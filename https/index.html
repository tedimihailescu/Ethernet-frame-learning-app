steps:[
{at:["br","wifi","att"],frame:null,kind:"none",tables:["goals"],
 title:{ro:"Scenariul: Wi-Fi public, date private",en:"The scenario: public Wi-Fi, private data"},
 body:{ro:`<p>Ești într-o cafenea, pe un Wi-Fi fără parolă, și intri în contul tău pe <code>https://shop.example.com</code>. Oricine din aceeași rețea poate <strong>vedea</strong> pachetele (vezi <a href="../ethernet/index.html">lecția Ethernet</a>: totul e doar o succesiune de cadre).</p>
<p>Fără HTTPS, parola ta ar circula în clar. <strong>TLS</strong> (Transport Layer Security) e stratul care face din HTTP <strong>HTTPS</strong>. Oferă trei garanții (în dreapta): nimeni nu citește, nimeni nu modifică, iar tu vorbești chiar cu site-ul corect.</p>
<p>Înainte de TLS, browserul a aflat IP-ul prin <a href="../dns/index.html">DNS</a> și a deschis o conexiune TCP (SYN, SYN-ACK, ACK) spre portul 443.</p>`,
 en:`<p>You're in a café on a password-less Wi-Fi and log in to <code>https://shop.example.com</code>. Anyone on the same network can <strong>see</strong> the packets (see the <a href="../ethernet/index.html">Ethernet lesson</a>: it's all just a stream of frames).</p>
<p>Without HTTPS, your password would travel in the clear. <strong>TLS</strong> (Transport Layer Security) is the layer that turns HTTP into <strong>HTTPS</strong>. It gives three guarantees (on the right): nobody reads, nobody modifies, and you're really talking to the right site.</p>
<p>Before TLS, the browser found the IP via <a href="../dns/index.html">DNS</a> and opened a TCP connection (SYN, SYN-ACK, ACK) to port 443.</p>`}},

{at:"br",frame:CH,kind:"t",move:[[["br","wifi"]],[["wifi","net"]],[["net","srv"]]],log:"ClientHello",who:{ro:"Browserul",en:"The browser"},
 title:{ro:"ClientHello: „uite ce știu să fac”",en:"ClientHello: \"here's what I can do\""},
 body:{ro:`<p>Primul mesaj TLS, trimis <strong>în clar</strong>. Browserul spune:</p>
<ul><li>ce versiuni știe (<strong>TLS 1.3</strong>);</li>
<li>ce <strong>cifruri</strong> acceptă (de ex. AES-128-GCM, ChaCha20-Poly1305);</li>
<li>un <strong>key_share</strong>: jumătatea lui dintr-un schimb de chei Diffie-Hellman (o cheie publică X25519, nouă la fiecare conexiune);</li>
<li><strong>SNI</strong>: numele site-ului vrut, ca un server cu mai multe site-uri să știe ce certificat să trimită;</li>
<li><strong>ALPN</strong>: ce protocol vrea deasupra (HTTP/2).</li></ul>`,
 en:`<p>The first TLS message, sent <strong>in the clear</strong>. The browser says:</p>
<ul><li>which versions it knows (<strong>TLS 1.3</strong>);</li>
<li>which <strong>cipher suites</strong> it accepts (e.g. AES-128-GCM, ChaCha20-Poly1305);</li>
<li>a <strong>key_share</strong>: its half of a Diffie-Hellman key exchange (an X25519 public key, fresh for every connection);</li>
<li><strong>SNI</strong>: the wanted site's name, so a server hosting several sites knows which certificate to send;</li>
<li><strong>ALPN</strong>: which protocol it wants on top (HTTP/2).</li></ul>`},
 more:{ro:`<p>SNI e în clar, deci atacatorul vede <em>ce site</em> vizitezi (nu și ce pagină). Extensia nouă <strong>ECH</strong> (Encrypted Client Hello) criptează și SNI-ul, dar nu e încă peste tot.</p>`,
  en:`<p>SNI is in the clear, so the attacker sees <em>which site</em> you visit (not which page). The newer <strong>ECH</strong> extension (Encrypted Client Hello) encrypts the SNI too, but isn't everywhere yet.</p>`}},

{at:"srv",frame:SH,kind:"t",move:[[["srv","net"]],[["net","wifi"]],[["wifi","br"]]],log:"ServerHello",who:"shop.example.com",
 title:{ro:"ServerHello și schimbul de chei: un secret la vedere",en:"ServerHello and the key exchange: a secret in plain sight"},
 body:{ro:`<p>Serverul alege un cifru (<code>TLS_AES_128_GCM_SHA256</code>) și trimite propria jumătate de cheie Diffie-Hellman.</p>
<p>Acum se întâmplă partea „magică”: fiecare parte combină <strong>cheia publică a celeilalte</strong> cu <strong>propria cheie secretă</strong> și obține <strong>același secret</strong>. Atacatorul a văzut ambele chei publice, dar, fără una dintre cele secrete, nu poate calcula secretul. Ar dura mai mult decât vârsta universului.</p>
<p class="key">Din acest moment, tot ce urmează e <strong>criptat</strong> cu chei derivate din acest secret.</p>`,
 en:`<p>The server picks a cipher suite (<code>TLS_AES_128_GCM_SHA256</code>) and sends its own Diffie-Hellman key half.</p>
<p>Now the "magic" part: each side combines <strong>the other's public key</strong> with <strong>its own secret key</strong> and gets <strong>the same secret</strong>. The attacker saw both public keys, but without one of the secret ones it can't compute the secret. It would take longer than the age of the universe.</p>
<p class="key">From this moment on, everything that follows is <strong>encrypted</strong> with keys derived from this secret.</p>`},
 more:{ro:`<p>O analogie cu vopsele: fiecare amestecă o culoare comună cu una secretă și trimite amestecul. Fiecare adaugă apoi propria culoare secretă la amestecul primit. Ambii ajung la aceeași culoare finală, dar cine vede doar amestecurile nu o poate reface.</p><p>Pentru că cheile Diffie-Hellman sunt noi la fiecare conexiune, chiar dacă cheia privată a serverului ar fi furată peste un an, conversațiile vechi înregistrate rămân sigure. Asta se numește <strong>forward secrecy</strong>.</p>`,
  en:`<p>A paint analogy: each side mixes a common colour with a secret one and sends the mix. Each then adds its own secret colour to the mix it received. Both end up with the same final colour, but someone who only sees the mixes can't reproduce it.</p><p>Because the Diffie-Hellman keys are fresh for every connection, even if the server's private key were stolen a year later, old recorded conversations stay safe. This is called <strong>forward secrecy</strong>.</p>`}},

{at:"srv",frame:CERT,kind:"t",move:[[["srv","net"]],[["net","wifi"]],[["wifi","br"]]],log:"Certificate + Finished",tables:["chain"],hl:{chain:[0,1,2]},who:"shop.example.com",
 title:{ro:"Certificatul: „eu chiar sunt shop.example.com”",en:"The certificate: \"I really am shop.example.com\""},
 body:{ro:`<p>Secretul comun garantează că nimeni nu citește. Dar cu cine vorbim? Poate atacatorul a răspuns el, în locul serverului. Pentru asta, serverul trimite (deja criptat):</p>
<ul><li>un <strong>certificat</strong>: un document care leagă numele <code>shop.example.com</code> de o <strong>cheie publică</strong>, semnat de o <strong>autoritate de certificare</strong> (CA);</li>
<li>certificatele <strong>intermediare</strong>, până aproape de rădăcină (în dreapta);</li>
<li><strong>CertificateVerify</strong>: o semnătură peste toată negocierea de până acum, făcută cu <strong>cheia privată</strong> a serverului. Doar cine are cheia privată poate semna; un atacator care copiază certificatul nu are cheia.</li>
<li><strong>Finished</strong>: confirmarea că nimic din negociere n-a fost modificat.</li></ul>`,
 en:`<p>The shared secret guarantees nobody reads along. But who are we talking to? Maybe the attacker answered instead of the server. So the server sends (already encrypted):</p>
<ul><li>a <strong>certificate</strong>: a document binding the name <code>shop.example.com</code> to a <strong>public key</strong>, signed by a <strong>certificate authority</strong> (CA);</li>
<li>the <strong>intermediate</strong> certificates, up to near the root (on the right);</li>
<li><strong>CertificateVerify</strong>: a signature over the whole handshake so far, made with the server's <strong>private key</strong>. Only the key holder can sign; an attacker copying the certificate doesn't have the key.</li>
<li><strong>Finished</strong>: confirmation that nothing in the handshake was tampered with.</li></ul>`}},

{at:"br",frame:VER,kind:"t",tables:["checks"],hl:{checks:[0,1,2,3,4]},who:{ro:"Browserul",en:"The browser"},
 title:{ro:"Browserul verifică certificatul",en:"The browser checks the certificate"},
 body:{ro:`<p>Browserul nu are încredere în nimic din ce primește până nu verifică:</p>
<ol><li><strong>Numele</strong>: certificatul e emis pentru <code>shop.example.com</code> (câmpul SAN)?</li>
<li><strong>Datele</strong>: e în perioada de valabilitate?</li>
<li><strong>Lanțul</strong>: certificatul site-ului e semnat de R11, iar R11 de <strong>ISRG Root X1</strong>, o rădăcină aflată deja în <strong>magazinul de încredere</strong> al sistemului sau al browserului.</li>
<li><strong>Semnătura</strong> CertificateVerify se potrivește cu cheia publică din certificat.</li>
<li><strong>Revocarea</strong>: certificatul nu a fost anulat (de ex. dacă cheia a fost furată).</li></ol>
<p>Dacă una singură eșuează, browserul oprește conexiunea și afișează un avertisment.</p>`,
 en:`<p>The browser trusts nothing it receives until it has checked:</p>
<ol><li>The <strong>name</strong>: is the certificate issued for <code>shop.example.com</code> (the SAN field)?</li>
<li>The <strong>dates</strong>: is it within its validity period?</li>
<li>The <strong>chain</strong>: the site certificate is signed by R11, and R11 by <strong>ISRG Root X1</strong>, a root already in the system's or browser's <strong>trust store</strong>.</li>
<li>The CertificateVerify <strong>signature</strong> matches the public key in the certificate.</li>
<li><strong>Revocation</strong>: the certificate hasn't been cancelled (e.g. because the key was stolen).</li></ol>
<p>If any single check fails, the browser stops the connection and shows a warning.</p>`},
 try:[{cmd:"certutil -store root | findstr /i \"ISRG\"",d:{ro:"Caută rădăcina ISRG în magazinul de încredere Windows.",en:"Looks for the ISRG root in the Windows trust store."}}]},

{at:"br",frame:FIN,kind:"t",move:[[["br","wifi"]],[["wifi","net"]],[["net","srv"]]],log:"Finished (client)",who:{ro:"Browserul",en:"The browser"},
 title:{ro:"Finished: conexiunea e gata, apare lacătul",en:"Finished: the connection is ready, the padlock appears"},
 body:{ro:`<p>Browserul trimite și el <strong>Finished</strong>. Ambele părți au acum aceleași <strong>chei de aplicație</strong>, derivate din secretul comun (cu HKDF), câte una pentru fiecare sens.</p>
<p>În TLS 1.3, toată negocierea a durat <strong>un singur dus-întors</strong> (1-RTT). Browserul afișează 🔒.</p>`,
 en:`<p>The browser sends its own <strong>Finished</strong> too. Both sides now hold the same <strong>application keys</strong>, derived from the shared secret (with HKDF), one per direction.</p>
<p>In TLS 1.3 the whole handshake took <strong>a single round trip</strong> (1-RTT). The browser shows 🔒.</p>`},
 more:{ro:`<p>La o reconectare, browserul poate folosi un „bilet” primit de la server (<strong>session resumption</strong>) și chiar trimite date din primul pachet (<strong>0-RTT</strong>). 0-RTT e rapid, dar datele pot fi „reluate” de un atacator, deci se folosește doar pentru cereri care nu modifică nimic.</p>`,
  en:`<p>On reconnecting, the browser can use a "ticket" from the server (<strong>session resumption</strong>) and even send data in the very first packet (<strong>0-RTT</strong>). 0-RTT is fast but its data can be "replayed" by an attacker, so it's used only for requests that change nothing.</p>`}},

{at:"att",frame:APP,kind:"a",move:[[["br","wifi"]],[["wifi","att"],["wifi","net"]],[["net","srv"]]],rest:["att","srv"],tables:["sees"],hl:{sees:[0,1,2]},log:{ro:"date criptate",en:"encrypted data"},who:{ro:"Atacatorul",en:"The attacker"},
 title:{ro:"Datele criptate: ce vede (și ce nu) atacatorul",en:"Encrypted data: what the attacker sees (and doesn't)"},
 body:{ro:`<p>Browserul trimite <code>GET /cont</code> cu cookie-ul de sesiune, criptat cu <strong>AES-128-GCM</strong>. Atacatorul primește aceleași pachete, dar vede doar octeți care arată aleator.</p>
<p>Fiecare înregistrare are și o <strong>etichetă de autentificare</strong>: dacă atacatorul schimbă un singur bit, serverul observă și închide conexiunea. Deci nici nu poate citi, nici nu poate modifica.</p>
<p>Ce poate afla totuși (tabelul): IP-ul serverului, numele site-ului din SNI, cât trafic e și când.</p>`,
 en:`<p>The browser sends <code>GET /account</code> with the session cookie, encrypted with <strong>AES-128-GCM</strong>. The attacker gets the same packets but only sees random-looking bytes.</p>
<p>Each record also has an <strong>authentication tag</strong>: if the attacker flips a single bit, the server notices and closes the connection. So it can neither read nor modify.</p>
<p>What it can still learn (the table): the server's IP, the site name from SNI, how much traffic there is and when.</p>`}},

{at:"att",frame:MITM,kind:"m",move:[[["br","wifi"]],[["wifi","att"]],[["att","wifi"]],[["wifi","br"]]],rest:["br"],marks:{br:{k:"drop",t:{ro:"⚠ avertisment",en:"⚠ warning"}},att:{k:"drop",t:{ro:"respins",en:"rejected"}}},who:{ro:"Atacatorul (man-in-the-middle)",en:"The attacker (man-in-the-middle)"},
 title:{ro:"Atacatorul încearcă să se dea drept site",en:"The attacker tries to impersonate the site"},
 body:{ro:`<p>Atacatorul poate redirecționa traficul spre el (de ex. cu un Wi-Fi fals) și să răspundă el ca „shop.example.com”. Poate face negocierea TLS, dar trebuie să trimită un <strong>certificat</strong>:</p>
<ul><li>Certificatul real al site-ului nu-l ajută: nu are <strong>cheia privată</strong>, deci nu poate semna CertificateVerify.</li>
<li>Un certificat făcut de el pentru <code>shop.example.com</code> nu e semnat de o CA de încredere, deci lanțul nu ajunge la nicio rădăcină cunoscută.</li></ul>
<p>Browserul afișează <code>NET::ERR_CERT_AUTHORITY_INVALID</code> (sau un nume greșit) și nu trimite nimic. <strong>De aceea e sigur lacătul</strong>, și de aceea nu trebuie să treci peste astfel de avertismente.</p>`,
 en:`<p>The attacker can redirect traffic to itself (e.g. with a fake Wi-Fi) and answer as "shop.example.com". It can do the TLS handshake, but it must send a <strong>certificate</strong>:</p>
<ul><li>The site's real certificate doesn't help: it lacks the <strong>private key</strong>, so it can't sign CertificateVerify.</li>
<li>A certificate it made itself for <code>shop.example.com</code> isn't signed by a trusted CA, so the chain doesn't reach any known root.</li></ul>
<p>The browser shows <code>NET::ERR_CERT_AUTHORITY_INVALID</code> (or a wrong-name error) and sends nothing. <strong>That's why the padlock is safe</strong>, and why you shouldn't click through such warnings.</p>`},
 more:{ro:`<p>Excepție cunoscută: în unele firme, un proxy de securitate inspectează traficul HTTPS. Merge doar pentru că firma a instalat pe calculatoarele ei <strong>propria rădăcină</strong> în magazinul de încredere. Pe un dispozitiv personal, fără acea rădăcină, ai vedea avertismentul.</p><p><strong>HSTS</strong>: un site poate cere browserului „folosește doar HTTPS cu mine, mereu”, ca un atacator să nu te poată coborî pe HTTP simplu.</p>`,
  en:`<p>A known exception: in some companies, a security proxy inspects HTTPS traffic. It only works because the company installed <strong>its own root</strong> into its computers' trust store. On a personal device without that root, you'd see the warning.</p><p><strong>HSTS</strong>: a site can tell the browser "always use HTTPS with me", so an attacker can't downgrade you to plain HTTP.</p>`}},

{at:"ca",frame:ACME,kind:"c",move:[[["srv","ca"]],[["ca","srv"]]],log:{ro:"obținerea certificatului",en:"getting the certificate"},who:"Let's Encrypt",
 title:{ro:"Cum a obținut serverul certificatul",en:"How the server got its certificate"},
 body:{ro:`<p>Cu câteva zile înainte, administratorul site-ului a obținut certificatul automat, prin <strong>ACME</strong>, de la <strong>Let's Encrypt</strong> (gratuit):</p>
<ol><li>Serverul generează o pereche de chei și trimite o cerere (<strong>CSR</strong>) cu cheia publică și numele.</li>
<li>CA-ul cere o dovadă că serverul controlează domeniul: o provocare <strong>HTTP-01</strong> (un fișier la <code>/.well-known/acme-challenge/…</code>) sau <strong>DNS-01</strong> (o înregistrare TXT, vezi <a href="../dns/index.html">lecția DNS</a>).</li>
<li>CA-ul verifică și semnează certificatul, valabil <strong>90 de zile</strong>. Un program (certbot, cert-manager) îl reînnoiește automat.</li></ol>
<p><strong>Cheia privată nu pleacă niciodată de pe server.</strong></p>`,
 en:`<p>A few days earlier, the site's admin got the certificate automatically via <strong>ACME</strong> from <strong>Let's Encrypt</strong> (free):</p>
<ol><li>The server generates a key pair and sends a request (<strong>CSR</strong>) with the public key and name.</li>
<li>The CA asks for proof the server controls the domain: an <strong>HTTP-01</strong> challenge (a file at <code>/.well-known/acme-challenge/…</code>) or <strong>DNS-01</strong> (a TXT record, see the <a href="../dns/index.html">DNS lesson</a>).</li>
<li>The CA checks and signs the certificate, valid for <strong>90 days</strong>. A tool (certbot, cert-manager) renews it automatically.</li></ol>
<p><strong>The private key never leaves the server.</strong></p>`},
 try:[{cmd:"certbot certonly --webroot -w /var/www/html -d shop.example.com",d:{ro:"Pe un server Linux: obține un certificat Let's Encrypt (domeniu propriu necesar).",en:"On a Linux server: gets a Let's Encrypt certificate (needs your own domain)."}}]},

{at:["br","srv"],frame:null,kind:"none",who:{ro:"Ce înseamnă lacătul",en:"What the padlock means"},
 title:{ro:"Ce înseamnă lacătul și ce nu",en:"What the padlock means, and what it doesn't"},
 body:{ro:`<p><strong>Înseamnă:</strong> conexiunea e criptată și protejată la modificări, iar serverul a dovedit că deține domeniul <code>shop.example.com</code>.</p>
<p><strong>Nu înseamnă:</strong> că site-ul e cinstit. Un site de phishing, <code>shop-example-login.com</code>, poate avea și el un certificat valid în câteva minute. Uită-te mereu <strong>la numele domeniului</strong>, nu doar la lacăt.</p>
<p>Nici nu protejează datele după ce ajung pe server: acolo depind de securitatea site-ului.</p>`,
 en:`<p><strong>It means:</strong> the connection is encrypted and protected from tampering, and the server proved it controls the domain <code>shop.example.com</code>.</p>
<p><strong>It doesn't mean:</strong> that the site is honest. A phishing site, <code>shop-example-login.com</code>, can also get a valid certificate in minutes. Always look at <strong>the domain name</strong>, not just the padlock.</p>
<p>Nor does it protect the data once it reaches the server: there, it depends on the site's own security.</p>`}},

{at:["br","srv","ca"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<div class="flow"><span>ClientHello</span><i>→</i><span>ServerHello (+ cheie DH)</span><i>→</i><span>🔒 Certificate · Verify · Finished</span><i>→</i><span>Finished</span><i>→</i><span>date criptate</span></div>
<ul><li>TLS dă <strong>confidențialitate, integritate și autentificare</strong>.</li>
<li><strong>Diffie-Hellman</strong> (ECDHE) creează un secret comun chiar dacă cineva vede tot schimbul; chei noi la fiecare conexiune (forward secrecy).</li>
<li><strong>Certificatul</strong> leagă numele de o cheie publică; <strong>CertificateVerify</strong> dovedește că serverul are cheia privată.</li>
<li>Browserul verifică numele, datele, <strong>lanțul până la o rădăcină de încredere</strong> și revocarea.</li>
<li>Un atacator nu poate trece de aceste verificări fără cheia privată sau o CA de încredere; de aceea nu ignora avertismentele.</li>
<li>Lacătul nu garantează că site-ul e cinstit: verifică domeniul.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Mergi la test ↓</button></p>`,
 en:`<div class="flow"><span>ClientHello</span><i>→</i><span>ServerHello (+ DH key)</span><i>→</i><span>🔒 Certificate · Verify · Finished</span><i>→</i><span>Finished</span><i>→</i><span>encrypted data</span></div>
<ul><li>TLS gives <strong>confidentiality, integrity and authentication</strong>.</li>
<li><strong>Diffie-Hellman</strong> (ECDHE) creates a shared secret even if someone sees the whole exchange; fresh keys per connection (forward secrecy).</li>
<li>The <strong>certificate</strong> binds the name to a public key; <strong>CertificateVerify</strong> proves the server holds the private key.</li>
<li>The browser checks the name, dates, <strong>chain to a trusted root</strong> and revocation.</li>
<li>An attacker can't pass these checks without the private key or a trusted CA; that's why you don't ignore warnings.</li>
<li>The padlock doesn't guarantee the site is honest: check the domain.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Go to the quiz ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  const cmd=(c,d)=>`<div class="cmdrow"><div class="cmd"><code>${c}</code><button type="button" class="copy" data-cmd="${c.replace(/"/g,"&quot;")}">${ro?"Copiază":"Copy"}</button></div><p>${T(d)}</p></div>`;
  let h=`<div class="ref-grid"><section class="card refcard"><h2>TLS 1.2 ${ro?"față de":"vs"} TLS 1.3</h2><div class="scroll"><table class="cmp" style="min-width:420px"><thead><tr><th></th><th>TLS 1.2</th><th>TLS 1.3</th></tr></thead><tbody>
<tr><td>${ro?"Dus-întors până la date":"Round trips before data"}</td><td>2</td><td>1 (0 ${ro?"la reluare":"on resumption"})</td></tr>
<tr><td>${ro?"Certificatul pe fir":"Certificate on the wire"}</td><td>${ro?"în clar":"in the clear"}</td><td>${ro?"criptat":"encrypted"}</td></tr>
<tr><td>${ro?"Schimb de chei":"Key exchange"}</td><td>${ro?"RSA sau (EC)DHE":"RSA or (EC)DHE"}</td><td>${ro?"doar (EC)DHE: forward secrecy obligatoriu":"(EC)DHE only: forward secrecy mandatory"}</td></tr>
<tr><td>${ro?"Cifruri":"Cipher suites"}</td><td>${ro?"multe, unele slabe":"many, some weak"}</td><td>${ro?"5, toate moderne (AEAD)":"5, all modern (AEAD)"}</td></tr>
</tbody></table></div><p class="note">${ro?"SSL, TLS 1.0 și 1.1 sunt depășite și dezactivate în browserele moderne.":"SSL, TLS 1.0 and 1.1 are obsolete and disabled in modern browsers."}</p></section>`;
  h+=`<section class="card refcard"><h2>${ro?"Comenzi":"Commands"}</h2><div class="try">`;
  h+=cmd("openssl s_client -connect example.com:443 -servername example.com",{ro:"Face o negociere TLS și afișează lanțul de certificate și cifrul ales.",en:"Does a TLS handshake and prints the certificate chain and the chosen cipher."});
  h+=cmd("openssl s_client -connect example.com:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates",{ro:"Doar numele, emitentul și datele certificatului.",en:"Just the certificate's subject, issuer and dates."});
  h+=cmd("curl -vI https://example.com",{ro:"Arată pașii TLS și certificatul, apoi antetele HTTP.",en:"Shows the TLS steps and the certificate, then the HTTP headers."});
  h+=`</div><p class="note">${ro?"În browser: click pe lacăt → Conexiunea e securizată → Certificatul e valid.":"In the browser: click the padlock → Connection is secure → Certificate is valid."}</p></section></div>`;
  return h;
},

gloss:[
 ["TLS","Transport Layer Security",{ro:"Protocolul care criptează și autentifică conexiunile; HTTPS = HTTP peste TLS.",en:"The protocol that encrypts and authenticates connections; HTTPS = HTTP over TLS."}],
 ["Handshake",{ro:"negociere",en:null},{ro:"Schimbul de mesaje de la început, în care se aleg cifrul și cheile și se verifică serverul.",en:"The opening exchange where the cipher and keys are chosen and the server is verified."}],
 ["Diffie-Hellman (ECDHE)",null,{ro:"Metodă prin care două părți obțin același secret fără să-l trimită vreodată.",en:"A method for two sides to get the same secret without ever sending it."}],
 ["Forward secrecy",null,{ro:"Conversațiile vechi rămân sigure chiar dacă cheia privată a serverului e furată mai târziu.",en:"Old conversations stay safe even if the server's private key is stolen later."}],
 [{ro:"Certificat",en:"Certificate"},"X.509",{ro:"Document semnat care leagă un nume de domeniu de o cheie publică.",en:"A signed document binding a domain name to a public key."}],
 ["CA","Certificate Authority",{ro:"Organizație care verifică domenii și semnează certificate.",en:"An organisation that verifies domains and signs certificates."}],
 [{ro:"Lanț de încredere",en:"Chain of trust"},null,{ro:"Certificat → intermediar → rădăcină aflată în magazinul de încredere.",en:"Certificate → intermediate → a root in the trust store."}],
 [{ro:"Cheie publică / privată",en:"Public / private key"},null,{ro:"Pereche de chei: cea publică se poate da oricui; cea privată rămâne secretă și semnează.",en:"A key pair: the public one can be shared; the private one stays secret and signs."}],
 ["SNI","Server Name Indication",{ro:"Numele site-ului trimis în ClientHello.",en:"The site name sent in ClientHello."}],
 ["ALPN",null,{ro:"Alegerea protocolului de deasupra TLS (h2, http/1.1).",en:"Choosing the protocol above TLS (h2, http/1.1)."}],
 ["AES-GCM / AEAD",null,{ro:"Criptare care și ascunde datele, și detectează orice modificare.",en:"Encryption that both hides data and detects any change."}],
 ["ACME",null,{ro:"Protocolul automat prin care se obțin și reînnoiesc certificate (Let's Encrypt).",en:"The automated protocol for getting and renewing certificates (Let's Encrypt)."}],
 ["HSTS",null,{ro:"Antet care obligă browserul să folosească doar HTTPS cu un site.",en:"A header forcing the browser to use only HTTPS with a site."}],

],
glossEx:{
 "TLS":{ro:"https://shop.example.com = HTTP/2 în interiorul unei conexiuni TLS 1.3 pe portul 443.",en:"https://shop.example.com = HTTP/2 inside a TLS 1.3 connection on port 443."},
 "Handshake":{ro:"ClientHello → ServerHello → Certificate → Finished, totul în ~1 dus-întors.",en:"ClientHello → ServerHello → Certificate → Finished, all in ~1 round trip."},
 "Diffie-Hellman (ECDHE)":{ro:"X25519: fiecare trimite 32 de octeți publici și ambii obțin același secret de 32 de octeți.",en:"X25519: each sends 32 public bytes and both get the same 32-byte secret."},
 "Forward secrecy":{ro:"o înregistrare a traficului de azi nu poate fi decriptată nici dacă serverul e spart anul viitor.",en:"a recording of today's traffic can't be decrypted even if the server is hacked next year."},
 "Certificate":{ro:"Subject: CN=shop.example.com · Issuer: R11 · Valid: 1 Oct – 30 Dec.",en:"Subject: CN=shop.example.com · Issuer: R11 · Valid: 1 Oct – 30 Dec."},
 "CA":{ro:"Let's Encrypt, DigiCert, Sectigo sunt CA-uri în care au încredere browserele.",en:"Let's Encrypt, DigiCert and Sectigo are CAs browsers trust."},
 "Chain of trust":{ro:"shop.example.com ← R11 ← ISRG Root X1 (deja în Windows).",en:"shop.example.com ← R11 ← ISRG Root X1 (already in Windows)."},
 "Public / private key":{ro:"cheia publică e în certificat; cheia privată stă într-un fișier .key pe server.",en:"the public key is in the certificate; the private key sits in a .key file on the server."},
 "SNI":{ro:"un server cu IP-ul 203.0.113.80 găzduiește shop.example.com și blog.example.com; SNI-ul îi spune ce certificat să dea.",en:"a server at 203.0.113.80 hosts shop.example.com and blog.example.com; SNI tells it which certificate to serve."},
 "ALPN":{ro:"browserul oferă „h2, http/1.1”, serverul alege „h2”.",en:"the browser offers \"h2, http/1.1\", the server picks \"h2\"."},
 "AES-GCM / AEAD":{ro:"dacă un singur bit e schimbat pe drum, verificarea etichetei eșuează și conexiunea se închide.",en:"if one bit is changed on the way, the tag check fails and the connection closes."},
 "ACME":{ro:"certbot renew rulează zilnic și reînnoiește certificatele care expiră în mai puțin de 30 de zile.",en:"certbot renew runs daily and renews certificates expiring within 30 days."},
 "HSTS":{ro:"Strict-Transport-Security: max-age=31536000; includeSubDomains",en:"Strict-Transport-Security: max-age=31536000; includeSubDomains"},
 "MITM":{ro:"un hotspot fals „Cafenea_Free” prin care trece tot traficul victimelor.",en:"a fake \"Cafe_Free\" hotspot that all victims' traffic passes through."}
},

quiz:[
 {q:{ro:"Ce garanții oferă TLS?",en:"What guarantees does TLS give?"},o:[{ro:"Doar viteză",en:"Only speed"},{ro:"Confidențialitate, integritate și autentificarea serverului",en:"Confidentiality, integrity and server authentication"},{ro:"Că site-ul e cinstit",en:"That the site is honest"},{ro:"Anonimat complet",en:"Complete anonymity"}],a:1,e:{ro:"Nimeni nu citește, nimeni nu modifică, iar serverul e cel corect.",en:"Nobody reads, nobody modifies, and the server is the right one."}},
 {q:{ro:"Atacatorul vede ambele chei publice Diffie-Hellman. Poate calcula secretul?",en:"The attacker sees both Diffie-Hellman public keys. Can it compute the secret?"},o:[{ro:"Da, ușor",en:"Yes, easily"},{ro:"Nu: îi trebuie una dintre cheile secrete, care nu circulă niciodată",en:"No: it needs one of the secret keys, which never travel"},{ro:"Da, dacă are Wi-Fi bun",en:"Yes, with good Wi-Fi"},{ro:"Doar în TLS 1.3",en:"Only in TLS 1.3"}],a:1,e:{ro:"De aceea schimbul de chei e sigur chiar „la vedere”.",en:"That's why the key exchange is safe even \"in plain sight\"."}},
 {q:{ro:"Ce dovedește CertificateVerify?",en:"What does CertificateVerify prove?"},o:[{ro:"Că certificatul e nou",en:"That the certificate is new"},{ro:"Că serverul deține cheia privată corespunzătoare certificatului",en:"That the server holds the private key matching the certificate"},{ro:"Că browserul e actualizat",en:"That the browser is up to date"},{ro:"Că DNS-ul e corect",en:"That DNS is correct"}],a:1,e:{ro:"Un atacator poate copia certificatul public, dar nu poate semna fără cheia privată.",en:"An attacker can copy the public certificate but can't sign without the private key."}},
 {q:{ro:"Ce verifică browserul în lanțul de certificate?",en:"What does the browser check in the certificate chain?"},o:[{ro:"Că fiecare certificat e semnat de următorul, până la o rădăcină din magazinul de încredere",en:"That each certificate is signed by the next, up to a root in the trust store"},{ro:"Că are cel puțin 10 certificate",en:"That it has at least 10 certificates"},{ro:"Doar culoarea lacătului",en:"Only the padlock colour"},{ro:"Nimic",en:"Nothing"}],a:0,e:{ro:"Plus numele, datele de valabilitate și revocarea.",en:"Plus the name, validity dates and revocation."}},
 {q:{ro:"Ce poate vedea un atacator pe Wi-Fi-ul cafenelei, cu HTTPS?",en:"What can an attacker on the café Wi-Fi see with HTTPS?"},o:[{ro:"Parolele",en:"Passwords"},{ro:"Pagina vizitată (/cont)",en:"The page visited (/account)"},{ro:"IP-ul serverului, numele site-ului (SNI) și volumul traficului",en:"The server IP, the site name (SNI) and the traffic volume"},{ro:"Cookie-urile",en:"Cookies"}],a:2,e:{ro:"Conținutul, căile și cookie-urile sunt criptate.",en:"Content, paths and cookies are encrypted."}},
 {q:{ro:"Browserul afișează NET::ERR_CERT_AUTHORITY_INVALID. Ce faci?",en:"The browser shows NET::ERR_CERT_AUTHORITY_INVALID. What do you do?"},o:[{ro:"Treci peste, e normal",en:"Click through, it's normal"},{ro:"Nu continui: certificatul nu e semnat de o autoritate de încredere (posibil atac)",en:"Don't continue: the certificate isn't signed by a trusted authority (possible attack)"},{ro:"Repornești routerul",en:"Restart the router"},{ro:"Ștergi cookie-urile",en:"Clear cookies"}],a:1,e:{ro:"Exact așa arată un atac man-in-the-middle oprit de browser.",en:"That's exactly what a man-in-the-middle attack stopped by the browser looks like."}},
 {q:{ro:"Cum dovedește un server lui Let's Encrypt că deține domeniul?",en:"How does a server prove to Let's Encrypt that it controls the domain?"},o:[{ro:"Trimite o fotocopie a buletinului",en:"Sends a copy of an ID card"},{ro:"Prin provocarea HTTP-01 (un fișier pe site) sau DNS-01 (o înregistrare TXT)",en:"Via the HTTP-01 challenge (a file on the site) or DNS-01 (a TXT record)"},{ro:"Plătește",en:"Pays"},{ro:"Nu trebuie să dovedească",en:"It doesn't have to"}],a:1,e:{ro:"Totul automat, prin protocolul ACME; certificatele durează 90 de zile.",en:"All automatic, via the ACME protocol; certificates last 90 days."}},
 {q:{ro:"Un site de phishing are lacăt. Ce înseamnă?",en:"A phishing site has a padlock. What does it mean?"},o:[{ro:"Că e un site sigur și cinstit",en:"That it's a safe, honest site"},{ro:"Doar că legătura cu acel domeniu e criptată; domeniul poate fi al unui escroc",en:"Only that the connection to that domain is encrypted; the domain may belong to a scammer"},{ro:"Că e verificat de poliție",en:"That police verified it"},{ro:"Că e al băncii tale",en:"That it's your bank's"}],a:1,e:{ro:"Verifică mereu numele domeniului.",en:"Always check the domain name."}}
]
};
