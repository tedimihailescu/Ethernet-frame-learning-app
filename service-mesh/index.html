sub:{ro:"Frontend-ul cheamă serviciul orders. Codul face un simplu GET pe HTTP, dar un proxy Envoy de lângă fiecare aplicație criptează traficul cu mTLS, verifică identitatea, împarte cererile între versiuni, reîncearcă erorile, scoate din rotație podurile bolnave și raportează metrici și trace-uri. Urmărești pas cu pas cum, în Istio, și ce alternative există.",en:"The frontend calls the orders service. The code does a plain HTTP GET, but an Envoy proxy next to each app encrypts traffic with mTLS, checks identity, splits requests between versions, retries errors, ejects sick pods and reports metrics and traces. Follow step by step how it works in Istio, and what the alternatives are."},

steps:[
{at:["fe","o1","o2"],frame:null,kind:"none",tables:["why"],
 title:{ro:"Problema: multe servicii, multe conexiuni",en:"The problem: many services, many connections"},
 body:{ro:`<p>Într-o aplicație cu zeci de <a href="../microservicii/index.html">microservicii</a>, fiecare cerere a unui utilizator devine multe cereri între servicii. Toate au nevoie de aceleași lucruri: criptare, verificarea cine cheamă, timeout-uri, retry-uri, metrici.</p>
<p>Le poți scrie în fiecare aplicație, cu biblioteci, sau le poți muta într-un <strong>service mesh</strong>: un <strong>proxy</strong> pus lângă fiecare aplicație, prin care trece tot traficul ei. Codul rămâne simplu, iar regulile sunt configurate central.</p>
<ul><li><strong>Planul de date</strong>: proxy-urile (aici <strong>Envoy</strong>), care mută efectiv cererile.</li>
<li><strong>Planul de control</strong>: <strong>istiod</strong>, care le trimite configurația și certificatele.</li></ul>`,
 en:`<p>In an app with dozens of <a href="../microservicii/index.html">microservices</a>, each user request becomes many requests between services. They all need the same things: encryption, checking who's calling, timeouts, retries, metrics.</p>
<p>You can write them into every app with libraries, or move them into a <strong>service mesh</strong>: a <strong>proxy</strong> placed next to each app, through which all its traffic flows. The code stays simple and the rules are configured centrally.</p>
<ul><li>The <strong>data plane</strong>: the proxies (here <strong>Envoy</strong>), which actually move the requests.</li>
<li>The <strong>control plane</strong>: <strong>istiod</strong>, which sends them configuration and certificates.</li></ul>`}},

{at:"fe",frame:null,kind:"none",tables:["ports"],who:"frontend",
 title:{ro:"Sidecar-ul: un al doilea container în fiecare pod",en:"The sidecar: a second container in every pod"},
 body:{ro:`<p>Namespace-ul are eticheta <code>istio-injection=enabled</code>. Când se creează un pod, un <em>webhook</em> modifică automat definiția lui și adaugă:</p>
<ul><li>containerul <strong>istio-proxy</strong> (Envoy), lângă aplicație;</li>
<li>un <strong>init container</strong> (sau pluginul CNI) care scrie reguli <strong>iptables</strong> în namespace-ul de rețea al podului: tot ce iese merge la portul <code>15001</code> al lui Envoy, tot ce intră la <code>15006</code>.</li></ul>
<p class="key">Aplicația nu știe nimic: crede că vorbește direct cu <code>orders:8080</code>. Interceptarea se face în kernel, ca la <a href="../k8s-intrare/index.html">kube-proxy</a>.</p>`,
 en:`<p>The namespace has the <code>istio-injection=enabled</code> label. When a pod is created, a <em>webhook</em> rewrites its definition automatically and adds:</p>
<ul><li>the <strong>istio-proxy</strong> container (Envoy), next to the app;</li>
<li>an <strong>init container</strong> (or the CNI plugin) that writes <strong>iptables</strong> rules in the pod's network namespace: everything going out goes to Envoy's port <code>15001</code>, everything coming in to <code>15006</code>.</li></ul>
<p class="key">The app knows nothing: it thinks it talks straight to <code>orders:8080</code>. Interception happens in the kernel, like with <a href="../k8s-intrare/index.html">kube-proxy</a>.</p>`},
 try:[{cmd:"kubectl label namespace shop istio-injection=enabled",d:{ro:"Activează injecția automată pentru namespace.",en:"Turns on automatic injection for the namespace."}},{cmd:"kubectl get pod -n shop -o jsonpath='{.items[0].spec.containers[*].name}'",d:{ro:"Vezi că podul are două containere: aplicația și istio-proxy.",en:"See that the pod has two containers: the app and istio-proxy."}}]},

{at:"ist",frame:X,kind:"xds",move:[[["ist","fe"],["ist","o1"]]],fx:[["ep","10.1.0.31:8080","v1","90","healthy"],["ep","10.1.0.47:8080","v2","10","healthy"]],tables:["ep"],log:{ro:"istiod trimite configurația",en:"istiod sends the configuration"},who:"istiod",
 title:{ro:"istiod: configurație (xDS) și certificate",en:"istiod: configuration (xDS) and certificates"},
 body:{ro:`<p>Fiecare Envoy ține o conexiune gRPC deschisă cu istiod. Prin ea primește, prin API-urile <strong>xDS</strong>, tot ce trebuie să știe: ce porturi ascultă (LDS), cum se rutează cererile (RDS), ce servicii există (CDS) și IP-urile podurilor din spatele fiecăruia (EDS). Când un pod pornește sau dispare, istiod trimite doar schimbarea.</p>
<p>Tot istiod e și <strong>autoritate de certificare</strong>. Fiecare proxy primește un certificat (prin SDS) cu identitatea contului de serviciu al podului, în format <strong>SPIFFE</strong>: <code>${SFE}</code>. Certificatul expiră în 24 h și e reînnoit automat.</p>`,
 en:`<p>Each Envoy keeps a gRPC connection open to istiod. Through it, via the <strong>xDS</strong> APIs, it gets everything it needs: which ports to listen on (LDS), how to route requests (RDS), which services exist (CDS), and the pod IPs behind each (EDS). When a pod starts or goes away, istiod sends only the change.</p>
<p>istiod is also a <strong>certificate authority</strong>. Each proxy gets a certificate (via SDS) with the identity of the pod's service account, in <strong>SPIFFE</strong> format: <code>${SFE}</code>. It expires in 24 h and is renewed automatically.</p>`},
 more:{ro:`<p>Identitatea vine din <strong>ServiceAccount</strong>, nu din IP. IP-urile podurilor se schimbă mereu; identitatea rămâne. De aceea politicile din mesh se scriu cu „cine ești” (contul de serviciu), nu cu „de unde vii” (IP).</p>`,
  en:`<p>Identity comes from the <strong>ServiceAccount</strong>, not the IP. Pod IPs change all the time; identity stays. That's why mesh policies are written as "who you are" (the service account), not "where you come from" (the IP).</p>`}},

{at:"fe",frame:R0,kind:"req",log:{ro:"aplicația → propriul Envoy",en:"the app → its own Envoy"},who:{ro:"Aplicația frontend",en:"The frontend app"},
 title:{ro:"Aplicația trimite un GET simplu",en:"The app sends a plain GET"},
 body:{ro:`<p>Codul frontend-ului face <code>GET http://orders:8080/orders/42</code>, fără TLS și fără nimic special. Conexiunea pleacă spre <code>orders:8080</code>, dar regula iptables din pod o trimite la <code>127.0.0.1:15001</code>, adică la Envoy-ul din același pod.</p>
<p>Singurul lucru pe care aplicația trebuie să-l facă e să <strong>transmită mai departe antetele de trace</strong> (<code>traceparent</code>) primite în cererea ei. Altfel, mesh-ul vede cererile, dar nu le poate lega într-un singur trace.</p>`,
 en:`<p>The frontend code does <code>GET http://orders:8080/orders/42</code>, with no TLS and nothing special. The connection heads for <code>orders:8080</code>, but the pod's iptables rule sends it to <code>127.0.0.1:15001</code>, the Envoy in the same pod.</p>
<p>The only thing the app must do is <strong>pass on the trace headers</strong> (<code>traceparent</code>) it received in its own request. Otherwise the mesh sees the requests but can't link them into one trace.</p>`}},

{at:"fe",frame:R1,kind:"req",move:[[["fe","o1"]]],tables:["vs","ep"],hl:{ep:"10.1.0.31:8080"},log:{ro:"Envoy → orders v1, în mTLS",en:"Envoy → orders v1, in mTLS"},who:{ro:"Envoy-ul frontend",en:"frontend's Envoy"},
 title:{ro:"Envoy alege podul și deschide mTLS",en:"Envoy picks the pod and opens mTLS"},
 body:{ro:`<p>Envoy-ul frontend-ului citește cererea HTTP și aplică regulile primite:</p>
<ul><li><strong>VirtualService</strong> (tabelul de sus): 90% din cereri merg la <code>v1</code>, 10% la <code>v2</code>. Aici iese v1.</li>
<li><strong>Load balancing</strong>: dintre podurile v1, alege unul (implicit, cel cu cele mai puține cereri active), direct după IP, fără ClusterIP.</li></ul>
<p>Apoi deschide spre podul ales o conexiune <strong>mTLS</strong> (TLS mutual): <em>ambele</em> părți prezintă certificate. Pe rețea, cererea circulă criptată, cu identitatea clientului în certificat.</p>`,
 en:`<p>The frontend's Envoy reads the HTTP request and applies the rules it received:</p>
<ul><li><strong>VirtualService</strong> (top table): 90% of requests go to <code>v1</code>, 10% to <code>v2</code>. This one draws v1.</li>
<li><strong>Load balancing</strong>: among the v1 pods it picks one (by default the one with the fewest active requests), straight by IP, bypassing the ClusterIP.</li></ul>
<p>Then it opens an <strong>mTLS</strong> (mutual TLS) connection to the chosen pod: <em>both</em> sides present certificates. On the wire the request travels encrypted, with the client's identity in its certificate.</p>`}},

{at:"o1",frame:R1b,kind:"req",tables:["authz"],log:{ro:"Envoy orders: verificat, decriptat",en:"orders' Envoy: checked, decrypted"},who:{ro:"Envoy-ul orders",en:"orders' Envoy"},
 title:{ro:"La destinație: verificarea identității și autorizarea",en:"At the destination: identity check and authorization"},
 body:{ro:`<p>Conexiunea intră în podul orders și e redirecționată la portul <code>15006</code> al Envoy-ului lui. Acesta:</p>
<ol><li>verifică certificatul clientului: semnat de CA-ul mesh-ului, identitatea <code>…/sa/frontend</code>;</li>
<li>aplică <strong>PeerAuthentication STRICT</strong>: conexiunile fără mTLS sunt refuzate;</li>
<li>aplică <strong>AuthorizationPolicy</strong>: doar frontend-ul are voie, și doar cu GET/POST. Altfel răspunde <code>403</code>;</li>
<li>decriptează și dă cererea aplicației pe <code>127.0.0.1:8080</code>.</li></ol>
<p class="key">Asta e <strong>zero trust</strong> în interiorul clusterului: nu contează că cererea vine din rețeaua internă, contează cine o trimite.</p>`,
 en:`<p>The connection enters the orders pod and is redirected to its Envoy's port <code>15006</code>. That Envoy:</p>
<ol><li>checks the client's certificate: signed by the mesh CA, identity <code>…/sa/frontend</code>;</li>
<li>applies <strong>PeerAuthentication STRICT</strong>: connections without mTLS are refused;</li>
<li>applies the <strong>AuthorizationPolicy</strong>: only the frontend is allowed, and only with GET/POST. Otherwise it answers <code>403</code>;</li>
<li>decrypts and hands the request to the app on <code>127.0.0.1:8080</code>.</li></ol>
<p class="key">This is <strong>zero trust</strong> inside the cluster: it doesn't matter that the request comes from the internal network, what matters is who sends it.</p>`}},

{at:"fe",frame:R2,kind:"req",move:[[["fe","o2"]]],tables:["ep"],hl:{ep:"10.1.0.47:8080"},log:{ro:"canary: 10% spre v2",en:"canary: 10% to v2"},who:{ro:"Envoy-ul frontend",en:"frontend's Envoy"},
 title:{ro:"Canary: o parte din cereri la versiunea nouă",en:"Canary: some requests to the new version"},
 body:{ro:`<p>Următoarea cerere, <code>/orders/43</code>, cade în cele 10% și merge la <strong>orders v2</strong>, versiunea lansată azi. Așa se testează o versiune nouă pe trafic real, cu risc mic: dacă merge bine, crești procentul (25%, 50%, 100%); dacă nu, îl pui înapoi la 0, fără redeploy.</p>
<p>Tot din VirtualService poți trimite la v2 doar cererile cu un anumit antet (<code>x-canary: true</code>), de exemplu doar ale echipei interne.</p>`,
 en:`<p>The next request, <code>/orders/43</code>, falls in the 10% and goes to <strong>orders v2</strong>, the version released today. That's how a new version is tested on real traffic with little risk: if it goes well you raise the share (25%, 50%, 100%); if not, you set it back to 0, with no redeploy.</p>
<p>The VirtualService can also send only requests with a certain header (<code>x-canary: true</code>) to v2, for example just the internal team's.</p>`}},

{at:"o2",frame:E1,kind:"resp",move:[[["o2","fe"]]],marks:{o2:{k:"drop",t:"503"}},log:{ro:"v2 răspunde cu eroare",en:"v2 answers with an error"},who:"orders v2",
 title:{ro:"Versiunea nouă are o problemă: 503",en:"The new version has a problem: 503"},
 body:{ro:`<p>orders v2 are un bug: nu se poate conecta la baza de date și răspunde <code>503 Service Unavailable</code>.</p>
<p>Fără mesh, eroarea ar ajunge direct în codul frontend-ului, care ar trebui să știe singur ce să facă. Aici, răspunsul trece întâi prin Envoy-ul frontend-ului, care are o <strong>politică de retry</strong>: pentru erori 5xx, încearcă din nou, pe alt pod.</p>`,
 en:`<p>orders v2 has a bug: it can't connect to the database and answers <code>503 Service Unavailable</code>.</p>
<p>Without a mesh, the error would go straight into the frontend code, which would have to know what to do on its own. Here the response passes through the frontend's Envoy first, which has a <strong>retry policy</strong>: for 5xx errors, try again, on another pod.</p>`}},

{at:"fe",frame:R3,kind:"req",move:[[["fe","o1"]]],fx:[["ep","10.1.0.47:8080","v2","10",{ro:"scos din rotație 30 s",en:"ejected for 30 s"}]],tables:["res","ep"],hl:{ep:"10.1.0.47:8080"},log:{ro:"retry spre v1",en:"retry to v1"},who:{ro:"Envoy-ul frontend",en:"frontend's Envoy"},
 title:{ro:"Retry, timeout, outlier detection",en:"Retries, timeouts, outlier detection"},
 body:{ro:`<p>Envoy reîncearcă cererea pe <strong>orders v1</strong>, care răspunde <code>200</code>. Utilizatorul nu observă nimic, doar câteva milisecunde în plus.</p>
<p>După mai multe erori la rând de la același pod, <strong>outlier detection</strong> îl <strong>scoate din rotație</strong> 30 de secunde (tabelul de jos), ca să nu mai primească cereri până se repară.</p>
<p class="key">Atenție la retry-uri: dacă fiecare strat reîncearcă de 3 ori, o eroare se multiplică (3 × 3 × 3 = 27 de cereri). Reîncearcă doar operații sigure (GET, sau POST idempotente) și pune un <strong>timeout total</strong>.</p>`,
 en:`<p>Envoy retries the request on <strong>orders v1</strong>, which answers <code>200</code>. The user notices nothing, just a few extra milliseconds.</p>
<p>After several errors in a row from the same pod, <strong>outlier detection</strong> <strong>ejects it</strong> for 30 seconds (bottom table), so it gets no requests until it recovers.</p>
<p class="key">Careful with retries: if every layer retries 3 times, one error multiplies (3 × 3 × 3 = 27 requests). Only retry safe operations (GET, or idempotent POSTs) and set an <strong>overall timeout</strong>.</p>`}},

{at:"o2",frame:TM,kind:"tel",move:[[["fe","obs"],["o2","obs"]]],log:{ro:"metrici și span-uri",en:"metrics and spans"},who:"Envoy",
 title:{ro:"Telemetrie pentru orice cerere, fără cod",en:"Telemetry for every request, with no code"},
 body:{ro:`<p>Fiecare Envoy a numărat, cronometrat și jurnalizat fiecare cerere:</p>
<ul><li><strong>metrici</strong> (expuse pe <code>:15090</code>, citite de Prometheus): <code>istio_requests_total</code> cu sursa, destinația, versiunea și codul. De aici vezi imediat că <em>doar v2</em> dă 503;</li>
<li><strong>span-uri</strong> de trace, trimise la Jaeger/Tempo, legate prin antetul <code>traceparent</code>;</li>
<li><strong>log-uri de acces</strong>; flag-urile Envoy (<code>UF</code> = upstream failure, <code>URX</code> = retry-uri epuizate) spun exact ce s-a întâmplat.</li></ul>
<p>Despre ce faci cu ele: <a href="../observabilitate/index.html">lecția de observabilitate</a>.</p>`,
 en:`<p>Every Envoy has counted, timed and logged every request:</p>
<ul><li><strong>metrics</strong> (exposed on <code>:15090</code>, scraped by Prometheus): <code>istio_requests_total</code> with source, destination, version and code. From this you immediately see that <em>only v2</em> returns 503;</li>
<li>trace <strong>spans</strong>, sent to Jaeger/Tempo, linked through the <code>traceparent</code> header;</li>
<li><strong>access logs</strong>; Envoy's flags (<code>UF</code> = upstream failure, <code>URX</code> = retries exhausted) say exactly what happened.</li></ul>
<p>What you do with them: the <a href="../observabilitate/index.html">observability lesson</a>.</p>`},
 try:[{cmd:"istioctl proxy-config endpoints deploy/frontend -n shop",d:{ro:"Endpoint-urile pe care le vede Envoy-ul frontend, cu starea lor.",en:"The endpoints frontend's Envoy sees, with their state."}},{cmd:"kubectl logs deploy/frontend -c istio-proxy -n shop",d:{ro:"Log-urile de acces ale sidecar-ului.",en:"The sidecar's access logs."}}]},

{at:["ist","fe","o1"],frame:null,kind:"none",who:{ro:"Alternative",en:"Alternatives"},
 title:{ro:"Fără sidecar: ambient mode, Linkerd și costurile",en:"Without sidecars: ambient mode, Linkerd and the costs"},
 body:{ro:`<p>Un proxy în fiecare pod costă: memorie și CPU (zeci de MB per pod, înmulțit cu sute de poduri), ~1–3 ms per salt și o repornire a podurilor la fiecare upgrade al proxy-ului. De aceea au apărut variante:</p>
<ul><li><strong>Istio ambient</strong>: un <strong>ztunnel</strong> per nod face mTLS și L4; un <strong>waypoint proxy</strong> per namespace face partea HTTP (L7) doar unde e nevoie. Podurile nu mai au sidecar.</li>
<li><strong>Linkerd</strong>: tot cu sidecar, dar cu un proxy mic scris în Rust și mai puține funcții; mai simplu de operat.</li>
<li><strong>Cilium</strong>: o parte din funcții direct în kernel, cu eBPF.</li></ul>
<p class="key">Un mesh merită când ai multe servicii, cerințe de securitate (mTLS peste tot) și mai multe echipe. Pentru trei servicii, e de obicei prea mult.</p>`,
 en:`<p>A proxy in every pod has a cost: memory and CPU (tens of MB per pod, times hundreds of pods), ~1–3 ms per hop, and pod restarts on every proxy upgrade. That's why alternatives appeared:</p>
<ul><li><strong>Istio ambient</strong>: one <strong>ztunnel</strong> per node does mTLS and L4; a <strong>waypoint proxy</strong> per namespace does the HTTP (L7) part only where needed. Pods have no sidecar.</li>
<li><strong>Linkerd</strong>: still sidecars, but a small proxy written in Rust and fewer features; simpler to run.</li>
<li><strong>Cilium</strong>: part of the features directly in the kernel, with eBPF.</li></ul>
<p class="key">A mesh pays off when you have many services, security requirements (mTLS everywhere) and several teams. For three services it's usually too much.</p>`}},

{at:["fe","o1","o2","ist"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<div class="flow"><span>app: GET orders</span><i>iptables →</i><span>Envoy (15001)</span><i>mTLS →</i><span>Envoy (15006)</span><i>→</i><span>app orders</span></div>
<ul><li>Mesh = <strong>proxy-uri</strong> lângă aplicații (plan de date) + <strong>istiod</strong> (plan de control).</li>
<li>Sidecar-ul e injectat automat; <strong>iptables</strong> îi trimite tot traficul podului.</li>
<li>istiod trimite configurația prin <strong>xDS</strong> și certificate cu identități <strong>SPIFFE</strong>, rotite automat.</li>
<li><strong>mTLS</strong> criptează și autentifică; <strong>AuthorizationPolicy</strong> decide cine are voie.</li>
<li><strong>VirtualService</strong> împarte traficul (canary); <strong>DestinationRule</strong> setează retry, timeout, outlier detection.</li>
<li>Metrici, trace-uri și log-uri pentru orice cerere; aplicația doar transmite antetele de trace.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Mergi la test ↓</button></p>`,
 en:`<div class="flow"><span>app: GET orders</span><i>iptables →</i><span>Envoy (15001)</span><i>mTLS →</i><span>Envoy (15006)</span><i>→</i><span>orders app</span></div>
<ul><li>Mesh = <strong>proxies</strong> next to apps (data plane) + <strong>istiod</strong> (control plane).</li>
<li>The sidecar is injected automatically; <strong>iptables</strong> sends it all the pod's traffic.</li>
<li>istiod sends configuration via <strong>xDS</strong> and certificates with <strong>SPIFFE</strong> identities, rotated automatically.</li>
<li><strong>mTLS</strong> encrypts and authenticates; the <strong>AuthorizationPolicy</strong> decides who's allowed.</li>
<li>The <strong>VirtualService</strong> splits traffic (canary); the <strong>DestinationRule</strong> sets retries, timeouts, outlier detection.</li>
<li>Metrics, traces and logs for every request; the app only passes on trace headers.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Go to the quiz ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  let h=`<div class="ref-grid"><section class="card refcard"><h2>${ro?"Canary 90/10 și retry":"Canary 90/10 and retries"}</h2>
<pre class="yaml">apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: orders, namespace: shop }
spec:
  hosts: [orders]
  http:
  - route:
    - destination: { host: orders, subset: v1 }
      weight: 90
    - destination: { host: orders, subset: v2 }
      weight: 10
    timeout: 5s
    retries: { attempts: 3, perTryTimeout: 2s, retryOn: 5xx }
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: { name: orders, namespace: shop }
spec:
  host: orders
  subsets:
  - { name: v1, labels: { version: v1 } }
  - { name: v2, labels: { version: v2 } }
  trafficPolicy:
    outlierDetection: { consecutive5xxErrors: 5, interval: 10s, baseEjectionTime: 30s }</pre></section>`;
  h+=`<section class="card refcard"><h2>${ro?"mTLS strict și autorizare":"Strict mTLS and authorization"}</h2>
<pre class="yaml">apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: default, namespace: shop }
spec: { mtls: { mode: STRICT } }
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: orders, namespace: shop }
spec:
  selector: { matchLabels: { app: orders } }
  rules:
  - from: [{ source: { principals: ["cluster.local/ns/shop/sa/frontend"] } }]
    to: [{ operation: { methods: ["GET","POST"] } }]

<span class="c"># ${ro?"depanare":"troubleshooting"}</span>
istioctl analyze -n shop
istioctl proxy-status
istioctl proxy-config routes deploy/frontend -n shop</pre></section></div>`;
  return h;
},
