sub:{ro:"O aplicație de plăți trimite o instrucțiune spre sistemul bancar central, care noaptea poate fi oprit pentru mentenanță. Mesajul nu se poate pierde și nu se poate procesa de două ori. Urmărim mesajul prin IBM MQ: JMS, queue manager, coadă remote, canal, tranzacție, răspuns, mesaj otrăvit și publish/subscribe, apoi vedem aceleași idei în ActiveMQ și diferențele față de Kafka.",en:"A payments app sends an instruction to the core banking system, which may be down at night for maintenance. The message must not be lost or processed twice. We follow it through IBM MQ: JMS, the queue manager, a remote queue, a channel, a transaction, the reply, a poison message and publish/subscribe, then see the same ideas in ActiveMQ and how it all differs from Kafka."},

steps:[
{at:["qm1","qm2"],frame:null,kind:"none",tables:["kinds"],who:{ro:"Ideea",en:"The idea"},
 title:{ro:"De ce o coadă între aplicații",en:"Why a queue between applications"},
 body:{ro:`<p>Sistemul bancar central (<em>core-banking</em>) e oprit în fiecare noapte o oră pentru mentenanță. Dacă aplicația de plăți l-ar chema direct, plățile din ora aceea ar eșua.</p>
<p>Cu un <strong>broker de mesaje</strong> (IBM MQ, ActiveMQ), aplicația pune plata într-o <strong>coadă</strong> și merge mai departe. Brokerul o <strong>păstrează în siguranță</strong>, pe disc, până când core-banking o ia. Cele două sisteme nu trebuie să funcționeze în același timp.</p>
<p>Brokerele au două tipuri de destinații: <strong>cozi</strong> (fiecare mesaj ajunge la un singur consumator) și <strong>topic-uri</strong> (fiecare abonat primește o copie).</p>`,
 en:`<p>The core banking system is down for an hour every night for maintenance. If the payments app called it directly, payments in that hour would fail.</p>
<p>With a <strong>message broker</strong> (IBM MQ, ActiveMQ), the app puts the payment on a <strong>queue</strong> and moves on. The broker <strong>keeps it safe</strong>, on disk, until core-banking takes it. The two systems don't need to be up at the same time.</p>
<p>Brokers have two kinds of destination: <strong>queues</strong> (each message reaches one consumer) and <strong>topics</strong> (each subscriber gets a copy).</p>`}},

{at:"app",frame:M1,kind:"m",move:[[["app","qm1"]]],log:{ro:"payments-api → QM_APP",en:"payments-api → QM_APP"},who:"payments-api",
 title:{ro:"Aplicația trimite mesajul prin JMS",en:"The app sends the message via JMS"},
 body:{ro:`<p>payments-api e o aplicație Java. Folosește <strong>JMS</strong>, interfața standard pentru mesagerie în Java (aceeași pentru IBM MQ și ActiveMQ). Se conectează la queue manager-ul local, <strong>QM_APP</strong>, printr-un <strong>canal client</strong> (SVRCONN) pe portul 1414, cu TLS.</p>
<p>Mesajul are un <strong>antet</strong> și un <strong>conținut</strong>:</p>
<ul><li><strong>MessageId</strong>: unic, dat de MQ;</li>
<li><strong>PERSISTENT</strong>: scris pe disc, supraviețuiește unei reporniri (o plată nu se poate pierde);</li>
<li><strong>ReplyTo</strong>: unde vrea aplicația să primească răspunsul.</li></ul>`,
 en:`<p>payments-api is a Java app. It uses <strong>JMS</strong>, the standard messaging interface in Java (the same for IBM MQ and ActiveMQ). It connects to the local queue manager, <strong>QM_APP</strong>, through a <strong>client channel</strong> (SVRCONN) on port 1414, with TLS.</p>
<p>The message has a <strong>header</strong> and a <strong>body</strong>:</p>
<ul><li><strong>MessageId</strong>: unique, assigned by MQ;</li>
<li><strong>PERSISTENT</strong>: written to disk, survives a restart (a payment mustn't be lost);</li>
<li><strong>ReplyTo</strong>: where the app wants the reply.</li></ul>`},
 more:{ro:`<p>Un <strong>queue manager</strong> (QM) e „serverul” IBM MQ: deține cozile, jurnalul de pe disc și canalele. O firmă are de obicei mai mulți, câte unul lângă fiecare sistem mare.</p>`,
  en:`<p>A <strong>queue manager</strong> (QM) is the IBM MQ "server": it owns the queues, the on-disk log and the channels. A company usually has several, one next to each large system.</p>`}},

{at:"qm1",frame:M2,kind:"m",tables:["qapp"],hl:{qapp:"QM_CORE.XMITQ"},log:{ro:"în coada de transmisie",en:"into the transmission queue"},who:"QM_APP",
 title:{ro:"Coada remote: aplicația nu știe unde e core-banking",en:"The remote queue: the app doesn't know where core-banking is"},
 body:{ro:`<p>Pentru aplicație, <code>PAYMENTS</code> e o coadă obișnuită. De fapt e o <strong>coadă remote</strong> (QREMOTE): o definiție care spune „mesajele astea merg la coada <code>PAYMENTS.IN</code> de pe <strong>QM_CORE</strong>”.</p>
<p>QM_APP pune mesajul în <strong>coada de transmisie</strong> <code>QM_CORE.XMITQ</code> și îl scrie în jurnalul de pe disc. Apoi confirmă aplicației: <strong>put reușit</strong>. Din acest moment, mesajul e responsabilitatea MQ.</p>
<p class="key">Dacă core-banking e oprit sau rețeaua spre el pică, mesajul doar <strong>așteaptă</strong> în XMITQ. Nu se pierde și aplicația nu primește eroare.</p>`,
 en:`<p>To the app, <code>PAYMENTS</code> is an ordinary queue. It's actually a <strong>remote queue</strong> (QREMOTE): a definition saying "these messages go to the <code>PAYMENTS.IN</code> queue on <strong>QM_CORE</strong>".</p>
<p>QM_APP puts the message on the <strong>transmission queue</strong> <code>QM_CORE.XMITQ</code> and writes it to the on-disk log. Then it confirms to the app: <strong>put succeeded</strong>. From this moment the message is MQ's responsibility.</p>
<p class="key">If core-banking is down or the network to it fails, the message simply <strong>waits</strong> in the XMITQ. It isn't lost and the app gets no error.</p>`}},

{at:"qm1",frame:M3,kind:"x",move:[[["qm1","qm2"]]],log:{ro:"pe canal spre QM_CORE",en:"over the channel to QM_CORE"},who:{ro:"Canal",en:"Channel"},
 title:{ro:"Canalul mută mesajul între queue manager-e",en:"The channel moves the message between queue managers"},
 body:{ro:`<p>Între QM_APP și QM_CORE există o pereche de <strong>canale</strong>: un canal <strong>sender</strong> pe QM_APP și un canal <strong>receiver</strong> pe QM_CORE. Canalul sender citește din XMITQ și trimite mesajele prin TCP (cu TLS).</p>
<p>Mesajele merg în <strong>loturi</strong> (batches). Ambele capete confirmă fiecare lot înainte ca mesajele să fie șterse din XMITQ, deci un mesaj persistent ajunge <strong>exact o dată</strong>, chiar dacă rețeaua cade la mijloc.</p>`,
 en:`<p>Between QM_APP and QM_CORE there's a pair of <strong>channels</strong>: a <strong>sender</strong> channel on QM_APP and a <strong>receiver</strong> channel on QM_CORE. The sender channel reads from the XMITQ and sends the messages over TCP (with TLS).</p>
<p>Messages travel in <strong>batches</strong>. Both ends confirm each batch before the messages are removed from the XMITQ, so a persistent message arrives <strong>exactly once</strong>, even if the network drops halfway.</p>`},
 try:[{cmd:"DISPLAY CHSTATUS(QM_APP.TO.QM_CORE)",d:{ro:"În runmqsc: canalul e RUNNING, RETRYING sau STOPPED?",en:"In runmqsc: is the channel RUNNING, RETRYING or STOPPED?"}}]},

{at:"qm2",frame:M4,kind:"m",tables:["qcore"],hl:{qcore:"PAYMENTS.IN"},log:{ro:"în PAYMENTS.IN",en:"into PAYMENTS.IN"},who:"QM_CORE",
 title:{ro:"Mesajul ajunge în coada locală",en:"The message lands in the local queue"},
 body:{ro:`<p>QM_CORE pune mesajul în coada locală <code>PAYMENTS.IN</code>. Adâncimea cozii (<code>CURDEPTH</code>) devine 1.</p>
<p>Adâncimea e cea mai importantă metrică: dacă tot crește, consumatorul e oprit sau prea lent. Coada are și o limită, <code>MAXDEPTH</code>; dacă e plină, mesajele noi ajung în <strong>dead letter queue</strong> sau aplicația primește eroare.</p>`,
 en:`<p>QM_CORE puts the message on the local queue <code>PAYMENTS.IN</code>. The queue depth (<code>CURDEPTH</code>) becomes 1.</p>
<p>Depth is the key metric: if it keeps rising, the consumer is down or too slow. The queue also has a limit, <code>MAXDEPTH</code>; when it's full, new messages go to the <strong>dead letter queue</strong> or the app gets an error.</p>`},
 try:[{cmd:"DISPLAY QLOCAL(PAYMENTS.IN) CURDEPTH IPPROCS",d:{ro:"Câte mesaje sunt în coadă și câte aplicații o citesc.",en:"How many messages are queued and how many apps are reading it."}}]},

{at:"core",frame:M5,kind:"m",move:[[["qm2","core"]]],log:{ro:"core-banking procesează",en:"core-banking processes"},who:"core-banking",
 title:{ro:"Consumatorul citește într-o tranzacție",en:"The consumer reads inside a transaction"},
 body:{ro:`<p>core-banking a revenit după mentenanță și citește mesajul <strong>sub syncpoint</strong> (o sesiune JMS tranzacționată): mesajul e „rezervat”, dar nu încă șters.</p>
<ol><li>Verifică plata și actualizează conturile în baza de date.</li>
<li>Dă <strong>COMMIT</strong>: abia acum mesajul dispare din coadă.</li></ol>
<p>Dacă procesul cade între 1 și 2, tranzacția se anulează și mesajul <strong>revine în coadă</strong>, ca să fie procesat din nou. Pentru siguranță deplină, baza de date și MQ pot fi în aceeași tranzacție (XA / two-phase commit) sau consumatorul verifică dacă plata P-5521 a fost deja făcută.</p>`,
 en:`<p>core-banking is back after maintenance and reads the message <strong>under syncpoint</strong> (a transacted JMS session): the message is "reserved" but not yet deleted.</p>
<ol><li>It checks the payment and updates the accounts in the database.</li>
<li>It issues a <strong>COMMIT</strong>: only now does the message leave the queue.</li></ol>
<p>If the process dies between 1 and 2, the transaction rolls back and the message <strong>returns to the queue</strong> to be processed again. For full safety, the database and MQ can share one transaction (XA / two-phase commit), or the consumer checks whether payment P-5521 was already done.</p>`}},

{at:"core",frame:M6,kind:"m",move:[[["core","qm2"]],[["qm2","qm1"]]],log:{ro:"răspunsul",en:"the reply"},who:"core-banking",
 title:{ro:"Request / reply: răspunsul găsește cererea",en:"Request / reply: the reply finds its request"},
 body:{ro:`<p>Aplicația de plăți vrea să știe dacă plata a fost acceptată. core-banking trimite un mesaj de <strong>răspuns</strong> în coada din <code>ReplyTo</code>, <code>PAYMENTS.REPLY</code>.</p>
<p>Truc important: în <strong>CorrelationId</strong> pune <strong>MessageId-ul cererii</strong>. payments-api, care poate avea sute de cereri în așteptare, citește din coada de răspunsuri doar mesajul cu acel CorrelationId și știe exact la ce plată se referă.</p>`,
 en:`<p>The payments app wants to know whether the payment was accepted. core-banking sends a <strong>reply</strong> message to the queue named in <code>ReplyTo</code>, <code>PAYMENTS.REPLY</code>.</p>
<p>The key trick: it puts the <strong>request's MessageId</strong> into the <strong>CorrelationId</strong>. payments-api, which may have hundreds of requests pending, reads from the reply queue only the message with that CorrelationId and knows exactly which payment it's about.</p>`}},

{at:"qm2",frame:M7,kind:"m",move:[[["qm2","core"]],[["core","qm2"]],[["qm2","dlq"]]],marks:{core:{k:"drop",t:{ro:"eroare ×3",en:"error ×3"}}},tables:["qcore"],hl:{qcore:"PAYMENTS.BACKOUT"},log:{ro:"mesaj otrăvit → backout",en:"poison message → backout"},who:{ro:"Mesaj otrăvit",en:"Poison message"},
 title:{ro:"Mesajul otrăvit și coada de backout",en:"The poison message and the backout queue"},
 body:{ro:`<p>Un alt mesaj are suma <code>"abc"</code>. core-banking dă eroare, tranzacția se anulează, mesajul revine în coadă… și e citit din nou, și dă iar eroare. Fără o regulă, s-ar învârti la nesfârșit și ar <strong>bloca</strong> toate plățile din spatele lui.</p>
<p>MQ numără încercările în <strong>BackoutCount</strong>. Când ajunge la pragul cozii (<code>BOTHRESH(3)</code>), mesajul e mutat în <strong>coada de backout</strong> <code>PAYMENTS.BACKOUT</code>. Coada principală merge mai departe, iar echipa de suport analizează mesajul și îl retrimite după corectare.</p>`,
 en:`<p>Another message has the amount <code>"abc"</code>. core-banking errors, the transaction rolls back, the message returns to the queue… is read again, and errors again. With no rule it would loop forever and <strong>block</strong> every payment behind it.</p>
<p>MQ counts the attempts in <strong>BackoutCount</strong>. When it reaches the queue's threshold (<code>BOTHRESH(3)</code>), the message is moved to the <strong>backout queue</strong> <code>PAYMENTS.BACKOUT</code>. The main queue carries on, and the support team investigates the message and resubmits it once fixed.</p>`},
 more:{ro:`<p>În IBM MQ, mutarea în coada de backout e făcută de clientul JMS (sau de aplicație), pe baza atributelor cozii. Separat, queue manager-ul are o <strong>dead letter queue</strong> (<code>SYSTEM.DEAD.LETTER.QUEUE</code>) pentru mesajele care nu pot fi livrate deloc (coadă inexistentă, coadă plină).</p>`,
  en:`<p>In IBM MQ, the move to the backout queue is done by the JMS client (or the app), based on the queue's attributes. Separately, the queue manager has a <strong>dead letter queue</strong> (<code>SYSTEM.DEAD.LETTER.QUEUE</code>) for messages that can't be delivered at all (missing queue, full queue).</p>`}},

{at:"qm2",frame:M8,kind:"m",move:[[["qm2","notif"]]],tables:["kinds"],log:{ro:"publicare pe topic",en:"publish to topic"},who:{ro:"Publish / subscribe",en:"Publish / subscribe"},
 title:{ro:"Topic: cine e abonat primește o copie",en:"Topic: every subscriber gets a copy"},
 body:{ro:`<p>După ce acceptă plata, core-banking <strong>publică</strong> un eveniment pe topic-ul <code>PAYMENTS/EVENTS</code>. Nu știe cine îl citește.</p>
<p>Serviciul de notificări are un <strong>abonament durabil</strong>: dacă e oprit, MQ îi păstrează mesajele până revine. Mâine se poate abona și serviciul antifraudă, fără nicio schimbare în core-banking: fiecare abonat primește <strong>propria copie</strong>.</p>`,
 en:`<p>After accepting the payment, core-banking <strong>publishes</strong> an event on the <code>PAYMENTS/EVENTS</code> topic. It doesn't know who reads it.</p>
<p>The notifications service has a <strong>durable subscription</strong>: if it's down, MQ keeps its messages until it returns. Tomorrow the anti-fraud service can subscribe too, with no change to core-banking: each subscriber gets <strong>its own copy</strong>.</p>`}},

{at:["qm1","qm2"],frame:null,kind:"none",tables:["map"],who:"ActiveMQ",
 title:{ro:"Aceleași idei în ActiveMQ",en:"The same ideas in ActiveMQ"},
 body:{ro:`<p><strong>Apache ActiveMQ</strong> e un broker open-source cu aceleași concepte: cozi, topic-uri, mesaje persistente, JMS, tranzacții, request/reply. Codul JMS al aplicației arată aproape la fel; se schimbă doar <em>ConnectionFactory</em>-ul.</p>
<ul><li>Un <strong>broker</strong> în loc de queue manager; mai mulți brokeri se leagă într-o <em>network of brokers</em>.</li>
<li>Protocoale: <strong>OpenWire</strong> (nativ), <strong>AMQP</strong>, STOMP, MQTT; portul implicit 61616.</li>
<li>Mesajele care eșuează de prea multe ori merg, după <em>redeliveryPolicy</em>, în <code>ActiveMQ.DLQ</code>.</li>
<li>Două variante: <strong>Classic</strong> și <strong>Artemis</strong> (noua generație, folosită și în Red Hat AMQ).</li></ul>`,
 en:`<p><strong>Apache ActiveMQ</strong> is an open-source broker with the same concepts: queues, topics, persistent messages, JMS, transactions, request/reply. The app's JMS code looks almost the same; only the <em>ConnectionFactory</em> changes.</p>
<ul><li>A <strong>broker</strong> instead of a queue manager; several brokers link into a <em>network of brokers</em>.</li>
<li>Protocols: <strong>OpenWire</strong> (native), <strong>AMQP</strong>, STOMP, MQTT; default port 61616.</li>
<li>Messages that fail too many times go, per the <em>redeliveryPolicy</em>, to <code>ActiveMQ.DLQ</code>.</li>
<li>Two flavours: <strong>Classic</strong> and <strong>Artemis</strong> (the new generation, also used in Red Hat AMQ).</li></ul>`}},

{at:["qm1","qm2","core"],frame:null,kind:"none",summary:true,
 title:{ro:"MQ sau Kafka? Și recapitulare",en:"MQ or Kafka? And a recap"},
 body:{ro:`<div class="scroll"><table class="cmp"><thead><tr><th></th><th>IBM MQ / ActiveMQ</th><th>Kafka</th></tr></thead><tbody>
<tr><td>Model</td><td>cozi: mesajul dispare după procesare</td><td>jurnal: mesajele rămân, fiecare grup are offset-ul lui</td></tr>
<tr><td>Bun pentru</td><td>comenzi, plăți, tranzacții, request/reply</td><td>fluxuri mari de evenimente, reluare, analiză</td></tr>
<tr><td>Garanții</td><td>tranzacții, exact o dată între QM-uri</td><td>at-least-once; exactly-once cu tranzacții Kafka</td></tr>
<tr><td>Reluare</td><td>nu (mesajul a plecat)</td><td>da (muți offset-ul)</td></tr></tbody></table></div>
<ul><li><strong>Coadă</strong> = un consumator; <strong>topic</strong> = fiecare abonat.</li>
<li>IBM MQ: aplicația → <strong>queue manager</strong> → coadă remote → <strong>XMITQ</strong> → <strong>canal</strong> → coada locală.</li>
<li>Mesaje <strong>persistente</strong> + citire în <strong>tranzacție</strong> = nicio plată pierdută.</li>
<li><strong>CorrelationId</strong> leagă răspunsul de cerere; <strong>BOTHRESH</strong> + coada de backout scot mesajele otrăvite.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<div class="scroll"><table class="cmp"><thead><tr><th></th><th>IBM MQ / ActiveMQ</th><th>Kafka</th></tr></thead><tbody>
<tr><td>Model</td><td>queues: the message is gone after processing</td><td>log: messages stay, each group has its own offset</td></tr>
<tr><td>Good for</td><td>commands, payments, transactions, request/reply</td><td>large event streams, replay, analytics</td></tr>
<tr><td>Guarantees</td><td>transactions, exactly once between QMs</td><td>at-least-once; exactly-once with Kafka transactions</td></tr>
<tr><td>Replay</td><td>no (the message is gone)</td><td>yes (move the offset)</td></tr></tbody></table></div>
<ul><li><strong>Queue</strong> = one consumer; <strong>topic</strong> = every subscriber.</li>
<li>IBM MQ: app → <strong>queue manager</strong> → remote queue → <strong>XMITQ</strong> → <strong>channel</strong> → local queue.</li>
<li><strong>Persistent</strong> messages + reading in a <strong>transaction</strong> = no payment lost.</li>
<li><strong>CorrelationId</strong> ties the reply to the request; <strong>BOTHRESH</strong> + a backout queue remove poison messages.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],

<pre class="yaml"><span class="c">* QM_APP: ${ro?"coada remote și canalul sender":"the remote queue and the sender channel"}</span>

DEFINE CHANNEL(QM_APP.TO.QM_CORE) CHLTYPE(SDR) +

<span class="c">* QM_CORE: ${ro?"coada locală cu backout":"the local queue with backout"}</span>

       BOTHRESH(3) BOQNAME(PAYMENTS.BACKOUT)
DEFINE QLOCAL(PAYMENTS.BACKOUT)
DEFINE CHANNEL(QM_APP.TO.QM_CORE) CHLTYPE(RCVR) SSLCIPH(ANY_TLS13)

<span class="c">* ${ro?"verificări":"checks"}</span>

<section class="card refcard"><h2>JMS (Java)</h2>
<pre class="yaml">try (JMSContext ctx = factory.createContext(JMSContext.SESSION_TRANSACTED)) {
  Queue q = ctx.createQueue("PAYMENTS");
  TextMessage m = ctx.createTextMessage(xml);
  m.setJMSReplyTo(ctx.createQueue("PAYMENTS.REPLY"));
  ctx.createProducer()
     .setDeliveryMode(DeliveryMode.PERSISTENT)
     .send(q, m);
  ctx.commit();
}</pre>
<h3>ActiveMQ Classic: redelivery</h3>
<pre class="yaml">&lt;redeliveryPolicy maximumRedeliveries="3"
