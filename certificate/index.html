steps:[
{at:["srv","br"],frame:null,kind:"none",tables:["chain"],who:{ro:"Ideea",en:"The idea"},
 title:{ro:"Ce e un certificat, într-o propoziție",en:"What a certificate is, in one sentence"},
 body:{ro:`<p>Un <strong>certificat</strong> e o carte de identitate digitală: „cheia publică asta aparține lui <code>shop.example.com</code>”, <strong>semnată</strong> de o autoritate în care browserul are încredere (o <strong>CA</strong>).</p>
<p>În <a href="../https/index.html">lecția HTTPS</a> ai văzut că browserul verifică certificatul în timpul negocierii TLS. Aici vedem de unde vine certificatul, cum ajunge pe server și ce poate merge prost.</p>
<p>Încrederea e un <strong>lanț</strong>: browserul are încredere într-o rădăcină, rădăcina garantează pentru un CA intermediar, intermediarul garantează pentru site.</p>`,
 en:`<p>A <strong>certificate</strong> is a digital ID card: "this public key belongs to <code>shop.example.com</code>", <strong>signed</strong> by an authority the browser trusts (a <strong>CA</strong>).</p>
<p>In the <a href="../https/index.html">HTTPS lesson</a> you saw the browser check the certificate during the TLS handshake. Here we see where the certificate comes from, how it gets onto the server and what can go wrong.</p>
<p>Trust is a <strong>chain</strong>: the browser trusts a root, the root vouches for an intermediate CA, the intermediate vouches for the site.</p>`}},

{at:"srv",frame:KEY,kind:"c",log:{ro:"cheile, pe server",en:"keys, on the server"},who:"shop.example.com",
 title:{ro:"Totul începe cu o pereche de chei",en:"Everything starts with a key pair"},
 body:{ro:`<p>Pe server, echipa generează o <strong>pereche de chei</strong>: o cheie <strong>privată</strong> și una <strong>publică</strong>, legate matematic.</p>
<ul><li>Ce e criptat sau <strong>semnat</strong> cu cheia privată se poate verifica cu cea publică.</li>
<li>Din cheia publică nu se poate afla cea privată.</li></ul>
<p class="key">Cheia privată <strong>nu pleacă niciodată</strong> de pe server. Nu se trimite prin e-mail, nu se pune în Git, nu o vede CA-ul. Cine o are se poate da drept site-ul.</p>`,
 en:`<p>On the server, the team generates a <strong>key pair</strong>: a <strong>private</strong> key and a <strong>public</strong> one, mathematically linked.</p>
<ul><li>Whatever is encrypted or <strong>signed</strong> with the private key can be checked with the public one.</li>
<li>The private key can't be worked out from the public key.</li></ul>
<p class="key">The private key <strong>never leaves</strong> the server. It isn't emailed, isn't put in Git, isn't seen by the CA. Whoever holds it can impersonate the site.</p>`},
 more:{ro:`<p>Tipuri de chei: <strong>RSA</strong> 2048 sau 3072 de biți (compatibil cu orice) sau <strong>ECDSA</strong> P-256 (mai mică și mai rapidă). La bănci și în cloud, cheile stau adesea într-un <strong>HSM</strong> sau KMS, un dispozitiv din care nu pot fi copiate deloc.</p>`,
  en:`<p>Key types: <strong>RSA</strong> 2048 or 3072 bits (works everywhere) or <strong>ECDSA</strong> P-256 (smaller and faster). At banks and in the cloud, keys often live in an <strong>HSM</strong> or KMS, a device they can't be copied out of at all.</p>`},
 try:[{cmd:"openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out shop.key",d:{ro:"Generează o cheie privată ECDSA.",en:"Generates an ECDSA private key."}}]},

{at:"srv",frame:CSR,kind:"c",move:[[["srv","ca"]]],log:{ro:"CSR → CA",en:"CSR → CA"},who:"shop.example.com",
 title:{ro:"CSR: cererea de certificat",en:"The CSR: the certificate request"},
 body:{ro:`<p>Echipa creează un <strong>CSR</strong> (Certificate Signing Request): un document mic cu <strong>numele</strong> dorite și <strong>cheia publică</strong>, semnat cu cheia privată.</p>
<p>Semnătura dovedește că cel care cere certificatul chiar are cheia privată. CSR-ul nu conține nimic secret, deci poate fi trimis liniștit la CA.</p>
<p>Numele importante sunt în <strong>SAN</strong> (subjectAltName): <code>shop.example.com</code> și <code>www.shop.example.com</code>. Browserele moderne se uită doar în SAN, nu în CN.</p>`,
 en:`<p>The team creates a <strong>CSR</strong> (Certificate Signing Request): a small document with the desired <strong>names</strong> and the <strong>public key</strong>, signed with the private key.</p>
<p>The signature proves whoever asks for the certificate actually holds the private key. The CSR contains nothing secret, so it can safely be sent to the CA.</p>
<p>The important names are in the <strong>SAN</strong> (subjectAltName): <code>shop.example.com</code> and <code>www.shop.example.com</code>. Modern browsers only look at the SAN, not the CN.</p>`},
 try:[{cmd:"openssl req -new -key shop.key -subj \"/CN=shop.example.com\" -addext \"subjectAltName=DNS:shop.example.com,DNS:www.shop.example.com\" -out shop.csr",d:{ro:"Creează CSR-ul cu două nume în SAN.",en:"Creates the CSR with two names in the SAN."}},{cmd:"openssl req -in shop.csr -noout -text",d:{ro:"Citește ce e în CSR.",en:"Reads what's inside the CSR."}}]},

{at:"ca",frame:CHAL,kind:"c",move:[[["ca","srv"]]],log:{ro:"CA verifică domeniul",en:"CA checks the domain"},who:{ro:"CA intermediar",en:"Intermediate CA"},
 title:{ro:"CA-ul verifică: chiar controlezi domeniul?",en:"The CA checks: do you really control the domain?"},
 body:{ro:`<p>Înainte să semneze, CA-ul trebuie să se convingă că cererea vine de la cine controlează <code>shop.example.com</code>. Cu <strong>ACME</strong> (protocolul folosit de Let's Encrypt), e automat:</p>
<ul><li><strong>http-01</strong>: „pune acest fișier la <code>/.well-known/acme-challenge/…</code>”; CA-ul îl descarcă de pe site.</li>
<li><strong>dns-01</strong>: „pune această valoare într-o înregistrare TXT <code>_acme-challenge</code>”; merge și pentru <code>*.example.com</code>.</li></ul>
<p>Asta e validare <strong>DV</strong> (domain validated). Pentru certificate interne, CA-ul firmei verifică de obicei printr-un tichet aprobat sau automat, prin cert-manager.</p>`,
 en:`<p>Before signing, the CA must be convinced the request comes from whoever controls <code>shop.example.com</code>. With <strong>ACME</strong> (the protocol Let's Encrypt uses), it's automatic:</p>
<ul><li><strong>http-01</strong>: "put this file at <code>/.well-known/acme-challenge/…</code>"; the CA downloads it from the site.</li>
<li><strong>dns-01</strong>: "put this value in a <code>_acme-challenge</code> TXT record"; this also works for <code>*.example.com</code>.</li></ul>
<p>That's <strong>DV</strong> (domain validated) validation. For internal certificates, the company CA usually checks via an approved ticket, or automatically through cert-manager.</p>`},
 more:{ro:`<p>Există și <strong>OV</strong> și <strong>EV</strong>, unde CA-ul verifică și firma. Browserele de azi nu le mai afișează diferit, așa că majoritatea site-urilor folosesc DV.</p>`,
  en:`<p>There are also <strong>OV</strong> and <strong>EV</strong>, where the CA checks the company too. Today's browsers no longer display them differently, so most sites use DV.</p>`}},

{at:"ca",frame:CERT,kind:"c",move:[[["ca","srv"]]],log:{ro:"certificatul emis",en:"certificate issued"},who:{ro:"CA intermediar",en:"Intermediate CA"},
 title:{ro:"CA-ul emite certificatul",en:"The CA issues the certificate"},
 body:{ro:`<p>CA-ul ia cheia publică și numele din CSR, adaugă câmpurile lui și <strong>semnează totul</strong> cu cheia lui privată:</p>
<ul><li><strong>Emitent</strong>: cine a semnat (<code>Example Issuing CA R2</code>);</li>
<li><strong>Număr de serie</strong>: unic, folosit la revocare;</li>
<li><strong>Valabilitate</strong>: de când până când (azi, maximum 398 de zile; Let's Encrypt dă 90);</li>
<li><strong>Utilizare</strong>: pentru ce e voie să fie folosit (aici, server TLS).</li></ul>
<p>Certificatul e <strong>public</strong>: orice browser îl primește la fiecare conexiune. Nu e nimic secret în el.</p>`,
 en:`<p>The CA takes the public key and names from the CSR, adds its own fields and <strong>signs it all</strong> with its private key:</p>
<ul><li><strong>Issuer</strong>: who signed it (<code>Example Issuing CA R2</code>);</li>
<li><strong>Serial number</strong>: unique, used for revocation;</li>
<li><strong>Validity</strong>: from when to when (today at most 398 days; Let's Encrypt gives 90);</li>
<li><strong>Key usage</strong>: what it may be used for (here, a TLS server).</li></ul>
<p>The certificate is <strong>public</strong>: every browser receives it on every connection. Nothing in it is secret.</p>`},
 try:[{cmd:"openssl x509 -in shop.crt -noout -subject -issuer -dates -ext subjectAltName",d:{ro:"Vezi pe scurt cine e, cine l-a emis și când expiră.",en:"See briefly who it's for, who issued it and when it expires."}}]},

{at:["ca","root"],frame:null,kind:"none",tables:["chain"],hl:{chain:"intermediate"},who:{ro:"Lanțul",en:"The chain"},
 title:{ro:"De ce un CA intermediar și o rădăcină offline",en:"Why an intermediate CA and an offline root"},
 body:{ro:`<p>Cheia privată a <strong>rădăcinii</strong> e cea mai valoroasă: dacă e furată, orice certificat semnat cu ea pare valid oriunde. De aceea rădăcina stă <strong>offline</strong>, într-un seif, și e folosită rar, doar ca să semneze CA-uri intermediare.</p>
<p><strong>Intermediarul</strong> e online și semnează certificatele zilnice. Dacă e compromis, rădăcina îl revocă și creează altul, fără ca browserele să-și schimbe lista de rădăcini.</p>
<p>Rădăcinile sunt preinstalate în browsere și sisteme de operare: magazinul de rădăcini (<em>root store</em>).</p>`,
 en:`<p>The <strong>root's</strong> private key is the most valuable: if stolen, any certificate signed with it looks valid everywhere. That's why the root stays <strong>offline</strong>, in a vault, and is used rarely, only to sign intermediate CAs.</p>
<p>The <strong>intermediate</strong> is online and signs the everyday certificates. If it's compromised, the root revokes it and creates another, without browsers changing their root list.</p>
<p>Roots come preinstalled in browsers and operating systems: the <em>root store</em>.</p>`}},

{at:"ops",frame:{doc:{ro:"Fișierele pe server",en:"Files on the server"},priv:"shop.key",chain:"fullchain.pem = shop.crt + Example Issuing CA R2",result:{ro:"nginx: ssl_certificate fullchain.pem; ssl_certificate_key shop.key;",en:"nginx: ssl_certificate fullchain.pem; ssl_certificate_key shop.key;"}},kind:"c",move:[[["ops","srv"]]],log:{ro:"instalare",en:"install"},who:{ro:"Echipa ops",en:"Ops team"},
 title:{ro:"Instalarea: certificatul + intermediarul + cheia",en:"Installing: the certificate + the intermediate + the key"},
 body:{ro:`<p>Pe server, nginx are nevoie de două lucruri: <strong>cheia privată</strong> și <strong>lanțul</strong>, adică certificatul site-ului <strong>urmat de</strong> certificatul intermediar, în același fișier (<code>fullchain.pem</code>).</p>
<p class="key">Greșeala clasică: pui doar certificatul site-ului, fără intermediar. Chrome merge (își descarcă singur intermediarul), dar <code>curl</code>, aplicațiile Java și telefoanele mai vechi dau eroare: „unable to get local issuer certificate”.</p>`,
 en:`<p>On the server, nginx needs two things: the <strong>private key</strong> and the <strong>chain</strong>, that is the site certificate <strong>followed by</strong> the intermediate certificate, in the same file (<code>fullchain.pem</code>).</p>
<p class="key">The classic mistake: installing only the site certificate, without the intermediate. Chrome works (it fetches the intermediate itself), but <code>curl</code>, Java apps and older phones fail: "unable to get local issuer certificate".</p>`},
 try:[{cmd:"openssl s_client -connect shop.example.com:443 -servername shop.example.com -showcerts",d:{ro:"Vezi ce lanț trimite serverul (trebuie să apară 2 certificate).",en:"See which chain the server sends (2 certificates should appear)."}}]},

{at:"br",frame:CHAIN,kind:"t",move:[[["srv","br"]]],tables:["checks"],log:{ro:"browserul verifică",en:"browser verifies"},who:"Browser",
 title:{ro:"Browserul verifică lanțul",en:"The browser verifies the chain"},
 body:{ro:`<p>La negocierea TLS, serverul trimite lanțul. Browserul verifică, în ordine:</p>
<ol><li>semnătura certificatului site-ului, cu cheia publică a intermediarului;</li>
<li>semnătura intermediarului, cu cheia publică a rădăcinii din <strong>root store</strong>;</li>
<li>că <code>shop.example.com</code> e în <strong>SAN</strong>, că e în perioada de valabilitate, că e pentru server TLS și că nu e revocat.</li></ol>
<p>Dacă orice pas eșuează, apare pagina roșie: <code>NET::ERR_CERT_DATE_INVALID</code>, <code>ERR_CERT_COMMON_NAME_INVALID</code> sau <code>ERR_CERT_AUTHORITY_INVALID</code>.</p>`,
 en:`<p>During the TLS handshake the server sends the chain. The browser checks, in order:</p>
<ol><li>the site certificate's signature, with the intermediate's public key;</li>
<li>the intermediate's signature, with the public key of the root in the <strong>root store</strong>;</li>
<li>that <code>shop.example.com</code> is in the <strong>SAN</strong>, that it's within the validity period, that it's for a TLS server and that it isn't revoked.</li></ol>
<p>If any step fails, the red page appears: <code>NET::ERR_CERT_DATE_INVALID</code>, <code>ERR_CERT_COMMON_NAME_INVALID</code> or <code>ERR_CERT_AUTHORITY_INVALID</code>.</p>`}},

{at:"ca",frame:REV,kind:"c",move:[[["ops","srv"]],[["srv","ca"]]],log:{ro:"revocare",en:"revocation"},who:{ro:"Incident",en:"Incident"},
 title:{ro:"Cheia s-a scurs: revocarea",en:"The key leaked: revocation"},
 body:{ro:`<p>Cineva a pus din greșeală <code>shop.key</code> într-un repository public. Certificatul e încă valabil 80 de zile, deci un atacator l-ar putea folosi. Echipa cere <strong>revocarea</strong>, cu motivul <code>keyCompromise</code>, apoi face o cheie și un certificat nou.</p>
<p>Cum află browserele? Prin <strong>CRL</strong> (listă de serii revocate, descărcată periodic) sau <strong>OCSP</strong> (întrebare „e valid seria X?”). Cu <strong>OCSP stapling</strong>, serverul atașează el răspunsul OCSP semnat, ca browserul să nu mai întrebe.</p>
<p>Revocarea merge prost în practică, de aceea industria trece la certificate <strong>de viață scurtă</strong>: un certificat furat expiră repede oricum.</p>`,
 en:`<p>Someone accidentally pushed <code>shop.key</code> to a public repository. The certificate is still valid for 80 days, so an attacker could use it. The team asks for <strong>revocation</strong>, with the reason <code>keyCompromise</code>, then makes a new key and certificate.</p>
<p>How do browsers find out? Through a <strong>CRL</strong> (a list of revoked serials, downloaded periodically) or <strong>OCSP</strong> (asking "is serial X valid?"). With <strong>OCSP stapling</strong>, the server attaches the signed OCSP answer itself, so the browser needn't ask.</p>
<p>Revocation works poorly in practice, which is why the industry is moving to <strong>short-lived</strong> certificates: a stolen certificate expires soon anyway.</p>`}},

{at:["srv"],frame:null,kind:"none",tables:["formats"],who:{ro:"Formate",en:"Formats"},
 title:{ro:"Formate, keystore, truststore și mTLS",en:"Formats, keystores, truststores and mTLS"},
 body:{ro:`<p>Același certificat poate fi în fișiere diferite (tabelul). Două cuvinte se confundă des, mai ales în Java:</p>
<ul><li><strong>Keystore</strong>: <em>identitatea mea</em>: cheia mea privată + certificatul meu. Îl folosește serverul.</li>
<li><strong>Truststore</strong>: <em>în cine am încredere</em>: certificatele CA-urilor acceptate. Îl folosește clientul (de ex. portalul din <a href="../ldap/index.html">lecția LDAP</a> are CA-ul intern în truststore).</li></ul>
<p>În <strong>mTLS</strong> (mutual TLS), și clientul arată un certificat, deci ambele părți au și keystore, și truststore. Așa se autentifică serviciile între ele (vezi <a href="../service-mesh/index.html">lecția service mesh</a>).</p>`,
 en:`<p>The same certificate can live in different files (the table). Two words are often confused, especially in Java:</p>
<ul><li><strong>Keystore</strong>: <em>my identity</em>: my private key + my certificate. The server uses it.</li>
<li><strong>Truststore</strong>: <em>whom I trust</em>: the certificates of accepted CAs. The client uses it (e.g. the portal in the <a href="../ldap/index.html">LDAP lesson</a> has the internal CA in its truststore).</li></ul>
<p>In <strong>mTLS</strong> (mutual TLS), the client presents a certificate too, so both sides have a keystore and a truststore. That's how services authenticate each other (see the <a href="../service-mesh/index.html">service mesh lesson</a>).</p>`},
 try:[{cmd:"openssl pkcs12 -export -inkey shop.key -in fullchain.pem -out shop.p12",d:{ro:"Pune cheia și lanțul într-un fișier PKCS#12 (îți cere o parolă).",en:"Packs the key and chain into a PKCS#12 file (asks for a password)."}},{cmd:"keytool -list -keystore truststore.p12",d:{ro:"Vezi CA-urile dintr-un truststore Java.",en:"Lists the CAs in a Java truststore."}}]},

{at:["ops","srv","ca"],frame:null,kind:"none",summary:true,
 title:{ro:"Reînnoire automată și recapitulare",en:"Automatic renewal and recap"},
 body:{ro:`<p>Cea mai frecventă pană cu certificate nu e un atac, ci <strong>expirarea</strong>: cineva a uitat să-l reînnoiască. Soluția: automatizare (<code>certbot</code>, <code>cert-manager</code> în Kubernetes) care reînnoiește cu ~30 de zile înainte, plus o alertă dacă un certificat expiră în mai puțin de 14 zile.</p>
<ul><li>Cheia <strong>privată</strong> stă pe server; certificatul e <strong>public</strong>.</li>
<li>Drumul: cheie → <strong>CSR</strong> → CA verifică (ACME) → CA <strong>semnează</strong> → instalezi <strong>certificat + intermediar</strong>.</li>
<li>Browserul verifică lanțul până la o <strong>rădăcină</strong> din root store, numele din <strong>SAN</strong>, datele și revocarea.</li>
<li>PEM = text, PFX/P12 = cheie + certificat cu parolă; keystore = cine sunt, truststore = în cine am încredere.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<p>The most common certificate outage isn't an attack but <strong>expiry</strong>: someone forgot to renew it. The fix: automation (<code>certbot</code>, <code>cert-manager</code> in Kubernetes) renewing ~30 days ahead, plus an alert when a certificate expires in under 14 days.</p>
<ul><li>The <strong>private</strong> key stays on the server; the certificate is <strong>public</strong>.</li>
<li>The path: key → <strong>CSR</strong> → the CA checks (ACME) → the CA <strong>signs</strong> → you install the <strong>certificate + intermediate</strong>.</li>
<li>The browser checks the chain up to a <strong>root</strong> in the root store, the name in the <strong>SAN</strong>, the dates and revocation.</li>
<li>PEM = text, PFX/P12 = key + certificate with a password; keystore = who I am, truststore = whom I trust.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  return `<div class="ref-grid"><section class="card refcard"><h2>${ro?"openssl: rețete":"openssl: recipes"}</h2>
<pre class="yaml"><span class="c"># ${ro?"când expiră certificatul unui site?":"when does a site's certificate expire?"}</span>
echo | openssl s_client -connect shop.example.com:443 \\
  -servername shop.example.com 2>/dev/null | openssl x509 -noout -dates

<span class="c"># ${ro?"cheia se potrivește cu certificatul? (hash-urile trebuie să fie egale)":"does the key match the certificate? (hashes must be equal)"}</span>
openssl pkey -in shop.key -pubout | openssl sha256
openssl x509 -in shop.crt -pubkey -noout | openssl sha256

<span class="c"># ${ro?"verifică lanțul local":"verify the chain locally"}</span>
openssl verify -CAfile root.pem -untrusted intermediate.pem shop.crt

<span class="c"># PFX → PEM</span>
openssl pkcs12 -in shop.p12 -out shop.pem -nodes</pre></section>
<section class="card refcard"><h2>cert-manager (Kubernetes)</h2>
<pre class="yaml">apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop
spec:
  secretName: shop-tls
  dnsNames: [shop.example.com, www.shop.example.com]
  issuerRef: { name: letsencrypt, kind: ClusterIssuer }
  renewBefore: 720h   <span class="c"># 30 ${ro?"de zile":"days"}</span></pre>
<h3>${ro?"Cum arată un PEM":"What a PEM looks like"}</h3>
<pre class="yaml">-----BEGIN CERTIFICATE-----
MIIB9TCCAZugAwIBAgIUBB+a…
-----END CERTIFICATE-----</pre></section></div>`;
},
