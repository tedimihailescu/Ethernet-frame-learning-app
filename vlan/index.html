steps:[
{at:["sw1","sw2"],frame:null,kind:"none",tables:["ports"],
 title:{ro:"Scenariul: două departamente, aceleași switch-uri",en:"The scenario: two departments, the same switches"},
 body:{ro:`<p>Un birou pe două etaje are calculatoare de la <strong>Finanțe</strong> și o rețea pentru <strong>oaspeți</strong>. Toate sunt conectate la aceleași două switch-uri, SW1 și SW2.</p>
<p>Fără nimic special, totul ar fi <strong>o singură rețea locală</strong>: un oaspete ar primi broadcast-urile Finanțelor, ar putea încerca să le acceseze calculatoarele, iar orice ARP sau broadcast ar ajunge la toți.</p>
<p>Un <strong>VLAN</strong> (Virtual LAN) împarte <strong>logic</strong> un switch în mai multe switch-uri separate: Finanțe în VLAN 10, oaspeți în VLAN 20. Fizic aceleași cabluri; logic, două rețele care nu se văd.</p>`,
 en:`<p>A two-floor office has <strong>Finance</strong> computers and a <strong>guest</strong> network. All of them plug into the same two switches, SW1 and SW2.</p>
<p>With nothing special, everything would be <strong>one local network</strong>: a guest would receive Finance's broadcasts, could try to reach their computers, and every ARP or broadcast would reach everyone.</p>
<p>A <strong>VLAN</strong> (Virtual LAN) splits a switch <strong>logically</strong> into several separate switches: Finance in VLAN 10, guests in VLAN 20. Physically the same cables; logically, two networks that can't see each other.</p>`},
 more:{ro:`<p>Fiecare VLAN e un <strong>domeniu de broadcast</strong> separat și, de obicei, un <strong>subnet IP</strong> separat: VLAN 10 = 10.10.10.0/24, VLAN 20 = 10.20.20.0/24. Numerele de VLAN merg de la 1 la 4094.</p>`,
  en:`<p>Each VLAN is a separate <strong>broadcast domain</strong> and usually a separate <strong>IP subnet</strong>: VLAN 10 = 10.10.10.0/24, VLAN 20 = 10.20.20.0/24. VLAN numbers range from 1 to 4094.</p>`}},

{at:"f1",frame:F1,kind:"f",move:[[["f1","sw1"]]],log:{ro:"PC-F1 → SW1 (access)",en:"PC-F1 → SW1 (access)"},tables:["ports"],hl:{ports:"p1 (PC-F1)"},who:"PC-F1",
 title:{ro:"Port access: calculatorul nu știe nimic de VLAN",en:"Access port: the computer knows nothing about VLANs"},
 body:{ro:`<p>PC-F1 trimite date lui PC-F2 (de la etajul 2). Construiește un cadru Ethernet <strong>obișnuit</strong>, exact ca în <a href="../ethernet/index.html">lecția Ethernet</a>: fără nicio mențiune despre VLAN.</p>
<p>Portul 1 al SW1 e un port <strong>access</strong>, setat pe VLAN 10. Pentru un port access, VLAN-ul e o setare a <strong>portului</strong>, nu a calculatorului: orice intră pe portul 1 aparține de VLAN 10.</p>`,
 en:`<p>PC-F1 sends data to PC-F2 (on floor 2). It builds an <strong>ordinary</strong> Ethernet frame, exactly as in the <a href="../ethernet/index.html">Ethernet lesson</a>: no mention of any VLAN.</p>
<p>SW1's port 1 is an <strong>access</strong> port set to VLAN 10. For an access port, the VLAN is a setting of the <strong>port</strong>, not of the computer: anything entering port 1 belongs to VLAN 10.</p>`}},

{at:"sw1",frame:F2,kind:"f",fx:[["mac","10",MAC.f1,"p1"],["mac","10 ",MAC.f2,"p24"]],tables:["mac"],hl:{mac:"10 "},who:"SW1",
 title:{ro:"SW1 învață și caută doar în VLAN 10",en:"SW1 learns and looks up only in VLAN 10"},
 body:{ro:`<p>SW1 notează cadrul intern ca aparținând de <strong>VLAN 10</strong> și lucrează ca un switch obișnuit, dar <strong>separat pe fiecare VLAN</strong>:</p>
<ul><li><strong>Învață</strong>: în VLAN 10, MAC-ul lui PC-F1 e pe portul 1.</li>
<li><strong>Caută</strong> MAC-ul destinației doar în tabela VLAN 10: PC-F2 a fost văzut venind de pe portul 24 (trunk-ul spre SW2).</li>
<li>Dacă nu l-ar ști, ar inunda cadrul doar pe porturile din VLAN 10, niciodată pe portul unui oaspete.</li></ul>`,
 en:`<p>SW1 internally marks the frame as belonging to <strong>VLAN 10</strong> and works like an ordinary switch, but <strong>separately for each VLAN</strong>:</p>
<ul><li>It <strong>learns</strong>: in VLAN 10, PC-F1's MAC is on port 1.</li>
<li>It <strong>looks up</strong> the destination MAC only in the VLAN 10 table: PC-F2 was seen arriving from port 24 (the trunk to SW2).</li>
<li>If it didn't know it, it would flood the frame only to VLAN 10 ports, never to a guest's port.</li></ul>`},
 try:[{cmd:"show mac address-table vlan 10",d:{ro:"Tabela MAC doar pentru VLAN 10.",en:"The MAC table for VLAN 10 only."}}]},

{at:"sw1",frame:F3,kind:"f",move:[[["sw1","sw2"]]],log:{ro:"pe trunk SW1 → SW2",en:"on the trunk SW1 → SW2"},tables:["trunk"],hl:{trunk:"Gi0/24"},who:"SW1 → trunk",
 title:{ro:"Pe trunk: se adaugă eticheta 802.1Q",en:"On the trunk: the 802.1Q tag is added"},
 body:{ro:`<p>Cablul dintre SW1 și SW2 duce trafic din <strong>ambele</strong> VLAN-uri. E un port <strong>trunk</strong>. Ca SW2 să știe din ce VLAN e fiecare cadru, SW1 <strong>inserează o etichetă de 4 octeți</strong>, între MAC-ul sursă și EtherType:</p>
<div class="flow"><span>MAC dest 6</span><span>MAC src 6</span><span><b>802.1Q 4</b></span><span>EtherType 2</span><span>${"date"}</span><span>FCS 4</span></div>
<ul><li><strong>TPID</strong> <code>0x8100</code>: „urmează o etichetă VLAN”;</li>
<li><strong>PCP</strong> (3 biți): prioritatea (0–7), pentru QoS, de ex. telefonie;</li>
<li><strong>VID</strong> (12 biți): numărul VLAN-ului, aici <code>10</code>.</li></ul>
<p>Pentru că s-a schimbat conținutul, SW1 recalculează și <strong>FCS</strong>-ul. Un cadru etichetat poate avea până la 1522 de octeți.</p>`,
 en:`<p>The cable between SW1 and SW2 carries traffic from <strong>both</strong> VLANs. It's a <strong>trunk</strong> port. So that SW2 knows which VLAN each frame is from, SW1 <strong>inserts a 4-byte tag</strong> between the source MAC and the EtherType:</p>
<div class="flow"><span>dst MAC 6</span><span>src MAC 6</span><span><b>802.1Q 4</b></span><span>EtherType 2</span><span>data</span><span>FCS 4</span></div>
<ul><li><strong>TPID</strong> <code>0x8100</code>: "a VLAN tag follows";</li>
<li><strong>PCP</strong> (3 bits): the priority (0–7), for QoS, e.g. telephony;</li>
<li><strong>VID</strong> (12 bits): the VLAN number, here <code>10</code>.</li></ul>
<p>Because the content changed, SW1 also recalculates the <strong>FCS</strong>. A tagged frame can be up to 1522 bytes.</p>`},
 more:{ro:`<p>12 biți pentru VID înseamnă 4096 de valori; 0 și 4095 sunt rezervate, deci 1–4094. Pentru mai multe rețele (de ex. la furnizori), se pun <strong>două</strong> etichete (QinQ, 802.1ad) sau se folosește VXLAN (vezi <a href="../gke-retea/index.html">lecția GKE</a>).</p>`,
  en:`<p>12 bits for the VID means 4096 values; 0 and 4095 are reserved, so 1–4094. For more networks (e.g. at providers), <strong>two</strong> tags are stacked (QinQ, 802.1ad) or VXLAN is used (see the <a href="../gke-retea/index.html">GKE lesson</a>).</p>`},
 try:[{cmd:"show interfaces trunk",d:{ro:"Porturile trunk, VLAN-urile permise și VLAN-ul nativ.",en:"Trunk ports, allowed VLANs and the native VLAN."}}]},

{at:"sw2",frame:F4,kind:"f",move:[[["sw2","f2"]]],log:{ro:"SW2 → PC-F2 (access)",en:"SW2 → PC-F2 (access)"},who:"SW2",
 title:{ro:"SW2 citește eticheta și o scoate",en:"SW2 reads the tag and removes it"},
 body:{ro:`<p>SW2 primește cadrul pe trunk, citește <code>VID = 10</code> și caută MAC-ul lui PC-F2 <strong>în tabela VLAN 10</strong>: portul 3.</p>
<p>Portul 3 e un port access, iar calculatoarele nu înțeleg de obicei etichete. Așa că SW2 <strong>scoate eticheta</strong> (și recalculează FCS-ul) și trimite un cadru obișnuit. PC-F2 primește exact ce a trimis PC-F1.</p>
<p class="key">Regula simplă: <strong>eticheta există doar pe trunk-uri</strong>. Calculatoarele nu o văd niciodată.</p>`,
 en:`<p>SW2 receives the frame on the trunk, reads <code>VID = 10</code> and looks up PC-F2's MAC <strong>in the VLAN 10 table</strong>: port 3.</p>
<p>Port 3 is an access port, and computers usually don't understand tags. So SW2 <strong>removes the tag</strong> (and recalculates the FCS) and sends an ordinary frame. PC-F2 receives exactly what PC-F1 sent.</p>
<p class="key">The simple rule: <strong>tags only exist on trunks</strong>. Computers never see them.</p>`}},

{at:"g1",frame:B1,kind:"b",move:[[["g1","sw1"]],[["sw1","sw2"],["sw1","r1"]],[["sw2","g2"]]],rest:["g2","r1"],marks:{f1:{k:"ok",t:{ro:"nu-l vede",en:"never sees it"}},f2:{k:"ok",t:{ro:"nu-l vede",en:"never sees it"}}},log:{ro:"broadcast în VLAN 20",en:"broadcast in VLAN 20"},who:"PC-G1",
 title:{ro:"Broadcast-urile rămân în VLAN-ul lor",en:"Broadcasts stay inside their VLAN"},
 body:{ro:`<p>PC-G1 (oaspete) trimite un <strong>broadcast</strong> ARP: „cine are 10.20.20.22?”. Un broadcast se trimite pe toate porturile, dar <strong>doar ale VLAN-ului lui</strong>:</p>
<ul><li>SW1 îl trimite pe trunk-uri, etichetat cu <code>VLAN 20</code> (spre SW2 și spre R1, care are o interfață în VLAN 20).</li>
<li>SW2 îl trimite doar pe portul 4 (PC-G2).</li>
<li>Calculatoarele Finanțelor (porturile 1 și 3) <strong>nu îl primesc deloc</strong>.</li></ul>
<p>Asta e și securitate (oaspeții nu văd traficul Finanțelor) și performanță (mai puține broadcast-uri pentru fiecare).</p>`,
 en:`<p>PC-G1 (a guest) sends an ARP <strong>broadcast</strong>: "who has 10.20.20.22?". A broadcast goes out every port, but <strong>only those of its VLAN</strong>:</p>
<ul><li>SW1 sends it on the trunks, tagged <code>VLAN 20</code> (to SW2 and to R1, which has an interface in VLAN 20).</li>
<li>SW2 sends it only on port 4 (PC-G2).</li>
<li>Finance's computers (ports 1 and 3) <strong>never receive it</strong>.</li></ul>
<p>That's both security (guests don't see Finance traffic) and performance (fewer broadcasts for everyone).</p>`}},

{at:"f1",frame:R1,kind:"r",move:[[["f1","sw1"]],[["sw1","r1"]]],log:{ro:"PC-F1 → R1 (VLAN 10)",en:"PC-F1 → R1 (VLAN 10)"},tables:["r1sub"],hl:{r1sub:"Gi0/0.10"},who:"PC-F1",
 title:{ro:"Între VLAN-uri: doar prin router",en:"Between VLANs: only through a router"},
 body:{ro:`<p>Contabilul vrea să dea ping imprimantei din rețeaua de oaspeți, PC-G1 (<code>10.20.20.21</code>). E <strong>alt subnet</strong>, deci, ca în lecția Ethernet, PC-F1 trimite cadrul la <strong>gateway</strong>: <code>10.10.10.1</code>.</p>
<p>Gateway-ul e R1, legat la SW1 printr-un singur cablu trunk. R1 are câte o <strong>subinterfață</strong> pe fiecare VLAN: <code>Gi0/0.10</code> (VLAN 10) și <code>Gi0/0.20</code> (VLAN 20). Cadrul ajunge la R1 etichetat cu VLAN 10.</p>`,
 en:`<p>The accountant wants to ping the printer on the guest network, PC-G1 (<code>10.20.20.21</code>). It's <strong>another subnet</strong>, so, as in the Ethernet lesson, PC-F1 sends the frame to the <strong>gateway</strong>: <code>10.10.10.1</code>.</p>
<p>The gateway is R1, connected to SW1 by a single trunk cable. R1 has a <strong>subinterface</strong> per VLAN: <code>Gi0/0.10</code> (VLAN 10) and <code>Gi0/0.20</code> (VLAN 20). The frame reaches R1 tagged VLAN 10.</p>`}},

{at:"r1",frame:R2,kind:"r",move:[[["r1","sw1"]],[["sw1","g1"]]],log:{ro:"R1 → PC-G1 (VLAN 20)",en:"R1 → PC-G1 (VLAN 20)"},tables:["r1sub"],hl:{r1sub:"Gi0/0.20"},who:"R1",
 title:{ro:"Router „on a stick”: intră pe VLAN 10, iese pe VLAN 20",en:"Router \"on a stick\": in on VLAN 10, out on VLAN 20"},
 body:{ro:`<p>R1 face exact ce face un router (vezi lecția Ethernet): scoate antetul Ethernet, citește IP-ul destinație, scade TTL-ul, caută ruta (<code>10.20.20.0/24</code> e direct conectată pe <code>Gi0/0.20</code>) și construiește un <strong>cadru nou</strong>.</p>
<p>Diferența: cadrul nou iese pe <strong>același cablu</strong> pe care a intrat, dar cu eticheta <strong>VLAN 20</strong>, MAC-ul sursă al lui R1 și MAC-ul destinație al lui PC-G1. SW1 îl duce pe portul 2, fără etichetă.</p>
<p>Configurația se numește „<strong>router on a stick</strong>” pentru că routerul atârnă de rețea printr-un singur cablu.</p>`,
 en:`<p>R1 does exactly what a router does (see the Ethernet lesson): it removes the Ethernet header, reads the destination IP, decrements the TTL, looks up the route (<code>10.20.20.0/24</code> is directly connected on <code>Gi0/0.20</code>) and builds a <strong>new frame</strong>.</p>
<p>The difference: the new frame leaves on <strong>the same cable</strong> it came in on, but tagged <strong>VLAN 20</strong>, with R1's source MAC and PC-G1's destination MAC. SW1 delivers it on port 2, untagged.</p>
<p>The setup is called "<strong>router on a stick</strong>" because the router hangs off the network by a single cable.</p>`},
 more:{ro:`<p>Aici se pun și regulile: o listă de acces (ACL) pe R1 poate permite Finanțelor să tipărească la imprimantă, dar poate interzice oaspeților să inițieze conexiuni spre Finanțe.</p><p>Azi, de multe ori, chiar switch-ul face rutarea: un <strong>switch de nivel 3</strong> are interfețe virtuale (SVI) <code>interface Vlan10</code>, <code>interface Vlan20</code>, cu IP-urile de gateway, și rutează între ele în hardware, fără cablul suplimentar.</p>`,
  en:`<p>This is also where rules go: an access list (ACL) on R1 can let Finance print to the printer but forbid guests from opening connections to Finance.</p><p>Today the switch itself often does the routing: a <strong>layer-3 switch</strong> has virtual interfaces (SVIs) <code>interface Vlan10</code>, <code>interface Vlan20</code> with the gateway IPs and routes between them in hardware, with no extra cable.</p>`}},

{at:["sw1","sw2"],frame:null,kind:"none",tables:["trunk"],who:{ro:"Securitate",en:"Security"},
 title:{ro:"VLAN-ul nativ și atacurile de tip „VLAN hopping”",en:"The native VLAN and \"VLAN hopping\" attacks"},
 body:{ro:`<p>Pe un trunk, cadrele <strong>fără etichetă</strong> sunt considerate parte din <strong>VLAN-ul nativ</strong> (implicit VLAN 1). Asta deschide două probleme:</p>
<ul><li><strong>Double tagging</strong>: un atacator dintr-un VLAN egal cu VLAN-ul nativ trimite un cadru cu <em>două</em> etichete. Primul switch o scoate pe prima (cea nativă), al doilea vede a doua și trimite cadrul într-un VLAN în care atacatorul n-ar avea voie.</li>
<li><strong>Switch spoofing</strong>: dacă un port negociază automat trunk-ul (DTP), un calculator se poate da drept switch și primi toate VLAN-urile.</li></ul>
<p>Bune practici: VLAN nativ nefolosit (aici <code>999</code>), trunk-uri configurate manual (<code>switchport nonegotiate</code>), porturile neutilizate oprite sau puse într-un VLAN „mort”, nimic important în VLAN 1.</p>`,
 en:`<p>On a trunk, <strong>untagged</strong> frames are treated as part of the <strong>native VLAN</strong> (VLAN 1 by default). That opens two problems:</p>
<ul><li><strong>Double tagging</strong>: an attacker in a VLAN equal to the native VLAN sends a frame with <em>two</em> tags. The first switch strips the first (native) one, the second sees the other and forwards the frame into a VLAN the attacker shouldn't reach.</li>
<li><strong>Switch spoofing</strong>: if a port negotiates trunking automatically (DTP), a computer can pose as a switch and receive every VLAN.</li></ul>
<p>Good practice: an unused native VLAN (here <code>999</code>), manually configured trunks (<code>switchport nonegotiate</code>), unused ports shut down or put in a "dead" VLAN, nothing important in VLAN 1.</p>`}},

{at:["f1","g1"],frame:null,kind:"none",who:{ro:"Unde mai întâlnești VLAN-uri",en:"Where else you meet VLANs"},
 title:{ro:"VLAN-uri peste tot: Wi-Fi, telefoane, servere",en:"VLANs everywhere: Wi-Fi, phones, servers"},
 body:{ro:`<ul><li><strong>Wi-Fi</strong>: un access point emite mai multe rețele (SSID-uri), de ex. „Birou” și „Oaspeți”; fiecare SSID e legat de un VLAN, iar cablul AP-ului spre switch e un trunk.</li>
<li><strong>Telefoane IP</strong>: un port poate avea un VLAN de date și un <strong>VLAN de voce</strong>; telefonul își etichetează singur traficul, iar PCP-ul dă prioritate vocii.</li>
<li><strong>Servere și virtualizare</strong>: un server cu mașini virtuale primește un trunk, iar fiecare VM e pusă într-un VLAN (de ex. în VMware sau Proxmox).</li>
<li><strong>Linux</strong>: poți crea o interfață pe un VLAN: <code>ip link add link eth0 name eth0.10 type vlan id 10</code>.</li></ul>`,
 en:`<ul><li><strong>Wi-Fi</strong>: an access point broadcasts several networks (SSIDs), e.g. "Office" and "Guests"; each SSID maps to a VLAN, and the AP's cable to the switch is a trunk.</li>
<li><strong>IP phones</strong>: a port can have a data VLAN and a <strong>voice VLAN</strong>; the phone tags its own traffic, and PCP gives voice priority.</li>
<li><strong>Servers and virtualisation</strong>: a server with virtual machines gets a trunk, and each VM is placed in a VLAN (e.g. in VMware or Proxmox).</li>
<li><strong>Linux</strong>: you can create an interface on a VLAN: <code>ip link add link eth0 name eth0.10 type vlan id 10</code>.</li></ul>`}},

{at:["sw1","sw2","r1"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<ul><li>Un <strong>VLAN</strong> e o rețea locală virtuală: un domeniu de broadcast separat pe același hardware.</li>
<li>Port <strong>access</strong>: aparține unui singur VLAN, cadre fără etichetă. Port <strong>trunk</strong>: duce mai multe VLAN-uri, cadre cu etichetă.</li>
<li>Eticheta <strong>802.1Q</strong> are 4 octeți (TPID 0x8100, PCP, VID) și stă între MAC-ul sursă și EtherType.</li>
<li>Switch-urile învață și caută MAC-uri <strong>separat pe fiecare VLAN</strong>; broadcast-urile nu trec dintr-un VLAN în altul.</li>
<li>Între VLAN-uri se trece doar printr-un <strong>router</strong> (sau un switch de nivel 3), unde se pot pune reguli.</li>
<li>Securitate: VLAN nativ nefolosit, trunk-uri fixe, nimic în VLAN 1.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Mergi la test ↓</button></p>`,
 en:`<ul><li>A <strong>VLAN</strong> is a virtual local network: a separate broadcast domain on the same hardware.</li>
<li><strong>Access</strong> port: belongs to one VLAN, untagged frames. <strong>Trunk</strong> port: carries several VLANs, tagged frames.</li>
<li>The <strong>802.1Q</strong> tag is 4 bytes (TPID 0x8100, PCP, VID) and sits between the source MAC and the EtherType.</li>
<li>Switches learn and look up MACs <strong>separately per VLAN</strong>; broadcasts don't cross from one VLAN to another.</li>
<li>Between VLANs you go only through a <strong>router</strong> (or a layer-3 switch), where rules can be applied.</li>
<li>Security: an unused native VLAN, fixed trunks, nothing in VLAN 1.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Go to the quiz ↓</button></p>`}}
],
