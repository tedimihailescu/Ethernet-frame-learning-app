sub:{ro:"Extrasele de cont trebuie trimise în fiecare noapte unei bănci partenere, prin internet, iar plățile ei trebuie primite înapoi. Serverele interne nu au voie să vorbească direct cu internetul. Urmărim fluxul prin Gateway-ul XFB din DMZ: store-and-forward, regula de rutare, criptare PGP, SFTP spre partener, reîncercări, primirea fișierelor prin SecureTransport, urmărirea cap-coadă în Sentinel și definirea fluxului într-un singur loc.",en:"Account statements must be sent every night to a partner bank, over the internet, and its payments must come back. Internal servers aren't allowed to talk to the internet directly. We follow the flow through the XFB Gateway in the DMZ: store-and-forward, the routing rule, PGP encryption, SFTP to the partner, retries, receiving files through SecureTransport, end-to-end tracking in Sentinel and defining the flow in one place."},

steps:[
{at:["gw","st"],frame:null,kind:"none",tables:["zones"],who:{ro:"Ideea",en:"The idea"},
 title:{ro:"De ce un Gateway între rețeaua internă și parteneri",en:"Why a Gateway between the internal network and partners"},
 body:{ro:`<p>Banca trebuie să schimbe fișiere cu zeci de parteneri: alte bănci, procesatori de carduri, autorități. Fiecare vrea alt protocol, alte chei, alte nume de fișiere.</p>
<p>Dacă fiecare server intern ar vorbi direct cu internetul, am avea zeci de găuri în firewall. În schimb, totul trece printr-un <strong>hub</strong> în <strong>DMZ</strong> (zona dintre rețeaua internă și internet):</p>
<ul><li><strong>Gateway</strong> (familia XFB, Axway) primește fișierele de la CFT-urile interne și le duce la parteneri;</li>
<li><strong>SecureTransport</strong> e serverul SFTP pe care partenerii își încarcă fișierele.</li></ul>
<p class="key">Serverele interne vorbesc doar cu Gateway-ul. Doar DMZ-ul vede internetul.</p>`,
 en:`<p>The bank must exchange files with dozens of partners: other banks, card processors, authorities. Each one wants a different protocol, different keys, different file names.</p>
<p>If every internal server talked to the internet directly, we'd have dozens of holes in the firewall. Instead, everything goes through a <strong>hub</strong> in the <strong>DMZ</strong> (the zone between the internal network and the internet):</p>
<ul><li>the <strong>Gateway</strong> (XFB family, Axway) takes files from the internal CFTs and delivers them to partners;</li>
<li><strong>SecureTransport</strong> is the SFTP server partners upload their files to.</li></ul>
<p class="key">Internal servers only talk to the Gateway. Only the DMZ sees the internet.</p>`}},

{at:"cft",frame:G1,kind:"f",move:[[["core","cft"]],[["cft","gw"]]],log:{ro:"CFT CORE → Gateway",en:"CFT CORE → Gateway"},who:"CFT CORE",
 title:{ro:"Primul pas e intern: CFT CORE → Gateway",en:"The first leg is internal: CFT CORE → Gateway"},
 body:{ro:`<p>La 01:00, core-banking scrie extrasele zilei și cere: <code>CFTUTIL SEND PART=GATEWAY, IDF=STMT, FNAME=STMT_20261112.xml</code>, cu destinația finală <strong>BANCA-P</strong>.</p>
<p>Observă: partenerul lui CFT CORE nu e banca, ci <strong>Gateway-ul</strong>. Transferul e exact ca în lecția anterioară: PeSIT peste TLS, checkpoint-uri, catalog. Când Gateway-ul confirmă, partea internă e gata.</p>`,
 en:`<p>At 01:00, core-banking writes the day's statements and requests: <code>CFTUTIL SEND PART=GATEWAY, IDF=STMT, FNAME=STMT_20261112.xml</code>, with the final destination <strong>BANCA-P</strong>.</p>
<p>Note: CFT CORE's partner isn't the bank but the <strong>Gateway</strong>. The transfer is exactly like the previous lesson: PeSIT over TLS, checkpoints, catalog. Once the Gateway confirms, the internal leg is done.</p>`}},

{at:"gw",frame:G2,kind:"f",tables:["route"],hl:{route:0},log:{ro:"stocat și rutat",en:"stored and routed"},who:"Gateway",
 title:{ro:"Store-and-forward: Gateway-ul păstrează și rutează",en:"Store-and-forward: the Gateway keeps and routes"},
 body:{ro:`<p>Gateway-ul nu trimite fișierul mai departe „în timp real”. Întâi îl <strong>scrie pe disc</strong> (store), apoi îl trimite când poate (forward). Asta decuplează cele două capete: CFT CORE a terminat, chiar dacă banca parteneră e oprită.</p>
<p>Apoi caută o <strong>regulă de rutare</strong> după IDF și destinație. Pentru <code>IDF=STMT</code> spre BANCA-P, regula spune: criptează PGP, redenumește după convenția băncii, trimite prin SFTP.</p>`,
 en:`<p>The Gateway doesn't pass the file on "in real time". It first <strong>writes it to disk</strong> (store), then sends it when it can (forward). That decouples the two ends: CFT CORE is done, even if the partner bank is down.</p>
<p>Then it looks up a <strong>routing rule</strong> by IDF and destination. For <code>IDF=STMT</code> to BANCA-P, the rule says: PGP-encrypt, rename to the bank's convention, send via SFTP.</p>`}},

{at:"gw",frame:G3,kind:"f",log:{ro:"PGP și redenumire",en:"PGP and rename"},who:"Gateway",
 title:{ro:"PGP: fișierul e criptat și semnat",en:"PGP: the file is encrypted and signed"},
 body:{ro:`<p>SFTP criptează <em>conexiunea</em>. Dar fișierul va sta apoi pe serverul băncii, poate în alte sisteme. De aceea băncile cer și criptarea <em>fișierului</em>, cu <strong>PGP</strong>:</p>
<ul><li><strong>criptat cu cheia publică a BANCA-P</strong>: doar BANCA-P, cu cheia ei privată, îl poate deschide;</li>
<li><strong>semnat cu cheia noastră privată</strong>: BANCA-P verifică, cu cheia noastră publică, că vine de la noi și că nu a fost modificat.</li></ul>
<p>Numele devine cel cerut de bancă: <code>BP_STMT_20261112_001.xml.pgp</code>.</p>`,
 en:`<p>SFTP encrypts the <em>connection</em>. But the file will then sit on the bank's server, maybe in other systems too. That's why banks also require encrypting the <em>file</em>, with <strong>PGP</strong>:</p>
<ul><li><strong>encrypted with BANCA-P's public key</strong>: only BANCA-P, with its private key, can open it;</li>
<li><strong>signed with our private key</strong>: BANCA-P checks, with our public key, that it came from us and wasn't changed.</li></ul>
<p>The name becomes the one the bank asked for: <code>BP_STMT_20261112_001.xml.pgp</code>.</p>`},
 try:[{cmd:"gpg --encrypt --sign -r banca-p@example STMT_20261112.xml",d:{ro:"Echivalentul manual al pasului PGP.",en:"The manual equivalent of the PGP step."}}]},

{at:"gw",frame:G4,kind:"s",move:[[["gw","partner"]]],log:{ro:"SFTP spre BANCA-P",en:"SFTP to BANCA-P"},who:"SFTP",
 title:{ro:"SFTP spre partener: cheia serverului și cheia noastră",en:"SFTP to the partner: the server's key and ours"},
 body:{ro:`<p>Gateway-ul deschide o conexiune <strong>SFTP</strong> (peste SSH, portul 22) spre <code>sftp.banca-p.example</code>. Două verificări:</p>
<ol><li><strong>Host key</strong>: cheia serverului băncii trebuie să fie cea salvată la configurare. Dacă diferă, conexiunea se oprește (poate fi un atac).</li>
<li><strong>Autentificarea noastră</strong>: cu o <strong>cheie SSH</strong>, nu cu parolă.</li></ol>
<p>Fișierul e încărcat întâi ca <code>.part</code> și redenumit la final, ca BANCA-P să nu ia un fișier pe jumătate.</p>`,
 en:`<p>The Gateway opens an <strong>SFTP</strong> connection (over SSH, port 22) to <code>sftp.banca-p.example</code>. Two checks:</p>
<ol><li><strong>Host key</strong>: the bank server's key must match the one saved during setup. If it differs, the connection stops (it could be an attack).</li>
<li><strong>Our authentication</strong>: with an <strong>SSH key</strong>, not a password.</li></ol>
<p>The file is uploaded as <code>.part</code> first and renamed at the end, so BANCA-P doesn't pick up half a file.</p>`},
 try:[{cmd:"sftp -i ~/.ssh/gw_banca_p xfb@sftp.banca-p.example",d:{ro:"Conectare manuală cu aceeași cheie, pentru depanare.",en:"A manual connection with the same key, for troubleshooting."}}]},

{at:"gw",frame:G5,kind:"s",move:[[["gw","partner"]]],marks:{partner:{k:"drop",t:{ro:"nu răspunde",en:"no answer"}}},log:{ro:"partener indisponibil",en:"partner down"},who:{ro:"Reîncercări",en:"Retries"},
 title:{ro:"Partenerul e oprit: Gateway-ul reîncearcă",en:"The partner is down: the Gateway retries"},
 body:{ro:`<p>Între 01:00 și 02:00, BANCA-P are mentenanță și serverul SFTP nu răspunde. Datorită store-and-forward, nu e o problemă:</p>
<ul><li>fișierul rămâne pe discul Gateway-ului;</li>
<li>Gateway-ul reîncearcă după regula partenerului: de 10 ori, la 15 minute;</li>
<li>dacă se termină toate încercările, transferul trece în eroare și Sentinel trimite o alertă.</li></ul>
<p>Nimeni din rețeaua internă nu trebuie să retrimită nimic.</p>`,
 en:`<p>Between 01:00 and 02:00, BANCA-P has maintenance and its SFTP server doesn't answer. Thanks to store-and-forward, that's fine:</p>
<ul><li>the file stays on the Gateway's disk;</li>
<li>the Gateway retries per the partner's rule: 10 times, every 15 minutes;</li>
<li>if all attempts run out, the transfer goes into error and Sentinel raises an alert.</li></ul>
<p>Nobody on the internal network has to resend anything.</p>`}},

{at:"partner",frame:G6,kind:"s",move:[[["gw","partner"]]],marks:{partner:{k:"ok",t:{ro:"livrat",en:"delivered"}}},log:{ro:"livrat și confirmat",en:"delivered and confirmed"},who:"BANCA-P",
 title:{ro:"Livrat, apoi confirmat de partener",en:"Delivered, then confirmed by the partner"},
 body:{ro:`<p>La 02:14 serverul revine și încărcarea reușește. Dar SFTP nu are „confirmare de aplicație”: știm doar că fișierul a ajuns pe disc.</p>
<p>De aceea, în contract, BANCA-P promite că după procesare pune un fișier <code>.ack</code> (sau <code>.nack</code>, la erori) în <code>/outbox</code>. Gateway-ul îl ridică periodic și îl leagă de transferul original. Acum avem dovada completă.</p>`,
 en:`<p>At 02:14 the server is back and the upload succeeds. But SFTP has no "application acknowledgement": we only know the file reached the disk.</p>
<p>That's why, in the contract, BANCA-P promises to put a <code>.ack</code> file (or <code>.nack</code>, on errors) in <code>/outbox</code> after processing. The Gateway picks it up regularly and ties it to the original transfer. Now we have full proof.</p>`}},

{at:"st",frame:G7,kind:"f",move:[[["partner","st"]],[["st","gw"]],[["gw","cft"]]],log:{ro:"fișier primit de la partener",en:"file received from the partner"},who:"SecureTransport",
 title:{ro:"Sensul invers: partenerul ne trimite plăți",en:"The other direction: the partner sends us payments"},
 body:{ro:`<p>BANCA-P trimite și ea fișiere: plățile primite. Ea se conectează prin SFTP la <strong>SecureTransport</strong>, cu propriul cont și propria cheie SSH, și încarcă <code>BP_PAYIN_20261112.xml.pgp</code>.</p>
<ol><li>SecureTransport predă fișierul Gateway-ului.</li>
<li>Regula <em>plati-banca-p</em>: <strong>verifică semnătura</strong> BANCA-P și <strong>decriptează</strong> cu cheia noastră privată.</li>
<li>Gateway-ul îl trimite prin PeSIT la CFT CORE, cu <code>IDF=PAYIN</code>; acolo, procedura de final pornește importul.</li></ol>
<p class="key">Partenerul vede doar SecureTransport din DMZ, niciodată rețeaua internă.</p>`,
 en:`<p>BANCA-P sends files too: incoming payments. It connects over SFTP to <strong>SecureTransport</strong>, with its own account and SSH key, and uploads <code>BP_PAYIN_20261112.xml.pgp</code>.</p>
<ol><li>SecureTransport hands the file to the Gateway.</li>
<li>The <em>payments-banca-p</em> rule <strong>verifies</strong> BANCA-P's <strong>signature</strong> and <strong>decrypts</strong> with our private key.</li>
<li>The Gateway sends it via PeSIT to CFT CORE, with <code>IDF=PAYIN</code>; there, the end procedure starts the import.</li></ol>
<p class="key">The partner only sees SecureTransport in the DMZ, never the internal network.</p>`}},

{at:"sent",frame:G8,kind:"t",move:[[["cft","sent"],["gw","sent"]]],tables:["track"],log:{ro:"urmărire cap-coadă",en:"end-to-end tracking"},who:"Sentinel",
 title:{ro:"Sentinel: un singur ciclu, de la core-banking la bancă",en:"Sentinel: one cycle, from core-banking to the bank"},
 body:{ro:`<p>Fișierul a avut două transferuri tehnice: CFT CORE → Gateway și Gateway → BANCA-P. Ambele trimit evenimente către <strong>Sentinel</strong>, cu același <strong>ID de ciclu</strong>, așa că suportul vede o singură linie: „STMT spre BANCA-P”.</p>
<p>Când un coleg întreabă „au primit extrasele?”, răspunsul e pe un singur ecran: livrat la 02:14, confirmat la 02:31, cu reîncercările din timpul mentenanței.</p>`,
 en:`<p>The file had two technical transfers: CFT CORE → Gateway and Gateway → BANCA-P. Both send events to <strong>Sentinel</strong> with the same <strong>cycle ID</strong>, so support sees a single line: "STMT to BANCA-P".</p>
<p>When a colleague asks "did they get the statements?", the answer is on one screen: delivered at 02:14, confirmed at 02:31, with the retries during maintenance.</p>`}},

{at:["cft","gw"],frame:null,kind:"none",tables:["flowdef"],who:{ro:"Definirea fluxului",en:"Defining the flow"},
 title:{ro:"Fluxul se definește o singură dată",en:"The flow is defined once"},
 body:{ro:`<p>Fără un instrument central, un flux nou înseamnă configurare manuală pe CFT CORE, pe Gateway, pe SecureTransport și în Sentinel, cu riscul ca un IDF să fie scris diferit într-un loc.</p>
<p>Cu <strong>Central Governance</strong> sau <strong>Flow Manager</strong> (Axway), fluxul e un singur obiect: sursă, intermediar, destinație, protocoale, chei, program și alerte. Instrumentul împinge configurarea pe fiecare componentă.</p>
<p>Un flux nou cu alt partener devine o cerere: „ca STMT → BANCA-P, dar pentru BANCA-Q”.</p>`,
 en:`<p>Without a central tool, a new flow means manual setup on CFT CORE, on the Gateway, on SecureTransport and in Sentinel, with the risk of an IDF spelled differently somewhere.</p>
<p>With <strong>Central Governance</strong> or <strong>Flow Manager</strong> (Axway), the flow is a single object: source, intermediary, target, protocols, keys, schedule and alerts. The tool pushes the configuration to each component.</p>
<p>A new flow with another partner becomes a request: "like STMT → BANCA-P, but for BANCA-Q".</p>`}},

{at:["cft","gw","partner"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<ul><li>Fișierele spre exterior trec prin <strong>DMZ</strong>: <strong>Gateway</strong> pentru trimis, <strong>SecureTransport</strong> pentru primit.</li>
<li>Primul pas e intern: CFT CORE → Gateway, prin <strong>PeSIT</strong>.</li>
<li><strong>Store-and-forward</strong>: Gateway-ul păstrează fișierul și reîncearcă dacă partenerul e oprit.</li>
<li><strong>Regula de rutare</strong> (după IDF și destinație) decide: PGP, redenumire, protocol.</li>
<li><strong>PGP</strong> protejează fișierul; <strong>SFTP</strong> protejează conexiunea (host key + cheie SSH).</li>
<li><strong>.ack</strong> de la partener = dovada procesării; <strong>Sentinel</strong> leagă etapele cu un ID de ciclu.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<ul><li>Files to the outside go through the <strong>DMZ</strong>: the <strong>Gateway</strong> for sending, <strong>SecureTransport</strong> for receiving.</li>
<li>The first leg is internal: CFT CORE → Gateway, via <strong>PeSIT</strong>.</li>
<li><strong>Store-and-forward</strong>: the Gateway keeps the file and retries if the partner is down.</li>
<li>The <strong>routing rule</strong> (by IDF and destination) decides: PGP, renaming, protocol.</li>
<li><strong>PGP</strong> protects the file; <strong>SFTP</strong> protects the connection (host key + SSH key).</li>
<li>The partner's <strong>.ack</strong> = proof of processing; <strong>Sentinel</strong> ties the legs together with a cycle ID.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  return `<div class="ref-grid"><section class="card refcard"><h2>${ro?"Regula de rutare (schematic)":"The routing rule (schematic)"}</h2>
<pre class="yaml"><span class="c"># ${ro?"pe Gateway: STMT spre BANCA-P":"on the Gateway: STMT to BANCA-P"}</span>
rule: statements-banca-p
  match:    IDF=STMT  DEST=BANCA-P
  actions:
    - pgp_encrypt: key=banca-p.pub
    - pgp_sign:    key=our-signing.key
    - rename:      BP_STMT_&amp;FDATE_&amp;SEQ.xml.pgp
  out:
    protocol: SFTP
    host:     sftp.banca-p.example:22
    user:     xfb
    auth:     ssh-key gw_banca_p
    hostkey:  SHA256:3f1c…a9
    dir:      /inbox   (upload .part → rename)
  retry:    10 x 15 min
  ack:      poll /outbox *.ack | *.nack</pre></section>
<section class="card refcard"><h2>${ro?"Echivalentul manual":"The manual equivalent"}</h2>
<pre class="yaml"><span class="c"># ${ro?"criptare + semnare":"encrypt + sign"}</span>
gpg --encrypt --sign -r banca-p@example \
    -o BP_STMT_20261112_001.xml.pgp STMT_20261112.xml

<span class="c"># ${ro?"încărcare SFTP":"SFTP upload"}</span>
sftp -i ~/.ssh/gw_banca_p xfb@sftp.banca-p.example
sftp&gt; put BP_STMT_20261112_001.xml.pgp /inbox/BP_STMT_20261112_001.part
sftp&gt; rename /inbox/BP_STMT_20261112_001.part /inbox/BP_STMT_20261112_001.xml.pgp

<span class="c"># ${ro?"primire: verificare + decriptare":"receive: verify + decrypt"}</span>
gpg --decrypt -o BP_PAYIN_20261112.xml BP_PAYIN_20261112.xml.pgp</pre></section></div>`;
},
