.prog i.g{background:var(--ok)}.prog i.b{background:var(--bad)}.prog i.c{background:var(--accent)}

const N=10;
let deck=[],i=0,score=0,res=[];

function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const r=new Uint32Array(1);crypto.getRandomValues(r);const j=r[0]%(k+1);[a[k],a[j]]=[a[j],a[k]]}return a}
function pickDeck(){
  // 10 of the 14, with at least 3 legit and 4 phishing
  for(;;){const d=shuffle(M).slice(0,N);const p=d.filter(m=>m.ph).length;if(p>=4&&N-p>=3)return d}
}
function renderMsg(m){
  const lk=m.link?`<p><button type="button" class="lnk" id="lnk">${esc(T(m.link.t))}</button><span class="real" id="real" hidden>🔗 ${esc(m.link.u)}</span></p>`:"";
  const att=m.att?`<p><span class="att">📎 ${esc(m.att)}</span></p>`:"";
  const qr=m.qr?`<div class="qr" role="img" aria-label="QR"></div>`:"";
  const ctx=m.ctx?`<p class="note" style="margin:0 0 10px">ℹ ${esc(T(m.ctx))}</p>`:"";
  if(m.kind==="sms")return ctx+`<div class="msg sms"><div class="bar">💬 SMS · ${esc(m.from)}</div><div class="bd">${m.body.map(p=>`<p>${esc(T(p))}</p>`).join("")}${lk}</div></div>`;
  return ctx+`<div class="msg"><div class="bar">✉ ${L("E-mail","E-mail")}</div><div class="hd"><span><span class="k">${L("De la","From")}:</span> <b>${esc(m.from)}</b></span><span><span class="k">${L("Către","To")}:</span> ${esc(m.to)}</span><span class="subj">${esc(T(m.subj))}</span></div><div class="bd">${m.body.map(p=>`<p>${esc(T(p))}</p>`).join("")}${lk}${qr}${att}</div></div>`;
}
function show(){
  const m=deck[i];
  $("#no").textContent=(i+1)+"/"+N;$("#sc").textContent=score;
  $("#prog").innerHTML=deck.map((_,k)=>`<i class="${k<res.length?(res[k]?"g":"b"):k===i?"c":""}"></i>`).join("");
  $("#box").innerHTML=renderMsg(m);$("#fb").innerHTML="";$("#choice").hidden=false;
  const l=$("#lnk");if(l)l.onclick=()=>{$("#real").hidden=false};
}
function answer(saysPh){
  const m=deck[i],ok=saysPh===m.ph;if(ok)score++;res.push(ok);
  const r=$("#real");if(r)r.hidden=false;
  $("#choice").hidden=true;
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}" role="status"><h3>${ok?L("Corect!","Correct!"):L("Nu chiar.","Not quite.")} ${m.ph?L("E phishing.","It's phishing."):L("E un mesaj legitim.","It's a legit message.")}</h3><b>${m.ph?L("Semnele:","The signs:"):L("De ce e în regulă:","Why it's fine:")}</b><ul>${m.why.map(w=>`<li>${esc(T(w))}</li>`).join("")}</ul><div class="row"><button type="button" class="btn" id="next">${i+1<N?L("Următorul mesaj →","Next message →"):L("Vezi rezultatul →","See the result →")}</button></div></div>`;
  $("#sc").textContent=score;
  $("#prog").innerHTML=deck.map((_,k)=>`<i class="${k<res.length?(res[k]?"g":"b"):""}"></i>`).join("");
  const nx=$("#next");nx.onclick=()=>{i++;if(i<N){show();$("#game").scrollIntoView({block:"start",behavior:"smooth"})}else finish()};nx.focus();
}
function finish(){
  $("#game").hidden=true;$("#end").hidden=false;
  $("#final").textContent=score+" / "+N;
  $("#verdict").textContent=score>=9?L("Excelent: ai ochi de analist.","Excellent: you have an analyst's eye."):score>=7?L("Bine! Mai uită-te la mesajele greșite de mai jos.","Good! Have another look at the ones you missed below."):L("Phishing-ul e făcut să păcălească. Citește lecția și mai încearcă.","Phishing is built to fool. Read the lesson and try again.");
  $("#review").innerHTML=deck.map((m,k)=>`<li>${res[k]?"✅":"❌"} ${esc(m.kind==="sms"?"SMS: "+T(m.body[0]).slice(0,60)+"…":T(m.subj))} — <b>${m.ph?"phishing":L("legitim","legit")}</b></li>`).join("");
  window.dispatchEvent(new CustomEvent("quiz:complete",{detail:{lesson:"phishing",title:"Mini-joc: Phishing sau nu?",score,total:N,answers:res.map(x=>x?1:0)}}));
  $("#end").scrollIntoView({block:"start",behavior:"smooth"});
}
function start(){deck=pickDeck();i=0;score=0;res=[];$("#intro").hidden=true;$("#end").hidden=true;$("#game").hidden=false;show()}

let lastChoice=null;
$("#bPh").onclick=()=>{lastChoice=true;answer(true)};$("#bOk").onclick=()=>{lastChoice=false;answer(false)};
$("#start").onclick=start;$("#again").onclick=start;
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("cadru-lang",lang);
  // re-render without changing the score: redraw the current message and, if answered, its feedback
  const answered=!$("#game").hidden&&res.length>i;
  if(answered){const ok=res.pop();if(ok)score--;}
  document.documentElement.lang=lang;document.title=L("Phishing sau nu?","Phishing or not?");
  document.querySelectorAll("[data-t]").forEach(e=>{if(UI[e.dataset.t])e.textContent=T(UI[e.dataset.t])});
  document.querySelectorAll("[data-lang]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.lang===lang?"true":"false"));
  if(!$("#game").hidden&&deck.length){show();if(answered)answer(lastChoice)}
  if(!$("#end").hidden){$("#final").textContent=score+" / "+N;$("#review").innerHTML=deck.map((m,k)=>`<li>${res[k]?"✅":"❌"} ${esc(m.kind==="sms"?"SMS: "+T(m.body[0]).slice(0,60)+"…":T(m.subj))} — <b>${m.ph?"phishing":L("legitim","legit")}</b></li>`).join("")}
});
const saved=store.get("cadru-theme");if(saved==="light"||saved==="dark")document.documentElement.dataset.theme=saved;
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const nt=d?"light":"dark";r.dataset.theme=nt;store.set("cadru-theme",nt)};
document.documentElement.lang=lang;
document.querySelectorAll("[data-t]").forEach(e=>{if(UI[e.dataset.t])e.textContent=T(UI[e.dataset.t])});
document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
document.title=L("Phishing sau nu?","Phishing or not?");
})();
</script>
</body>
</html>
