  g.innerHTML=`<rect x="${-w/2}" y="-10" width="${w}" height="20" rx="5"/><text x="0" y="1">${s}</text>`;return g}
const place=(el,[x,y])=>el.setAttribute("transform",`translate(${x.toFixed(1)},${y.toFixed(1)})`);
function restNodes(st){if(st.rest)return st.rest;if(st.move){return st.move[st.move.length-1].map(s=>s[1])}return [].concat(st.at)}
function setMarks(st){const g=svg.querySelector("#marks");g.innerHTML="";if(!st.marks)return;
  Object.entries(st.marks).forEach(([id,k])=>{const [x,y]=L.n[id];const side=NODES[id].side;
    const t=document.createElementNS(SVGNS,"text");t.setAttribute("class","mark "+k);
    t.setAttribute("x",side?x+30:x);t.setAttribute("y",side?y+42:y-52);if(!side)t.setAttribute("text-anchor","middle");
    t.textContent=T(k==="ok"?UI.accepted:UI.dropped);g.appendChild(t)})}
function updateDiagram(animate,done){
  const st=S[cur];const id=++animId;
  svg.querySelectorAll(".node").forEach(e=>e.classList.remove("active"));
  [].concat(st.at).forEach(a=>{const e=svg.querySelector("#n-"+a);if(e)e.classList.add("active")});
  const hot=new Set();(st.move||[]).forEach(ph=>ph.forEach(([a,b])=>{hot.add(a+"-"+b);hot.add(b+"-"+a)}));
  svg.querySelectorAll(".link").forEach(l=>l.classList.toggle("hot",hot.has(l.dataset.l)));
  const layer=svg.querySelector("#tokens");layer.innerHTML="";svg.querySelector("#marks").innerHTML="";
  const finish=()=>{if(id!==animId)return;layer.innerHTML="";if(st.frame)restNodes(st).forEach(n=>{const t=tokenEl(st.frame);place(t,tokPos(n));layer.appendChild(t)});setMarks(st);done&&done()};
  if(!animate||!st.move||!st.frame||mqReduce.matches){finish();return 0}
  let pi=0;const D=850;
  const phase=()=>{if(id!==animId)return;if(pi>=st.move.length){finish();return}
    const segs=st.move[pi++];layer.innerHTML="";const els=segs.map(()=>{const t=tokenEl(st.frame);layer.appendChild(t);return t});
    const t0=performance.now();
    const tick=now=>{if(id!==animId)return;const p=Math.min(1,(now-t0)/D);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      segs.forEach(([a,b],k)=>{const A=tokPos(a),B=tokPos(b);place(els[k],[A[0]+(B[0]-A[0])*e,A[1]+(B[1]-A[1])*e])});
      if(p<1)requestAnimationFrame(tick);else phase()};
    requestAnimationFrame(tick)};
  phase();return st.move.length*D;
}

/* ---------- panels ---------- */
function prevFrame(i){for(let j=i-1;j>=0;j--){if(S[j].frame&&S[j].kind===S[i].kind)return S[j].frame}return null}
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function renderExp(){
  const st=S[cur];let h="";
  const dev=st.stack?st.stack.dev:null;
  h+=`<p class="eyebrow">${T(UI.step)} ${cur+1} / ${N}${dev?" · "+DEVNAME[dev]:""}</p>`;
  h+=`<h2>${T(st.title)}</h2>${T(st.body)}`;
  if(st.more)h+=`<details class="more"${moreOpen?" open":""}><summary>${T(UI.more)}</summary><div class="more-body">${T(st.more)}</div></details>`;
  if(st.try)h+=`<div class="try"><h4>${T(UI.tryT)}</h4>${st.try.map(c=>`<div class="cmdrow"><div class="cmd"><code>${c.cmd}</code><button type="button" class="copy" data-cmd="${c.cmd}">${T(UI.copy)}</button></div><p>${T(c.d)}</p></div>`).join("")}</div>`;
  if(st.stack){const k=st.stack;
    h+=`<div class="stack"><h3>${T(UI.stackT).replace("{d}",DEVNAME[k.dev])} · ${T(UI[k.dir])}</h3>`;
    LAYERS.forEach(([n,name,pdu])=>{const off=n>k.max,on=k.on.includes(n);
      h+=`<div class="layer L${n}${on?" on":""}${off?" off":""}"><span class="n">L${n}</span><span>${T(name)}</span><span class="pdu">${off?T(UI.notUsed):T(pdu)}</span></div>`});
    h+=`<div class="note">${T(UI.stackNote)}</div></div>`}
  $("#exp").innerHTML=h;
  const dm=$("#exp details.more");if(dm)dm.addEventListener("toggle",()=>{moreOpen=dm.open});
  const b=$("#toQuiz");if(b)b.onclick=()=>{stop();$("#quiz").scrollIntoView({behavior:mqReduce.matches?"auto":"smooth"})};
}
function renderFrame(){
  const st=S[cur],f=st.frame,p=prevFrame(cur);let h=`<h2>${T(UI.frame)}`;
  if(!f){h+=`</h2><p class="empty">${T(st.summary?UI.sumFrame:UI.noFrame)}</p>`;$("#frame").innerHTML=h;return}
  h+=`<span class="pdu-badge">${T(UI.pdu[pduKey(f)])}</span></h2>`;
  h+=`<div class="legend"><span><i class="sw" style="background:var(--newbg);border:1px solid var(--newfg)"></i>${T(UI.lgNew)}</span><span><i class="sw" style="background:var(--chgbg);border:1px solid var(--chgfg)"></i>${T(UI.lgChg)}</span><span><i class="sw" style="background:var(--rembg);border:1px solid var(--remfg)"></i>${T(UI.lgRem)}</span></div>`;
  let bar="",groups="",any=false;
  GROUPS.forEach(g=>{
    const ks=g.fields.filter(k=>k in f||(p&&k in p));if(!ks.length)return;
    const present=ks.some(k=>k in f);let touched=false,rows="";
    ks.forEach(k=>{let cls="",tag="",val;
      if(k in f&&!(p&&k in p)){cls="new";tag=T(UI.lgNew)}
      else if(!(k in f)){cls="rem";tag=T(UI.lgRem)}
      else if(!same(f[k],p[k])){cls="chg";tag=T(UI.lgChg)}
      if(cls)touched=true;if(cls)any=true;
      if(cls==="rem")val=T(p[k]);else if(cls==="chg")val=`<span class="old">${T(p[k])}</span>→ ${T(f[k])}`;else val=T(f[k]);
      rows+=`<div class="f ${cls}"><span class="k">${T(FL[k])}${tag?`<span class="tag">${tag}</span>`:""}</span><span class="v">${val}</span></div>`});
    const grow={eth:3,arp:4,ip:4,tcp:2,app:3,fcs:1}[g.id];
    bar+=`<div class="g-${g.id}${present?"":" gone"}${touched&&present?" touched":""}" style="flex:${grow}">${T(g.short)}</div>`;
    groups+=`<div class="group g-${g.id}"><h4>${T(g.name)}</h4>${rows}</div>`});
  h+=`<div class="bar" aria-hidden="true">${bar}</div>`;
  if(!any)h+=`<p class="note">${T(UI.nochange)}</p>`;
  $("#frame").innerHTML=h+groups+`<p><a class="glink" href="#gloss">${T(UI.glossLink)}</a></p>`;
}
function renderTables(){
  const st=S[cur],el=$("#tables");if(!st.tables){el.hidden=true;el.innerHTML="";return}
  const {s,added}=stateAt(cur);let h=`<h2>${T(UI.tables)}</h2>`;
  st.tables.forEach(id=>{const t=TABLES[id];const rows=t.rows(s);const hl=st.hl&&st.hl[id];
    h+=`<div class="tbl"><h3>${T(t.title)}</h3><div class="scroll"><table><thead><tr>${t.cols.map(c=>`<th>${T(c)}</th>`).join("")}</tr></thead><tbody>`;
    if(!rows.length)h+=`<tr><td colspan="${t.cols.length}" class="empty">${T(UI.empty)}</td></tr>`;
    rows.forEach((r,i)=>{const hit=t.idx?hl===i:hl===r[0];const add=(added[id]||[]).includes(r[0]);
      h+=`<tr class="${hit?"hit":""}${add?" added":""}">${r.map((c,ci)=>`<td class="${(ci>0||!t.idx)?"m":""}">${T(c)}</td>`).join("")}</tr>`});
    h+=`</tbody></table></div>`;
    if(st.miss&&st.miss[id])h+=`<div class="tnote">${T(UI.miss).replace("{m}",st.miss[id])}</div>`;
    h+=`</div>`});
  el.innerHTML=h;el.hidden=false;
}
function renderLog(){
  let rows="";for(let j=0;j<=cur;j++)if(S[j].log){const f=S[j].frame;
    rows+=`<tr><td><b>${S[j].log}</b></td><td class="m mac">${f.dstMac}</td><td class="m mac">${f.srcMac}</td><td class="m ip">${f.srcIp}</td><td class="m ip">${f.dstIp}</td><td class="m">${f.ttl}</td><td class="m">${f.fcs}</td></tr>`}
  let h=`<h2>${T(UI.logT)}</h2><p class="lead">${T(UI.logLead)}</p>`;
  if(!rows)h+=`<p class="empty">${T(UI.logEmpty)}</p>`;
  else h+=`<div class="scroll"><table><thead><tr><th>${T(UI.link)}</th><th>${T(FL.dstMac)}</th><th>${T(FL.srcMac)}</th><th>${T(FL.srcIp)}</th><th>${T(FL.dstIp)}</th><th>TTL</th><th>FCS</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  $("#log").innerHTML=h;
}
function renderQuiz(){
  let h=`<h2>${T(UI.quizT)}</h2>`;
  QUIZ.forEach((q,qi)=>{const a=answers[qi];
    h+=`<div class="q"><p class="t">${qi+1}. ${T(q.q)}</p><div class="opts">`;
    q.o.forEach((o,oi)=>{let c="";if(a!==null){if(oi===q.a)c="right";else if(oi===a)c="wrong"}
      h+=`<button type="button" class="opt ${c}" data-q="${qi}" data-o="${oi}" ${a!==null?"disabled":""}>${T(o)}</button>`});
    h+=`</div>`;
    if(a!==null)h+=`<p class="fb ${a===q.a?"ok":"no"}"><b>${T(a===q.a?UI.right:UI.wrong)}</b> ${T(q.e)}</p>`;
    h+=`</div>`});
  const done=answers.filter(x=>x!==null).length,ok=answers.filter((x,i)=>x===QUIZ[i].a).length;
  h+=`<div class="score">${T(UI.score)}: ${ok} / ${QUIZ.length}${done?` <button type="button" class="btn" id="retry">${T(UI.retry)}</button>`:""}</div>`;
  $("#quiz").innerHTML=h;
  const r=$("#retry");if(r)r.onclick=()=>{answers.fill(null);renderQuiz()};
}
$("#quiz").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;answers[+b.dataset.q]=+b.dataset.o;renderQuiz();
  const q=$("#quiz").querySelectorAll(".q")[+b.dataset.q];const fb=q&&q.querySelector(".fb");if(fb)fb.setAttribute("role","status");
  if(answers.every(a=>a!==null)){
    const score=answers.filter((x,i)=>x===QUIZ[i].a).length;
    window.dispatchEvent(new CustomEvent("quiz:complete",{detail:{lesson:"ethernet",title:"Drumul unui cadru Ethernet",score,total:QUIZ.length,answers:answers.slice()}}));
  }});

function renderControls(){
  const lab=(id,v)=>{const s=T(v),i=s.indexOf(" ");const ic=id==="#b-next"?s.slice(s.lastIndexOf(" ")+1):s.slice(0,i);const tx=id==="#b-next"?s.slice(0,s.lastIndexOf(" ")):s.slice(i+1);
    const b=$(id);b.innerHTML=id==="#b-next"?`<span class="bt">${tx} </span><span aria-hidden="true">${ic}</span>`:`<span aria-hidden="true">${ic}</span><span class="bt"> ${tx}</span>`;b.setAttribute("aria-label",tx);b.title=tx};
  lab("#b-reset",UI.reset);lab("#b-back",UI.back);lab("#b-next",UI.next);lab("#b-play",playing?UI.pause:UI.play);
  $("#b-back").disabled=cur===0;$("#b-next").disabled=cur===N-1;$("#b-reset").disabled=cur===0&&!playing;
  $("#stepno").textContent=`${T(UI.step)} ${cur+1} ${T(UI.of)} ${N}`;
  const d=$("#dots");if(d.children.length!==N){d.innerHTML=S.map((_,i)=>`<button type="button" data-i="${i}"></button>`).join("")}
  [...d.children].forEach((b,i)=>{b.className=i===cur?"cur":i<cur?"done":"";b.setAttribute("aria-label",`${T(UI.step)} ${i+1}: ${T(S[i].title)}`);b.setAttribute("aria-current",i===cur?"step":"false")});
}
function renderStatic(){
  document.documentElement.lang=lang;document.title=lang==="ro"?"Drumul unui cadru":"Ethernet Frame Journey";
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=T(UI[e.dataset.t])});
  $("#goals").innerHTML=UI.goals.map(g=>`<li>${T(g)}</li>`).join("");
  $("#meta").innerHTML=UI.meta.map(g=>`<li>${T(g)}</li>`).join("");
  $("#dlegend").innerHTML=`<span><i class="lg-ring"></i>${T(UI.lgRing)}</span><span><b class="lg-arp">ARP</b>${T(UI.lgArp)}</span><span><b class="lg-eth">ETH</b>${T(UI.lgEth)}</span><span><b class="lg-ip">IP</b>${T(UI.lgIp)}</span><span><b class="lg-tcp">TCP</b>${T(UI.lgTcp)}</span><span><b class="lg-app">${T(TOK.app[0])}</b>${T(UI.lgApp)}</span>`;
  renderAnatomy();
  $("#t-title").textContent=T(UI.title);$("#t-sub").textContent=T(UI.sub);$("#foot").textContent=T(UI.foot);
  $("#theme").setAttribute("aria-label",T(UI.theme));$("#theme").title=T(UI.theme);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
}
function render(animate){
  renderControls();renderExp();renderFrame();renderTables();renderLog();
  const dur=updateDiagram(animate,null);
  if(playing){clearTimeout(timer);timer=setTimeout(()=>{if(!playing)return;if(cur<N-1){cur++;render(true)}else stop()},(dur||0)+5200)}
}
function go(i,animate){cur=Math.max(0,Math.min(N-1,i));render(!!animate)}
function stop(){playing=false;clearTimeout(timer);renderControls()}

/* ---------- events ---------- */
$("#b-next").onclick=()=>{if(playing)stop();go(cur+1,true)};
$("#b-back").onclick=()=>{if(playing)stop();go(cur-1,false)};
$("#b-reset").onclick=()=>{stop();go(0,false)};
$("#b-play").onclick=()=>{if(playing){stop();return}playing=true;if(cur===N-1)cur=0;go(cur+(cur===0?0:1),cur!==0)};
$("#dots").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(playing)stop();go(+b.dataset.i,false)};
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;const t=e.target;if(t&&(t.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(t.tagName)))return;
  if(e.key==="ArrowRight"){e.preventDefault();if(playing)stop();if(cur<N-1)go(cur+1,true)}
  else if(e.key==="ArrowLeft"){e.preventDefault();if(playing)stop();if(cur>0)go(cur-1,false)}});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("cadru-lang",lang);renderStatic();renderGloss();renderQuiz();render(false)});
const savedTheme=store.get("cadru-theme");if(savedTheme==="light"||savedTheme==="dark")document.documentElement.dataset.theme=savedTheme;
$("#theme").onclick=()=>{const isDark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const nt=isDark?"light":"dark";document.documentElement.dataset.theme=nt;store.set("cadru-theme",nt)};
const onLayout=()=>{buildDiagram();updateDiagram(false,null)};
if(mqNarrow.addEventListener)mqNarrow.addEventListener("change",onLayout);else mqNarrow.addListener(onLayout);

buildDiagram();renderStatic();renderGloss();renderQuiz();render(false);
})();
</script>
