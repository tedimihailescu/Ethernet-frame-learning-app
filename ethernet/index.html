/* Layout: lab-notebook console - slim top bar, compact hero, diagram as the hero, two working columns, reference sections below */
:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --head:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#edf1f6; --text:#0f1b2d; --muted:#52627a; --border:#dae1ea;
  --accent:#0b62c4; --accent-text:#ffffff; --focus:#0b62c4; --ink:#0f1b2d; --hero:#e8eef6;
  --l2:#6f42c1; --l2bg:#efe7fb; --l3:#1868c9; --l3bg:#e2eefc; --l4:#12804f; --l4bg:#dff3e8;
  --l7:#b95a0c; --l7bg:#fcecda; --arp:#9a6b00; --arpbg:#fbf0d2;
  --newbg:#d9f3e4; --newfg:#0e6b40; --chgbg:#fff0b3; --chgfg:#7a5a00; --rembg:#fbe1de; --remfg:#a8322a;
  --ok:#12804f; --bad:#c0392b; --zone:#f0f3f9; --link:#9aa4b8; --hot:#2a64d8;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b111c; --surface:#111a28; --surface2:#182336; --text:#e6edf7; --muted:#95a5bf; --border:#24324a;
    --accent:#5aa7ff; --accent-text:#06101e; --focus:#8cc2ff; --ink:#e6edf7; --hero:#0f1828;
    --l2:#b893ff; --l2bg:#2a2140; --l3:#6db0ff; --l3bg:#162a43; --l4:#52d394; --l4bg:#133222;
    --l7:#ffae63; --l7bg:#3a2613; --arp:#f0c44f; --arpbg:#3a3012;
    --newbg:#143a27; --newfg:#7ee2ad; --chgbg:#4a3d0b; --chgfg:#ffdc6b; --rembg:#43201d; --remfg:#ff9a8f;
    --ok:#52d394; --bad:#ff7b6e; --zone:#141822; --link:#5b6478; --hot:#6e9cff;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b111c; --surface:#111a28; --surface2:#182336; --text:#e6edf7; --muted:#95a5bf; --border:#24324a;
  --accent:#5aa7ff; --accent-text:#06101e; --focus:#8cc2ff; --ink:#e6edf7; --hero:#0f1828;
  --l2:#b893ff; --l2bg:#2a2140; --l3:#6db0ff; --l3bg:#162a43; --l4:#52d394; --l4bg:#133222;
  --l7:#ffae63; --l7bg:#3a2613; --arp:#f0c44f; --arpbg:#3a3012;
  --newbg:#143a27; --newfg:#7ee2ad; --chgbg:#4a3d0b; --chgfg:#ffdc6b; --rembg:#43201d; --remfg:#ff9a8f;
  --ok:#52d394; --bad:#ff7b6e; --zone:#141822; --link:#5b6478; --hot:#6e9cff;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans)}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--surface2);padding:.05em .35em;border-radius:4px;overflow-wrap:anywhere}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header.top h1{font-size:clamp(1.25rem,2.6vw,1.7rem);margin:0;line-height:1.2}
header.top p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--text);padding:6px 11px;font:600 .85rem var(--sans);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.95rem}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.card h2{font-size:1.05rem;margin:0 0 10px}
.diagram{padding:8px}
svg#net{width:100%;height:auto;display:block}
.zone{fill:var(--zone);stroke:var(--border);stroke-dasharray:5 4}
.zone-lbl{font:600 12px var(--sans);fill:var(--muted)}
.link{stroke:var(--link);stroke-width:3;stroke-linecap:round}
.link.hot{stroke:var(--hot);stroke-width:4}
.port{font:10px var(--mono);fill:var(--muted)}
.dev{fill:var(--surface);stroke:var(--text);stroke-width:1.8}
.dev-ink{stroke:var(--text);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dev-fill{fill:var(--text)}
.nm{font:700 13px var(--sans);fill:var(--text)}
.lbl{font:11px var(--mono);fill:var(--muted)}
.narrow .nm{font-size:12px}.narrow .lbl{font-size:9.5px}
.ring{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:0}
.node.active .ring{opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}
.token rect{stroke-width:1.5}
.token text{font:700 10px var(--sans);text-anchor:middle;dominant-baseline:central}
.token.k-data rect{fill:var(--l2bg);stroke:var(--l2)} .token.k-data text{fill:var(--l2)}
.token.k-ip rect{fill:var(--l3bg);stroke:var(--l3)} .token.k-ip text{fill:var(--l3)}
.token.k-tcp rect{fill:var(--l4bg);stroke:var(--l4)} .token.k-tcp text{fill:var(--l4)}
.token.k-app rect{fill:var(--l7bg);stroke:var(--l7)} .token.k-app text{fill:var(--l7)}
.token.k-arp rect{fill:var(--arpbg);stroke:var(--arp)} .token.k-arp text{fill:var(--arp)}
.mark{font:700 12px var(--sans)}
.mark.ok{fill:var(--ok)} .mark.drop{fill:var(--bad)}

.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;padding:10px 12px}
.controls .btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:8px 14px;font:600 .92rem var(--sans);cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.stepno{font-size:.85rem;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots button{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;padding:0;cursor:pointer}
.dots button.done{background:var(--muted);opacity:.55}
.dots button.cur{background:var(--accent);border-color:var(--accent);opacity:1}

.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-block;font:600 .78rem var(--sans);padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-bottom:6px}
#exp h2{font-size:1.2rem;margin:0 0 8px}
#exp p,#exp li{margin:.45em 0}
#exp ul,#exp ol{padding-left:1.3em;margin:.4em 0}
.quote{border-left:3px solid var(--arp);padding:4px 10px;background:var(--arpbg);border-radius:0 6px 6px 0;font-style:italic}
.key{border-left:3px solid var(--accent);padding:6px 10px;background:var(--surface2);border-radius:0 6px 6px 0}
.note{color:var(--muted);font-size:.9rem}

.stack{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.stack h3{font-size:.9rem;margin:0 0 8px;color:var(--muted);font-weight:600}
.layer{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);margin-bottom:4px;font-size:.9rem;background:var(--surface)}
.layer .n{font:700 .8rem var(--mono);width:26px;text-align:center;border-radius:5px;padding:1px 0;background:var(--surface2)}
.layer .pdu{margin-left:auto;color:var(--muted);font-size:.82rem}
.layer.off{opacity:.35;border-style:dashed}
.layer.on{border-width:2px}
.layer.on.L7{border-color:var(--l7);background:var(--l7bg)} .layer.on.L4{border-color:var(--l4);background:var(--l4bg)}
.layer.on.L3{border-color:var(--l3);background:var(--l3bg)} .layer.on.L2{border-color:var(--l2);background:var(--l2bg)}
.layer.on.L1{border-color:var(--muted);background:var(--surface2)}

.pdu-badge{display:inline-block;font:600 .8rem var(--sans);padding:2px 9px;border-radius:6px;background:var(--surface2);margin-left:6px;vertical-align:middle}
.bar{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin:10px 0 6px;min-height:34px;font:600 .72rem var(--sans)}
.bar div{display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 3px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.bar .g-eth,.bar .g-fcs{background:var(--l2bg);color:var(--l2)} .bar .g-arp{background:var(--arpbg);color:var(--arp)}
.bar .g-ip{background:var(--l3bg);color:var(--l3)} .bar .g-tcp{background:var(--l4bg);color:var(--l4)} .bar .g-app{background:var(--l7bg);color:var(--l7)}
.bar div+div{border-left:1px solid var(--border)}
.bar .gone{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--surface2) 5px 10px);color:var(--muted);text-decoration:line-through}
.bar .touched{box-shadow:inset 0 0 0 2px var(--chgfg)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.group{margin-top:10px}
.group h4{margin:0 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.group.g-eth h4,.group.g-fcs h4{color:var(--l2)} .group.g-arp h4{color:var(--arp)} .group.g-ip h4{color:var(--l3)} .group.g-tcp h4{color:var(--l4)} .group.g-app h4{color:var(--l7)}
.f{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:8px;align-items:baseline;padding:4px 8px;border-radius:6px;font-size:.88rem}
.f+.f{margin-top:2px}
.f .k{color:var(--muted)}
.f .v{font-family:var(--mono);overflow-wrap:anywhere}
.f .old{text-decoration:line-through;opacity:.7;margin-right:4px}
.f .tag{font:700 .68rem var(--sans);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.f.new{background:var(--newbg)} .f.new .tag{background:var(--newfg);color:var(--surface)}
.f.chg{background:var(--chgbg)} .f.chg .tag{background:var(--chgfg);color:var(--surface)}
.f.rem{background:var(--rembg)} .f.rem .v{text-decoration:line-through;opacity:.75} .f.rem .tag{background:var(--remfg);color:var(--surface)}
.empty{color:var(--muted);font-style:italic}

table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:.76rem;color:var(--muted);font-weight:600}
td.m{font-family:var(--mono);font-size:.84rem;overflow-wrap:anywhere}
tr.hit td{background:var(--l3bg);font-weight:600}
tr.added td{background:var(--newbg)}
.tbl{margin-bottom:14px}.tbl:last-child{margin-bottom:0}
.tbl h3{font-size:.88rem;margin:0 0 4px}
.tnote{font-size:.82rem;color:var(--bad);margin-top:4px;font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#log table{min-width:560px}
#log td.mac{background:var(--chgbg)}
#log td.ip{background:var(--l3bg)}
.lead{color:var(--muted);font-size:.9rem;margin:0 0 8px}

.full{margin-top:12px}
.q{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.q p.t{margin:0 0 8px;font-weight:600}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:9px 12px;font:inherit;font-size:.93rem;cursor:pointer}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--newbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--rembg)}
.fb{margin:8px 0 0;font-size:.9rem}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}
.score{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:600}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px 16px;margin:0}
.gl div{padding:8px 10px;border:1px solid var(--border);border-radius:8px;min-width:0}
.gl dt{font-weight:700}
.gl dt small{font-weight:400;color:var(--muted);margin-left:6px}
.gl dd{margin:2px 0 0;font-size:.9rem}
.glink{color:var(--accent);font-size:.82rem}
.gl dd.ex{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:.85rem;color:var(--muted)}
.gl dd.ex b{color:var(--text);font-weight:600}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:500 .85rem var(--mono);margin:8px 0}
.flow span{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface2)}
.flow i{font-style:normal;color:var(--muted)}
#exp table{margin:6px 0 10px}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:18px 0 8px}

@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .wrap{padding-block:12px}
  .controls{position:sticky;bottom:8px;z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.18)}
  .btn{padding:8px 12px}
  .controls{padding:8px 10px;gap:6px}
  .controls .btns{width:100%;display:grid;grid-template-columns:auto auto auto 1fr;gap:6px}
  #b-reset .bt,#b-back .bt,#b-play .bt{display:none}
  #b-reset,#b-back,#b-play{min-width:44px;font-size:1rem}
  .progress{min-width:0;flex-direction:row;align-items:center;gap:8px;width:100%}
  .stepno{white-space:nowrap;font-size:.78rem}
  .dots{gap:3px;flex-wrap:wrap;flex:1;min-width:0}
  .dots button{width:10px;height:10px}
  .f{grid-template-columns:minmax(0,1fr)}
  .f{gap:0}
  .card{padding:14px}
}
@media (prefers-reduced-motion: reduce){.node.active .ring{animation:none}}

/* ---------- professional layer ---------- */
html{scroll-behavior:smooth;scroll-padding-top:16px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.card h2,#exp h2{font-family:var(--head);letter-spacing:-.01em;text-wrap:balance}
a{color:var(--accent)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 1rem var(--head);white-space:nowrap}

.nav a:focus-visible,.brand:focus-visible,.glink:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hero{background:var(--hero);border-bottom:1px solid var(--border)}
.hero-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 .74rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}

.meta{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}

.goals{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}

.wrap{padding-block:20px}
.card{border-radius:10px;box-shadow:none}

.dlegend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 8px 4px;border-top:1px solid var(--border);margin-top:4px;font-size:.78rem;color:var(--muted)}
.dlegend span{display:inline-flex;align-items:center;gap:6px}

.lg-eth{color:var(--l2);background:var(--l2bg)}.lg-arp{color:var(--arp);background:var(--arpbg)}.lg-ip{color:var(--l3);background:var(--l3bg)}.lg-tcp{color:var(--l4);background:var(--l4bg)}.lg-app{color:var(--l7);background:var(--l7bg)}

#exp .eyebrow{margin-bottom:4px}

.cmdrow{padding:8px 12px;display:grid;gap:4px}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("cadru-lang")==="en"?"en":"ro";
const T=v=>(v&&typeof v==="object")?v[lang]:v;

const CRC_TABLE=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(str){let c=0xFFFFFFFF;for(let i=0;i<str.length;i++)c=CRC_TABLE[(c^str.charCodeAt(i))&0xFF]^(c>>>8);return ((c^0xFFFFFFFF)>>>0).toString(16).toUpperCase().padStart(8,"0")}
function ipChecksum(ttl,len){
  // real IPv4 header checksum for: 45 00 | len 0x0036 | id 0x1c46 | DF | ttl,proto=6 | 192.168.1.10 -> 192.168.2.20
  const w=[0x4500,len||0x0036,0x1c46,0x4000,(ttl<<8)|6,0,0xc0a8,0x010a,0xc0a8,0x0214];
  let s=w.reduce((a,b)=>a+b,0);while(s>>16)s=(s&0xffff)+(s>>16);
  return "0x"+((~s)&0xffff).toString(16).toUpperCase().padStart(4,"0");
}

/* ---------- addresses ---------- */
const MAC={A:"02:AA:00:00:00:0A",R1a:"02:11:00:00:00:01",R1b:"02:11:00:00:00:02",R2a:"02:22:00:00:00:01",R2b:"02:22:00:00:00:02",B:"02:BB:00:00:00:0B",C:"02:CC:00:00:00:0C",BC:"FF:FF:FF:FF:FF:FF",Z:"00:00:00:00:00:00"};
const IP={A:"192.168.1.10",R1a:"192.168.1.1",R1b:"10.0.0.1",R2b:"10.0.0.2",R2a:"192.168.2.1",B:"192.168.2.20",C:"192.168.2.30"};

/* ---------- frames ---------- */
const ET_IP="0x0800 (IPv4)",ET_ARP="0x0806 (ARP)";
const APP={payload:"GET / HTTP/1.1"};
const TCP={srcPort:"49152",dstPort:"80 (HTTP)",seq:"1001",ack:"5001",flags:"PSH, ACK",window:"64240"};
const ipHdr=ttl=>({srcIp:IP.A,dstIp:IP.B,ttl:String(ttl),proto:"6 (TCP)",ipChk:ipChecksum(ttl)});
function eth(dst,src,type,inner){const f=Object.assign({dstMac:dst,srcMac:src,etherType:type},inner);delete f.fcs;f.fcs="0x"+crc32(JSON.stringify(f));return f}
const F={
  app:{...APP}, seg:{...TCP,...APP}, pkt:{...ipHdr(64),...TCP,...APP},
  arpReq:eth(MAC.BC,MAC.A,ET_ARP,{arpOp:{ro:"1 (cerere)",en:"1 (request)"},sMac:MAC.A,sIp:IP.A,tMac:{ro:MAC.Z+" (necunoscut)",en:MAC.Z+" (unknown)"},tIp:IP.R1a}),
  arpRep:eth(MAC.A,MAC.R1a,ET_ARP,{arpOp:{ro:"2 (răspuns)",en:"2 (reply)"},sMac:MAC.R1a,sIp:IP.R1a,tMac:MAC.A,tIp:IP.A}),
};
F.fA=eth(MAC.R1a,MAC.A,ET_IP,F.pkt);
F.pR1={...ipHdr(63),...TCP,...APP};
F.fR1=eth(MAC.R2b,MAC.R1b,ET_IP,F.pR1);
F.fR2=eth(MAC.B,MAC.R2a,ET_IP,{...ipHdr(62),...TCP,...APP});
F.pB={...ipHdr(62),...TCP,...APP};

const GROUPS=[
  {id:"eth",fields:["dstMac","srcMac","etherType"],name:{ro:"Antet Ethernet (L2)",en:"Ethernet header (L2)"},short:{ro:"Antet Ethernet",en:"Ethernet hdr"}},
  {id:"arp",fields:["arpOp","sMac","sIp","tMac","tIp"],name:{ro:"Mesaj ARP",en:"ARP message"},short:{ro:"ARP",en:"ARP"}},
  {id:"ip",fields:["srcIp","dstIp","ttl","proto","ipChk"],name:{ro:"Antet IP (L3)",en:"IP header (L3)"},short:{ro:"Antet IP",en:"IP hdr"}},
  {id:"tcp",fields:["srcPort","dstPort","seq","ack","flags","window"],name:{ro:"Antet TCP (L4)",en:"TCP header (L4)"},short:{ro:"TCP",en:"TCP"}},
  {id:"app",fields:["payload"],name:{ro:"Date aplicație (L7)",en:"Application data (L7)"},short:{ro:"Date",en:"Data"}},
  {id:"fcs",fields:["fcs"],name:{ro:"Trailer Ethernet (L2)",en:"Ethernet trailer (L2)"},short:{ro:"FCS",en:"FCS"}}
];
const FL={
  dstMac:{ro:"MAC destinație",en:"Destination MAC"},srcMac:{ro:"MAC sursă",en:"Source MAC"},etherType:"EtherType",
  arpOp:{ro:"Operație ARP",en:"ARP operation"},sMac:{ro:"MAC expeditor",en:"Sender MAC"},sIp:{ro:"IP expeditor",en:"Sender IP"},tMac:{ro:"MAC țintă",en:"Target MAC"},tIp:{ro:"IP țintă",en:"Target IP"},
  srcIp:{ro:"IP sursă",en:"Source IP"},dstIp:{ro:"IP destinație",en:"Destination IP"},ttl:"TTL",proto:"Protocol",ipChk:{ro:"Checksum IP",en:"IP checksum"},
  srcPort:{ro:"Port sursă",en:"Source port"},dstPort:{ro:"Port destinație",en:"Destination port"},
  seq:{ro:"Nr. de secvență",en:"Sequence no."},ack:{ro:"Nr. de confirmare",en:"Ack no."},flags:{ro:"Indicatori (flags)",en:"Flags"},window:{ro:"Fereastră",en:"Window"},
  payload:{ro:"Date (payload)",en:"Payload (data)"},fcs:"FCS (CRC-32)"
};

/* ---------- topology ---------- */
const NODES={
  A:{type:"host",name:"Host A",lines:[IP.A,MAC.A]},
  SW1:{type:"switch",name:"SW1",lines:[]},
  R1:{type:"router",name:"R1",lines:["Gi0 "+IP.R1a,"Gi1 "+IP.R1b]},
  R2:{type:"router",name:"R2",lines:["Gi1 "+IP.R2b,"Gi0 "+IP.R2a]},
  SW2:{type:"switch",name:"SW2",lines:[],lblLeft:true},
  B:{type:"host",name:"Host B",lines:[IP.B,MAC.B]},
  C:{type:"host",name:"Host C",lines:[IP.C,MAC.C],side:true}
};
const LINKS=[["A","SW1"],["SW1","R1"],["R1","R2"],["R2","SW2"],["SW2","B"],["SW2","C"]];
const PORTS=[["SW1","A","p1"],["SW1","R1","p2"],["SW2","R2","p1"],["SW2","B","p2"],["SW2","C","p3"]];
const LAYOUTS={
  wide:{vb:[0,0,1000,330],n:{A:[70,130],SW1:[230,130],R1:[400,130],R2:[600,130],SW2:[770,130],B:[930,130],C:[770,262]},
    zones:[{x:10,y:24,w:390,h:206,l:"LAN 1 · 192.168.1.0/24"},{x:600,y:24,w:390,h:300,l:"LAN 2 · 192.168.2.0/24"}],
    wan:{x:500,y:100,a:"middle"},cls:""},
  narrow:{vb:[0,0,360,450],n:{A:[62,72],SW1:[178,72],R1:[296,72],R2:[296,282],SW2:[178,282],B:[62,282],C:[178,392]},
    zones:[{x:4,y:16,w:292,h:148,l:"LAN 1 · 192.168.1.0/24"},{x:4,y:226,w:292,h:220,l:"LAN 2 · 192.168.2.0/24"}],
    wan:{x:286,y:197,a:"end"},cls:"narrow"}
};

/* ---------- steps ---------- */
const DC={ro:"direct conectată",en:"directly connected"};
const S=[
{at:["A","B"],frame:null,kind:"data",
 title:{ro:"Scenariul",en:"The scenario"},
 body:{ro:`<p><strong>Host A</strong> (un laptop, IP <code>192.168.1.10</code>) vrea să deschidă o pagină web de pe <strong>Host B</strong> (un server, IP <code>192.168.2.20</code>).</p>
<p>Cele două calculatoare sunt în <strong>rețele diferite</strong>, legate prin două routere (R1 și R2). Fiecare rețea locală are câte un switch.</p>
<p>Vom urmări un singur mesaj, pas cu pas. Apasă <strong>Următorul</strong> (sau tasta →). În panoul <em>Cadrul</em>, câmpurile colorate sunt cele care s-au schimbat la pasul curent.</p>`,
 en:`<p><strong>Host A</strong> (a laptop, IP <code>192.168.1.10</code>) wants to open a web page on <strong>Host B</strong> (a server, IP <code>192.168.2.20</code>).</p>
<p>The two computers are on <strong>different networks</strong>, connected by two routers (R1 and R2). Each local network has a switch.</p>
<p>We'll follow a single message, step by step. Press <strong>Next</strong> (or the → key). In the <em>Frame</em> panel, coloured fields are the ones that changed in the current step.</p>`},
 tables:["cfgA"]},

{at:"A",frame:F.app,kind:"data",stack:{dev:"A",max:7,on:[7],dir:"down"},
 title:{ro:"Pe A: stratul Aplicație",en:"On A: the Application layer"},
 body:{ro:`<p>Browserul de pe A creează cererea HTTP <code>GET / HTTP/1.1</code> – adică „dă-mi pagina principală”.</p>
<p>Deocamdată sunt doar <strong>date</strong>: nicăieri nu scrie unde trebuie să ajungă. Urmează <strong>încapsularea</strong>: fiecare strat de dedesubt adaugă propriul antet, ca niște plicuri puse unul peste altul.</p>`,
 en:`<p>The browser on A creates the HTTP request <code>GET / HTTP/1.1</code> – meaning "give me the home page".</p>
<p>For now it's just <strong>data</strong>: nothing says where it should go. Next comes <strong>encapsulation</strong>: each layer below adds its own header, like envelopes placed one inside another.</p>`}},

{at:"A",frame:F.seg,kind:"data",stack:{dev:"A",max:7,on:[4],dir:"down"},
 title:{ro:"Pe A: stratul Transport (TCP)",en:"On A: the Transport layer (TCP)"},
 body:{ro:`<p><strong>Cine îl adaugă?</strong> Nu browserul. Browserul doar îi cere sistemului de operare: „deschide o conexiune la <code>192.168.2.20</code>, portul <code>80</code>, și trimite textul ăsta”. Partea din <strong>Windows</strong> (driverul <code>tcpip.sys</code>, „stiva TCP/IP”) face restul.</p>
<p><strong>Unde îl adaugă?</strong> <strong>În fața datelor</strong>, în memorie. TCP lasă 20 de octeți liberi înaintea textului <code>GET / HTTP/1.1</code> și scrie acolo antetul. Antet + date = un <strong>segment</strong>:</p>
<div class="flow"><span><b>Antet TCP</b> 20 B</span><span>GET / HTTP/1.1 · 14 B</span></div>
<p>Apoi fiecare strat de dedesubt pune <em>tot ce a primit</em> în interiorul propriului „plic”, tot în față:</p>
<div class="flow"><span>Ethernet 14 B</span><span>IP 20 B</span><span><b>TCP 20 B</b></span><span>date 14 B</span><span>FCS 4 B</span></div>
<p><strong>Ce conține antetul TCP</strong>, octet cu octet:</p>
<div class="scroll"><table style="min-width:420px"><thead><tr><th>Octeți</th><th>Câmp</th><th>La noi</th></tr></thead><tbody>
<tr><td class="m">0–1</td><td><strong>Port sursă</strong></td><td class="m">49152 → C0 00</td></tr>
<tr><td class="m">2–3</td><td><strong>Port destinație</strong></td><td class="m">80 → 00 50</td></tr>
<tr><td class="m">4–7</td><td>Număr de secvență (al câtelea octet trimit)</td><td class="m">1001</td></tr>
<tr><td class="m">8–11</td><td>Număr de confirmare (ce octet aștept de la B)</td><td class="m">5001</td></tr>
<tr><td class="m">12</td><td>Lungimea antetului</td><td class="m">5 × 4 = 20 B</td></tr>
<tr><td class="m">13</td><td>Indicatori: SYN, ACK, PSH, FIN, RST…</td><td class="m">PSH, ACK</td></tr>
<tr><td class="m">14–15</td><td>Fereastră (câți octeți pot primi acum)</td><td class="m">64240</td></tr>
<tr><td class="m">16–17</td><td>Checksum (antet + date + cele două IP-uri)</td><td class="m">—</td></tr>
<tr><td class="m">18–19</td><td>Urgent pointer (aproape nefolosit)</td><td class="m">0</td></tr>
</tbody></table></div>
<p><strong>De ce două porturi?</strong> <code>80</code> spune pe B: „dă-i asta serverului web”. <code>49152</code> e ales de Windows pentru această conexiune, dintr-un interval de porturi temporare; răspunsul lui B va veni pe el, ca Windows să știe că e pentru <em>această</em> filă de browser, nu pentru altă aplicație.</p>
<p class="note">Valorile 1001 și 5001 și indicatorii PSH, ACK vin din „strângerea de mână” TCP. O explicăm în pasul următor și o vei vedea apoi circulând prin rețea.</p>`,
 en:`<p><strong>Who adds it?</strong> Not the browser. The browser just asks the operating system: "open a connection to <code>192.168.2.20</code>, port <code>80</code>, and send this text". The part of <strong>Windows</strong> that does the rest is the <code>tcpip.sys</code> driver, the "TCP/IP stack".</p>
<p><strong>Where does it add it?</strong> <strong>In front of the data</strong>, in memory. TCP leaves 20 bytes free before the text <code>GET / HTTP/1.1</code> and writes the header there. Header + data = a <strong>segment</strong>:</p>
<div class="flow"><span><b>TCP header</b> 20 B</span><span>GET / HTTP/1.1 · 14 B</span></div>
<p>Then each layer below puts <em>everything it received</em> inside its own "envelope", again at the front:</p>
<div class="flow"><span>Ethernet 14 B</span><span>IP 20 B</span><span><b>TCP 20 B</b></span><span>data 14 B</span><span>FCS 4 B</span></div>
<p><strong>What the TCP header holds</strong>, byte by byte:</p>
<div class="scroll"><table style="min-width:420px"><thead><tr><th>Bytes</th><th>Field</th><th>Ours</th></tr></thead><tbody>
<tr><td class="m">0–1</td><td><strong>Source port</strong></td><td class="m">49152 → C0 00</td></tr>
<tr><td class="m">2–3</td><td><strong>Destination port</strong></td><td class="m">80 → 00 50</td></tr>
<tr><td class="m">4–7</td><td>Sequence number (which byte I'm sending)</td><td class="m">1001</td></tr>
<tr><td class="m">8–11</td><td>Acknowledgement number (which byte I expect from B)</td><td class="m">5001</td></tr>
<tr><td class="m">12</td><td>Header length</td><td class="m">5 × 4 = 20 B</td></tr>
<tr><td class="m">13</td><td>Flags: SYN, ACK, PSH, FIN, RST…</td><td class="m">PSH, ACK</td></tr>
<tr><td class="m">14–15</td><td>Window (how many bytes I can receive now)</td><td class="m">64240</td></tr>
<tr><td class="m">16–17</td><td>Checksum (header + data + both IPs)</td><td class="m">—</td></tr>
<tr><td class="m">18–19</td><td>Urgent pointer (almost never used)</td><td class="m">0</td></tr>
</tbody></table></div>
<p><strong>Why two ports?</strong> <code>80</code> tells B: "give this to the web server". <code>49152</code> is picked by Windows for this connection, from a range of temporary ports; B's reply will come back to it, so Windows knows it's for <em>this</em> browser tab and not another app.</p>
<p class="note">The values 1001 and 5001 and the PSH, ACK flags come from the TCP "handshake". We explain it in the next step, and you'll then watch it travel across the network.</p>`}},

{at:"A",frame:F.pkt,kind:"data",stack:{dev:"A",max:7,on:[3],dir:"down"},
 title:{ro:"Pe A: stratul Rețea (IP)",en:"On A: the Network layer (IP)"},
 body:{ro:`<p>IP adaugă <strong>IP-ul sursă</strong> (<code>192.168.1.10</code>) și <strong>IP-ul destinație</strong> (<code>192.168.2.20</code>). Sunt adresele <strong>de la un capăt la altul</strong>: rămân la fel pe tot drumul.</p>
<p><strong>TTL = 64</strong> („time to live”): fiecare router scade 1. Dacă ajunge la 0, pachetul e aruncat – așa nu se învârte la nesfârșit dacă există o buclă.</p>
<p>Segment + antet IP = <strong>pachet</strong>.</p>`,
 en:`<p>IP adds the <strong>source IP</strong> (<code>192.168.1.10</code>) and the <strong>destination IP</strong> (<code>192.168.2.20</code>). These are the <strong>end-to-end</strong> addresses: they stay the same for the whole trip.</p>
<p><strong>TTL = 64</strong> ("time to live"): every router subtracts 1. If it reaches 0 the packet is discarded – so it can't loop forever if there's a loop.</p>
<p>Segment + IP header = <strong>packet</strong>.</p>`}},

{at:"A",frame:F.pkt,kind:"data",stack:{dev:"A",max:7,on:[3],dir:"down"},
 title:{ro:"Pe A: local sau la distanță?",en:"On A: local or remote?"},
 body:{ro:`<p>A trebuie să decidă cui predă pachetul. Își compară rețeaua cu a lui B folosind masca <code>/24</code> (255.255.255.0):</p>
<ul><li>rețeaua lui A: <code>192.168.1</code>.0</li><li>rețeaua lui B: <code>192.168.2</code>.0</li></ul>
<p>Sunt diferite ⇒ B nu e în rețeaua locală. A trimite pachetul la <strong>gateway-ul implicit</strong>: routerul R1 (<code>192.168.1.1</code>).</p>
<p>Problemă: pe cablu, cadrele se adresează după adresa <strong>MAC</strong>, nu după IP. A știe IP-ul lui R1, dar nu și MAC-ul lui.</p>`,
 en:`<p>A has to decide who to hand the packet to. It compares its network with B's using the <code>/24</code> mask (255.255.255.0):</p>
<ul><li>A's network: <code>192.168.1</code>.0</li><li>B's network: <code>192.168.2</code>.0</li></ul>
<p>They differ ⇒ B is not on the local network. A sends the packet to its <strong>default gateway</strong>: router R1 (<code>192.168.1.1</code>).</p>
<p>Problem: on the wire, frames are addressed by <strong>MAC</strong> address, not by IP. A knows R1's IP but not its MAC.</p>`},
 tables:["cfgA","arpA"],hl:{cfgA:2}},

{at:"A",frame:F.arpReq,kind:"arp",stack:{dev:"A",max:7,on:[2],dir:"down"},
 move:[[["A","SW1"]],[["SW1","R1"]]],
 fx:[["sw1",MAC.A,"p1"],["arpR1",IP.A,MAC.A]],
 title:{ro:"ARP: „Cine are 192.168.1.1?”",en:"ARP: \"Who has 192.168.1.1?\""},
 body:{ro:`<p>A caută în <strong>cache-ul ARP</strong> și nu găsește nimic pentru <code>192.168.1.1</code>. Pachetul IP așteaptă, iar A trimite o <strong>cerere ARP</strong>:</p>
<p class="quote">„Cine are 192.168.1.1? Spune-i lui 192.168.1.10.”</p>
<p>MAC destinație <code>FF:FF:FF:FF:FF:FF</code> = <strong>broadcast</strong>, adică „pentru toți din rețeaua locală”. ARP nu folosește IP: stă direct în cadrul Ethernet (EtherType <code>0x0806</code>).</p>
<p><strong>SW1 învață</strong>: MAC-ul sursă <code>02:AA:00:00:00:0A</code> a intrat pe portul p1, deci îl notează în tabela MAC. Fiind broadcast, trimite cadrul pe toate celelalte porturi. R1 își recunoaște IP-ul (și, în treacăt, notează MAC-ul lui A).</p>`,
 en:`<p>A looks in its <strong>ARP cache</strong> and finds nothing for <code>192.168.1.1</code>. The IP packet waits while A sends an <strong>ARP request</strong>:</p>
<p class="quote">"Who has 192.168.1.1? Tell 192.168.1.10."</p>
<p>Destination MAC <code>FF:FF:FF:FF:FF:FF</code> = <strong>broadcast</strong>, i.e. "for everyone on the local network". ARP doesn't use IP: it sits directly inside the Ethernet frame (EtherType <code>0x0806</code>).</p>
<p><strong>SW1 learns</strong>: source MAC <code>02:AA:00:00:00:0A</code> came in on port p1, so it writes that into its MAC table. Since it's a broadcast, it sends the frame out of all other ports. R1 recognises its own IP (and also notes A's MAC along the way).</p>`},
 tables:["arpA","sw1"]},

{at:"R1",frame:F.arpRep,kind:"arp",stack:{dev:"A",max:7,on:[2],dir:"up"},
 move:[[["R1","SW1"]],[["SW1","A"]]],
 fx:[["sw1",MAC.R1a,"p2"],["arpA",IP.R1a,MAC.R1a]],
 title:{ro:"ARP: răspunsul lui R1",en:"ARP: R1's reply"},
 body:{ro:`<p>R1 îi răspunde direct lui A (<strong>unicast</strong>, nu broadcast):</p>
<p class="quote">„192.168.1.1 este la 02:11:00:00:00:01.”</p>
<p>SW1 învață din nou: MAC-ul lui R1 e pe portul p2. Știe deja că A e pe p1, așa că trimite răspunsul <strong>doar</strong> acolo.</p>
<p>A salvează perechea IP → MAC în cache-ul ARP (pentru câteva minute), ca să nu mai întrebe la fiecare pachet.</p>`,
 en:`<p>R1 replies directly to A (<strong>unicast</strong>, not broadcast):</p>
<p class="quote">"192.168.1.1 is at 02:11:00:00:00:01."</p>
<p>SW1 learns again: R1's MAC is on port p2. It already knows A is on p1, so it sends the reply <strong>only</strong> there.</p>
<p>A saves the IP → MAC pair in its ARP cache (for a few minutes) so it doesn't have to ask for every packet.</p>`},
 tables:["sw1","arpA"]},

{at:"A",frame:F.fA,kind:"data",stack:{dev:"A",max:7,on:[2],dir:"down"},
 title:{ro:"Pe A: stratul Legătură de date (Ethernet)",en:"On A: the Data link layer (Ethernet)"},
 body:{ro:`<p>Acum A poate construi <strong>cadrul Ethernet</strong> în jurul pachetului:</p>
<ul><li><strong>MAC destinație</strong> = R1 (<code>02:11:00:00:00:01</code>) – <em>nu</em> B!</li>
<li><strong>MAC sursă</strong> = A (<code>02:AA:00:00:00:0A</code>)</li>
<li><strong>EtherType</strong> <code>0x0800</code> = „înăuntru e un pachet IPv4”</li>
<li>la final, <strong>FCS</strong> – o sumă de control (CRC-32) cu care destinatarul verifică dacă cadrul s-a stricat pe drum.</li></ul>
<p class="key">Ideea cheie: <strong>IP-ul</strong> arată destinația finală (B). <strong>MAC-ul</strong> arată doar următorul pas pe drum (R1).</p>`,
 en:`<p>Now A can build the <strong>Ethernet frame</strong> around the packet:</p>
<ul><li><strong>Destination MAC</strong> = R1 (<code>02:11:00:00:00:01</code>) – <em>not</em> B!</li>
<li><strong>Source MAC</strong> = A (<code>02:AA:00:00:00:0A</code>)</li>
<li><strong>EtherType</strong> <code>0x0800</code> = "there's an IPv4 packet inside"</li>
<li>at the end, the <strong>FCS</strong> – a checksum (CRC-32) the receiver uses to check whether the frame got damaged on the way.</li></ul>
<p class="key">Key idea: the <strong>IP</strong> address points to the final destination (B). The <strong>MAC</strong> address only points to the next stop (R1).</p>`},
 tables:["arpA"],hl:{arpA:IP.R1a}},

{at:"A",frame:F.fA,kind:"data",stack:{dev:"A",max:7,on:[1],dir:"down"},
 move:[[["A","SW1"]]],log:"A → R1",
 title:{ro:"Pe A: stratul Fizic",en:"On A: the Physical layer"},
 body:{ro:`<p>Placa de rețea transformă cadrul în <strong>biți</strong> – semnale electrice pe cablu (sau lumină pe fibră, unde radio pe Wi-Fi) – și îi trimite spre switch.</p>
<p>Am notat cadrul în <em>Jurnalul legăturilor</em> de mai jos: așa arată pe porțiunea A → R1.</p>`,
 en:`<p>The network card turns the frame into <strong>bits</strong> – electrical signals on the cable (or light on fibre, radio waves on Wi-Fi) – and sends them to the switch.</p>
<p>We've recorded the frame in the <em>Per-link log</em> below: this is how it looks on the A → R1 stretch.</p>`}},

{at:"SW1",frame:F.fA,kind:"data",stack:{dev:"SW1",max:2,on:[2],dir:"updown"},
 move:[[["SW1","R1"]]],
 title:{ro:"SW1: învață și trimite mai departe",en:"SW1: learn and forward"},
 body:{ro:`<p>Switch-ul se uită doar la antetul Ethernet (stratul 2):</p>
<ol><li><strong>Învățare:</strong> MAC-ul sursă <code>…:0A</code> e pe portul p1 – știa deja, doar reîmprospătează intrarea.</li>
<li><strong>Redirecționare:</strong> caută MAC-ul destinație <code>02:11:00:00:00:01</code> în tabelă → portul p2. Trimite cadrul <strong>numai</strong> pe p2.</li></ol>
<p>Switch-ul <strong>nu modifică</strong> cadrul – de aceea niciun câmp nu e colorat la acest pas.</p>`,
 en:`<p>The switch only looks at the Ethernet header (layer 2):</p>
<ol><li><strong>Learning:</strong> source MAC <code>…:0A</code> is on port p1 – it already knew that, so it just refreshes the entry.</li>
<li><strong>Forwarding:</strong> it looks up destination MAC <code>02:11:00:00:00:01</code> in the table → port p2. It sends the frame <strong>only</strong> out of p2.</li></ol>
<p>The switch <strong>does not change</strong> the frame – that's why no field is coloured in this step.</p>`},
 tables:["sw1"],hl:{sw1:MAC.R1a}},

{at:"R1",frame:F.pR1,kind:"data",stack:{dev:"R1",max:3,on:[1,2,3],dir:"up"},
 title:{ro:"R1: despachetează și alege drumul",en:"R1: unwrap and choose the route"},
 body:{ro:`<p>R1 verifică FCS-ul (e corect) și vede că MAC-ul destinație e al lui, deci acceptă cadrul.</p>
<ol><li><strong>Scoate antetul și trailerul Ethernet</strong> – și-au făcut treaba pe legătura asta.</li>
<li>Citește <strong>IP-ul destinație</strong> <code>192.168.2.20</code> și caută în <strong>tabela de rutare</strong>: cea mai bună potrivire e <code>192.168.2.0/24</code> → următorul hop <code>10.0.0.2</code> (R2), pe interfața Gi1.</li>
<li><strong>Scade TTL-ul</strong>: 64 → 63. Pentru că antetul IP s-a schimbat, recalculează și <strong>checksum-ul IP</strong>.</li></ol>`,
 en:`<p>R1 checks the FCS (it's fine) and sees the destination MAC is its own, so it accepts the frame.</p>
<ol><li><strong>It removes the Ethernet header and trailer</strong> – they've done their job on this link.</li>
<li>It reads the <strong>destination IP</strong> <code>192.168.2.20</code> and looks in its <strong>routing table</strong>: the best match is <code>192.168.2.0/24</code> → next hop <code>10.0.0.2</code> (R2), via interface Gi1.</li>
<li><strong>It decrements the TTL</strong>: 64 → 63. Because the IP header changed, it also recalculates the <strong>IP checksum</strong>.</li></ol>`},
 tables:["rtR1"],hl:{rtR1:"192.168.2.0/24"}},

{at:"R1",frame:F.fR1,kind:"data",stack:{dev:"R1",max:3,on:[2,1],dir:"down"},
 move:[[["R1","R2"]]],log:"R1 → R2",
 title:{ro:"R1: un cadru nou pentru legătura următoare",en:"R1: a new frame for the next link"},
 body:{ro:`<p>R1 pune pachetul într-un <strong>cadru Ethernet complet nou</strong>:</p>
<ul><li>MAC sursă = interfața Gi1 a lui R1 (<code>02:11:00:00:00:02</code>)</li>
<li>MAC destinație = R2 (<code>02:22:00:00:00:02</code>), luat din cache-ul ARP al lui R1. Dacă nu l-ar fi avut, ar fi făcut ARP, exact ca A.</li>
<li>FCS nou, calculat pentru noul cadru.</li></ul>
<p class="key">IP-urile sursă și destinație <strong>nu se schimbă</strong>. Se schimbă doar MAC-urile (și TTL-ul).</p>
<p class="note">Pe internetul real, legăturile dintre routere nu sunt mereu Ethernet (pot fi fibră, PPP etc.). Principiul e același: la fiecare legătură se construiește un antet nou de stratul 2.</p>`,
 en:`<p>R1 puts the packet into a <strong>brand-new Ethernet frame</strong>:</p>
<ul><li>Source MAC = R1's Gi1 interface (<code>02:11:00:00:00:02</code>)</li>
<li>Destination MAC = R2 (<code>02:22:00:00:00:02</code>), taken from R1's ARP cache. If it weren't there, R1 would ARP for it, just like A did.</li>
<li>A new FCS, calculated for the new frame.</li></ul>
<p class="key">The source and destination IPs <strong>do not change</strong>. Only the MACs (and the TTL) change.</p>
<p class="note">On the real internet, links between routers aren't always Ethernet (they may be fibre, PPP, etc.). The principle is the same: a new layer-2 header is built for every link.</p>`},
 tables:["arpR1"],hl:{arpR1:IP.R2b}},

{at:"R2",frame:F.fR2,kind:"data",stack:{dev:"R2",max:3,on:[1,2,3],dir:"updown"},
 move:[[["R2","SW2"]]],log:"R2 → B",
 title:{ro:"R2: aceeași rutină, încă o dată",en:"R2: the same routine again"},
 body:{ro:`<p>R2 face exact ce a făcut R1:</p>
<ol><li>Verifică FCS-ul; MAC-ul destinație e al lui → scoate antetul Ethernet.</li>
<li>Tabela de rutare: <code>192.168.2.0/24</code> e <strong>direct conectată</strong> pe Gi0 → B e chiar în rețeaua de alături, deci livrează direct.</li>
<li>TTL 63 → 62, checksum IP recalculat.</li>
<li>Cadru nou: MAC sursă = R2 Gi0 (<code>02:22:00:00:00:01</code>), MAC destinație = B (<code>02:BB:00:00:00:0B</code>, din cache-ul ARP).</li></ol>
<p>Compară câmpurile colorate cu pasul anterior: din nou s-au schimbat MAC-urile și TTL-ul; IP-urile au rămas la fel.</p>`,
 en:`<p>R2 does exactly what R1 did:</p>
<ol><li>Checks the FCS; the destination MAC is its own → removes the Ethernet header.</li>
<li>Routing table: <code>192.168.2.0/24</code> is <strong>directly connected</strong> on Gi0 → B is right on the attached network, so it delivers directly.</li>
<li>TTL 63 → 62, IP checksum recalculated.</li>
<li>New frame: source MAC = R2 Gi0 (<code>02:22:00:00:00:01</code>), destination MAC = B (<code>02:BB:00:00:00:0B</code>, from the ARP cache).</li></ol>
<p>Compare the coloured fields with the previous step: again the MACs and the TTL changed; the IPs stayed the same.</p>`},
 tables:["rtR2","arpR2"],hl:{rtR2:"192.168.2.0/24",arpR2:IP.B}},

{at:"SW2",frame:F.fR2,kind:"data",stack:{dev:"SW2",max:2,on:[2],dir:"updown"},
 move:[[["SW2","B"]]],
 title:{ro:"SW2: acum știe unde e B",en:"SW2: now it knows where B is"},
 body:{ro:`<p>SW2 caută MAC-ul destinație <code>02:BB:00:00:00:0B</code> în tabelă și îl <strong>găsește</strong>: portul p2. Trimite cadrul <strong>doar</strong> pe p2; Host C nici nu-l vede.</p>
<p>De unde știe? Din <strong>strângerea de mână</strong>: când B a trimis SYN-ACK-ul, cadrul a intrat în SW2 pe portul p2, iar SW2 a notat MAC-ul sursă al lui B. Tot atunci și-a reîmprospătat și intrarea pentru R2 (portul p1).</p>
<p class="note">Compară cu pasul SYN: acolo SW2 încă nu-l cunoștea pe B și a inundat cadrul pe toate porturile.</p>`,
 en:`<p>SW2 looks up the destination MAC <code>02:BB:00:00:00:0B</code> in its table and <strong>finds it</strong>: port p2. It sends the frame <strong>only</strong> out of p2; Host C never even sees it.</p>
<p>How does it know? From the <strong>handshake</strong>: when B sent the SYN-ACK, the frame entered SW2 on port p2, and SW2 noted B's source MAC. It also refreshed its entry for R2 (port p1) at that point.</p>
<p class="note">Compare with the SYN step: back then SW2 didn't know B yet and flooded the frame out of every port.</p>`},
 tables:["sw2"],hl:{sw2:MAC.B}},

{at:"B",frame:F.pB,kind:"data",stack:{dev:"B",max:7,on:[1,2],dir:"up"},
 title:{ro:"Pe B: Legătură de date",en:"On B: Data link"},
 body:{ro:`<p>Începe <strong>decapsularea</strong> – drumul în sus prin straturi.</p>
<p>Placa de rețea a lui B verifică <strong>FCS</strong>-ul (cadrul nu e stricat) și <strong>MAC-ul destinație</strong> (e al lui). EtherType <code>0x0800</code> spune că înăuntru e IPv4, deci scoate antetul Ethernet și predă pachetul stratului Rețea.</p>`,
 en:`<p><strong>Decapsulation</strong> begins – the trip back up through the layers.</p>
<p>B's network card checks the <strong>FCS</strong> (the frame isn't damaged) and the <strong>destination MAC</strong> (it's its own). EtherType <code>0x0800</code> says there's IPv4 inside, so it removes the Ethernet header and hands the packet to the Network layer.</p>`}},

{at:"B",frame:F.seg,kind:"data",stack:{dev:"B",max:7,on:[3],dir:"up"},
 title:{ro:"Pe B: stratul Rețea",en:"On B: the Network layer"},
 body:{ro:`<p>IP-ul destinație <code>192.168.2.20</code> e al lui B → pachetul a ajuns. Nu mai trebuie rutat nicăieri.</p>
<p>Avea <strong>TTL = 62</strong>: a pornit cu 64, deci a trecut prin 2 routere.</p>
<p>Câmpul Protocol = 6 înseamnă TCP, așa că B scoate antetul IP și predă segmentul lui TCP.</p>`,
 en:`<p>The destination IP <code>192.168.2.20</code> is B's own → the packet has arrived. It doesn't need routing any further.</p>
<p>It had <strong>TTL = 62</strong>: it started at 64, so it went through 2 routers.</p>
<p>The Protocol field = 6 means TCP, so B removes the IP header and hands the segment to TCP.</p>`}},

{at:"B",frame:F.app,kind:"data",stack:{dev:"B",max:7,on:[4,7],dir:"up"},
 title:{ro:"Pe B: Transport și Aplicație",en:"On B: Transport and Application"},
 body:{ro:`<p>TCP vede portul destinație <code>80</code> și predă datele <strong>serverului web</strong> care ascultă pe acel port.</p>
<p>Serverul primește exact ce a trimis browserul: <code>GET / HTTP/1.1</code>. 🎉</p>
<p>Răspunsul (pagina web) va face același drum înapoi, cu cadre noi la fiecare legătură: IP-urile sursă și destinație inversate, porturile inversate (80 → 49152).</p>`,
 en:`<p>TCP sees destination port <code>80</code> and hands the data to the <strong>web server</strong> listening on that port.</p>
<p>The server receives exactly what the browser sent: <code>GET / HTTP/1.1</code>. 🎉</p>
<p>The reply (the web page) will make the same trip back, with new frames on every link: source and destination IPs swapped, ports swapped (80 → 49152).</p>`}},

{at:["A","B"],frame:null,kind:"data",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<p>Uită-te la <strong>Jurnalul legăturilor</strong>: același pachet IP a călătorit în 3 cadre Ethernet diferite.</p>
<ul><li><strong>MAC-urile</strong> se schimbă la fiecare router – arată doar <em>următorul pas</em>.</li>
<li><strong>IP-urile</strong> rămân aceleași – arată <em>capetele</em> drumului.</li>
<li><strong>TTL-ul</strong> scade cu 1 la fiecare router; <strong>FCS</strong>-ul se recalculează pentru fiecare cadru nou.</li>
<li><strong>Switch-urile</strong> nu modifică cadrul: învață MAC-urile sursă și trimit după MAC-ul destinație (sau inundă dacă nu-l știu).</li>
<li><strong>ARP</strong> află MAC-ul pentru un IP din rețeaua locală.</li>
<li>Înaintea datelor, <strong>TCP</strong> deschide conexiunea în 3 pași: <strong>SYN → SYN-ACK → ACK</strong>. Primul cadru (SYN) a fost inundat de SW2; din SYN-ACK, SW2 a învățat unde e B.</li></ul>
<p><button type="button" class="btn primary" id="toQuiz">Mergi la test ↓</button></p>`,
 en:`<p>Look at the <strong>Per-link log</strong>: the same IP packet travelled inside 3 different Ethernet frames.</p>
<ul><li><strong>MACs</strong> change at every router – they only point to the <em>next stop</em>.</li>
<li><strong>IPs</strong> stay the same – they point to the <em>two ends</em> of the trip.</li>
<li>The <strong>TTL</strong> drops by 1 at every router; the <strong>FCS</strong> is recalculated for every new frame.</li>
<li><strong>Switches</strong> don't change the frame: they learn source MACs and forward by destination MAC (or flood if they don't know it).</li>
<li><strong>ARP</strong> finds the MAC for an IP on the local network.</li>
<li>Before any data, <strong>TCP</strong> opens the connection in 3 steps: <strong>SYN → SYN-ACK → ACK</strong>. The first frame (SYN) was flooded by SW2; from the SYN-ACK, SW2 learned where B is.</li></ul>
<p><button type="button" class="btn primary" id="toQuiz">Go to the quiz ↓</button></p>`}}
];
/* ---------- deeper explanations ("Learn more") and commands to try, one entry per step ---------- */
const MORE=[
 {more:{ro:`<p>De ce straturi? Fiecare strat are <strong>o singură treabă</strong> și nu trebuie să știe cum lucrează celelalte. Browserul nu știe nimic despre cabluri, iar placa de rețea nu știe ce e o pagină web.</p><p>O analogie: scrii o scrisoare (aplicația), o pui într-un plic cu numele destinatarului (TCP), plicul intră într-un colet cu adresa poștală (IP), iar curierul lipește o etichetă pentru drumul până la următorul depozit (Ethernet). La fiecare depozit se schimbă eticheta curierului, dar adresa poștală rămâne aceeași.</p>`,
   en:`<p>Why layers? Each layer has <strong>one job</strong> and doesn't need to know how the others work. The browser knows nothing about cables, and the network card doesn't know what a web page is.</p><p>An analogy: you write a letter (the application), put it in an envelope with the recipient's name (TCP), the envelope goes into a parcel with the postal address (IP), and the courier sticks on a label for the trip to the next depot (Ethernet). At each depot the courier label is replaced, but the postal address stays the same.</p>`},
  try:[{cmd:"ipconfig /all",d:{ro:"Arată IP-ul, masca, gateway-ul și adresa MAC („Physical Address”) ale calculatorului tău.",en:"Shows your computer's IP, mask, gateway and MAC address (\"Physical Address\")."}}]},
 {more:{ro:`<p>În realitate, înainte de acest pas browserul face o interogare <strong>DNS</strong> (vezi <a href="../dns/index.html">lecția DNS</a>): transformă un nume (de ex. <code>server-b.ro</code>) în IP-ul <code>192.168.2.20</code>.</p><p>Azi aproape toate site-urile folosesc <strong>HTTPS</strong> (portul 443), care criptează datele. Aici folosim HTTP simplu ca să poți citi conținutul. Criptarea schimbă doar datele; drumul cadrului e identic.</p>`,
   en:`<p>In reality, before this step the browser makes a <strong>DNS</strong> query (see the <a href="../dns/index.html">DNS lesson</a>): it turns a name (e.g. <code>server-b.com</code>) into the IP <code>192.168.2.20</code>.</p><p>Almost every site today uses <strong>HTTPS</strong> (port 443), which encrypts the data. We use plain HTTP here so you can read the content. Encryption only changes the data; the frame's journey is identical.</p>`},
  try:[{cmd:"nslookup example.com",d:{ro:"Întreabă DNS-ul ce IP are un nume de site.",en:"Asks DNS which IP a site name has."}}]},
 {more:{ro:`<p>Antetul TCP are minimum <strong>20 de octeți</strong>. Pe lângă porturi conține: număr de secvență, număr de confirmare (ACK), indicatori (SYN, ACK, FIN…) și o „fereastră” care spune câte date pot veni fără confirmare.</p><p>Porturile sursă temporare sunt de obicei între <code>49152</code> și <code>65535</code>. Alternativa la TCP este <strong>UDP</strong>: fără conexiune și fără confirmări, mai rapid, folosit pentru DNS, jocuri, apeluri video.</p>`,
   en:`<p>The TCP header is at least <strong>20 bytes</strong>. Besides ports it holds: a sequence number, an acknowledgement number (ACK), flags (SYN, ACK, FIN…) and a "window" saying how much data may arrive without acknowledgement.</p><p>Temporary source ports are usually between <code>49152</code> and <code>65535</code>. The alternative to TCP is <strong>UDP</strong>: no connection and no acknowledgements, faster, used for DNS, games and video calls.</p>`},
  try:[{cmd:"netstat -an",d:{ro:"Listează conexiunile deschise, cu IP-uri și porturi.",en:"Lists open connections, with IPs and ports."}}]},
 {more:{ro:`<p>Antetul IPv4 are minimum <strong>20 de octeți</strong>: versiune, lungime, identificator, indicatori (de ex. „nu fragmenta”), TTL, protocol, checksum, IP sursă și IP destinație.</p><p>Valoarea inițială a TTL-ului depinde de sistem: <strong>Windows pornește de la 128</strong>, Linux și macOS de la 64.</p><p class="note">Adresele <code>192.168.x.x</code> și <code>10.x.x.x</code> sunt <strong>private</strong>. Pe internetul real, routerul de acasă le înlocuiește cu IP-ul public (<strong>NAT</strong>), deci IP-ul sursă se schimbă acolo. În exemplul nostru nu există NAT.</p>`,
   en:`<p>The IPv4 header is at least <strong>20 bytes</strong>: version, length, identifier, flags (e.g. "don't fragment"), TTL, protocol, checksum, source IP and destination IP.</p><p>The starting TTL depends on the system: <strong>Windows starts at 128</strong>, Linux and macOS at 64.</p><p class="note">Addresses like <code>192.168.x.x</code> and <code>10.x.x.x</code> are <strong>private</strong>. On the real internet, your home router replaces them with its public IP (<strong>NAT</strong>), so the source IP does change there. Our example has no NAT.</p>`}},
 {more:{ro:`<p>Calculul se face bit cu bit, cu operația <strong>AND</strong> între IP și mască:</p><ul><li><code>192.168.1.10 AND 255.255.255.0 = 192.168.1.0</code></li><li><code>192.168.2.20 AND 255.255.255.0 = 192.168.2.0</code></li></ul><p>Rezultatele diferă ⇒ rețele diferite. Și calculatorul are o mică tabelă de rutare: ruta <code>0.0.0.0/0</code> („orice altceva”) duce la gateway.</p>`,
   en:`<p>The calculation is done bit by bit, with an <strong>AND</strong> between the IP and the mask:</p><ul><li><code>192.168.1.10 AND 255.255.255.0 = 192.168.1.0</code></li><li><code>192.168.2.20 AND 255.255.255.0 = 192.168.2.0</code></li></ul><p>The results differ ⇒ different networks. The computer has a small routing table too: the route <code>0.0.0.0/0</code> ("everything else") leads to the gateway.</p>`},
  try:[{cmd:"route print -4",d:{ro:"Arată tabela de rutare a calculatorului tău; caută linia 0.0.0.0 cu gateway-ul.",en:"Shows your computer's routing table; look for the 0.0.0.0 line with the gateway."}}]},
 {more:{ro:`<p>Mesajul ARP are 28 de octeți. Pentru că un cadru Ethernet trebuie să aibă minimum 64 de octeți, placa de rețea adaugă <strong>umplutură</strong> (padding).</p><p>Un broadcast ajunge doar până la router: <strong>routerele nu trimit broadcast-uri mai departe</strong>. De aceea ARP funcționează numai în rețeaua locală, iar A nu poate afla direct MAC-ul lui B.</p>`,
   en:`<p>The ARP message is 28 bytes. Because an Ethernet frame must be at least 64 bytes, the network card adds <strong>padding</strong>.</p><p>A broadcast only goes as far as the router: <strong>routers don't forward broadcasts</strong>. That's why ARP only works on the local network, and A can't directly learn B's MAC.</p>`},
  try:[{cmd:"arp -a",d:{ro:"Afișează cache-ul ARP al calculatorului tău (IP → MAC).",en:"Shows your computer's ARP cache (IP → MAC)."}}]},
 {more:{ro:`<p>Intrările din cache-ul ARP expiră: pe Windows după zeci de secunde fără folosire, pe multe routere după 4 ore. Așa se adaptează rețeaua dacă un dispozitiv își schimbă placa de rețea.</p><p class="note">Securitate: ARP nu verifică cine răspunde. Un atacator din rețeaua locală poate pretinde că e gateway-ul (<strong>ARP spoofing</strong>). Switch-urile profesionale au protecții precum <em>Dynamic ARP Inspection</em>.</p>`,
   en:`<p>ARP cache entries expire: on Windows after tens of seconds unused, on many routers after 4 hours. That way the network adapts if a device changes its network card.</p><p class="note">Security: ARP doesn't verify who replies. An attacker on the local network can claim to be the gateway (<strong>ARP spoofing</strong>). Professional switches have protections such as <em>Dynamic ARP Inspection</em>.</p>`},
  try:[{cmd:"Get-NetNeighbor -AddressFamily IPv4",d:{ro:"Varianta PowerShell: vecinii cunoscuți și starea lor (Reachable, Stale…).",en:"PowerShell version: known neighbours and their state (Reachable, Stale…)."}}]},
 {more:{ro:`<p>Un cadru Ethernet are între <strong>64 și 1518 octeți</strong>. Datele din el pot avea cel mult <strong>1500 de octeți</strong> (MTU). Cadrul nostru are 72 de octeți: 14 antet + 20 IP + 20 TCP + 14 date + 4 FCS.</p><p>Adresa MAC are 6 octeți. Primii 3 identifică de obicei <strong>producătorul</strong> plăcii (OUI). Adresele din exemplu încep cu <code>02</code>, ceea ce înseamnă „administrată local”, adică inventată pentru exemplu.</p><p>Vezi secțiunea <a href="#anatomy">Anatomia cadrului</a> pentru harta completă, octet cu octet.</p>`,
   en:`<p>An Ethernet frame is between <strong>64 and 1518 bytes</strong>. The data inside can be at most <strong>1500 bytes</strong> (the MTU). Our frame is 72 bytes: 14 header + 20 IP + 20 TCP + 14 data + 4 FCS.</p><p>A MAC address is 6 bytes. The first 3 usually identify the card's <strong>manufacturer</strong> (OUI). The addresses here start with <code>02</code>, meaning "locally administered", i.e. made up for the example.</p><p>See the <a href="#anatomy">Frame anatomy</a> section for the full byte-by-byte map.</p>`}},
 {more:{ro:`<p>Înainte de cadru, placa trimite un <strong>preambul</strong> de 7 octeți și un octet SFD („începe cadrul”), ca receptorul să se sincronizeze. După fiecare cadru urmează o mică pauză obligatorie.</p><p>Legăturile moderne sunt <strong>full-duplex</strong>: se poate trimite și primi în același timp, deci nu mai există coliziuni. Pe Wi-Fi cadrele au alt format (802.11), iar access point-ul le transformă în cadre Ethernet.</p>`,
   en:`<p>Before the frame, the card sends a 7-byte <strong>preamble</strong> and a 1-byte SFD ("frame starts here") so the receiver can synchronise. A short mandatory gap follows every frame.</p><p>Modern links are <strong>full-duplex</strong>: sending and receiving happen at the same time, so there are no collisions any more. On Wi-Fi, frames have a different format (802.11), and the access point converts them into Ethernet frames.</p>`},
  try:[{cmd:"Get-NetAdapter",d:{ro:"Arată plăcile de rețea, adresa MAC și viteza legăturii (de ex. 1 Gbps).",en:"Shows network adapters, MAC address and link speed (e.g. 1 Gbps)."}}]},
 {more:{ro:`<p>Majoritatea switch-urilor lucrează <strong>store-and-forward</strong>: primesc tot cadrul, verifică FCS-ul și aruncă cadrele stricate. Altele (<em>cut-through</em>) încep să trimită după ce au citit doar MAC-ul destinație, pentru viteză.</p><p>O intrare din tabela MAC expiră de obicei după <strong>300 de secunde</strong> fără trafic. Toate porturile unui switch formează un singur <strong>domeniu de broadcast</strong>; ca să-l împarți ai nevoie de VLAN-uri sau de un router.</p>`,
   en:`<p>Most switches work <strong>store-and-forward</strong>: they receive the whole frame, check the FCS and drop damaged frames. Others (<em>cut-through</em>) start forwarding after reading only the destination MAC, for speed.</p><p>A MAC table entry usually expires after <strong>300 seconds</strong> without traffic. All ports of a switch form one <strong>broadcast domain</strong>; to split it you need VLANs or a router.</p>`}},
 {more:{ro:`<p>Regula de alegere este <strong>cea mai lungă potrivire</strong> (longest prefix match). Dacă tabela ar avea și <code>192.168.0.0/16</code>, și <code>192.168.2.0/24</code>, ar câștiga <code>/24</code>, pentru că e mai specifică. Ruta <code>0.0.0.0/0</code> se potrivește cu orice și se folosește doar când nu există alta.</p><p>Dacă TTL-ul ajunge la 0, routerul aruncă pachetul și îi trimite lui A un mesaj ICMP „Time Exceeded”. Pe asta se bazează comanda <code>tracert</code>: trimite pachete cu TTL 1, 2, 3… și află astfel fiecare router de pe drum.</p>`,
   en:`<p>The selection rule is <strong>longest prefix match</strong>. If the table had both <code>192.168.0.0/16</code> and <code>192.168.2.0/24</code>, <code>/24</code> would win because it's more specific. The route <code>0.0.0.0/0</code> matches anything and is used only when nothing else does.</p><p>If the TTL reaches 0, the router drops the packet and sends A an ICMP "Time Exceeded" message. That's what the <code>tracert</code> command relies on: it sends packets with TTL 1, 2, 3… and so discovers every router on the way.</p>`},
  try:[{cmd:"tracert -d 1.1.1.1",d:{ro:"Arată fiecare router (hop) până la un server de pe internet.",en:"Shows every router (hop) on the way to a server on the internet."}}]},
 {more:{ro:`<p>Dacă pachetul e mai mare decât MTU-ul legăturii următoare, routerul fie îl <strong>fragmentează</strong>, fie (dacă e setat „nu fragmenta”) îl aruncă și îi spune expeditorului să trimită pachete mai mici.</p><p>Pe drumul real prin internet, un pachet trece de obicei prin <strong>10–20 de routere</strong>. La fiecare se întâmplă exact pașii pe care i-ai văzut la R1.</p>`,
   en:`<p>If the packet is larger than the next link's MTU, the router either <strong>fragments</strong> it or (if "don't fragment" is set) drops it and tells the sender to send smaller packets.</p><p>On a real trip across the internet, a packet usually passes through <strong>10–20 routers</strong>. At each one, exactly the steps you saw at R1 happen.</p>`}},
 {more:{ro:`<p>„Direct conectată” înseamnă că routerul are o interfață chiar în acea rețea. Atunci următorul hop este <strong>destinația însăși</strong>, iar routerul caută în cache-ul ARP MAC-ul lui B, nu al altui router.</p><p>Dacă R2 nu ar fi avut MAC-ul lui B, ar fi făcut ARP în LAN 2, iar pachetul ar fi așteptat, exact ca la pasul 6.</p>`,
   en:`<p>"Directly connected" means the router has an interface right on that network. Then the next hop is <strong>the destination itself</strong>, and the router looks up B's MAC in its ARP cache, not another router's.</p><p>If R2 didn't have B's MAC, it would ARP on LAN 2 and the packet would wait, exactly as in step 6.</p>`}},
 {more:{ro:`<p>Inundarea unui MAC necunoscut (<em>unknown unicast flooding</em>) seamănă cu un broadcast, dar MAC-ul destinație e unul anume, nu <code>FF:FF:FF:FF:FF:FF</code>. Doar B îl păstrează.</p><p>Apare des când cache-ul ARP al routerului trăiește mai mult (ore) decât tabela MAC a switch-ului (minute): routerul încă știe MAC-ul, switch-ul l-a uitat.</p>`,
   en:`<p>Flooding an unknown MAC (<em>unknown unicast flooding</em>) looks like a broadcast, but the destination MAC is a specific one, not <code>FF:FF:FF:FF:FF:FF</code>. Only B keeps it.</p><p>It often happens when the router's ARP cache lives longer (hours) than the switch's MAC table (minutes): the router still knows the MAC, the switch has forgotten it.</p>`}},
 {more:{ro:`<p>Placa de rețea filtrează direct în hardware: acceptă cadrele pentru MAC-ul ei, broadcast-urile și grupurile multicast la care e abonată. Restul sunt ignorate fără să deranjeze procesorul.</p><p>Programe ca <strong>Wireshark</strong> pun placa în <em>modul promiscuu</em>, ca să vezi toate cadrele, exact cu câmpurile din această aplicație.</p>`,
   en:`<p>The network card filters in hardware: it accepts frames for its own MAC, broadcasts and the multicast groups it has joined. Everything else is ignored without bothering the CPU.</p><p>Tools like <strong>Wireshark</strong> put the card into <em>promiscuous mode</em>, so you can see every frame, with exactly the fields shown in this app.</p>`}},
 {more:{ro:`<p>Câmpul Protocol spune cui îi dă IP-ul conținutul: <code>1</code> = ICMP (ping), <code>6</code> = TCP, <code>17</code> = UDP.</p><p>Dacă IP-ul destinație nu ar fi fost al lui, B ar fi aruncat pachetul: calculatoarele obișnuite nu rutează pachete pentru alții.</p>`,
   en:`<p>The Protocol field says who IP hands the content to: <code>1</code> = ICMP (ping), <code>6</code> = TCP, <code>17</code> = UDP.</p><p>If the destination IP hadn't been its own, B would have dropped the packet: ordinary computers don't route packets for others.</p>`},
  try:[{cmd:"ping -n 2 1.1.1.1",d:{ro:"Trimite pachete ICMP; răspunsul arată și TTL-ul cu care au ajuns înapoi.",en:"Sends ICMP packets; the reply also shows the TTL they came back with."}}]},
 {more:{ro:`<p>O conexiune TCP e identificată de patru valori: <strong>IP sursă, port sursă, IP destinație, port destinație</strong>. Așa poate serverul să servească mii de browsere în același timp pe portul 80.</p><p>Pentru răspuns, B folosește propriul gateway (<code>192.168.2.1</code>) și propriul cache ARP, apoi totul se repetă în sens invers.</p>`,
   en:`<p>A TCP connection is identified by four values: <strong>source IP, source port, destination IP, destination port</strong>. That's how a server can serve thousands of browsers at once on port 80.</p><p>For the reply, B uses its own gateway (<code>192.168.2.1</code>) and its own ARP cache, and everything repeats in the opposite direction.</p>`}},
 {more:{ro:`<p>Ce poți învăța mai departe:</p><ul><li><strong>VLAN-uri</strong>: împart un switch în mai multe rețele separate.</li><li><strong>NAT</strong>: cum ies mai multe calculatoare pe internet cu un singur IP public.</li><li><strong>DHCP și DNS</strong>: cum primește un calculator IP-ul și cum află IP-ul unui site.</li><li><strong>IPv6</strong>: adrese mai lungi; în loc de ARP folosește NDP.</li></ul><p>Cel mai bun exercițiu: instalează Wireshark, pornește o captură, rulează <code>ping</code> spre gateway și găsește cererea ARP și răspunsul.</p>`,
   en:`<p>What to learn next:</p><ul><li><strong>VLANs</strong>: split one switch into several separate networks.</li><li><strong>NAT</strong>: how many computers share a single public IP on the internet.</li><li><strong>DHCP and DNS</strong>: how a computer gets its IP and how it finds a site's IP.</li><li><strong>IPv6</strong>: longer addresses; uses NDP instead of ARP.</li></ul><p>Best exercise: install Wireshark, start a capture, run <code>ping</code> to your gateway and find the ARP request and reply.</p>`}}
];
MORE.forEach((m,i)=>Object.assign(S[i],m));

/* ---------- TCP 3-way handshake (inserted after the detail text above was attached) ---------- */
const HSP={proto:"6 (TCP)"};
const SYNF=eth(MAC.R1a,MAC.A,ET_IP,{srcIp:IP.A,dstIp:IP.B,ttl:"64",...HSP,ipChk:ipChecksum(64,0x28),srcPort:"49152",dstPort:"80 (HTTP)",seq:{ro:"1000 (ales la întâmplare)",en:"1000 (picked at random)"},ack:"0",flags:"SYN",window:"64240"});
const SYNACKF=eth(MAC.A,MAC.R1a,ET_IP,{srcIp:IP.B,dstIp:IP.A,ttl:"62",...HSP,ipChk:ipChecksum(62,0x28),srcPort:"80 (HTTP)",dstPort:"49152",seq:{ro:"5000 (ales la întâmplare de B)",en:"5000 (picked at random by B)"},ack:"1001",flags:"SYN, ACK",window:"65160"});
const ACKF=eth(MAC.R1a,MAC.A,ET_IP,{srcIp:IP.A,dstIp:IP.B,ttl:"64",...HSP,ipChk:ipChecksum(64,0x28),srcPort:"49152",dstPort:"80 (HTTP)",seq:"1001",ack:"5001",flags:"ACK",window:"64240"});
const SOCKA="A (192.168.1.10:49152)",SOCKB="B (192.168.2.20:80)";
const HS_INTRO={at:["A","B"],rest:["A"],frame:F.seg,kind:"data",stack:{dev:"A",max:7,on:[4],dir:"down"},tables:["hs","sock"],
 title:{ro:"Înainte de date: TCP deschide o conexiune",en:"Before any data: TCP opens a connection"},
 body:{ro:`<p>Segmentul cu <code>GET</code> e gata, dar <strong>nu pleacă încă</strong>. TCP promite că datele ajung <strong>toate, în ordine și o singură dată</strong>. Ca să poată face asta, A și B trebuie întâi să se pună de acord. Asta e <strong>strângerea de mână în 3 pași</strong> (3-way handshake):</p>
<ol><li><strong>SYN</strong> (A → B): „Vreau să vorbim. Eu încep să număr octeții de la <code>1000</code>.”</li>
<li><strong>SYN-ACK</strong> (B → A): „De acord. Eu încep de la <code>5000</code>. Am primit până la 1000, aștept octetul <code>1001</code> de la tine.”</li>
<li><strong>ACK</strong> (A → B): „Am înțeles, aștept octetul <code>5001</code> de la tine.”</li></ol>
<p>Abia după al treilea mesaj conexiunea e <strong>ESTABLISHED</strong> (stabilită), iar segmentul cu <code>GET</code> pleacă cu <code>seq = 1001</code>, <code>ack = 5001</code>.</p>
<p>Fiecare dintre cele 3 mesaje e un segment TCP <strong>fără date</strong> (doar antetul de 20 de octeți), pus și el în pachete IP și cadre Ethernet, exact ca datele. Le vei vedea circulând după ce A află MAC-ul gateway-ului (ARP).</p>`,
 en:`<p>The segment with the <code>GET</code> is ready, but it <strong>doesn't leave yet</strong>. TCP promises that data arrives <strong>complete, in order and exactly once</strong>. To do that, A and B first have to agree. That's the <strong>3-way handshake</strong>:</p>
<ol><li><strong>SYN</strong> (A → B): "I want to talk. I'll start counting my bytes at <code>1000</code>."</li>
<li><strong>SYN-ACK</strong> (B → A): "Agreed. I start at <code>5000</code>. I got up to 1000, I expect byte <code>1001</code> from you."</li>
<li><strong>ACK</strong> (A → B): "Understood, I expect byte <code>5001</code> from you."</li></ol>
<p>Only after the third message is the connection <strong>ESTABLISHED</strong>, and the <code>GET</code> segment leaves with <code>seq = 1001</code>, <code>ack = 5001</code>.</p>
<p>Each of the 3 messages is a TCP segment <strong>with no data</strong> (just the 20-byte header), also wrapped in IP packets and Ethernet frames, exactly like the data. You'll watch them travel once A has learned the gateway's MAC (ARP).</p>`},
 more:{ro:`<p>De ce numere de pornire aleatorii? Ca un atacator să nu poată ghici numerele și să „bage” pachete false într-o conexiune, și ca pachete întârziate dintr-o conexiune veche să nu fie confundate cu cele noi.</p><p>În SYN și SYN-ACK cele două părți schimbă și <strong>opțiuni</strong>: MSS (cel mai mare segment acceptat, de obicei 1460 octeți = 1500 MTU − 20 IP − 20 TCP), <em>window scaling</em> (ferestre mai mari de 64 KB) și SACK (confirmări pentru bucăți primite pe sărite).</p><p>Dacă pe B nu ascultă nimeni pe portul 80, B răspunde cu <strong>RST</strong> și browserul afișează „connection refused”. Dacă nu răspunde nimic, A retrimite SYN-ul de câteva ori, apoi afișează „timed out”.</p>`,
  en:`<p>Why random starting numbers? So an attacker can't guess them and "inject" fake packets into a connection, and so delayed packets from an old connection aren't mistaken for new ones.</p><p>In the SYN and SYN-ACK both sides also exchange <strong>options</strong>: MSS (the largest segment accepted, usually 1460 bytes = 1500 MTU − 20 IP − 20 TCP), <em>window scaling</em> (windows larger than 64 KB) and SACK (acknowledging pieces received out of order).</p><p>If nothing is listening on port 80 on B, B answers with <strong>RST</strong> and the browser shows "connection refused". If nothing answers at all, A resends the SYN a few times, then shows "timed out".</p>`},
 try:[{cmd:"Test-NetConnection 1.1.1.1 -Port 443",d:{ro:"Face exact o strângere de mână TCP; TcpTestSucceeded: True înseamnă că serverul a răspuns cu SYN-ACK.",en:"Does exactly one TCP handshake; TcpTestSucceeded: True means the server answered with SYN-ACK."}}]};
const HS_SYN={at:"A",frame:SYNF,kind:"hs",tables:["sock","sw2"],miss:{sw2:MAC.B},
 move:[[["A","SW1"]],[["SW1","R1"]],[["R1","R2"]],[["R2","SW2"]],[["SW2","B"],["SW2","C"]]],rest:["B","C"],
 marks:{B:"ok",C:"drop"},fx:[["sw2",MAC.R2a,"p1"],["sock",SOCKA,"SYN-SENT"],["sock",SOCKB,"SYN-RECEIVED"]],
 title:{ro:"Strângerea de mână 1/3: SYN, prin toată rețeaua",en:"Handshake 1/3: SYN, across the whole network"},
 body:{ro:`<p>Acum că A știe MAC-ul lui R1, trimite <strong>primul cadru adevărat</strong> spre B: un segment TCP cu indicatorul <strong>SYN</strong>, fără date. În dreapta vezi cadrul așa cum pleacă de la A.</p>
<p>Face <strong>exact drumul pe care îl vei studia pas cu pas la cererea GET</strong>: SW1 → R1 (cadru nou, TTL − 1) → R2 (cadru nou, TTL − 1) → SW2.</p>
<p>La SW2 se întâmplă ceva important: SW2 învață că R2 e pe portul p1, dar <strong>nu cunoaște încă MAC-ul lui B</strong> (intrările se șterg după ~5 minute fără trafic). Ce face un switch când nu știe? <strong>Inundă</strong> (flooding): trimite cadrul pe <strong>toate porturile</strong>, mai puțin pe cel pe care a venit.</p>
<p>Host C primește și el SYN-ul, vede că MAC-ul destinație nu e al lui și îl <strong>aruncă</strong>. B îl acceptă: pe portul 80 ascultă serverul web, așa că trece în starea <strong>SYN-RECEIVED</strong>.</p>`,
 en:`<p>Now that A knows R1's MAC, it sends the <strong>first real frame</strong> towards B: a TCP segment with the <strong>SYN</strong> flag and no data. On the right you see the frame as it leaves A.</p>
<p>It takes <strong>exactly the path you'll study step by step for the GET request</strong>: SW1 → R1 (new frame, TTL − 1) → R2 (new frame, TTL − 1) → SW2.</p>
<p>Something important happens at SW2: it learns that R2 is on port p1, but it <strong>doesn't know B's MAC yet</strong> (entries are removed after ~5 minutes without traffic). What does a switch do when it doesn't know? It <strong>floods</strong>: it sends the frame out of <strong>every port</strong> except the one it came in on.</p>
<p>Host C receives the SYN too, sees the destination MAC isn't its own and <strong>drops</strong> it. B accepts it: the web server is listening on port 80, so B moves to the <strong>SYN-RECEIVED</strong> state.</p>`},
 more:{ro:`<p>În lecție am arătat ARP înaintea SYN-ului ca să-l explicăm separat. În realitate ordinea e: Windows construiește SYN-ul, IP decide că trebuie trimis la gateway, nu are MAC-ul lui în cache, deci <strong>SYN-ul așteaptă</strong> cât durează ARP-ul și pleacă imediat după.</p>`,
  en:`<p>In the lesson we showed ARP before the SYN so we could explain it on its own. In reality the order is: Windows builds the SYN, IP decides it must go to the gateway, finds no MAC for it in the cache, so <strong>the SYN waits</strong> while ARP runs and leaves right after.</p>`}};
const HS_SYNACK={at:"B",frame:SYNACKF,kind:"hs",tables:["sock","sw2"],hl:{sw2:MAC.B},
 move:[[["B","SW2"]],[["SW2","R2"]],[["R2","R1"]],[["R1","SW1"]],[["SW1","A"]]],
 fx:[["sw2",MAC.B,"p2"],["sock",SOCKA,"ESTABLISHED"]],
 title:{ro:"Strângerea de mână 2/3: SYN-ACK înapoi la A",en:"Handshake 2/3: SYN-ACK back to A"},
 body:{ro:`<p>B răspunde cu un segment care are <strong>doi</strong> indicatori: <strong>SYN</strong> (propriul număr de pornire, <code>5000</code>) și <strong>ACK</strong> (confirmă SYN-ul lui A: <code>ack = 1001</code>, adică „aștept octetul 1001”).</p>
<p>Observă cum s-au <strong>inversat</strong> porturile (sursa e acum <code>80</code>, destinația <code>49152</code>) și IP-urile. În dreapta vezi cadrul așa cum <strong>ajunge la A</strong>, după două routere: TTL 62, MAC-urile ultimei legături (R1 → A).</p>
<ul><li><strong>SW2 învață</strong> că MAC-ul lui B e pe portul p2 (cadrul a intrat pe acolo) și trimite cadrul doar pe p1, spre R2.</li>
<li>R2 și R1 îl rutează la fel cum vor ruta cererea, doar în sens invers.</li>
<li>A primește SYN-ACK-ul, verifică <code>ack = 1001</code> și trece în <strong>ESTABLISHED</strong>.</li></ul>`,
 en:`<p>B replies with a segment carrying <strong>two</strong> flags: <strong>SYN</strong> (its own starting number, <code>5000</code>) and <strong>ACK</strong> (acknowledging A's SYN: <code>ack = 1001</code>, i.e. "I expect byte 1001").</p>
<p>Note how the ports have <strong>swapped</strong> (the source is now <code>80</code>, the destination <code>49152</code>), and so have the IPs. On the right you see the frame as it <strong>arrives at A</strong>, after two routers: TTL 62, with the MACs of the last link (R1 → A).</p>
<ul><li><strong>SW2 learns</strong> that B's MAC is on port p2 (the frame came in there) and sends the frame only out of p1, towards R2.</li>
<li>R2 and R1 route it the same way they'll route the request, just in the opposite direction.</li>
<li>A receives the SYN-ACK, checks <code>ack = 1001</code> and moves to <strong>ESTABLISHED</strong>.</li></ul>`}};
const HS_ACK={at:"A",frame:ACKF,kind:"hs",tables:["hs","sock"],hl:{hs:2},
 move:[[["A","SW1"]],[["SW1","R1"]],[["R1","R2"]],[["R2","SW2"]],[["SW2","B"]]],
 fx:[["sock",SOCKB,"ESTABLISHED"]],
 title:{ro:"Strângerea de mână 3/3: ACK, conexiunea e gata",en:"Handshake 3/3: ACK, the connection is ready"},
 body:{ro:`<p>A trimite ultimul segment fără date: doar <strong>ACK</strong>, cu <code>seq = 1001</code> și <code>ack = 5001</code> („am primit SYN-ul tău, aștept octetul 5001”).</p>
<p>De data asta SW2 <strong>știe</strong> unde e B și trimite cadrul doar pe portul p2; Host C nu mai primește nimic. B trece și el în <strong>ESTABLISHED</strong>.</p>
<p class="key">Trei cadre au trecut deja prin toată rețeaua și <strong>nu s-a transferat niciun octet de date</strong>. Abia acum pleacă cererea <code>GET</code>, pe care o urmărim în detaliu în pașii următori.</p>`,
 en:`<p>A sends the last segment with no data: just <strong>ACK</strong>, with <code>seq = 1001</code> and <code>ack = 5001</code> ("I got your SYN, I expect byte 5001").</p>
<p>This time SW2 <strong>knows</strong> where B is and sends the frame only out of port p2; Host C gets nothing. B also moves to <strong>ESTABLISHED</strong>.</p>
<p class="key">Three frames have already crossed the whole network and <strong>not a single byte of data has been transferred</strong>. Only now does the <code>GET</code> request leave, and we follow it in detail in the next steps.</p>`},
 more:{ro:`<p>Strângerea de mână costă un „dus-întors” (RTT) înainte de primul octet util. Pe o legătură cu 50 ms până la server, asta înseamnă 50 ms în plus; HTTPS adaugă încă unul sau două pentru TLS. De aceea browserele țin conexiunile deschise (<em>keep-alive</em>) și le refolosesc pentru mai multe cereri.</p><p>La final, conexiunea se închide tot în pași: <strong>FIN</strong> → ACK → <strong>FIN</strong> → ACK (sau brusc, cu RST).</p>`,
  en:`<p>The handshake costs one round trip (RTT) before the first useful byte. On a link with 50 ms to the server, that's 50 ms extra; HTTPS adds one or two more for TLS. That's why browsers keep connections open (<em>keep-alive</em>) and reuse them for several requests.</p><p>At the end, the connection is also closed in steps: <strong>FIN</strong> → ACK → <strong>FIN</strong> → ACK (or abruptly, with RST).</p>`},
 try:[{cmd:"Get-NetTCPConnection -RemotePort 443 -State Established",d:{ro:"Conexiunile TCP stabilite de calculatorul tău cu servere HTTPS, cu porturile locale alese de Windows.",en:"Your computer's established TCP connections to HTTPS servers, with the local ports Windows picked."}}]};
