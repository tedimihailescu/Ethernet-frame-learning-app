steps:[
{at:"art",frame:null,kind:"none",tables:["types"],who:{ro:"Ideea",en:"The idea"},
 title:{ro:"De ce un depozit de artefacte",en:"Why an artifact repository"},
 body:{ro:`<p>Un build Java descarcă zeci sau sute de biblioteci de pe internet și produce un <strong>artefact</strong>: un jar, o imagine Docker, un pachet npm. Fără un loc central apar probleme:</p>
<ul><li>fiecare build iese pe internet, iar dacă Maven Central e lent sau blocat, build-urile cad;</li>
<li>artefactele stau „pe undeva”, pe serverul de CI sau pe laptopuri;</li>
<li>producția primește uneori un pachet <em>reconstruit</em>, nu exact cel testat.</li></ul>
<p><strong>JFrog Artifactory</strong> e depozitul central pentru toate tipurile de pachete. Are trei tipuri de repo: <strong>local</strong>, <strong>remote</strong> și <strong>virtual</strong>.</p>`,
 en:`<p>A Java build downloads dozens or hundreds of libraries from the internet and produces an <strong>artifact</strong>: a jar, a Docker image, an npm package. Without a central place, problems appear:</p>
<ul><li>every build goes out to the internet, and if Maven Central is slow or blocked, builds fail;</li>
<li>artifacts live "somewhere", on the CI server or on laptops;</li>
<li>production sometimes gets a <em>rebuilt</em> package, not exactly the tested one.</li></ul>
<p><strong>JFrog Artifactory</strong> is the central store for every package type. It has three kinds of repo: <strong>local</strong>, <strong>remote</strong> and <strong>virtual</strong>.</p>`}},

{at:"art",frame:A1,kind:"a",move:[[["ci","art"]],[["art","ext"]],[["ext","art"]]],log:{ro:"prima descărcare",en:"the first download"},who:{ro:"Repo remote",en:"Remote repo"},
 title:{ro:"O dependență nouă: repo-ul remote o aduce",en:"A new dependency: the remote repo fetches it"},
 body:{ro:`<p>Build-ul are nevoie de <code>jackson-databind 2.17.1</code>. Maven nu știe de Maven Central; în <code>settings.xml</code> are o singură adresă: <strong>maven-virtual</strong> din Artifactory.</p>
<p>Repo-ul virtual caută întâi în repo-urile locale, apoi în <strong>maven-remote</strong>. Acolo nu e încă în cache (<strong>MISS</strong>), deci Artifactory îl descarcă din Maven Central, îi verifică <strong>checksum</strong>-ul și îl salvează.</p>`,
 en:`<p>The build needs <code>jackson-databind 2.17.1</code>. Maven doesn't know about Maven Central; its <code>settings.xml</code> has a single address: <strong>maven-virtual</strong> in Artifactory.</p>
<p>The virtual repo looks first in the local repos, then in <strong>maven-remote</strong>. It's not cached there yet (<strong>MISS</strong>), so Artifactory downloads it from Maven Central, checks its <strong>checksum</strong> and stores it.</p>`}},

{at:"art",frame:A2,kind:"a",move:[[["ci","art"]],[["art","ci"]]],log:{ro:"din cache",en:"from the cache"},who:"Cache",
 title:{ro:"A doua oară: din cache",en:"The second time: from the cache"},
 body:{ro:`<p>Următorul build cere aceeași bibliotecă: <strong>HIT</strong>, servită din cache în câteva milisecunde. Cele 400 de build-uri pe zi ale firmei nu mai ies pe internet pentru ea.</p>
<p>Bonus: dacă biblioteca dispare vreodată de pe internet, firma o are în continuare. Și pentru că serverele de build vorbesc doar cu Artifactory, firewall-ul poate bloca restul internetului.</p>`,
 en:`<p>The next build asks for the same library: <strong>HIT</strong>, served from the cache in milliseconds. The company's 400 builds a day no longer go out to the internet for it.</p>
<p>Bonus: if the library ever disappears from the internet, the company still has it. And since build servers only talk to Artifactory, the firewall can block the rest of the internet.</p>`},
 try:[{cmd:"mvn -s settings.xml dependency:resolve",d:{ro:"Toate dependențele vin prin maven-virtual.",en:"Every dependency comes through maven-virtual."}}]},

{at:"art",frame:A3,kind:"p",move:[[["ci","art"]]],tables:["repos"],hl:{repos:"libs-release-local"},log:{ro:"jar publicat",en:"jar published"},who:{ro:"Repo local",en:"Local repo"},
 title:{ro:"Build-ul își publică jar-ul",en:"The build publishes its jar"},
 body:{ro:`<p>Testele trec. <code>mvn deploy</code> urcă <code>orders-api-1.8.0.jar</code> în repo-ul <strong>local</strong> <code>libs-release-local</code>, cu checksum-urile lui (SHA-1, SHA-256).</p>
<p>Regula esențială: o <strong>versiune de release nu se suprascrie</strong>. Dacă cineva încearcă să urce alt conținut sub 1.8.0, primește eroare. Așa, „1.8.0” înseamnă mereu exact aceiași bytes.</p>`,
 en:`<p>Tests pass. <code>mvn deploy</code> uploads <code>orders-api-1.8.0.jar</code> to the <strong>local</strong> repo <code>libs-release-local</code>, with its checksums (SHA-1, SHA-256).</p>
<p>The essential rule: a <strong>release version is never overwritten</strong>. If someone tries to upload different content under 1.8.0, they get an error. That way "1.8.0" always means exactly the same bytes.</p>`},
 more:{ro:`<p>Artifactory stochează fișierele după <strong>checksum</strong>, nu după nume. Dacă același jar apare în cinci repo-uri, pe disc există o singură copie. De aceea copierea și mutarea între repo-uri sunt instantanee.</p>`,
  en:`<p>Artifactory stores files by <strong>checksum</strong>, not by name. If the same jar appears in five repos, there's a single copy on disk. That's why copying and moving between repos is instant.</p>`}},

{at:"art",frame:A4,kind:"p",move:[[["ci","art"]]],log:{ro:"imagine Docker",en:"Docker image"},who:"Docker",
 title:{ro:"Imaginea Docker: doar stratul nou urcă",en:"The Docker image: only the new layer is uploaded"},
 body:{ro:`<p>CI-ul construiește imaginea și face <code>docker push artifactory.example.com/docker-dev-local/orders-api:1.8.0</code>.</p>
<p>O imagine e făcută din <strong>straturi</strong>. Patru (sistemul de bază și Java) există deja în Artifactory, de la alte imagini; urcă doar stratul nou, cu jar-ul (12 MB). Imaginea are un <strong>digest</strong> (sha256) care o identifică exact, indiferent de tag.</p>`,
 en:`<p>CI builds the image and runs <code>docker push artifactory.example.com/docker-dev-local/orders-api:1.8.0</code>.</p>
<p>An image is made of <strong>layers</strong>. Four (the base OS and Java) are already in Artifactory, from other images; only the new layer, with the jar (12 MB), is uploaded. The image has a <strong>digest</strong> (sha256) that identifies it exactly, whatever the tag.</p>`}},

{at:"art",frame:A5,kind:"p",move:[[["ci","art"]]],log:{ro:"build info",en:"build info"},who:"Build info",
 title:{ro:"Build info: rețeta imaginii",en:"Build info: the image's recipe"},
 body:{ro:`<p>La final, CI-ul publică și <strong>build info</strong> (cu JFrog CLI: <code>jf rt build-publish</code>): ce dependențe au intrat (toate 63, cu checksum), ce artefacte au ieșit, din ce commit, din ce job CI și cu ce variabile.</p>
<p>Peste un an, când cineva întreabă „imaginea din producție conține biblioteca X?”, răspunsul e o căutare, nu o arheologie.</p>`,
 en:`<p>At the end, CI also publishes <strong>build info</strong> (with the JFrog CLI: <code>jf rt build-publish</code>): which dependencies went in (all 63, with checksums), which artifacts came out, from which commit, which CI job and with which variables.</p>
<p>A year from now, when someone asks "does the production image contain library X?", the answer is a search, not archaeology.</p>`},
 try:[{cmd:"jf rt build-publish orders-api 412",d:{ro:"Publică build info pentru build-ul 412.",en:"Publishes build info for build 412."}}]},

{at:"xray",frame:A6,kind:"s",move:[[["art","xray"]],[["xray","art"]]],marks:{art:{k:"drop",t:{ro:"blocat",en:"blocked"}}},log:{ro:"Xray blochează",en:"Xray blocks"},who:"Xray",
 title:{ro:"Xray găsește o vulnerabilitate critică",en:"Xray finds a critical vulnerability"},
 body:{ro:`<p><strong>JFrog Xray</strong> scanează fiecare artefact nou, inclusiv straturile imaginii și dependențele din build info. Găsește o bibliotecă de logging cu un <strong>CVE critic</strong>.</p>
<p>Politica firmei spune: artefactele cu vulnerabilități critice <strong>nu pot fi descărcate</strong>. Imaginea 1.8.0 rămâne în docker-dev-local, dar niciun cluster nu o poate lua. Echipa primește alerta cu versiunea care repară problema.</p>`,
 en:`<p><strong>JFrog Xray</strong> scans every new artifact, including image layers and the dependencies listed in build info. It finds a logging library with a <strong>critical CVE</strong>.</p>
<p>The company policy says: artifacts with critical vulnerabilities <strong>cannot be downloaded</strong>. Image 1.8.0 stays in docker-dev-local, but no cluster can pull it. The team gets an alert with the version that fixes the issue.</p>`}},

{at:"art",frame:A7,kind:"s",move:[[["art","xray"]],[["xray","art"]]],tables:["repos"],hl:{repos:"docker-prod-local"},log:{ro:"promovare",en:"promotion"},who:{ro:"Promovare",en:"Promotion"},
 title:{ro:"Promovarea: aceiași bytes, fără rebuild",en:"Promotion: the same bytes, no rebuild"},
 body:{ro:`<p>Echipa actualizează biblioteca și scoate 1.8.1. Xray: curat. Testele din mediul de staging trec.</p>
<p>Acum imaginea e <strong>promovată</strong>: mutată (sau copiată) din <code>docker-dev-local</code> în <code>docker-prod-local</code> (<code>jf rt build-promote</code>). Nu se reconstruiește nimic: <strong>digest-ul e identic</strong>, deci în producție ajunge exact ce a fost testat.</p>
<p class="key">Repo-urile devin etape: dev → staging → prod. Doar procesul de promovare are voie să scrie în prod.</p>`,
 en:`<p>The team updates the library and ships 1.8.1. Xray: clean. Staging tests pass.</p>
<p>Now the image is <strong>promoted</strong>: moved (or copied) from <code>docker-dev-local</code> to <code>docker-prod-local</code> (<code>jf rt build-promote</code>). Nothing is rebuilt: <strong>the digest is identical</strong>, so production gets exactly what was tested.</p>
<p class="key">Repos become stages: dev → staging → prod. Only the promotion process may write to prod.</p>`}},

{at:"k8s",frame:A8,kind:"p",move:[[["art","k8s"]]],log:{ro:"pull în Kubernetes",en:"pull into Kubernetes"},who:"Kubernetes",
 title:{ro:"Kubernetes descarcă imaginea",en:"Kubernetes pulls the image"},
 body:{ro:`<p>În lecția GitOps, un PR schimbă tag-ul în 1.8.1. Nodurile Kubernetes descarcă imaginea din <code>artifactory.example.com/docker-virtual</code>, cu un <strong>imagePullSecret</strong> care conține un token <strong>doar de citire</strong>.</p>
<p>Clusterul de producție vede numai imagini promovate și curate. Iar dacă vrei siguranță maximă, în manifest pui imaginea după <strong>digest</strong> (<code>@sha256:7e22…</code>), nu doar după tag.</p>`,
 en:`<p>In the GitOps lesson, a PR changes the tag to 1.8.1. The Kubernetes nodes pull the image from <code>artifactory.example.com/docker-virtual</code>, with an <strong>imagePullSecret</strong> holding a <strong>read-only</strong> token.</p>
<p>The production cluster sees only promoted, clean images. For maximum safety, the manifest references the image by <strong>digest</strong> (<code>@sha256:7e22…</code>), not just by tag.</p>`}},

{at:"art",frame:null,kind:"none",tables:["repos"],who:{ro:"Administrare",en:"Administration"},
 title:{ro:"Drepturi, token-uri și curățenie",en:"Permissions, tokens and cleanup"},
 body:{ro:`<p>Câteva reguli care țin Artifactory sănătos:</p>
<ul><li><strong>Drepturi pe repo</strong>: CI-ul scrie în dev, doar promovarea scrie în prod, toată lumea citește prin repo-urile virtuale.</li>
<li><strong>Token-uri de acces</strong> cu durată limitată în loc de parole, câte unul pe sistem (CI, cluster), ușor de revocat.</li>
<li><strong>Curățenie</strong>: snapshot-urile și imaginile de dev mai vechi de 30 de zile, nedescărcate, se șterg automat. Release-urile din prod rămân.</li>
<li><strong>Același model pentru toate formatele</strong>: npm, PyPI, NuGet, Helm, Go: un remote pentru registry-ul public, un local, un virtual peste ele.</li></ul>`,
 en:`<p>A few rules that keep Artifactory healthy:</p>
<ul><li><strong>Per-repo permissions</strong>: CI writes to dev, only promotion writes to prod, everyone reads through the virtual repos.</li>
<li><strong>Access tokens</strong> with a limited lifetime instead of passwords, one per system (CI, cluster), easy to revoke.</li>
<li><strong>Cleanup</strong>: dev snapshots and images older than 30 days that nobody downloaded are deleted automatically. Prod releases stay.</li>
<li><strong>The same model for every format</strong>: npm, PyPI, NuGet, Helm, Go: a remote for the public registry, a local, and a virtual on top.</li></ul>`}},

{at:["ci","art","k8s"],frame:null,kind:"none",summary:true,tables:["types"],
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<ul><li><strong>Remote</strong> = cache pentru internet; <strong>local</strong> = ce producem; <strong>virtual</strong> = o adresă peste ele.</li>
<li>Build-urile vorbesc doar cu Artifactory; dependențele vin din cache după prima descărcare.</li>
<li>Versiunile de release <strong>nu se suprascriu</strong>; fișierele sunt identificate prin <strong>checksum</strong> / <strong>digest</strong>.</li>
<li><strong>Build info</strong> = ce a intrat și ce a ieșit dintr-un build.</li>
<li><strong>Xray</strong> scanează și poate bloca descărcarea artefactelor vulnerabile.</li>
<li><strong>Promovare</strong> între repo-uri, fără rebuild: în prod ajunge exact ce s-a testat.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<ul><li><strong>Remote</strong> = a cache for the internet; <strong>local</strong> = what we build; <strong>virtual</strong> = one address over them.</li>
<li>Builds only talk to Artifactory; dependencies come from the cache after the first download.</li>
<li>Release versions are <strong>never overwritten</strong>; files are identified by <strong>checksum</strong> / <strong>digest</strong>.</li>
<li><strong>Build info</strong> = what went into and came out of a build.</li>
<li><strong>Xray</strong> scans and can block downloads of vulnerable artifacts.</li>
<li><strong>Promotion</strong> between repos, without rebuilding: prod gets exactly what was tested.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  return `<div class="ref-grid"><section class="card refcard"><h2>Maven: settings.xml</h2>
