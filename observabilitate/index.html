steps:[
{at:["api","co","pay"],frame:null,kind:"none",tables:["three"],
 title:{ro:"Monitorizare vs. observabilitate",en:"Monitoring vs observability"},
 body:{ro:`<p><strong>Monitorizarea</strong> răspunde la întrebări pe care le-ai pus dinainte: „e serverul pornit?”, „e CPU-ul peste 90%?”. <strong>Observabilitatea</strong> înseamnă să poți răspunde la întrebări <em>noi</em>, despre probleme pe care nu le-ai prevăzut, doar din datele pe care sistemul le produce deja.</p>
<p>Pentru asta, fiecare serviciu emite trei semnale (tabelul din dreapta). În exemplu, aplicația are trei servicii (api-gateway, checkout, payments) și o bază de date. Telemetria lor e colectată cu <strong>OpenTelemetry</strong>, standardul deschis folosit azi de aproape toate uneltele.</p>`,
 en:`<p><strong>Monitoring</strong> answers questions you asked in advance: "is the server up?", "is CPU above 90%?". <strong>Observability</strong> means being able to answer <em>new</em> questions, about problems you didn't foresee, using only the data the system already produces.</p>
<p>For that, each service emits three signals (table on the right). In the example the app has three services (api-gateway, checkout, payments) and a database. Their telemetry is collected with <strong>OpenTelemetry</strong>, the open standard almost every tool uses today.</p>`}},

{at:"api",frame:F1,kind:"req",move:[[["usr","api"]]],fx:[["spans","POST /checkout","api-gateway","0 ms",{ro:"1 900 ms",en:"1,900 ms"}]],tables:["spans"],log:{ro:"clientul → api-gateway",en:"customer → api-gateway"},who:"api-gateway",
 title:{ro:"Cererea intră: începe un trace",en:"The request arrives: a trace begins"},
 body:{ro:`<p>Clientul trimite <code>POST /checkout</code>. Biblioteca OpenTelemetry din api-gateway vede că cererea nu are context de trace și creează unul:</p>
<ul><li>un <strong>trace_id</strong> de 128 de biți, același pentru toată călătoria cererii prin sistem;</li>
<li>un <strong>span</strong>: o operație cu început, durată, nume și atribute (metodă, rută, status). Primul e <strong>span-ul rădăcină</strong>.</li></ul>
<p>Span-urile se adună într-un <strong>waterfall</strong> (tabelul din dreapta), care crește la fiecare pas.</p>`,
 en:`<p>The customer sends <code>POST /checkout</code>. The OpenTelemetry library in api-gateway sees the request has no trace context and creates one:</p>
<ul><li>a 128-bit <strong>trace_id</strong>, the same for the request's whole journey through the system;</li>
<li>a <strong>span</strong>: an operation with a start, duration, name and attributes (method, route, status). The first one is the <strong>root span</strong>.</li></ul>
<p>Spans add up to a <strong>waterfall</strong> (table on the right), which grows at every step.</p>`}},

{at:"api",frame:F2,kind:"req",move:[[["api","co"]]],fx:[["spans","POST /v1/orders","checkout","40 ms",{ro:"1 850 ms",en:"1,850 ms"}]],tables:["spans"],log:{ro:"api-gateway → checkout",en:"api-gateway → checkout"},who:"api-gateway",
 title:{ro:"Propagarea: antetul traceparent",en:"Propagation: the traceparent header"},
 body:{ro:`<p>api-gateway cheamă checkout. Ca trace-ul să continue, adaugă la cerere antetul standard W3C <strong>traceparent</strong>:</p>
<p class="key"><code>00-{trace_id}-{span_id al apelantului}-01</code></p>
<p>Checkout citește antetul și își creează propriul span, <strong>copil</strong> al celui din api-gateway: același trace_id, alt span_id, iar „părintele” e span-ul care l-a chemat. Ultimul <code>01</code> înseamnă „acest trace e eșantionat, păstrează-l”.</p>
<p>Dacă un serviciu din mijloc nu transmite antetul, trace-ul se rupe în două bucăți fără legătură. Bibliotecile OpenTelemetry îl transmit automat pentru clienții HTTP, gRPC și Kafka obișnuiți.</p>`,
 en:`<p>api-gateway calls checkout. To continue the trace it adds the standard W3C <strong>traceparent</strong> header to the request:</p>
<p class="key"><code>00-{trace_id}-{caller's span_id}-01</code></p>
<p>Checkout reads the header and creates its own span, a <strong>child</strong> of api-gateway's: the same trace_id, a different span_id, and its "parent" is the span that called it. The trailing <code>01</code> means "this trace is sampled, keep it".</p>
<p>If a service in the middle doesn't pass the header on, the trace breaks into two unrelated pieces. OpenTelemetry libraries pass it automatically for common HTTP, gRPC and Kafka clients.</p>`}},

{at:"pay",frame:F3,kind:"req",move:[[["co","pay"]],[["pay","db"]]],fx:[["spans","POST /v1/charge","payments","70 ms",{ro:"1 820 ms",en:"1,820 ms"}],["spans","SQL UPDATE payments","payments → PostgreSQL","75 ms",{ro:"1 740 ms ⚠",en:"1,740 ms ⚠"}]],tables:["spans"],hl:{spans:"SQL UPDATE payments"},log:{ro:"checkout → payments → DB",en:"checkout → payments → DB"},who:"payments",
 title:{ro:"Unde se duce timpul: un span de 1,7 secunde",en:"Where the time goes: a 1.7-second span"},
 body:{ro:`<p>Checkout cheamă payments, care face un <code>UPDATE</code> în baza de date. Biblioteca pentru driverul SQL creează automat un span și pentru interogare.</p>
<p>Waterfall-ul (dreapta) spune deja povestea: din cele 1 900 ms ale cererii, <strong>1 740 ms</strong> sunt petrecute așteptând baza de date. Restul serviciilor sunt rapide. Fără trace, ai fi văzut doar „checkout e lent” și ai fi căutat în locul greșit.</p>`,
 en:`<p>Checkout calls payments, which runs an <code>UPDATE</code> on the database. The SQL driver instrumentation automatically creates a span for the query too.</p>
<p>The waterfall (right) already tells the story: of the request's 1,900 ms, <strong>1,740 ms</strong> are spent waiting for the database. The other services are fast. Without a trace you'd only have seen "checkout is slow" and looked in the wrong place.</p>`}},

{at:["api","co","pay"],frame:FX,kind:"exp",move:[[["api","col"],["co","col"],["pay","col"]],[["col","sto"]]],log:{ro:"span-uri spre Collector → Tempo",en:"spans to the Collector → Tempo"},who:"OTel Collector",
 title:{ro:"Span-urile pleacă la Collector, apoi la Tempo",en:"Spans go to the Collector, then to Tempo"},
 body:{ro:`<p>Serviciile nu scriu direct în baza de trace-uri. Trimit span-urile, în loturi, prin protocolul <strong>OTLP</strong> la <strong>OpenTelemetry Collector</strong>, un proces separat care:</p>
<ul><li>primește de la toate serviciile, în orice limbaj;</li>
<li>adaugă informații (pod, nod, namespace) și șterge date sensibile;</li>
<li>decide ce păstrează (<strong>sampling</strong>) și trimite mai departe la <strong>Tempo</strong> (sau Jaeger, sau un furnizor comercial).</li></ul>
<p><strong>Tail sampling</strong>: Collector-ul așteaptă trace-ul întreg și păstrează toate erorile și cererile lente, dar doar 10% din cele normale. Costă mai puțin și nu pierzi exact trace-urile interesante.</p>`,
 en:`<p>Services don't write straight into the trace store. They send spans, in batches, over the <strong>OTLP</strong> protocol to the <strong>OpenTelemetry Collector</strong>, a separate process that:</p>
<ul><li>receives from every service, in any language;</li>
<li>adds information (pod, node, namespace) and strips sensitive data;</li>
<li>decides what to keep (<strong>sampling</strong>) and forwards to <strong>Tempo</strong> (or Jaeger, or a commercial vendor).</li></ul>
<p><strong>Tail sampling</strong>: the Collector waits for the whole trace and keeps every error and slow request, but only 10% of normal ones. It costs less and you don't lose exactly the interesting traces.</p>`}},

{at:"pay",frame:FM,kind:"met",move:[[["pay","col"]],[["col","prom"]]],tables:["q"],log:{ro:"metrici spre Prometheus",en:"metrics to Prometheus"},who:"Prometheus",
 title:{ro:"Metrici: histograme și percentile",en:"Metrics: histograms and percentiles"},
 body:{ro:`<p>Pe lângă span-uri, fiecare serviciu ține <strong>contoare</strong> în memorie: câte cereri, câte erori și o <strong>histogramă</strong> a duratelor, adică în câte cereri au durat ≤ 50 ms, ≤ 100 ms, ≤ 500 ms, ≤ 1 s… Prometheus le citește periodic și le păstrează ca serii de timp.</p>
<p>Media e înșelătoare: dacă 98 de cereri durează 100 ms și 2 durează 10 s, media e ~300 ms și pare totul bine. De aceea se urmăresc <strong>percentile</strong>: <strong>p99</strong> = 99% din cereri sunt mai rapide de atât. Interogările din dreapta (PromQL) calculează cele trei semnale <strong>RED</strong>: Rate, Errors, Duration.</p>`,
 en:`<p>Besides spans, each service keeps <strong>counters</strong> in memory: how many requests, how many errors, and a <strong>histogram</strong> of durations, i.e. how many requests took ≤ 50 ms, ≤ 100 ms, ≤ 500 ms, ≤ 1 s… Prometheus reads them periodically and stores them as time series.</p>
<p>The average is misleading: if 98 requests take 100 ms and 2 take 10 s, the average is ~300 ms and everything looks fine. That's why you track <strong>percentiles</strong>: <strong>p99</strong> = 99% of requests are faster than this. The queries on the right (PromQL) compute the three <strong>RED</strong> signals: Rate, Errors, Duration.</p>`},
 more:{ro:`<p>Fiecare combinație diferită de etichete e o serie separată în Prometheus. Etichete ca <code>route</code> sau <code>status</code> au câteva valori; una ca <code>user_id</code> sau <code>order_id</code> ar crea milioane de serii (<strong>cardinalitate</strong> mare) și ar umple memoria. Lucrurile unice per cerere merg în trace-uri și log-uri, nu în etichete de metrici.</p>`,
  en:`<p>Every distinct label combination is a separate series in Prometheus. Labels like <code>route</code> or <code>status</code> have a few values; one like <code>user_id</code> or <code>order_id</code> would create millions of series (high <strong>cardinality</strong>) and fill memory. Things unique per request belong in traces and logs, not metric labels.</p>`}},

{at:"pay",frame:FL,kind:"log",move:[[["pay","col"]],[["col","sto"]]],log:{ro:"log de eroare → Loki",en:"error log → Loki"},who:"payments",
 title:{ro:"Log-uri structurate, cu trace_id",en:"Structured logs, with trace_id"},
 body:{ro:`<p>Payments scrie un log de eroare. Nu e o propoziție liberă, ci un obiect <strong>JSON</strong> cu câmpuri: nivel, serviciu, mesaj, cât a așteptat și, important, <strong>trace_id</strong>-ul cererii curente.</p>
<p>Aplicația scrie doar la <code>stdout</code>. Un agent de pe fiecare nod (Collector, Promtail, Fluent Bit) citește log-urile containerelor și le trimite la <strong>Loki</strong>.</p>
<p class="key">Cu trace_id în fiecare log poți sări direct de la un trace lent la exact log-urile acelei cereri, din toate serviciile, în loc să cauți după oră printre milioane de linii.</p>`,
 en:`<p>Payments writes an error log. It's not a free-form sentence but a <strong>JSON</strong> object with fields: level, service, message, how long it waited and, importantly, the current request's <strong>trace_id</strong>.</p>
<p>The app only writes to <code>stdout</code>. An agent on each node (Collector, Promtail, Fluent Bit) reads the containers' logs and ships them to <strong>Loki</strong>.</p>
<p class="key">With the trace_id in every log you can jump straight from a slow trace to exactly that request's logs, across all services, instead of searching by time through millions of lines.</p>`}},

{at:"graf",frame:FA,kind:"alert",move:[[["prom","graf"]]],log:{ro:"alerta pornește",en:"the alert fires"},who:"Alertmanager",
 title:{ro:"SLO, buget de erori și o alertă care contează",en:"SLO, error budget and an alert that matters"},
 body:{ro:`<p>Echipa nu alertează la „CPU peste 80%”: asta nu spune dacă suferă clienții. Alertează pe un <strong>SLO</strong> (Service Level Objective): „99% din cererile /checkout răspund în sub 500 ms, pe 30 de zile”.</p>
<p>Restul de 1% e <strong>bugetul de erori</strong>: cât îți permiți să greșești. Alerta urmărește <strong>burn rate</strong>-ul, adică cât de repede se consumă bugetul. 1× înseamnă exact la limită; acum e 14×, deci în ~2 zile s-ar termina tot bugetul pe o lună. Prometheus evaluează regula, iar <strong>Alertmanager</strong> trimite alerta echipei de gardă.</p>`,
 en:`<p>The team doesn't alert on "CPU above 80%": that doesn't say whether customers are suffering. It alerts on an <strong>SLO</strong> (Service Level Objective): "99% of /checkout requests respond in under 500 ms, over 30 days".</p>
<p>The remaining 1% is the <strong>error budget</strong>: how much you can afford to get wrong. The alert tracks the <strong>burn rate</strong>, how fast the budget is being used up. 1× means exactly at the limit; it's 14× now, so the whole month's budget would be gone in ~2 days. Prometheus evaluates the rule and <strong>Alertmanager</strong> pages the on-call team.</p>`}},

{at:["graf","prom","sto"],frame:null,kind:"none",tables:["inv"],who:{ro:"Echipa de gardă",en:"The on-call team"},
 title:{ro:"Investigația: de la alertă la cauză în 5 minute",en:"The investigation: from alert to cause in 5 minutes"},
 body:{ro:`<p>Inginerul de gardă deschide Grafana și urmează firul (tabelul din dreapta):</p>
<ol><li><strong>Metricile</strong> spun <em>ce</em> și <em>când</em>: p99 a crescut brusc la 09:30, doar pentru payments.</li>
<li>Un <strong>exemplar</strong> (un trace_id atașat unui punct din grafic) duce la un <strong>trace</strong> lent, care spune <em>unde</em>: interogarea SQL.</li>
<li><strong>Log-urile</strong> acelui trace spun <em>de ce</em>: „lock wait timeout”.</li>
<li>Metricile bazei de date și lista de deploy-uri arată cine blochează tabela: un job de raportare nou.</li></ol>
<p>Jobul e oprit, p99 revine la 300 ms, alerta se închide. Urmează un <strong>postmortem</strong> fără vinovați: jobul se mută pe o replică de citire.</p>`,
 en:`<p>The on-call engineer opens Grafana and follows the thread (table on the right):</p>
<ol><li><strong>Metrics</strong> say <em>what</em> and <em>when</em>: p99 jumped at 09:30, for payments only.</li>
<li>An <strong>exemplar</strong> (a trace_id attached to a point on the graph) leads to a slow <strong>trace</strong>, which says <em>where</em>: the SQL query.</li>
<li>That trace's <strong>logs</strong> say <em>why</em>: "lock wait timeout".</li>
<li>The database metrics and the deploy list show who's locking the table: a new reporting job.</li></ol>
<p>The job is stopped, p99 goes back to 300 ms, the alert resolves. Then a blameless <strong>postmortem</strong>: the job moves to a read replica.</p>`}},

{at:["col","prom","sto"],frame:null,kind:"none",who:{ro:"Capcane",en:"Pitfalls"},
 title:{ro:"Capcane: cost, cardinalitate, date personale",en:"Pitfalls: cost, cardinality, personal data"},
 body:{ro:`<ul><li><strong>Costul</strong> crește cu volumul: log-urile la nivel DEBUG în producție și trace-urile 100% pot costa mai mult decât aplicația. Folosește niveluri de log, sampling și retenție diferită (metrici 1 an, trace-uri 7 zile, log-uri 30 de zile).</li>
<li><strong>Cardinalitatea</strong>: o etichetă cu valori unice (ID-uri, URL-uri complete) poate prăbuși Prometheus.</li>
<li><strong>Date personale</strong>: parole, tokenuri, carduri sau e-mailuri ajunse în log-uri și trace-uri sunt o problemă de securitate și GDPR. Filtrează-le în aplicație și în Collector.</li>
<li><strong>Alertele zgomotoase</strong>: dacă pagerul sună pentru lucruri care nu afectează clienții, oamenii încep să-l ignore. Alertează pe simptome (SLO), nu pe cauze posibile.</li></ul>`,
 en:`<ul><li><strong>Cost</strong> grows with volume: DEBUG-level logs in production and 100% traces can cost more than the app. Use log levels, sampling and different retention (metrics 1 year, traces 7 days, logs 30 days).</li>
<li><strong>Cardinality</strong>: one label with unique values (IDs, full URLs) can bring Prometheus down.</li>
<li><strong>Personal data</strong>: passwords, tokens, cards or emails that end up in logs and traces are a security and GDPR problem. Filter them in the app and in the Collector.</li>
<li><strong>Noisy alerts</strong>: if the pager rings for things that don't affect customers, people start ignoring it. Alert on symptoms (SLOs), not on possible causes.</li></ul>`}},

{at:["api","co","pay","graf"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<div class="flow"><span>metrici: ce + când</span><i>→</i><span>trace: unde</span><i>→</i><span>log-uri: de ce</span></div>
<ul><li>Trei semnale: <strong>metrici</strong> (ieftine, agregate), <strong>trace-uri</strong> (drumul unei cereri), <strong>log-uri</strong> (detaliile).</li>
<li>Un trace = span-uri cu același <strong>trace_id</strong>, legate prin antetul <strong>traceparent</strong>.</li>
<li><strong>OpenTelemetry</strong> instrumentează aplicațiile; <strong>Collector</strong>-ul adună, filtrează, eșantionează și trimite mai departe.</li>
<li>Pentru latență, urmărește <strong>percentile</strong> (p99) din histograme, nu media.</li>
<li>Pune <strong>trace_id</strong> în log-uri ca să poți trece de la un semnal la altul.</li>
<li>Alertează pe <strong>SLO</strong> și burn rate, nu pe CPU.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Mergi la test ↓</button></p>`,
 en:`<div class="flow"><span>metrics: what + when</span><i>→</i><span>trace: where</span><i>→</i><span>logs: why</span></div>
<ul><li>Three signals: <strong>metrics</strong> (cheap, aggregated), <strong>traces</strong> (one request's path), <strong>logs</strong> (the details).</li>
<li>A trace = spans sharing a <strong>trace_id</strong>, linked by the <strong>traceparent</strong> header.</li>
<li><strong>OpenTelemetry</strong> instruments the apps; the <strong>Collector</strong> gathers, filters, samples and forwards.</li>
<li>For latency, watch <strong>percentiles</strong> (p99) from histograms, not the average.</li>
<li>Put the <strong>trace_id</strong> in logs so you can move from one signal to another.</li>
<li>Alert on <strong>SLOs</strong> and burn rate, not on CPU.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Go to the quiz ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  let h=`<div class="ref-grid"><section class="card refcard"><h2>${ro?"Regulă de alertă pe SLO (Prometheus)":"An SLO alert rule (Prometheus)"}</h2>
<pre class="yaml">groups:
- name: checkout-slo
  rules:
  - alert: CheckoutLatencySLO
    <span class="c"># ${ro?"fracția de cereri peste 500 ms, ultima oră":"share of requests over 500 ms, last hour"}</span>
    expr: |
      (1 - sum(rate(http_server_request_duration_seconds_bucket{route="/checkout",le="0.5"}[1h]))
         / sum(rate(http_server_request_duration_seconds_count{route="/checkout"}[1h])))
      &gt; 14 * 0.01
    for: 5m
    labels: { severity: page }
    annotations:
      summary: "${ro?"Checkout consumă bugetul de erori de 14× mai repede":"Checkout is burning its error budget 14× too fast"}"</pre></section>`;
  h+=`<section class="card refcard"><h2>${ro?"LogQL și un Collector minim":"LogQL and a minimal Collector"}</h2>
<pre class="yaml"><span class="c"># ${ro?"Loki: toate log-urile unei cereri":"Loki: all logs of one request"}</span>
{namespace="shop"} | json | trace_id="4bf92f3577b34da6a3ce929d0e0e4736"
<span class="c"># ${ro?"erori pe minut, pe serviciu":"errors per minute, per service"}</span>
sum by (service) (count_over_time({namespace="shop"} | json | level="error" [1m]))

<span class="c"># otel-collector.yaml</span>
receivers: { otlp: { protocols: { grpc: {}, http: {} } } }
processors:
  batch: {}
  tail_sampling:
    policies:
    - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
    - { name: slow, type: latency, latency: { threshold_ms: 1000 } }
    - { name: rest, type: probabilistic, probabilistic: { sampling_percentage: 10 } }
exporters: { otlp/tempo: { endpoint: tempo:4317 } }
service:
  pipelines:
    traces: { receivers: [otlp], processors: [tail_sampling, batch], exporters: [otlp/tempo] }</pre></section></div>`;
  return h;
},

 {q:{ro:"Ce semnal îți spune cel mai bine UNDE se pierde timpul într-o cerere anume?",en:"Which signal best tells you WHERE the time goes in a specific request?"},o:[{ro:"Trace-ul",en:"The trace"},{ro:"Utilizarea CPU",en:"CPU usage"},{ro:"Numărul de cereri pe secundă",en:"Requests per second"},{ro:"Uptime-ul",en:"Uptime"}],a:0,e:{ro:"Waterfall-ul span-urilor arată durata fiecărei operații.",en:"The span waterfall shows each operation's duration."}},
