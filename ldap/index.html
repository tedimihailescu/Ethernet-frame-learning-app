steps:[
{at:["dir"],frame:null,kind:"none",tables:["dit"],who:{ro:"Directorul",en:"The directory"},
 title:{ro:"Directorul: un arbore cu oamenii firmei",en:"The directory: a tree of the company's people"},
 body:{ro:`<p>O firmă are sute de aplicații, dar o singură listă de angajați. Lista stă într-un <strong>director</strong>: o bază de date specială, optimizată pentru citit repede, pe care o întrebi prin protocolul <strong>LDAP</strong>.</p>
<p>Directorul e un <strong>arbore</strong>. Fiecare intrare are o adresă unică, <strong>DN</strong>-ul, citită de la frunză spre rădăcină:</p>
<div class="flow"><span>uid=ana</span><i>→</i><span>ou=People</span><i>→</i><span>dc=example,dc=com</span></div>
<p>Adică: „Ana, din unitatea People, din domeniul example.com”. Fiecare intrare are <strong>atribute</strong> (nume, mail, grupuri) și o hash a parolei, pe care aplicațiile <strong>nu</strong> o pot citi.</p>`,
 en:`<p>A company has hundreds of apps but a single list of employees. The list lives in a <strong>directory</strong>: a special database optimised for fast reads, which you query using the <strong>LDAP</strong> protocol.</p>
<p>The directory is a <strong>tree</strong>. Every entry has a unique address, its <strong>DN</strong>, read from the leaf to the root:</p>
<div class="flow"><span>uid=ana</span><i>→</i><span>ou=People</span><i>→</i><span>dc=example,dc=com</span></div>
<p>Meaning: "Ana, in the People unit, in the example.com domain". Each entry has <strong>attributes</strong> (name, mail, groups) and a hash of the password, which apps can <strong>not</strong> read.</p>`},
 more:{ro:`<p><code>dc</code> = domain component, <code>ou</code> = organizational unit, <code>cn</code> = common name, <code>uid</code> = user id. În Active Directory, utilizatorii stau de obicei în <code>CN=Users</code> sau în OU-uri create de firmă, iar numele de login e în atributul <code>sAMAccountName</code>.</p>`,
  en:`<p><code>dc</code> = domain component, <code>ou</code> = organizational unit, <code>cn</code> = common name, <code>uid</code> = user id. In Active Directory users usually sit in <code>CN=Users</code> or in company-made OUs, and the login name is in the <code>sAMAccountName</code> attribute.</p>`}},

{at:"ana",frame:H1,kind:"h",move:[[["ana","app"]]],log:{ro:"Ana → portal",en:"Ana → portal"},who:"Ana",
 title:{ro:"Ana trimite numele și parola portalului",en:"Ana sends her name and password to the portal"},
 body:{ro:`<p>Ana deschide <code>portal.example.com</code>, scrie <code>ana</code> și parola, apasă „Intră”. Browserul trimite un <strong>POST</strong> prin <strong>HTTPS</strong>, deci parola călătorește criptat (vezi <a href="../https/index.html">lecția HTTPS</a>).</p>
<p class="key">Important: portalul <strong>nu are</strong> o tabelă cu parole. Nu le salvează și nu le compară singur. Le trimite la director să fie verificate.</p>`,
 en:`<p>Ana opens <code>portal.example.com</code>, types <code>ana</code> and her password and clicks "Sign in". The browser sends a <strong>POST</strong> over <strong>HTTPS</strong>, so the password travels encrypted (see the <a href="../https/index.html">HTTPS lesson</a>).</p>
<p class="key">Important: the portal does <strong>not</strong> have a password table. It doesn't store passwords or compare them itself. It sends them to the directory to be checked.</p>`}},

{at:"app",frame:T1,kind:"t",move:[[["app","dir"]]],log:{ro:"portal → director: TLS",en:"portal → directory: TLS"},who:{ro:"Portal",en:"Portal"},
 title:{ro:"Portalul deschide o conexiune sigură spre director",en:"The portal opens a secure connection to the directory"},
 body:{ro:`<p>Portalul deschide o conexiune TCP spre <code>ldap.example.com</code> pe portul <strong>636</strong> (<strong>LDAPS</strong> = LDAP în TLS) și face negocierea TLS.</p>
<p>Portalul <strong>verifică certificatul</strong> directorului: e emis de CA-ul intern al firmei, în care portalul are încredere (în truststore-ul Java). Dacă n-ar verifica, un atacator din rețea s-ar putea da drept director și ar primi parolele tuturor.</p>`,
 en:`<p>The portal opens a TCP connection to <code>ldap.example.com</code> on port <strong>636</strong> (<strong>LDAPS</strong> = LDAP inside TLS) and does the TLS handshake.</p>
<p>The portal <strong>checks the directory's certificate</strong>: it's issued by the company's internal CA, which the portal trusts (in the Java truststore). If it didn't check, an attacker on the network could pose as the directory and collect everyone's passwords.</p>`},
 more:{ro:`<p>Alternativa e portul <strong>389</strong> cu <strong>StartTLS</strong>: conexiunea începe necriptată, apoi clientul cere trecerea la TLS. Pe 389 <em>fără</em> StartTLS, parolele trec în clar. Despre truststore și CA intern, vezi <a href="../certificate/index.html">lecția Certificate</a>.</p>`,
  en:`<p>The alternative is port <strong>389</strong> with <strong>StartTLS</strong>: the connection starts unencrypted, then the client asks to upgrade to TLS. On 389 <em>without</em> StartTLS, passwords travel in the clear. For truststores and internal CAs, see the <a href="../certificate/index.html">Certificates lesson</a>.</p>`},
 try:[{cmd:"openssl s_client -connect ldap.example.com:636 -showcerts",d:{ro:"Vezi certificatul directorului și cine l-a emis.",en:"See the directory's certificate and who issued it."}}]},

{at:"app",frame:B1,kind:"l",move:[[["app","dir"]],[["dir","app"]]],log:{ro:"bind cont de serviciu",en:"service-account bind"},who:{ro:"Portal",en:"Portal"},
 title:{ro:"Bind 1: portalul se prezintă cu contul lui de serviciu",en:"Bind 1: the portal identifies itself with its service account"},
 body:{ro:`<p>În LDAP, a te autentifica se numește <strong>bind</strong>. Ca să aibă voie să caute în director, portalul face bind cu <strong>contul lui de serviciu</strong>, <code>cn=svc-portal</code>, și parola lui (ținută într-un seif de secrete, nu în cod).</p>
<p>Directorul răspunde <code>BindResponse: 0 success</code>. Contul de serviciu are doar drept de <strong>citire</strong> și doar în zonele de care are nevoie: principiul celui mai mic privilegiu.</p>`,
 en:`<p>In LDAP, authenticating is called a <strong>bind</strong>. To be allowed to search the directory, the portal binds with its <strong>service account</strong>, <code>cn=svc-portal</code>, and its password (kept in a secrets vault, not in the code).</p>
<p>The directory answers <code>BindResponse: 0 success</code>. The service account only has <strong>read</strong> rights, and only where it needs them: the principle of least privilege.</p>`}},

{at:"app",frame:S1,kind:"l",move:[[["app","dir"]]],log:{ro:"caută utilizatorul",en:"search for the user"},tables:["dit"],hl:{dit:"ou=People,"+BASE},who:{ro:"Portal",en:"Portal"},
 title:{ro:"Căutare: „care e DN-ul lui ana?”",en:"Search: \"what is ana's DN?\""},
 body:{ro:`<p>Ana a scris doar <code>ana</code>, dar ca să-i verifice parola, directorul are nevoie de <strong>DN-ul complet</strong>. Portalul trimite un <strong>SearchRequest</strong>:</p>
<ul><li><strong>base</strong>: de unde începe căutarea, <code>ou=People,dc=example,dc=com</code>;</li>
<li><strong>scope</strong> <code>sub</code>: în tot subarborele;</li>
<li><strong>filtru</strong> <code>(&amp;(objectClass=person)(uid=ana))</code>: „o persoană cu uid ana” (<code>&amp;</code> = și);</li>
<li><strong>atribute</strong>: doar ce-i trebuie: nume, mail, grupuri.</li></ul>`,
 en:`<p>Ana only typed <code>ana</code>, but to check her password the directory needs her <strong>full DN</strong>. The portal sends a <strong>SearchRequest</strong>:</p>
<ul><li><strong>base</strong>: where the search starts, <code>ou=People,dc=example,dc=com</code>;</li>
<li><strong>scope</strong> <code>sub</code>: the whole subtree;</li>
<li><strong>filter</strong> <code>(&amp;(objectClass=person)(uid=ana))</code>: "a person with uid ana" (<code>&amp;</code> = and);</li>
<li><strong>attributes</strong>: only what it needs: name, mail, groups.</li></ul>`},
 try:[{cmd:"ldapsearch -x -H ldaps://ldap.example.com -D \"cn=svc-portal,ou=Services,dc=example,dc=com\" -W -b \"ou=People,dc=example,dc=com\" \"(uid=ana)\" cn mail memberOf",d:{ro:"Aceeași căutare din terminal.",en:"The same search from a terminal."}}]},

{at:"dir",frame:S1r,kind:"l",move:[[["dir","app"]]],log:{ro:"rezultatul căutării",en:"search result"},tables:["dit"],hl:{dit:ANA},who:{ro:"Director",en:"Directory"},
 title:{ro:"Directorul o găsește pe Ana",en:"The directory finds Ana"},
 body:{ro:`<p>Răspunsul vine în două mesaje: un <strong>SearchResultEntry</strong> cu DN-ul și atributele cerute, apoi <strong>SearchResultDone</strong> cu codul <code>0</code>.</p>
<p>Portalul știe acum: DN = <code>uid=ana,ou=People,dc=example,dc=com</code>, numele „Ana Pop” și că e în grupul <code>portal-admins</code>.</p>
<p>Dacă nu găsea nimic (0 rezultate), portalul ar fi răspuns „utilizator sau parolă greșită”, fără să spună <em>care</em> din ele, ca să nu ajute un atacator să ghicească nume.</p>`,
 en:`<p>The answer comes in two messages: a <strong>SearchResultEntry</strong> with the DN and the requested attributes, then <strong>SearchResultDone</strong> with code <code>0</code>.</p>
<p>The portal now knows: DN = <code>uid=ana,ou=People,dc=example,dc=com</code>, the name "Ana Pop", and that she's in the <code>portal-admins</code> group.</p>
<p>Had it found nothing (0 entries), the portal would answer "wrong username or password", without saying <em>which</em>, so as not to help an attacker guess names.</p>`}},

{at:"app",frame:B2,kind:"l",move:[[["app","dir"]],[["dir","app"]]],log:{ro:"bind ca Ana",en:"bind as Ana"},who:{ro:"Portal",en:"Portal"},
 title:{ro:"Bind 2: chiar verificarea parolei",en:"Bind 2: the actual password check"},
 body:{ro:`<p>Acum vine trucul: portalul face un al doilea <strong>bind</strong>, de data asta <strong>ca Ana</strong>: DN-ul ei plus parola pe care a tastat-o.</p>
<p>Directorul calculează hash-ul parolei primite și îl compară cu cel salvat. Răspunsul <code>0 success</code> înseamnă: <strong>parola e corectă</strong>. Portalul n-a văzut niciodată hash-ul și n-a salvat parola nicăieri.</p>
<p class="key">Modelul se numește <strong>search, then bind</strong>: caută cu contul de serviciu, verifică cu bind-ul utilizatorului.</p>`,
 en:`<p>Now comes the trick: the portal does a second <strong>bind</strong>, this time <strong>as Ana</strong>: her DN plus the password she typed.</p>
<p>The directory hashes the received password and compares it with the stored one. The answer <code>0 success</code> means: <strong>the password is correct</strong>. The portal never saw the hash and never stored the password anywhere.</p>
<p class="key">The pattern is called <strong>search, then bind</strong>: search with the service account, verify with the user's bind.</p>`},
 more:{ro:`<p>După verificare, portalul face din nou bind cu contul de serviciu (sau folosește altă conexiune din pool), ca următoarele căutări să nu ruleze cu drepturile Anei.</p>`,
  en:`<p>After the check, the portal binds again as the service account (or uses another pooled connection), so later searches don't run with Ana's rights.</p>`}},

{at:"app",frame:H2,kind:"h",move:[[["app","ana"]]],log:{ro:"portal → Ana: sesiune",en:"portal → Ana: session"},tables:["roles"],hl:{roles:"cn=portal-admins"},who:{ro:"Portal",en:"Portal"},
 title:{ro:"Grupurile devin drepturi, Ana primește o sesiune",en:"Groups become permissions, Ana gets a session"},
 body:{ro:`<p>Portalul transformă grupurile din director în <strong>roluri</strong> proprii: <code>portal-admins</code> → <code>ROLE_ADMIN</code>. Așa, adminii portalului se schimbă din director, fără deploy.</p>
<p>Apoi creează o <strong>sesiune</strong> și îi trimite Anei un cookie <code>SESSION</code> (HttpOnly, Secure). La următoarele cereri, portalul nu mai întreabă directorul: îi ajunge cookie-ul, până expiră sesiunea.</p>`,
 en:`<p>The portal turns the directory groups into its own <strong>roles</strong>: <code>portal-admins</code> → <code>ROLE_ADMIN</code>. That way the portal's admins are changed in the directory, without a deploy.</p>
<p>Then it creates a <strong>session</strong> and sends Ana a <code>SESSION</code> cookie (HttpOnly, Secure). On later requests the portal no longer asks the directory: the cookie is enough, until the session expires.</p>`}},

{at:["app","dir"],frame:B3,kind:"l",tables:["codes"],hl:{codes:"49"},log:{ro:"parolă greșită",en:"wrong password"},who:{ro:"Când nu merge",en:"When it fails"},
 title:{ro:"Parolă greșită: cod 49",en:"Wrong password: code 49"},
 body:{ro:`<p>A doua zi, Ana greșește parola. Bind-ul ca Ana primește <code>49 invalidCredentials</code>. Active Directory adaugă un mesaj de diagnostic cu detalii: <code>data 52e</code> = parolă greșită, <code>data 775</code> = cont blocat, <code>data 532</code> = parolă expirată.</p>
<p>Portalul afișează doar „utilizator sau parolă greșită”, dar <strong>scrie în log</strong> codul exact, pentru suport. După câteva încercări greșite, directorul poate <strong>bloca</strong> contul, ca protecție contra ghicirii parolelor.</p>`,
 en:`<p>The next day Ana mistypes her password. The bind as Ana gets <code>49 invalidCredentials</code>. Active Directory adds a diagnostic message with details: <code>data 52e</code> = wrong password, <code>data 775</code> = account locked, <code>data 532</code> = password expired.</p>
<p>The portal only shows "wrong username or password", but <strong>logs</strong> the exact code for support. After a few wrong attempts the directory may <strong>lock</strong> the account, to protect against password guessing.</p>`}},

{at:["app"],frame:null,kind:"none",who:{ro:"Securitate",en:"Security"},
 title:{ro:"Trei greșeli care deschid ușa oricui",en:"Three mistakes that open the door to anyone"},
 body:{ro:`<ul><li><strong>Parola goală</strong>: în LDAP, un bind cu DN dar <em>fără</em> parolă e un „unauthenticated bind” și multe servere răspund <code>0 success</code>! Portalul trebuie să refuze parolele goale <em>înainte</em> de bind.</li>
<li><strong>Injecția LDAP</strong>: dacă numele tastat intră direct în filtru, cineva poate scrie <code>*)(uid=*</code> și schimba sensul căutării. Caracterele <code>* ( ) \\ NUL</code> trebuie escapate (bibliotecile o fac, dacă le folosești corect).</li>
<li><strong>LDAP necriptat</strong>: pe portul 389 fără StartTLS, parolele trec în clar prin rețea.</li></ul>`,
 en:`<ul><li><strong>Empty password</strong>: in LDAP a bind with a DN but <em>no</em> password is an "unauthenticated bind", and many servers answer <code>0 success</code>! The portal must reject empty passwords <em>before</em> binding.</li>
<li><strong>LDAP injection</strong>: if the typed name goes straight into the filter, someone can type <code>*)(uid=*</code> and change what the search means. The characters <code>* ( ) \\ NUL</code> must be escaped (libraries do this if used correctly).</li>
<li><strong>Unencrypted LDAP</strong>: on port 389 without StartTLS, passwords cross the network in the clear.</li></ul>`},
 more:{ro:`<p>Alte bune practici: cont de serviciu doar cu citire, timeout-uri scurte la conexiune (dacă directorul e lent, login-ul nu trebuie să blocheze toate firele aplicației), pool de conexiuni și mai multe servere de director în configurație, pentru failover.</p>`,
  en:`<p>Other good practice: a read-only service account, short connection timeouts (if the directory is slow, login mustn't block all of the app's threads), a connection pool and several directory servers in the configuration, for failover.</p>`}},

{at:["ana","app","dir"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<ul><li>Un <strong>director LDAP</strong> e un arbore de intrări; fiecare are un <strong>DN</strong> unic și atribute.</li>
<li>Aplicația <strong>nu ține parole</strong>: le verifică în director.</li>
<li>Fluxul: TLS → <strong>bind</strong> cont de serviciu → <strong>search</strong> după uid → <strong>bind</strong> ca utilizator (parola) → grupuri → roluri → sesiune.</li>
<li>Cod <code>0</code> = succes, <code>49</code> = credențiale greșite.</li>
<li>Folosește <strong>LDAPS (636)</strong> sau StartTLS, refuză parolele goale și escapează filtrele.</li>
<li>În <strong>Active Directory</strong>: login în <code>sAMAccountName</code> sau <code>userPrincipalName</code>, grupuri în <code>memberOf</code>.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">${"Mergi la laborator ↓"}</button></p>`,
 en:`<ul><li>An <strong>LDAP directory</strong> is a tree of entries; each has a unique <strong>DN</strong> and attributes.</li>
<li>The app <strong>keeps no passwords</strong>: it checks them in the directory.</li>
<li>The flow: TLS → <strong>bind</strong> as the service account → <strong>search</strong> by uid → <strong>bind</strong> as the user (password) → groups → roles → session.</li>
<li>Code <code>0</code> = success, <code>49</code> = wrong credentials.</li>
<li>Use <strong>LDAPS (636)</strong> or StartTLS, reject empty passwords and escape filters.</li>
<li>In <strong>Active Directory</strong>: the login is in <code>sAMAccountName</code> or <code>userPrincipalName</code>, groups in <code>memberOf</code>.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],
