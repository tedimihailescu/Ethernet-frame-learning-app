steps:[
{at:["b1","b2","b3"],frame:null,kind:"none",tables:["topic"],who:{ro:"Ideea",en:"The idea"},
 title:{ro:"Kafka: un jurnal în care toți scriu și din care toți citesc",en:"Kafka: a log everyone writes to and reads from"},
 body:{ro:`<p>Când un client plasează o comandă, trebuie să afle mai multe servicii: plăți, e-mail, stoc, statistici. Dacă serviciul de comenzi le-ar chema pe toate pe rând, ar depinde de fiecare (vezi <a href="../microservicii/index.html">lecția Microservicii</a>).</p>
<p>Cu <strong>Kafka</strong>, serviciul de comenzi scrie un singur <strong>eveniment</strong> într-un <strong>topic</strong>, <code>orders</code>, și atât. Cine e interesat citește din topic, în ritmul lui.</p>
<p>Un topic e împărțit în <strong>partiții</strong>. Fiecare partiție e un <strong>jurnal</strong> în care mesajele se adaugă doar la coadă și primesc un număr crescător: <strong>offset</strong>-ul. Partițiile sunt împărțite între <strong>brokeri</strong> (serverele Kafka).</p>`,
 en:`<p>When a customer places an order, several services need to know: payments, email, stock, analytics. If the order service called each in turn, it would depend on all of them (see the <a href="../microservicii/index.html">Microservices lesson</a>).</p>
<p>With <strong>Kafka</strong>, the order service writes a single <strong>event</strong> to a <strong>topic</strong>, <code>orders</code>, and that's it. Whoever is interested reads from the topic, at its own pace.</p>
<p>A topic is split into <strong>partitions</strong>. Each partition is a <strong>log</strong> where messages are only appended at the end and get an increasing number: the <strong>offset</strong>. Partitions are spread across <strong>brokers</strong> (the Kafka servers).</p>`}},

{at:"prod",frame:R0,kind:"r",log:{ro:"producătorul alege partiția",en:"producer picks the partition"},who:"order-service",
 title:{ro:"Producătorul: cheia alege partiția",en:"The producer: the key picks the partition"},
 body:{ro:`<p>order-service creează un <strong>record</strong>: o <strong>cheie</strong> (<code>c-77</code>, clientul), o <strong>valoare</strong> (JSON-ul comenzii) și câteva <strong>headers</strong> (de ex. <code>traceparent</code> pentru tracing).</p>
<p>Partiția se alege din cheie: <code>hash("c-77") % 3 = 1</code>. Toate comenzile clientului c-77 ajung mereu în <strong>aceeași partiție</strong>.</p>
<p class="key">De ce contează: Kafka garantează ordinea <strong>doar în interiorul unei partiții</strong>. Cu aceeași cheie, comenzile lui c-77 vor fi citite exact în ordinea în care au fost scrise.</p>`,
 en:`<p>order-service creates a <strong>record</strong>: a <strong>key</strong> (<code>c-77</code>, the customer), a <strong>value</strong> (the order JSON) and a few <strong>headers</strong> (e.g. <code>traceparent</code> for tracing).</p>
<p>The partition comes from the key: <code>hash("c-77") % 3 = 1</code>. Every order from customer c-77 always lands in the <strong>same partition</strong>.</p>
<p class="key">Why it matters: Kafka guarantees order <strong>only within a partition</strong>. With the same key, c-77's orders will be read in exactly the order they were written.</p>`},
 more:{ro:`<p>Fără cheie, producătorul împarte mesajele între partiții ca să echilibreze încărcarea (sticky partitioner), dar pierzi ordinea între ele. O cheie prea „populară” (de ex. un client uriaș) face o partiție fierbinte.</p>`,
  en:`<p>Without a key, the producer spreads messages across partitions to balance load (the sticky partitioner), but you lose ordering between them. An overly "popular" key (e.g. one huge customer) makes a hot partition.</p>`}},

{at:"prod",frame:R1,kind:"r",move:[[["prod","b2"]]],tables:["topic"],hl:{topic:"orders-1"},log:{ro:"spre liderul p1",en:"to the p1 leader"},who:"order-service",
 title:{ro:"Trimis direct liderului partiției",en:"Sent straight to the partition's leader"},
 body:{ro:`<p>Fiecare partiție are un broker <strong>lider</strong>: doar el primește scrieri pentru partiția aceea. Producătorul a aflat din <strong>metadata</strong> clusterului că liderul pentru <code>orders-1</code> e <strong>broker-2</strong> și îi trimite record-ul direct.</p>
<p>Producătorul cere <code>acks=all</code>: „confirmă-mi doar după ce mesajul e pe toate replicile sincronizate”. Cu <code>enable.idempotence=true</code>, dacă trimite de două ori din cauza unui timeout, brokerul păstrează o singură copie.</p>`,
 en:`<p>Each partition has a <strong>leader</strong> broker: only it accepts writes for that partition. The producer learned from the cluster <strong>metadata</strong> that the leader for <code>orders-1</code> is <strong>broker-2</strong> and sends it the record directly.</p>
<p>The producer asks for <code>acks=all</code>: "acknowledge only once the message is on every in-sync replica". With <code>enable.idempotence=true</code>, if it sends twice because of a timeout, the broker keeps a single copy.</p>`},
 try:[{cmd:"kafka-console-producer.sh --bootstrap-server broker-1:9092 --topic orders --property parse.key=true --property key.separator=:",d:{ro:"Scrii „c-77:{...}” și apeși Enter: un record cu cheie.",en:"Type \"c-77:{...}\" and press Enter: a keyed record."}}]},

{at:"b2",frame:R2,kind:"r",move:[[["b2","b1"],["b2","b3"]]],tables:["log1"],hl:{log1:3},log:{ro:"replicare pe b1, b3",en:"replicated to b1, b3"},who:"broker-2",
 title:{ro:"Liderul scrie la offset 7, replicile copiază",en:"The leader writes at offset 7, the replicas copy"},
 body:{ro:`<p>Broker-2 adaugă record-ul la coada jurnalului <code>orders-1</code>: primește <strong>offset-ul 7</strong>. Mesajul e scris pe disc, nu doar în memorie.</p>
<p>Topic-ul are <strong>factor de replicare 3</strong>: broker-1 și broker-3 sunt <strong>urmăritori</strong> (followers) și își copiază continuu partiția de la lider. Replicile care sunt la zi formează <strong>ISR</strong>-ul (in-sync replicas).</p>`,
 en:`<p>Broker-2 appends the record to the end of the <code>orders-1</code> log: it gets <strong>offset 7</strong>. The message is written to disk, not just kept in memory.</p>
<p>The topic has <strong>replication factor 3</strong>: broker-1 and broker-3 are <strong>followers</strong> that continuously copy the partition from the leader. The replicas that are up to date form the <strong>ISR</strong> (in-sync replicas).</p>`}},

{at:"b2",frame:R3,kind:"a",move:[[["b2","prod"]]],log:{ro:"ack → producător",en:"ack → producer"},who:"broker-2",
 title:{ro:"acks=all: confirmarea vine după ce toate replicile îl au",en:"acks=all: the acknowledgement comes once every replica has it"},
 body:{ro:`<p>Când broker-1 și broker-3 au confirmat copia, liderul răspunde producătorului: <strong>scris</strong>. Acum mesajul e pe trei servere; dacă pică unul, nu se pierde.</p>
<p>Setarea pereche e <code>min.insync.replicas=2</code>: dacă rămân mai puțin de 2 replici la zi, brokerul <strong>refuză</strong> scrierile cu acks=all, în loc să riște pierderea datelor.</p>
<ul><li><code>acks=0</code>: nu aștepți nimic (rapid, poți pierde).</li><li><code>acks=1</code>: doar liderul (pierzi dacă liderul pică imediat).</li><li><code>acks=all</code>: toate ISR (sigur).</li></ul>`,
 en:`<p>Once broker-1 and broker-3 have confirmed their copy, the leader replies to the producer: <strong>written</strong>. The message now lives on three servers; if one fails, it isn't lost.</p>
<p>The companion setting is <code>min.insync.replicas=2</code>: if fewer than 2 replicas are in sync, the broker <strong>rejects</strong> acks=all writes rather than risk losing data.</p>
<ul><li><code>acks=0</code>: wait for nothing (fast, may lose data).</li><li><code>acks=1</code>: the leader only (lost if the leader dies right away).</li><li><code>acks=all</code>: every ISR replica (safe).</li></ul>`}},

{at:"pay1",frame:R4,kind:"r",move:[[["b2","pay1"]]],tables:["assign"],hl:{assign:"payment-1"},log:{ro:"payment-1 citește",en:"payment-1 reads"},who:"payment-1",
 title:{ro:"Consumer group: partițiile se împart între instanțe",en:"Consumer group: partitions are split between instances"},
 body:{ro:`<p>Serviciul de plăți rulează în <strong>două instanțe</strong>, amândouă în <strong>consumer group</strong>-ul <code>payment-service</code>. Kafka împarte partițiile între ele: payment-1 are partițiile 0 și 1, payment-2 are partiția 2.</p>
<p>Fiecare partiție e citită de <strong>un singur</strong> membru al grupului, deci comanda 1042 e procesată o singură dată, de payment-1. Consumatorul <strong>cere</strong> mesajele (poll); brokerul nu le împinge.</p>`,
 en:`<p>The payment service runs as <strong>two instances</strong>, both in the <code>payment-service</code> <strong>consumer group</strong>. Kafka splits the partitions between them: payment-1 owns partitions 0 and 1, payment-2 owns partition 2.</p>
<p>Each partition is read by <strong>exactly one</strong> member of the group, so order 1042 is processed once, by payment-1. The consumer <strong>pulls</strong> messages (poll); the broker doesn't push them.</p>`}},

{at:"pay1",frame:R5,kind:"c",move:[[["pay1","b2"]]],log:{ro:"commit offset 8",en:"commit offset 8"},who:"payment-1",
 title:{ro:"Procesează, apoi comite offset-ul",en:"Process, then commit the offset"},
 body:{ro:`<p>payment-1 încasează plata, apoi <strong>comite</strong> offset-ul <code>8</code>: „am terminat tot până la 7; data viitoare dă-mi de la 8”. Offset-urile comise se păstrează chiar în Kafka (topic-ul intern <code>__consumer_offsets</code>).</p>
<p>Ordinea contează: dacă payment-1 cade <em>după</em> plată dar <em>înainte</em> de commit, mesajul 7 va fi citit din nou. Asta e garanția <strong>at-least-once</strong>: niciun mesaj pierdut, dar uneori duplicate.</p>
<p class="key">De aceea consumatorii trebuie să fie <strong>idempotenți</strong>: aceeași comandă procesată de două ori trebuie să încaseze o singură dată (de ex. verifici orderId-ul în baza de date).</p>`,
 en:`<p>payment-1 charges the payment, then <strong>commits</strong> offset <code>8</code>: "I've finished everything up to 7; next time give me 8 onwards". Committed offsets are stored in Kafka itself (the internal <code>__consumer_offsets</code> topic).</p>
<p>Order matters: if payment-1 crashes <em>after</em> charging but <em>before</em> committing, message 7 will be read again. That's the <strong>at-least-once</strong> guarantee: no message lost, but sometimes duplicates.</p>
<p class="key">That's why consumers must be <strong>idempotent</strong>: the same order processed twice must charge only once (e.g. check the orderId in the database).</p>`}},

{at:"mail",frame:R6,kind:"r",move:[[["b2","mail"]]],tables:["assign"],hl:{assign:"email-1"},log:{ro:"email-1 citește același mesaj",en:"email-1 reads the same message"},who:"email-1",
 title:{ro:"Alt grup, aceeași comandă, offset-uri separate",en:"Another group, the same order, separate offsets"},
 body:{ro:`<p>Serviciul de e-mail e alt <strong>consumer group</strong>, <code>email-service</code>. El primește <strong>toate</strong> mesajele topic-ului, inclusiv comanda 1042, independent de plăți.</p>
<p>Fiecare grup are <strong>offset-urile lui</strong>. Email-ul e mai lent (la offset 5), dar nu încurcă pe nimeni: mesajele rămân în jurnal, nu se șterg când sunt citite.</p>
<p>Așa obții ambele modele: <strong>în interiorul</strong> unui grup, mesajele se împart (ca o coadă); <strong>între</strong> grupuri, fiecare primește tot (publish/subscribe).</p>`,
 en:`<p>The email service is another <strong>consumer group</strong>, <code>email-service</code>. It receives <strong>every</strong> message on the topic, including order 1042, independently of payments.</p>
<p>Each group has <strong>its own offsets</strong>. Email is slower (at offset 5), but it gets in nobody's way: messages stay in the log; reading doesn't delete them.</p>
<p>So you get both models: <strong>within</strong> a group, messages are shared out (like a queue); <strong>between</strong> groups, each gets everything (publish/subscribe).</p>`}},

{at:["pay1","pay2"],frame:null,kind:"none",tables:["lag"],hl:{lag:"orders-2"},who:"Lag",
 title:{ro:"Lag și scalare: câte instanțe ajută?",en:"Lag and scaling: how many instances help?"},
 body:{ro:`<p><strong>Lag</strong>-ul = ultimul offset din partiție − offset-ul comis. Pe <code>orders-2</code>, payment-2 are 6 mesaje în urmă: plățile întârzie. Lag-ul e metrica principală de urmărit (alertă dacă tot crește).</p>
<p>Soluția: mai multe instanțe. Pornești payment-3; grupul face un <strong>rebalance</strong> și reîmparte partițiile. Dar atenție:</p>
<p class="key">Paralelismul maxim al unui grup = numărul de partiții. Cu 3 partiții, a 4-a instanță ar sta degeaba. Alegi numărul de partiții gândindu-te la vârful de trafic.</p>`,
 en:`<p><strong>Lag</strong> = the partition's last offset − the committed offset. On <code>orders-2</code>, payment-2 is 6 messages behind: payments are delayed. Lag is the main metric to watch (alert if it keeps growing).</p>
<p>The fix: more instances. You start payment-3; the group does a <strong>rebalance</strong> and reassigns partitions. But note:</p>
<p class="key">A group's maximum parallelism = the number of partitions. With 3 partitions, a 4th instance would sit idle. Choose the partition count with peak traffic in mind.</p>`},
 try:[{cmd:"kafka-consumer-groups.sh --bootstrap-server broker-1:9092 --describe --group payment-service",d:{ro:"Vezi pe fiecare partiție: offset curent, ultimul offset și LAG.",en:"See for each partition: current offset, log end offset and LAG."}}]},

{at:"b2",frame:null,kind:"none",marks:{b2:{k:"drop",t:{ro:"căzut",en:"down"}}},who:{ro:"Pană",en:"Failure"},
 title:{ro:"Pică broker-2: alegerea unui lider nou",en:"Broker-2 fails: electing a new leader"},
 body:{ro:`<p>Broker-2 se oprește. Partiția <code>orders-1</code> rămâne fără lider. <strong>Controller</strong>-ul clusterului (în Kafka modern, quorum-ul <strong>KRaft</strong>; înainte, ZooKeeper) alege un lider nou <strong>din ISR</strong>: broker-3.</p>
<p>Producătorii și consumatorii primesc erori o clipă, își reîmprospătează metadata și continuă cu broker-3. Mesajul 7 nu s-a pierdut: era deja pe broker-3, datorită <code>acks=all</code>.</p>
<p>Dacă ISR-ul ar fi gol, Kafka ar aștepta (implicit <code>unclean.leader.election.enable=false</code>), în loc să aleagă o replică în urmă și să piardă mesaje.</p>`,
 en:`<p>Broker-2 stops. The <code>orders-1</code> partition has no leader. The cluster's <strong>controller</strong> (in modern Kafka the <strong>KRaft</strong> quorum; previously ZooKeeper) elects a new leader <strong>from the ISR</strong>: broker-3.</p>
<p>Producers and consumers get errors for a moment, refresh their metadata and carry on with broker-3. Message 7 wasn't lost: it was already on broker-3, thanks to <code>acks=all</code>.</p>
<p>If the ISR were empty, Kafka would wait (by default <code>unclean.leader.election.enable=false</code>) rather than elect a lagging replica and lose messages.</p>`}},

{at:["b1","b2","b3"],frame:null,kind:"none",summary:true,
 title:{ro:"Retenție, reluare și recapitulare",en:"Retention, replay and recap"},
 body:{ro:`<p>Mesajele nu se șterg când sunt citite, ci după <strong>retenție</strong> (de ex. 7 zile) sau, la topic-urile <strong>compactate</strong>, se păstrează ultima valoare pentru fiecare cheie. Poți <strong>relua</strong> evenimentele: muți offset-ul unui grup înapoi și le procesezi din nou.</p>
<ul><li><strong>Topic</strong> → <strong>partiții</strong> → mesaje cu <strong>offset</strong>; ordinea e garantată doar într-o partiție.</li>
<li><strong>Cheia</strong> alege partiția: aceeași cheie, aceeași partiție, aceeași ordine.</li>
<li>Scrierea merge la <strong>lider</strong>; replicile din <strong>ISR</strong> copiază; <code>acks=all</code> + <code>min.insync.replicas=2</code> = fără pierderi.</li>
<li>Un <strong>consumer group</strong> împarte partițiile; grupuri diferite primesc fiecare tot.</li>
<li>Commit după procesare = <strong>at-least-once</strong> → consumatori idempotenți. Urmărește <strong>lag</strong>-ul.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<p>Messages aren't deleted when read but after the <strong>retention</strong> period (e.g. 7 days) or, on <strong>compacted</strong> topics, the latest value per key is kept. You can <strong>replay</strong> events: move a group's offset back and process them again.</p>
<ul><li><strong>Topic</strong> → <strong>partitions</strong> → messages with an <strong>offset</strong>; ordering is only guaranteed within a partition.</li>
<li>The <strong>key</strong> picks the partition: same key, same partition, same order.</li>
<li>Writes go to the <strong>leader</strong>; <strong>ISR</strong> replicas copy; <code>acks=all</code> + <code>min.insync.replicas=2</code> = no loss.</li>
<li>A <strong>consumer group</strong> shares out the partitions; different groups each get everything.</li>
<li>Commit after processing = <strong>at-least-once</strong> → idempotent consumers. Watch the <strong>lag</strong>.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],
