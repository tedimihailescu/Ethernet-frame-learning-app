steps:[
{at:["dev","stg","prod"],frame:D1,kind:"d",tables:["why"],marks:{prod:{k:"drop",t:{ro:"subnet recreat",en:"subnet recreated"}}},log:{ro:"incidentul cu două laptopuri",en:"the two-laptop incident"},who:{ro:"Problema",en:"The problem"},
 title:{ro:"De ce: două laptopuri, două stări, un subnet stricat",en:"Why: two laptops, two states, a broken subnet"},
 body:{ro:`<p>La început, echipa Platformă rula Terraform de pe laptop. Fiecare avea chei AWS de admin și propriul <code>terraform.tfstate</code>.</p>
<p>Într-o marți, Maria schimbă un subnet al producției. În același minut, Dan face apply pentru altceva, dar cu o stare veche de o săptămână. Terraform-ul lui Dan nu știe de schimbarea Mariei și o „repară” la loc, recreând subnet-ul. Serviciile din el pierd conexiunea 4 minute.</p>
<p class="key">Problema nu e Terraform, ci <em>unde</em> rulează: stări diferite, apply-uri în paralel, chei de admin pe laptopuri și planuri pe care nu le-a văzut nimeni altcineva.</p>`,
 en:`<p>At first, the Platform team ran Terraform from their laptops. Everyone had admin AWS keys and their own <code>terraform.tfstate</code>.</p>
<p>One Tuesday, Maria changes a production subnet. In the same minute, Dan runs apply for something else, but with a week-old state. Dan's Terraform doesn't know about Maria's change and "fixes" it back, recreating the subnet. The services in it lose their connection for 4 minutes.</p>
<p class="key">The problem isn't Terraform, it's <em>where</em> it runs: different states, parallel applies, admin keys on laptops and plans nobody else saw.</p>`}},

{at:"st",frame:D2,kind:"d",log:{ro:"stare în S3",en:"state in S3"},who:{ro:"Starea remote",en:"Remote state"},
 title:{ro:"O singură stare, comună: backend-ul S3",en:"One shared state: the S3 backend"},
 body:{ro:`<p>Primul pas: starea pleacă de pe laptopuri. Un bloc <strong>backend "s3"</strong> spune unde stă:</p>
<ul><li><code>bucket = "acme-tfstate"</code>: un bucket dedicat, cu <strong>versionare</strong> (fiecare versiune a stării poate fi recuperată) și <strong>criptare</strong>;</li>
<li><code>key = "prod/terraform.tfstate"</code>: calea stării pentru acest mediu;</li>
<li><code>use_lockfile = true</code>: lock-ul se face printr-un fișier <code>.tflock</code> lângă stare, în același bucket.</li></ul>
<p>Cu <code>terraform init -migrate-state</code>, Terraform urcă starea locală în S3. Accesul la bucket îl au doar pipeline-ul și câțiva administratori: starea conține secrete.</p>`,
 en:`<p>Step one: the state leaves the laptops. A <strong>backend "s3"</strong> block says where it lives:</p>
<ul><li><code>bucket = "acme-tfstate"</code>: a dedicated bucket, with <strong>versioning</strong> (every version of the state can be recovered) and <strong>encryption</strong>;</li>
<li><code>key = "prod/terraform.tfstate"</code>: this environment's state path;</li>
<li><code>use_lockfile = true</code>: locking is done through a <code>.tflock</code> file next to the state, in the same bucket.</li></ul>
<p>With <code>terraform init -migrate-state</code>, Terraform uploads the local state to S3. Only the pipeline and a few administrators can access the bucket: the state holds secrets.</p>`},
 more:{ro:`<p>Până la Terraform 1.10, lock-ul pe S3 se făcea cu un tabel DynamoDB (<code>dynamodb_table</code>). Varianta aceea e acum depreciată, dar o vei vedea des în proiecte mai vechi. Alte backend-uri: Azure Blob, Google Cloud Storage, HCP Terraform.</p>`,
  en:`<p>Until Terraform 1.10, S3 locking used a DynamoDB table (<code>dynamodb_table</code>). That option is now deprecated, but you'll see it often in older projects. Other backends: Azure Blob, Google Cloud Storage, HCP Terraform.</p>`},
 try:[{cmd:"terraform init -migrate-state",d:{ro:"Mută starea în backend-ul nou.",en:"Moves the state to the new backend."}},{cmd:"terraform state pull | head",d:{ro:"Citește starea din S3.",en:"Reads the state from S3."}}]},

{at:"st",frame:D3,kind:"d",move:[[["ci","st"]]],marks:{st:{k:"drop",t:{ro:"ocupat",en:"locked"}}},log:{ro:"lock-ul oprește al doilea apply",en:"the lock stops the second apply"},who:"Lock",
 title:{ro:"Lock-ul: un singur apply odată",en:"The lock: one apply at a time"},
 body:{ro:`<p>Pipeline-ul rulează un apply pe producție. Dan, din obișnuință, pornește și el unul. Înainte să citească starea, Terraform încearcă să creeze fișierul de lock. Nu poate: există deja.</p>
<p><strong>Error acquiring the state lock</strong>. Mesajul spune cine ține lock-ul (<code>runner@ci-7</code>), ce operație face (<code>OperationTypeApply</code>) și de când.</p>
<p>Al doilea apply se oprește înainte să schimbe ceva. Exact incidentul de marți nu mai poate avea loc.</p>`,
 en:`<p>The pipeline is running an apply on production. Dan, out of habit, starts one too. Before reading the state, Terraform tries to create the lock file. It can't: it already exists.</p>
<p><strong>Error acquiring the state lock</strong>. The message says who holds the lock (<code>runner@ci-7</code>), what operation it's doing (<code>OperationTypeApply</code>) and since when.</p>
<p>The second apply stops before changing anything. Tuesday's incident can't happen any more.</p>`},
 more:{ro:`<p>Dacă un job e oprit brutal, lock-ul poate rămâne. Se șterge cu <code>terraform force-unlock &lt;ID&gt;</code>, dar doar după ce ești sigur că nu mai rulează nimic: altfel, două apply-uri scriu aceeași stare.</p>`,
  en:`<p>If a job is killed, the lock can be left behind. It's removed with <code>terraform force-unlock &lt;ID&gt;</code>, but only once you're sure nothing is running: otherwise two applies write the same state.</p>`}},

{at:"mod",frame:D4,kind:"d",move:[[["mod","ci"]]],tables:["mods"],hl:{mods:"network"},log:{ro:"module versionate",en:"versioned modules"},who:{ro:"Module",en:"Modules"},
 title:{ro:"Module: aceeași bucată de infrastructură, folosită peste tot",en:"Modules: the same piece of infrastructure, used everywhere"},
 body:{ro:`<p>Rețeaua din staging și cea din producție sunt aproape identice. În loc să copieze codul, echipa îl pune într-un <strong>modul</strong>: un folder Terraform cu intrări (<code>variable</code>) și ieșiri (<code>output</code>).</p>
<p>Modulele stau în repo-ul <code>tf-modules</code> și au <strong>versiuni</strong> (tag-uri Git). Mediile le cheamă cu o versiune fixă:</p>
<p><code>source = "git::https://git.example.com/platform/tf-modules.git//network?ref=v1.4.0"</code></p>
<p>O schimbare în modul ajunge într-un mediu doar când cineva mută versiunea, printr-un PR. Staging poate încerca v1.5.0 în timp ce producția rămâne pe v1.4.0.</p>`,
 en:`<p>The staging and production networks are almost identical. Instead of copying code, the team puts it in a <strong>module</strong>: a Terraform folder with inputs (<code>variable</code>) and outputs (<code>output</code>).</p>
<p>The modules live in the <code>tf-modules</code> repo and have <strong>versions</strong> (Git tags). Environments call them with a pinned version:</p>
<p><code>source = "git::https://git.example.com/platform/tf-modules.git//network?ref=v1.4.0"</code></p>
<p>A change to a module reaches an environment only when someone bumps the version, through a PR. Staging can try v1.5.0 while production stays on v1.4.0.</p>`},
 more:{ro:`<p>Există și module publice în registry, de exemplu <code>terraform-aws-modules/vpc/aws</code>. Sunt bune ca punct de plecare, dar fixează-le versiunea (<code>version = "~> 6.0"</code>) și citește ce creează: un modul public poate face mult mai multe decât ai nevoie.</p>`,
  en:`<p>There are public modules in the registry too, for example <code>terraform-aws-modules/vpc/aws</code>. They're a good starting point, but pin their version (<code>version = "~> 6.0"</code>) and read what they create: a public module can do far more than you need.</p>`}},

{at:["stg","prod"],frame:D5,kind:"d",tables:["envs"],hl:{envs:"envs/prod"},log:{ro:"un folder per mediu",en:"one folder per environment"},who:{ro:"Medii",en:"Environments"},
 title:{ro:"Un folder și o stare pentru fiecare mediu",en:"One folder and one state per environment"},
 body:{ro:`<p>Repo-ul <code>infra-live</code> are câte un folder pentru fiecare mediu: <code>envs/staging</code> și <code>envs/prod</code>. Fiecare are:</p>
<ul><li><code>backend.tf</code> cu <strong>altă cheie de stare</strong> (<code>staging/…</code>, <code>prod/…</code>);</li>
<li><code>main.tf</code>, care cheamă aceleași module;</li>
<li><code>terraform.tfvars</code> cu ce diferă: rețeaua, mărimea serverelor, numărul de replici.</li></ul>
<p class="key">Stări separate înseamnă că o greșeală în staging nu poate atinge producția, iar un plan pe staging nu are nevoie de acces la producție.</p>`,
 en:`<p>The <code>infra-live</code> repo has one folder per environment: <code>envs/staging</code> and <code>envs/prod</code>. Each one has:</p>
<ul><li><code>backend.tf</code> with <strong>a different state key</strong> (<code>staging/…</code>, <code>prod/…</code>);</li>
<li><code>main.tf</code>, which calls the same modules;</li>
<li><code>terraform.tfvars</code> with what differs: the network, the server sizes, the number of replicas.</li></ul>
<p class="key">Separate states mean a mistake in staging can't touch production, and a staging plan doesn't need access to production.</p>`},
 more:{ro:`<p>Terraform are și <strong>workspaces</strong> (<code>terraform workspace new staging</code>): același folder, mai multe stări. Sunt comode pentru medii temporare, dar ușor de încurcat: rulezi apply crezând că ești în staging și ești în prod. Pentru medii permanente, folderele separate sunt mai clare. Unelte ca <strong>Terragrunt</strong> reduc repetiția dintre foldere.</p>`,
  en:`<p>Terraform also has <strong>workspaces</strong> (<code>terraform workspace new staging</code>): one folder, several states. They're handy for temporary environments but easy to mix up: you run apply thinking you're in staging and you're in prod. For permanent environments, separate folders are clearer. Tools like <strong>Terragrunt</strong> cut the repetition between folders.</p>`}},

{at:"ci",frame:D6,kind:"d",move:[[["dev","git"]],[["git","ci"]],[["mod","ci"]]],tables:["checks"],hl:{checks:"trivy config"},log:{ro:"PR deschis, verificări",en:"PR opened, checks"},who:"Pull request",
 title:{ro:"Cererea: un cache Redis, prin pull request",en:"The request: a Redis cache, through a pull request"},
 body:{ro:`<p>Echipa Comenzi are nevoie de un cache Redis. Echipa Platformă adaugă un modul <code>cache</code> (ElastiCache, criptat, 2 replici) și îl cheamă din ambele medii. Nimeni nu rulează nimic de pe laptop: totul pleacă dintr-un <strong>pull request</strong>, <code>#212</code>.</p>
<p>La fiecare push, pipeline-ul pornește singur și rulează, în ordine, verificări rapide care nu au nevoie de AWS:</p>
<ul><li><code>terraform fmt -check</code> și <code>terraform validate</code>;</li>
<li><code>tflint</code>: de exemplu un tip de instanță care nu există;</li>
<li><code>trivy config</code>: probleme de securitate în cod, cum ar fi un cache fără criptare.</li></ul>`,
 en:`<p>The Orders team needs a Redis cache. The Platform team adds a <code>cache</code> module (ElastiCache, encrypted, 2 replicas) and calls it from both environments. Nobody runs anything from a laptop: it all starts from a <strong>pull request</strong>, <code>#212</code>.</p>
<p>On every push, the pipeline starts on its own and runs, in order, quick checks that don't need AWS:</p>
<ul><li><code>terraform fmt -check</code> and <code>terraform validate</code>;</li>
<li><code>tflint</code>: for example an instance type that doesn't exist;</li>
<li><code>trivy config</code>: security problems in the code, such as a cache without encryption.</li></ul>`},
 try:[{cmd:"terraform fmt -check -recursive",d:{ro:"Eșuează dacă vreun fișier nu e formatat.",en:"Fails if any file isn't formatted."}},{cmd:"tflint --recursive",d:{ro:"Caută greșeli și practici proaste.",en:"Looks for mistakes and bad practices."}},{cmd:"trivy config envs/prod",d:{ro:"Caută probleme de securitate.",en:"Looks for security problems."}}]},

{at:"iam",frame:D7,kind:"d",move:[[["ci","iam"]]],tables:["roles"],hl:{roles:"pull_request"},log:{ro:"acces AWS fără chei",en:"keyless AWS access"},who:"OIDC",
 title:{ro:"Acces la AWS fără chei: OIDC",en:"AWS access without keys: OIDC"},
 body:{ro:`<p>Ca să facă plan, pipeline-ul trebuie să citească din AWS. Dar nu mai există chei AWS salvate nicăieri. În loc de ele:</p>
<ol><li>platforma de CI dă job-ului un <strong>token OIDC</strong> semnat, care spune cine e: repo-ul <code>platform/infra-live</code>, evenimentul <code>pull_request</code>;</li>
<li>job-ul îl prezintă la AWS STS (<code>AssumeRoleWithWebIdentity</code>);</li>
<li>AWS verifică semnătura și condiția din rol, apoi dă credențiale temporare, valabile o oră, pentru rolul <strong>tf-plan</strong>, care poate doar să citească.</li></ol>
<p class="key">Un PR, chiar și unul rău intenționat, nu poate schimba nimic în AWS: rolul lui nu are drept de scriere.</p>`,
 en:`<p>To run a plan, the pipeline needs to read from AWS. But there are no stored AWS keys anywhere any more. Instead:</p>
<ol><li>the CI platform gives the job a signed <strong>OIDC token</strong> saying who it is: the <code>platform/infra-live</code> repo, the <code>pull_request</code> event;</li>
<li>the job presents it to AWS STS (<code>AssumeRoleWithWebIdentity</code>);</li>
<li>AWS checks the signature and the role's condition, then hands out temporary credentials, valid for an hour, for the <strong>tf-plan</strong> role, which can only read.</li></ol>
<p class="key">A PR, even a malicious one, can't change anything in AWS: its role has no write access.</p>`},
 more:{ro:`<p>Plan-ul are totuși nevoie să citească starea, care conține secrete. De aceea unele echipe nu rulează plan automat pe PR-uri din fork-uri sau de la necunoscuți.</p>`,
  en:`<p>A plan still needs to read the state, which holds secrets. That's why some teams don't run plans automatically on PRs from forks or from strangers.</p>`}},

{at:"ci",frame:D8,kind:"d",move:[[["ci","st"]],[["ci","stg"],["ci","prod"]],[["ci","git"]]],log:{ro:"planul postat în PR",en:"the plan posted in the PR"},who:{ro:"Planul în PR",en:"The plan in the PR"},
 title:{ro:"Planul ajunge în PR, verificat de politici",en:"The plan lands in the PR, checked by policies"},
 body:{ro:`<p>Pipeline-ul rulează <code>terraform plan</code> pentru fiecare mediu (pe PR, fără să ia lock-ul, pentru că nu scrie nimic) și postează rezultatul ca <strong>comentariu în PR</strong>:</p>
<p><strong>staging: 3 to add, 1 to change, 0 to destroy · prod: la fel.</strong></p>
<p>Planul trece apoi prin <strong>politici scrise ca și cod</strong> (OPA / conftest), aplicate pe JSON-ul planului: „orice cache sau bază de date trebuie să fie criptată”, „nimic nu se șterge în prod fără eticheta allow-destroy”. Aici toate trec.</p>
<p>Recenzenții nu mai citesc doar codul, ci și <em>efectul</em> lui: exact ce resurse se schimbă, în ce mediu.</p>`,
 en:`<p>The pipeline runs <code>terraform plan</code> for each environment (on a PR, without taking the lock, since it writes nothing) and posts the result as a <strong>PR comment</strong>:</p>
<p><strong>staging: 3 to add, 1 to change, 0 to destroy · prod: the same.</strong></p>
<p>The plan then goes through <strong>policies written as code</strong> (OPA / conftest), applied to the plan's JSON: "every cache or database must be encrypted", "nothing is deleted in prod without the allow-destroy label". Here they all pass.</p>
<p>Reviewers no longer read just the code but also its <em>effect</em>: exactly which resources change, in which environment.</p>`},
 more:{ro:`<p><code>terraform show -json tfplan</code> transformă planul în JSON, pe care îl pot citi uneltele de politici. HCP Terraform are propriul limbaj de politici, Sentinel; ideea e aceeași.</p>`,
  en:`<p><code>terraform show -json tfplan</code> turns the plan into JSON that policy tools can read. HCP Terraform has its own policy language, Sentinel; the idea is the same.</p>`}},

{at:"git",frame:D9,kind:"d",move:[[["rev","git"]]],log:{ro:"review și merge",en:"review and merge"},who:"Review",
 title:{ro:"Review: ce caută un om în plan",en:"Review: what a person looks for in the plan"},
 body:{ro:`<p>Doi colegi citesc PR-ul. Un review bun de infrastructură se uită mai ales la plan:</p>
<ul><li>există vreun <code>-</code> sau <code>-/+</code>? Pe ce? O bază de date, un bucket, un disc?</li>
<li>schimbările sunt doar cele așteptate? Aici: cache-ul (3 resurse noi) și o regulă nouă în security group-ul aplicației, portul <code>6379</code>, doar de la aplicație;</li>
<li>planul pentru prod e același ca pentru staging? Dacă nu, de ce?</li></ul>
<p>Totul e cum trebuie. PR-ul primește 2 aprobări (Platformă și Comenzi) și e îmbinat în <code>main</code>.</p>`,
 en:`<p>Two colleagues read the PR. A good infrastructure review looks mostly at the plan:</p>
<ul><li>is there any <code>-</code> or <code>-/+</code>? On what? A database, a bucket, a disk?</li>
<li>are the changes only the expected ones? Here: the cache (3 new resources) and a new rule in the app's security group, port <code>6379</code>, only from the app;</li>
<li>is the prod plan the same as staging's? If not, why?</li></ul>
<p>It's all as it should be. The PR gets 2 approvals (Platform and Orders) and is merged into <code>main</code>.</p>`}},

{at:"stg",frame:D10,kind:"d",move:[[["git","ci"]],[["ci","iam"]],[["ci","st"]],[["ci","stg"]]],marks:{stg:{k:"ok",t:"Redis ✓"}},log:{ro:"apply pe staging",en:"apply on staging"},who:"Apply staging",
 title:{ro:"Merge în main: apply automat pe staging",en:"Merged into main: an automatic apply on staging"},
 body:{ro:`<p>Merge-ul pornește job-ul <strong>terraform-apply staging</strong>:</p>
<ol><li>token OIDC cu <code>environment:staging</code> → rolul <strong>tf-apply-staging</strong>, care poate scrie doar în contul de staging;</li>
<li><code>terraform plan -out=tfplan</code>: ia lock-ul și salvează planul;</li>
<li><code>terraform apply tfplan</code>: aplică exact planul salvat, nimic în plus;</li>
<li>lock-ul e eliberat.</li></ol>
<p><strong>Apply complete! Resources: 3 added, 1 changed, 0 destroyed.</strong> Echipa Comenzi își testează aplicația cu Redis în staging.</p>`,
 en:`<p>The merge starts the <strong>terraform-apply staging</strong> job:</p>
<ol><li>an OIDC token with <code>environment:staging</code> → the <strong>tf-apply-staging</strong> role, which can only write to the staging account;</li>
<li><code>terraform plan -out=tfplan</code>: takes the lock and saves the plan;</li>
<li><code>terraform apply tfplan</code>: applies exactly the saved plan, nothing more;</li>
<li>the lock is released.</li></ol>
<p><strong>Apply complete! Resources: 3 added, 1 changed, 0 destroyed.</strong> The Orders team tests its app with Redis in staging.</p>`},
 more:{ro:`<p>Dacă între plan și apply altcineva a schimbat starea, apply-ul refuză: <strong>Saved plan is stale</strong>. E o protecție: nu aplici un plan calculat pe o realitate care nu mai există.</p>`,
  en:`<p>If someone changed the state between the plan and the apply, the apply refuses: <strong>Saved plan is stale</strong>. It's a safeguard: you don't apply a plan worked out against a reality that no longer exists.</p>`}},

{at:"prod",frame:D11,kind:"d",move:[[["rev","git"]],[["git","ci"]],[["ci","iam"]],[["ci","prod"]]],marks:{prod:{k:"ok",t:"Redis ✓"}},log:{ro:"aprobare și apply pe prod",en:"approval and apply on prod"},who:{ro:"Producția",en:"Production"},
 title:{ro:"Producția: un om aprobă după ce recitește planul",en:"Production: a person approves after re-reading the plan"},
 body:{ro:`<p>Job-ul pentru producție calculează planul și se oprește. Mediul <code>production</code> din CI are o regulă: <strong>aprobare obligatorie</strong> de la cineva din echipa Platformă, alta decât autorul.</p>
<p>Recenzentul deschide planul pentru prod, verifică din nou că e <em>3 to add, 1 to change, 0 to destroy</em> și apasă „Approve”. Abia atunci job-ul primește rolul <strong>tf-apply-prod</strong> (doar job-urile din mediul <code>production</code> îl pot lua) și aplică planul salvat.</p>
<p class="key">Între PR și producție, aceeași schimbare a trecut prin verificări, politici, două review-uri, staging și o aprobare. Și totul e în istoricul Git și al pipeline-ului.</p>`,
 en:`<p>The production job works out the plan and stops. The <code>production</code> environment in CI has a rule: a <strong>mandatory approval</strong> from someone on the Platform team other than the author.</p>
<p>The reviewer opens the prod plan, checks again that it's <em>3 to add, 1 to change, 0 to destroy</em> and clicks "Approve". Only then does the job get the <strong>tf-apply-prod</strong> role (only jobs in the <code>production</code> environment can take it) and apply the saved plan.</p>
<p class="key">Between the PR and production, the same change went through checks, policies, two reviews, staging and an approval. And all of it is in the Git and pipeline history.</p>`}},

{at:"prod",frame:D12,kind:"d",move:[[["ci","prod"]],[["ci","st"]]],marks:{prod:{k:"drop",t:{ro:"2 din 3",en:"2 of 3"}}},tables:["fail"],hl:{fail:0},log:{ro:"apply eșuat la jumătate",en:"apply failed halfway"},who:{ro:"Eșec",en:"Failure"},
 title:{ro:"Un apply eșuează la jumătate. Și acum?",en:"An apply fails halfway. Now what?"},
 body:{ro:`<p>O lună mai târziu, o altă schimbare adaugă un al doilea cache în prod. Apply-ul creează două resurse, apoi AWS refuză a treia: <strong>NodeQuotaForCustomerExceeded</strong>, contul a atins limita de noduri Redis.</p>
<p>Terraform <strong>nu face rollback</strong>. Dar nici nu pierde nimic: a salvat în stare fiecare resursă imediat ce a fost creată. Echipa cere AWS o limită mai mare, rulează din nou pipeline-ul, iar planul arată doar ce lipsește: <em>1 to add</em>.</p>
<p>Dacă o schimbare reușită strică ceva, rollback-ul e tot o schimbare: <code>git revert</code>, PR, plan, apply. Istoricul rămâne complet.</p>`,
 en:`<p>A month later, another change adds a second cache in prod. The apply creates two resources, then AWS refuses the third: <strong>NodeQuotaForCustomerExceeded</strong>, the account hit its Redis node limit.</p>
<p>Terraform <strong>doesn't roll back</strong>. But it doesn't lose anything either: it saved each resource to the state as soon as it was created. The team asks AWS for a higher limit, runs the pipeline again, and the plan shows only what's missing: <em>1 to add</em>.</p>
<p>If a successful change breaks something, the rollback is just another change: <code>git revert</code>, PR, plan, apply. The history stays complete.</p>`}},

{at:"prod",frame:D13,kind:"d",move:[[["ci","iam"]],[["ci","prod"]]],marks:{prod:{k:"drop",t:"drift"}},log:{ro:"drift găsit noaptea",en:"drift found overnight"},who:"Drift check",
 title:{ro:"În fiecare noapte: cine a schimbat ceva de mână?",en:"Every night: did anyone change something by hand?"},
 body:{ro:`<p>Chiar și cu pipeline, cineva tot mai poate schimba ceva din consolă în timpul unui incident. Așa că pipeline-ul are și un job programat, la 03:00, care rulează pentru fiecare mediu:</p>
<p><code>terraform plan -detailed-exitcode</code></p>
<p>Codul de ieșire spune tot: <strong>0</strong> = nicio diferență, <strong>1</strong> = eroare, <strong>2</strong> = realitatea diferă de cod. Azi-noapte a ieșit 2: cineva a deschis portul 22 spre internet. Echipa primește o alertă și decide: regula se șterge (apply) sau, dacă era necesară, intră în cod printr-un PR.</p>`,
 en:`<p>Even with a pipeline, someone can still change something in the console during an incident. So the pipeline also has a scheduled job, at 03:00, which runs for every environment:</p>
<p><code>terraform plan -detailed-exitcode</code></p>
<p>The exit code says it all: <strong>0</strong> = no difference, <strong>1</strong> = error, <strong>2</strong> = reality differs from the code. Last night it came out 2: someone opened port 22 to the internet. The team gets an alert and decides: the rule is removed (apply) or, if it was needed, it goes into the code through a PR.</p>`}},

{at:["git","ci","st","stg","prod"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare și unelte",en:"Recap and tools"},
 body:{ro:`<ul><li>Nu face apply de pe laptop: stări diferite, apply-uri în paralel, chei de admin.</li>
<li><strong>Starea remote</strong> (S3 cu versionare, criptare, <code>use_lockfile</code>) și <strong>lock</strong>: o stare, un apply odată.</li>
<li><strong>Module versionate</strong> și <strong>un folder / o stare per mediu</strong>.</li>
<li>Pe PR: fmt, validate, tflint, trivy, <strong>plan postat în PR</strong>, politici pe JSON-ul planului.</li>
<li><strong>OIDC</strong>: roluri temporare, separate pentru plan (citire) și apply (per mediu).</li>
<li>După merge: apply din <strong>planul salvat</strong> pe staging; în prod, după o <strong>aprobare</strong>.</li>
<li>Eșec la jumătate: repari și rulezi din nou. Rollback: <code>git revert</code>. Noaptea: <code>-detailed-exitcode</code> pentru drift.</li></ul>
<p>Același flux îl oferă gata făcut <strong>Atlantis</strong> (plan și apply din comentarii în PR), <strong>HCP Terraform</strong>, Spacelift sau env0.</p>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<ul><li>Don't apply from a laptop: different states, parallel applies, admin keys.</li>
<li><strong>Remote state</strong> (S3 with versioning, encryption, <code>use_lockfile</code>) and a <strong>lock</strong>: one state, one apply at a time.</li>
<li><strong>Versioned modules</strong> and <strong>one folder / one state per environment</strong>.</li>
<li>On a PR: fmt, validate, tflint, trivy, <strong>the plan posted in the PR</strong>, policies on the plan's JSON.</li>
<li><strong>OIDC</strong>: temporary roles, separate for plan (read) and apply (per environment).</li>
<li>After merge: apply the <strong>saved plan</strong> to staging; in prod, after an <strong>approval</strong>.</li>
<li>A halfway failure: fix and run again. Rollback: <code>git revert</code>. At night: <code>-detailed-exitcode</code> for drift.</li></ul>
<p>The same flow comes ready-made in <strong>Atlantis</strong> (plan and apply from PR comments), <strong>HCP Terraform</strong>, Spacelift or env0.</p>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  return `<div class="ref-grid"><section class="card refcard"><h2>${ro?"Repo-ul infra-live":"The infra-live repo"}</h2>
<pre class="yaml">infra-live/
├── envs/
│   ├── staging/
│   │   ├── backend.tf        <span class="c"># key = "staging/terraform.tfstate"</span>
│   │   ├── main.tf           <span class="c"># ${ro?"cheamă modulele":"calls the modules"}</span>
│   │   └── terraform.tfvars
│   └── prod/
│       ├── backend.tf        <span class="c"># key = "prod/terraform.tfstate"</span>
│       ├── main.tf
│       └── terraform.tfvars
├── policy/                   <span class="c"># ${ro?"reguli conftest (Rego)":"conftest rules (Rego)"}</span>
└── .github/workflows/terraform.yml</pre>
<h3>envs/prod/backend.tf</h3>
<pre class="yaml">terraform {
  backend "s3" {
    bucket       = "acme-tfstate"
    key          = "prod/terraform.tfstate"
    region       = "eu-central-1"
    encrypt      = true
    use_lockfile = true
  }
}</pre>
<h3>envs/prod/main.tf</h3>
<pre class="yaml">module "network" {
  source = "git::https://git.example.com/platform/tf-modules.git//network?ref=v1.4.0"
  cidr   = "10.30.0.0/16"
}
module "cache" {
  source     = "git::https://git.example.com/platform/tf-modules.git//cache?ref=v1.4.0"
  subnet_ids = module.network.private_subnet_ids
  node_type  = var.cache_node_type
}</pre></section>
<section class="card refcard"><h2>${ro?"Pipeline-ul (GitHub Actions, prescurtat)":"The pipeline (GitHub Actions, shortened)"}</h2>
<pre class="yaml">on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "0 3 * * *" }]   <span class="c"># drift check</span>
permissions: { id-token: write, contents: read, pull-requests: write }
jobs:
  plan:
    if: github.event_name == 'pull_request'
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: arn:aws:iam::111122223333:role/tf-plan, aws-region: eu-central-1 }
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=envs/prod init
      - run: terraform -chdir=envs/prod validate
      - run: terraform -chdir=envs/prod plan -lock=false -out=tfplan
      - run: terraform -chdir=envs/prod show -json tfplan > plan.json
      - run: conftest test plan.json -p policy/
  apply-prod:
    if: github.ref == 'refs/heads/main'
    needs: apply-staging
    environment: production             <span class="c"># ${ro?"aprobare obligatorie":"required approval"}</span>
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: arn:aws:iam::444455556666:role/tf-apply-prod, aws-region: eu-central-1 }
      - run: terraform -chdir=envs/prod init
      - run: terraform -chdir=envs/prod plan -out=tfplan
      - run: terraform -chdir=envs/prod apply tfplan</pre>
<h3>${ro?"Condiția din rolul tf-apply-prod":"The condition in the tf-apply-prod role"}</h3>
<pre class="yaml">"token.actions.githubusercontent.com:sub":
  "repo:platform/infra-live:environment:production"</pre></section></div>`;
