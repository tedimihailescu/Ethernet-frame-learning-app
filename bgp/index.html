steps:[
{at:["as1","t1","t2","isp"],frame:null,kind:"none",tables:["ases"],
 title:{ro:"Internetul: o rețea de rețele (AS-uri)",en:"The internet: a network of networks (ASes)"},
 body:{ro:`<p>Internetul nu are un centru. E format din peste 75.000 de rețele independente, numite <strong>sisteme autonome</strong> (AS): furnizori, cloud-uri, universități, firme mari. Fiecare are un număr unic (<strong>ASN</strong>) și blocuri de adrese (prefixe).</p>
<p>În interiorul unui AS, routerele folosesc un protocol intern (<strong>IGP</strong>: OSPF, IS-IS). Între AS-uri se folosește un singur protocol: <strong>BGP</strong> (Border Gateway Protocol). Prin el, fiecare AS spune vecinilor: „prin mine ajungeți la prefixele astea”.</p>
<p>În exemplu (tabelul din dreapta), o firmă de hosting, <strong>AS64501</strong>, are rețeaua <code>${PF}</code> și plătește doi furnizori de tranzit, ca să fie accesibilă chiar dacă unul pică. Tu ești client la <strong>AS64504</strong>.</p>
<p class="key">BGP nu caută cel mai scurt drum în kilometri sau milisecunde. Alege după <strong>politică</strong>: contracte, costuri, preferințe.</p>`,
 en:`<p>The internet has no centre. It's made of more than 75,000 independent networks called <strong>autonomous systems</strong> (AS): providers, clouds, universities, large companies. Each has a unique number (<strong>ASN</strong>) and blocks of addresses (prefixes).</p>
<p>Inside an AS, routers use an internal protocol (<strong>IGP</strong>: OSPF, IS-IS). Between ASes a single protocol is used: <strong>BGP</strong> (Border Gateway Protocol). Through it each AS tells its neighbours: "you can reach these prefixes through me".</p>
<p>In the example (table on the right), a hosting company, <strong>AS64501</strong>, owns <code>${PF}</code> and pays two transit providers so it stays reachable even if one fails. You're a customer of <strong>AS64504</strong>.</p>
<p class="key">BGP doesn't look for the shortest path in kilometres or milliseconds. It chooses by <strong>policy</strong>: contracts, costs, preferences.</p>`},
 try:[{cmd:"https://bgp.he.net",d:{ro:"Caută un IP sau un AS (de ex. AS15169) și vezi vecinii și prefixele lui.",en:"Look up an IP or an AS (e.g. AS15169) and see its neighbours and prefixes."}}]},

{at:"as1",frame:OPEN,kind:"open",move:[[["as1","t1"],["as1","t2"]]],fx:[["sess","AS64501 ↔ AS64502","eBGP","Established"],["sess","AS64501 ↔ AS64503","eBGP","Established"],["sess","AS64504 ↔ AS64502","eBGP","Established"],["sess","AS64504 ↔ AS64503","eBGP","Established"]],tables:["sess"],log:{ro:"deschiderea sesiunilor",en:"opening the sessions"},who:"AS64501",
 title:{ro:"Sesiunea BGP: TCP 179, OPEN, KEEPALIVE",en:"The BGP session: TCP 179, OPEN, KEEPALIVE"},
 body:{ro:`<p>BGP nu descoperă vecinii singur: fiecare sesiune e <strong>configurată manual</strong>, cu IP-ul și AS-ul vecinului, de obicei după un contract. Între AS-uri diferite se numește <strong>eBGP</strong>.</p>
<p>Routerul deschide o conexiune <strong>TCP pe portul 179</strong> și trimite <strong>OPEN</strong>: numărul lui AS, <em>hold time</em> și router ID. Dacă celălalt e de acord, sesiunea ajunge în starea <strong>Established</strong>.</p>
<p>De acum, vecinii își trimit <strong>KEEPALIVE</strong> la ~30 s. Dacă nu se aude nimic 90 s (hold time), sesiunea cade și toate rutele învățate prin ea sunt șterse.</p>`,
 en:`<p>BGP doesn't discover neighbours by itself: every session is <strong>configured by hand</strong>, with the neighbour's IP and AS, usually after a contract. Between different ASes it's called <strong>eBGP</strong>.</p>
<p>The router opens a <strong>TCP connection on port 179</strong> and sends <strong>OPEN</strong>: its AS number, <em>hold time</em> and router ID. If the other side agrees, the session reaches the <strong>Established</strong> state.</p>
<p>From now on the neighbours send each other <strong>KEEPALIVE</strong> every ~30 s. If nothing is heard for 90 s (the hold time), the session drops and every route learned through it is removed.</p>`},
 more:{ro:`<p>Stările sesiunii (automatul BGP): <code>Idle → Connect → OpenSent → OpenConfirm → Established</code>. O sesiune blocată în <code>Active</code> sau <code>Idle</code> înseamnă de obicei IP/AS greșit, un firewall care blochează portul 179 sau o parolă MD5/TCP-AO diferită.</p>`,
  en:`<p>Session states (the BGP state machine): <code>Idle → Connect → OpenSent → OpenConfirm → Established</code>. A session stuck in <code>Active</code> or <code>Idle</code> usually means a wrong IP/AS, a firewall blocking port 179, or a mismatched MD5/TCP-AO password.</p>`}},

{at:"as1",frame:U1,kind:"upd",move:[[["as1","t1"],["as1","t2"]]],log:{ro:"AS64501 își anunță prefixul",en:"AS64501 announces its prefix"},who:"AS64501",
 title:{ro:"UPDATE: „prin mine ajungeți la "+PF+"”",en:"UPDATE: \"reach "+PF+" through me\""},
 body:{ro:`<p>AS64501 trimite ambilor furnizori un mesaj <strong>UPDATE</strong>. Conține:</p>
<ul><li><strong>prefixul</strong> (NLRI): <code>${PF}</code>;</li>
<li><strong>AS_PATH</strong>: lista AS-urilor prin care a trecut anunțul, deocamdată doar <code>64501</code>, care e <em>originea</em>;</li>
<li><strong>NEXT_HOP</strong>: IP-ul la care se trimit pachetele pentru prefix, al routerului lui AS64501;</li>
<li><strong>ORIGIN</strong>: de unde vine ruta (IGP = configurată intenționat).</li></ul>
<p class="key">BGP trimite doar <strong>schimbările</strong>. După primul schimb de rute nu mai retrimite totul periodic, ca alte protocoale.</p>`,
 en:`<p>AS64501 sends both providers an <strong>UPDATE</strong> message. It contains:</p>
<ul><li>the <strong>prefix</strong> (NLRI): <code>${PF}</code>;</li>
<li><strong>AS_PATH</strong>: the list of ASes the announcement has crossed, for now only <code>64501</code>, the <em>origin</em>;</li>
<li><strong>NEXT_HOP</strong>: the IP to send packets for the prefix to, AS64501's router;</li>
<li><strong>ORIGIN</strong>: where the route came from (IGP = configured on purpose).</li></ul>
<p class="key">BGP only sends <strong>changes</strong>. After the initial exchange it doesn't resend everything periodically like other protocols do.</p>`}},

{at:"t1",frame:U2,kind:"upd",move:[[["t1","isp"]]],fx:[["rib","AS64502","64502 64501","192.0.2.9","—","—"]],tables:["rib"],log:{ro:"Tranzit A → ISP",en:"Transit A → ISP"},who:"AS64502",
 title:{ro:"Tranzitul A transmite mai departe și își adaugă AS-ul",en:"Transit A passes it on and adds its AS"},
 body:{ro:`<p>AS64502 acceptă ruta (e de la un client care plătește, deci o anunță oricui). Înainte s-o trimită mai departe, face două schimbări:</p>
<ul><li><strong>își pune AS-ul în față</strong> în AS_PATH: <code>64502 64501</code>;</li>
<li>pune ca <strong>NEXT_HOP</strong> adresa propriului router: pachetele vor veni întâi la el.</li></ul>
<p>ISP-ul tău primește ruta și o pune în <strong>Adj-RIB-In</strong>, lista rutelor primite de la vecini (tabelul din dreapta).</p>`,
 en:`<p>AS64502 accepts the route (it's from a paying customer, so it announces it to everyone). Before passing it on, it makes two changes:</p>
<ul><li>it <strong>prepends its own AS</strong> to AS_PATH: <code>64502 64501</code>;</li>
<li>it sets <strong>NEXT_HOP</strong> to its own router's address: packets will come to it first.</li></ul>
<p>Your ISP receives the route and puts it in the <strong>Adj-RIB-In</strong>, the list of routes received from neighbours (table on the right).</p>`}},

{at:"t2",frame:U3,kind:"upd",move:[[["t2","isp"]]],fx:[["rib","AS64503","64503 64501","192.0.2.17","—","—"]],tables:["rib"],log:{ro:"Tranzit B → ISP",en:"Transit B → ISP"},who:"AS64503",
 title:{ro:"Același prefix, pe un al doilea drum",en:"The same prefix, along a second path"},
 body:{ro:`<p>Tranzitul B face la fel: AS_PATH devine <code>64503 64501</code>, NEXT_HOP e routerul lui.</p>
<p>ISP-ul are acum <strong>două rute</strong> pentru același prefix. Ambele au AS_PATH de lungime 2. BGP trebuie să aleagă <strong>una singură</strong>, pe care o va folosi pentru trafic și o va anunța mai departe.</p>`,
 en:`<p>Transit B does the same: AS_PATH becomes <code>64503 64501</code>, NEXT_HOP is its router.</p>
<p>The ISP now has <strong>two routes</strong> for the same prefix. Both have an AS_PATH of length 2. BGP has to pick <strong>exactly one</strong>, which it will use for traffic and announce onward.</p>`}},

{at:"isp",frame:null,kind:"none",fx:[["rib","AS64502","64502 64501","192.0.2.9","200",{ro:"✓ cea mai bună",en:"✓ best"}],["rib","AS64503","64503 64501","192.0.2.17","100",{ro:"rezervă",en:"backup"}]],tables:["rib","best"],hl:{rib:"AS64502",best:0},who:"AS64504",
 title:{ro:"Alegerea celui mai bun drum: politica întâi",en:"Choosing the best path: policy first"},
 body:{ro:`<p>BGP compară rutele pe rând, după criteriile din tabelul de jos, și se oprește la primul care le deosebește.</p>
<p>Primul criteriu e <strong>LOCAL_PREF</strong>, o valoare pe care ISP-ul o setează singur, după contracte. Tranzitul A e mai ieftin, deci rutelor de la el li se dă <code>200</code>, iar celor de la B <code>100</code>. Câștigă ruta prin AS64502, înainte să mai conteze lungimea AS_PATH.</p>
<p class="key">De aceea pachetele pe internet nu merg neapărat pe drumul cel mai rapid: merg pe drumul pe care fiecare AS îl preferă din motive de afaceri.</p>`,
 en:`<p>BGP compares routes criterion by criterion, in the order of the bottom table, and stops at the first one that tells them apart.</p>
<p>The first criterion is <strong>LOCAL_PREF</strong>, a value the ISP sets itself, based on contracts. Transit A is cheaper, so routes from it get <code>200</code> and routes from B get <code>100</code>. The route via AS64502 wins before AS_PATH length even matters.</p>
<p class="key">That's why internet packets don't necessarily take the fastest path: they take the path each AS prefers for business reasons.</p>`},
 more:{ro:`<p>Cum influențează AS64501 traficul care <em>intră</em> la el? Nu poate seta LOCAL_PREF-ul altora, dar poate:</p><ul><li><strong>AS path prepending</strong>: anunță spre B cu <code>64501 64501 64501</code>, ca drumul să pară mai lung;</li><li><strong>MED</strong>: îi spune unui vecin cu care are mai multe legături pe care să o prefere;</li><li><strong>communities</strong>: etichete (de ex. <code>64503:80</code>) prin care cere furnizorului să-i schimbe preferința;</li><li>să anunțe prefixe <strong>mai specifice</strong> pe un singur drum.</li></ul>`,
  en:`<p>How does AS64501 influence the traffic <em>coming in</em> to it? It can't set others' LOCAL_PREF, but it can:</p><ul><li><strong>AS path prepending</strong>: announce towards B with <code>64501 64501 64501</code> so that path looks longer;</li><li><strong>MED</strong>: tell a neighbour it has several links with which one to prefer;</li><li><strong>communities</strong>: tags (e.g. <code>64503:80</code>) asking the provider to change its preference;</li><li>announce <strong>more specific</strong> prefixes on one path only.</li></ul>`}},

{at:"t2",frame:LOOP,kind:"upd",move:[[["t2","as1"]]],rest:["as1"],marks:{as1:{k:"drop",t:{ro:"✗ buclă",en:"✗ loop"}}},log:{ro:"înapoi la origine",en:"back to the origin"},who:"AS64501",
 title:{ro:"Cum previne BGP buclele: AS_PATH",en:"How BGP prevents loops: AS_PATH"},
 body:{ro:`<p>Tranzitul B anunță ruta tuturor vecinilor, deci și înapoi spre AS64501: <code>64503 64501</code>.</p>
<p>AS64501 vede <strong>propriul număr</strong> în AS_PATH și respinge ruta. Altfel ar putea ajunge să trimită traficul pentru propria rețea spre B, care l-ar trimite înapoi, la nesfârșit.</p>
<p class="key">AS_PATH are două roluri: <strong>previne buclele</strong> și e un criteriu de alegere (mai scurt = mai bun).</p>`,
 en:`<p>Transit B announces the route to all its neighbours, including back to AS64501: <code>64503 64501</code>.</p>
<p>AS64501 sees <strong>its own number</strong> in AS_PATH and rejects the route. Otherwise it could end up sending traffic for its own network to B, which would send it back, forever.</p>
<p class="key">AS_PATH has two jobs: it <strong>prevents loops</strong> and it's a selection criterion (shorter = better).</p>`}},

{at:"isp",frame:LEAK,kind:"upd",move:[[["isp","t2"]]],rest:["t2"],marks:{t2:{k:"drop",t:{ro:"✗ filtrat",en:"✗ filtered"}}},log:{ro:"route leak, filtrat",en:"route leak, filtered"},who:{ro:"ISP-ul (greșeală)",en:"The ISP (mistake)"},
 title:{ro:"Cine ce anunță: route leak și filtre",en:"Who announces what: route leaks and filters"},
 body:{ro:`<p>Regula de afaceri a internetului (<strong>valley-free</strong>):</p>
<ul><li>rutele <strong>clienților</strong> le anunți tuturor (te plătesc să fie accesibili);</li>
<li>rutele primite de la <strong>furnizori</strong> sau <strong>parteneri de peering</strong> le anunți <strong>doar clienților</strong>.</li></ul>
<p>Aici, ISP-ul greșește configurația și anunță spre Tranzitul B ruta primită de la Tranzitul A. Dacă B ar accepta-o, ar putea trimite trafic spre AS64501 <em>prin ISP-ul mic</em>, care s-ar sufoca. Asta e un <strong>route leak</strong>; s-a întâmplat de multe ori la scară mare.</p>
<p>B are însă <strong>filtre pe client</strong>: de la AS64504 acceptă doar prefixele care îi aparțin lui AS64504 (din registrele IRR). Ruta e aruncată.</p>`,
 en:`<p>The internet's business rule (<strong>valley-free</strong>):</p>
<ul><li>routes from <strong>customers</strong> you announce to everyone (they pay you to be reachable);</li>
<li>routes from <strong>providers</strong> or <strong>peering partners</strong> you announce <strong>only to customers</strong>.</li></ul>
<p>Here the ISP misconfigures things and announces to Transit B the route it got from Transit A. If B accepted it, it could send traffic for AS64501 <em>through the small ISP</em>, which would be overwhelmed. That's a <strong>route leak</strong>; it has happened many times at large scale.</p>
<p>But B has <strong>customer filters</strong>: from AS64504 it only accepts prefixes that belong to AS64504 (from the IRR registries). The route is dropped.</p>`}},

{at:"usr",frame:D2,kind:"data",move:[[["usr","isp"]],[["isp","t1"]],[["t1","as1"]],[["as1","srv"]]],log:{ro:"tu → server, pe drumul ales",en:"you → server, along the chosen path"},who:{ro:"Pachetul tău",en:"Your packet"},
 title:{ro:"Pachetele de date urmează rutele alese",en:"Data packets follow the chosen routes"},
 body:{ro:`<p>Deschizi site-ul de pe <code>203.0.113.10</code>. Pachetul tău nu conține nimic despre BGP: are doar IP sursă și destinație.</p>
<p>Fiecare router caută destinația în tabela lui de forwarding (<strong>FIB</strong>), construită din rutele alese de BGP, și trimite pachetul mai departe: ISP → Tranzit A → AS64501 → server. TTL-ul scade la fiecare router.</p>
<p class="key">Separarea e importantă: <strong>planul de control</strong> (BGP) decide rutele, din când în când; <strong>planul de date</strong> mută milioane de pachete pe secundă după ele.</p>`,
 en:`<p>You open the site on <code>203.0.113.10</code>. Your packet contains nothing about BGP: just source and destination IPs.</p>
<p>Each router looks up the destination in its forwarding table (<strong>FIB</strong>), built from the routes BGP chose, and forwards the packet: ISP → Transit A → AS64501 → server. The TTL drops at each router.</p>
<p class="key">The split matters: the <strong>control plane</strong> (BGP) decides routes, now and then; the <strong>data plane</strong> moves millions of packets per second according to them.</p>`},
 try:[{cmd:"tracert 1.1.1.1",d:{ro:"Vezi routerele prin care trece pachetul; numele lor arată adesea AS-ul.",en:"See the routers the packet crosses; their names often show the AS."}}]},

{at:"t1",frame:WD,kind:"wd",move:[[["t1","isp"]]],fx:[["rib","AS64502","—","—","—",{ro:"✗ retrasă",en:"✗ withdrawn"}],["rib","AS64503","64503 64501","192.0.2.17","100",{ro:"✓ cea mai bună",en:"✓ best"}]],tables:["rib"],hl:{rib:"AS64503"},marks:{as1:{k:"drop",t:{ro:"✗ legătura A a căzut",en:"✗ link A down"}}},log:{ro:"retragere după pană",en:"withdrawal after a failure"},who:"AS64502",
 title:{ro:"O legătură pică: retragere și convergență",en:"A link fails: withdrawal and convergence"},
 body:{ro:`<p>Fibra dintre AS64501 și Tranzitul A e tăiată. Sesiunea BGP cade (imediat, sau după hold time). Tranzitul A nu mai are drum spre <code>${PF}</code> și trimite vecinilor o <strong>retragere</strong> (UPDATE cu prefixul la „withdrawn routes”).</p>
<p>ISP-ul șterge ruta și reface alegerea: rămâne cea prin AS64503, care devine cea mai bună. Traficul tău merge acum prin Tranzitul B. Asta e <strong>convergența</strong>; pe internet durează de la câteva secunde la câteva minute.</p>
<p>Ca să afle mai repede de pană, routerele folosesc <strong>BFD</strong> (verificări la câteva sute de milisecunde) în loc să aștepte 90 s.</p>`,
 en:`<p>The fibre between AS64501 and Transit A is cut. The BGP session drops (immediately, or after the hold time). Transit A no longer has a path to <code>${PF}</code> and sends its neighbours a <strong>withdrawal</strong> (an UPDATE with the prefix under "withdrawn routes").</p>
<p>The ISP removes the route and re-runs the selection: the one via AS64503 is left and becomes best. Your traffic now goes through Transit B. That's <strong>convergence</strong>; on the internet it takes from a few seconds to a few minutes.</p>
<p>To notice failures faster, routers use <strong>BFD</strong> (checks every few hundred milliseconds) instead of waiting 90 s.</p>`}},

{at:"bad",frame:HJ,kind:"upd",move:[[["bad","t2"]]],rest:["t2"],tables:["roa"],marks:{t2:{k:"drop",t:{ro:"✗ RPKI invalid",en:"✗ RPKI invalid"}}},log:{ro:"anunț fals (hijack)",en:"bogus announcement (hijack)"},who:"AS64505",
 title:{ro:"Hijack: un prefix mai specific, oprit de RPKI",en:"Hijack: a more specific prefix, stopped by RPKI"},
 body:{ro:`<p>AS64505 anunță, din greșeală sau intenționat, <code>203.0.113.0/25</code>, jumătate din rețeaua altcuiva. Routerele aleg mereu <strong>prefixul cel mai specific</strong> (longest prefix match), deci dacă anunțul s-ar propaga, tot internetul ar trimite traficul pentru <code>203.0.113.10</code> la AS64505, oricât de bune ar fi rutele corecte.</p>
<p>Apărarea e <strong>RPKI</strong>: AS64501 a publicat un certificat semnat (<strong>ROA</strong>, tabelul din dreapta) care spune „<code>${PF}</code> poate fi anunțat doar de AS64501, cel mult ca /24”. Tranzitul B face <strong>Route Origin Validation</strong>: anunțul are originea greșită și e mai specific decât permite ROA-ul, deci e <strong>INVALID</strong> și e aruncat.</p>
<p class="key">RPKI verifică doar <strong>originea</strong>. Un AS_PATH falsificat în mijloc rămâne o problemă, rezolvată parțial de ASPA și BGPsec.</p>`,
 en:`<p>AS64505 announces, by mistake or on purpose, <code>203.0.113.0/25</code>, half of someone else's network. Routers always prefer the <strong>most specific prefix</strong> (longest prefix match), so if the announcement spread, the whole internet would send traffic for <code>203.0.113.10</code> to AS64505, however good the legitimate routes are.</p>
<p>The defence is <strong>RPKI</strong>: AS64501 has published a signed certificate (<strong>ROA</strong>, table on the right) saying "<code>${PF}</code> may only be originated by AS64501, at most as a /24". Transit B performs <strong>Route Origin Validation</strong>: the announcement has the wrong origin and is more specific than the ROA allows, so it's <strong>INVALID</strong> and dropped.</p>
<p class="key">RPKI only checks the <strong>origin</strong>. A forged AS_PATH in the middle is still a problem, partly addressed by ASPA and BGPsec.</p>`},
 try:[{cmd:"https://isbgpsafeyet.com",d:{ro:"Verifică dacă furnizorul tău aruncă rutele RPKI invalide.",en:"Check whether your provider drops RPKI-invalid routes."}}]},

{at:["as1","t1","t2","isp"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<div class="flow"><span>64501</span><i>→</i><span>64502 64501</span><i>→</i><span>ISP: alege după LOCAL_PREF</span><i>→</i><span>date pe drumul ales</span></div>
<ul><li>Internetul e format din <strong>AS-uri</strong>; între ele vorbește <strong>BGP</strong>, pe TCP 179, cu vecini configurați manual.</li>
<li>Un <strong>UPDATE</strong> poartă un prefix și atribute; fiecare AS își adaugă numărul în <strong>AS_PATH</strong>.</li>
<li>Alegerea: <strong>LOCAL_PREF</strong> (politica) întâi, apoi AS_PATH mai scurt, ORIGIN, MED și departajări.</li>
<li>Propriul AS în AS_PATH = buclă → ruta e respinsă. Filtrele opresc <strong>route leak</strong>-urile.</li>
<li>La o pană vine o <strong>retragere</strong>, iar rețeaua converge pe drumul de rezervă.</li>
<li><strong>Prefixul cel mai specific</strong> câștigă; <strong>RPKI</strong> (ROA + validare) oprește originile false.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Mergi la test ↓</button></p>`,
 en:`<div class="flow"><span>64501</span><i>→</i><span>64502 64501</span><i>→</i><span>ISP: picks by LOCAL_PREF</span><i>→</i><span>data on the chosen path</span></div>
<ul><li>The internet is made of <strong>ASes</strong>; between them <strong>BGP</strong> runs, over TCP 179, with manually configured neighbours.</li>
<li>An <strong>UPDATE</strong> carries a prefix and attributes; each AS adds its number to <strong>AS_PATH</strong>.</li>
<li>Selection: <strong>LOCAL_PREF</strong> (policy) first, then shorter AS_PATH, ORIGIN, MED and tie-breakers.</li>
<li>Your own AS in AS_PATH = a loop → the route is rejected. Filters stop <strong>route leaks</strong>.</li>
<li>On a failure a <strong>withdrawal</strong> arrives and the network converges onto the backup path.</li>
<li>The <strong>most specific prefix</strong> wins; <strong>RPKI</strong> (ROA + validation) stops false origins.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Go to the quiz ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  const attrs=[["AS_PATH",{ro:"AS-urile traversate; previne buclele, mai scurt e mai bun",en:"the ASes crossed; prevents loops, shorter is better"},{ro:"se transmite tuturor",en:"passed to everyone"}],["NEXT_HOP",{ro:"unde se trimit pachetele",en:"where to send packets"},{ro:"schimbat la fiecare eBGP",en:"changed at every eBGP hop"}],["LOCAL_PREF",{ro:"preferința internă a unui AS",en:"an AS's internal preference"},{ro:"doar în interiorul AS-ului",en:"inside the AS only"}],["MED",{ro:"sugestie pentru un vecin: pe ce legătură să intre",en:"a hint to a neighbour: which link to come in on"},{ro:"doar la vecinul direct",en:"to the direct neighbour only"}],["COMMUNITY",{ro:"etichete pentru politici (de ex. „nu anunța mai departe”)",en:"tags for policies (e.g. \"don't announce further\")"},{ro:"opțional, tranzitiv",en:"optional, transitive"}],["ORIGIN",{ro:"cum a apărut ruta: IGP, EGP, incomplete",en:"how the route appeared: IGP, EGP, incomplete"},{ro:"se transmite tuturor",en:"passed to everyone"}]];
  let h=`<div class="ref-grid"><section class="card refcard"><h2>${ro?"Atributele principale":"The main attributes"}</h2><div class="scroll"><table class="cmp" style="min-width:460px"><thead><tr><th>${ro?"Atribut":"Attribute"}</th><th>${ro?"Ce înseamnă":"What it means"}</th><th>${ro?"Cât de departe":"How far"}</th></tr></thead><tbody>`;
  attrs.forEach(r=>{h+=`<tr><td><b>${r[0]}</b></td><td>${T(r[1])}</td><td>${T(r[2])}</td></tr>`});
  h+=`</tbody></table></div><p>${ro?"Relații între AS-uri: <b>client–furnizor</b> (clientul plătește tranzit), <b>peering</b> (două rețele schimbă gratuit traficul propriilor clienți, adesea într-un IXP).":"Relationships between ASes: <b>customer–provider</b> (the customer pays for transit), <b>peering</b> (two networks exchange their own customers' traffic for free, often at an IXP)."}</p></section>`;
  h+=`<section class="card refcard"><h2>${ro?"Configurația lui AS64501 (FRR / Bird-like)":"AS64501's configuration (FRR-style)"}</h2>
<pre class="yaml">router bgp 64501
 bgp router-id 192.0.2.1
 neighbor 192.0.2.2 remote-as 64502   <span class="c"># ${ro?"Tranzit A":"Transit A"}</span>
 neighbor 192.0.2.18 remote-as 64503  <span class="c"># ${ro?"Tranzit B":"Transit B"}</span>
 address-family ipv4 unicast
  network 203.0.113.0/24
  <span class="c"># ${ro?"B doar ca rezervă: drum mai lung":"B as backup only: a longer path"}</span>
  neighbor 192.0.2.18 route-map PREPEND out
route-map PREPEND permit 10
 set as-path prepend 64501 64501

<span class="c"># ${ro?"verificare":"checking"}</span>
show bgp summary
show bgp ipv4 unicast 203.0.113.0/24</pre></section></div>`;
  return h;
},
