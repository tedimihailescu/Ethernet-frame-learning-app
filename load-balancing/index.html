sub:{ro:"Un magazin online are o singură adresă publică, dar mai multe servere în spate. Urmărim o cerere prin două niveluri de load balancer: unul L4, care vede doar IP-uri și porturi, și unul L7, care citește HTTP. Apoi vedem algoritmii, health check-urile, sesiunile lipicioase și deploy-ul fără întreruperi.",en:"An online shop has one public address but several servers behind it. We follow a request through two tiers of load balancer: an L4 one that only sees IPs and ports, and an L7 one that reads HTTP. Then come algorithms, health checks, sticky sessions and zero-downtime deploys."},

steps:[
{at:["l4"],frame:null,kind:"none",tables:["pools"],who:{ro:"Problema",en:"The problem"},
 title:{ro:"Un nume, o adresă, multe servere",en:"One name, one address, many servers"},
 body:{ro:`<p>De Black Friday, magazinul <code>shop.example.com</code> primește de zece ori mai mult trafic. Un singur server nu face față și, dacă pică, pică tot magazinul.</p>
<p>Soluția: mai multe servere identice și, în fața lor, un <strong>load balancer</strong> (LB). DNS-ul dă o singură adresă, <strong>VIP</strong>-ul <code>203.0.113.10</code>, iar LB-ul împarte cererile între servere.</p>
<p>Aici avem <strong>două niveluri</strong>, ca în multe firme și în cloud: un LB <strong>L4</strong> rapid în față, apoi doi <strong>proxy L7</strong> care citesc HTTP și trimit fiecare cerere la pool-ul potrivit.</p>`,
 en:`<p>On Black Friday, <code>shop.example.com</code> gets ten times more traffic. One server can't cope and, if it fails, the whole shop fails.</p>
<p>The fix: several identical servers and, in front of them, a <strong>load balancer</strong> (LB). DNS hands out a single address, the <strong>VIP</strong> <code>203.0.113.10</code>, and the LB spreads requests across the servers.</p>
<p>Here we have <strong>two tiers</strong>, as at many companies and in the cloud: a fast <strong>L4</strong> LB in front, then two <strong>L7 proxies</strong> that read HTTP and send each request to the right pool.</p>`},
 more:{ro:`<p>„L4” și „L7” vin din modelul OSI: nivelul 4 e transportul (TCP/UDP, porturi), nivelul 7 e aplicația (HTTP). Un LB L4 decide după IP și port; unul L7 decide după URL, header-e și cookie-uri.</p>`,
  en:`<p>"L4" and "L7" come from the OSI model: layer 4 is transport (TCP/UDP, ports), layer 7 is the application (HTTP). An L4 LB decides by IP and port; an L7 one decides by URL, headers and cookies.</p>`}},

{at:"cl",frame:F1,kind:"p",move:[[["cl","l4"]]],log:{ro:"client → VIP",en:"client → VIP"},who:{ro:"Client",en:"Client"},
 title:{ro:"Clientul se conectează la VIP",en:"The client connects to the VIP"},
 body:{ro:`<p>Browserul a aflat din DNS adresa <code>203.0.113.10</code> și trimite primul pachet TCP, <strong>SYN</strong>, spre portul 443.</p>
<p>Clientul nu știe că în spate sunt mai multe servere. Pentru el, VIP-ul e „magazinul”. Asta e ideea: serverele se pot adăuga, scoate sau schimba fără ca vreun client să observe.</p>`,
 en:`<p>The browser got the address <code>203.0.113.10</code> from DNS and sends the first TCP packet, the <strong>SYN</strong>, to port 443.</p>
<p>The client doesn't know there are several servers behind it. To it, the VIP <em>is</em> the shop. That's the point: servers can be added, removed or replaced without any client noticing.</p>`}},

{at:"l4",frame:F2,kind:"p",move:[[["l4","pa"]]],fx:[["conn",CL+":51000",VIP+":443","proxy-a","ESTABLISHED"]],tables:["conn"],hl:{conn:CL+":51000"},log:{ro:"LB L4 → proxy-a",en:"L4 LB → proxy-a"},who:"LB L4",
 title:{ro:"LB-ul L4: decide doar după IP și port",en:"The L4 LB: decides by IP and port only"},
 body:{ro:`<p>LB-ul L4 vede <strong>doar</strong> antetul IP și TCP: cine trimite, spre ce port. Nu vede URL-ul, nu vede cookie-urile; oricum, conținutul e criptat cu TLS.</p>
<p>Alege un proxy după un <strong>hash</strong> al IP-urilor și porturilor (sau după cine are mai puține conexiuni), schimbă IP-ul destinație (DNAT, ca în <a href="../nat/index.html">lecția NAT</a>) și <strong>notează conexiunea</strong>. Toate pachetele acestei conexiuni TCP vor merge la același proxy.</p>
<p class="key">L4 = rapid și simplu: lucrează pe pachete, poate duce milioane de conexiuni, merge cu orice protocol peste TCP/UDP.</p>`,
 en:`<p>The L4 LB sees <strong>only</strong> the IP and TCP headers: who is sending, to which port. It can't see the URL or cookies; the content is TLS-encrypted anyway.</p>
<p>It picks a proxy with a <strong>hash</strong> of the IPs and ports (or by who has the fewest connections), rewrites the destination IP (DNAT, as in the <a href="../nat/index.html">NAT lesson</a>) and <strong>records the connection</strong>. Every packet of this TCP connection will go to the same proxy.</p>
<p class="key">L4 = fast and simple: it works on packets, can carry millions of connections, and works with any protocol over TCP/UDP.</p>`},
 more:{ro:`<p>Exemple de LB L4: AWS Network Load Balancer, Google Cloud Network LB, Linux IPVS, HAProxy în <code>mode tcp</code>, Maglev la Google. Un Service Kubernetes cu kube-proxy e tot un LB L4 (vezi <a href="../kubernetes/index.html">lecția Kubernetes</a>).</p>`,
  en:`<p>Examples of L4 LBs: AWS Network Load Balancer, Google Cloud Network LB, Linux IPVS, HAProxy in <code>mode tcp</code>, Google's Maglev. A Kubernetes Service with kube-proxy is an L4 LB too (see the <a href="../kubernetes/index.html">Kubernetes lesson</a>).</p>`}},

{at:"pa",frame:F3,kind:"h",log:{ro:"proxy-a citește HTTP",en:"proxy-a reads HTTP"},who:"proxy-a",
 title:{ro:"Proxy-ul L7 desface TLS-ul și citește cererea",en:"The L7 proxy unwraps TLS and reads the request"},
 body:{ro:`<p>Proxy-a are <strong>certificatul</strong> magazinului, deci poate termina TLS-ul: negociază cu browserul și <strong>decriptează</strong> cererea. Acum vede tot:</p>
<div class="flow"><span>GET /api/cart</span><span>Host: shop.example.com</span><span>Cookie: session=ab12</span></div>
<p>Asta îi permite decizii pe care L4 nu le poate lua: după cale, după host, după header-e, după cookie-uri.</p>`,
 en:`<p>Proxy-a holds the shop's <strong>certificate</strong>, so it can terminate TLS: it does the handshake with the browser and <strong>decrypts</strong> the request. Now it sees everything:</p>
<div class="flow"><span>GET /api/cart</span><span>Host: shop.example.com</span><span>Cookie: session=ab12</span></div>
<p>That allows decisions L4 can't make: by path, by host, by headers, by cookies.</p>`},
 more:{ro:`<p>Exemple de LB L7: nginx, HAProxy în <code>mode http</code>, Envoy, Traefik, AWS Application Load Balancer, controller-ele Ingress din Kubernetes. Despre certificat vezi <a href="../certificate/index.html">lecția Certificate</a>.</p>`,
  en:`<p>Examples of L7 LBs: nginx, HAProxy in <code>mode http</code>, Envoy, Traefik, the AWS Application Load Balancer, Kubernetes Ingress controllers. For the certificate, see the <a href="../certificate/index.html">Certificates lesson</a>.</p>`}},

{at:"pa",frame:F4,kind:"h",move:[[["pa","api"]]],log:{ro:"proxy-a → api-1",en:"proxy-a → api-1"},tables:["pools"],hl:{pools:"api (L7)"},who:"proxy-a",
 title:{ro:"Rutare după cale și o conexiune nouă",en:"Routing by path, and a new connection"},
 body:{ro:`<p>Regula spune: <code>/api/*</code> → pool-ul <strong>api</strong>, restul → pool-ul <strong>web</strong>. Proxy-ul trimite cererea la <code>api-1</code>.</p>
<p>Diferența mare față de L4: proxy-ul <strong>deschide o conexiune TCP nouă</strong> spre server. Sunt două conexiuni separate: client ↔ proxy și proxy ↔ server. De aceea IP-ul sursă văzut de server e al proxy-ului.</p>
<p>Ca serverul să știe totuși cine e clientul, proxy-ul adaugă <code>X-Forwarded-For: 198.51.100.7</code> și un <code>X-Request-Id</code>, util la căutarea în log-uri.</p>`,
 en:`<p>The rule says: <code>/api/*</code> → the <strong>api</strong> pool, everything else → the <strong>web</strong> pool. The proxy sends the request to <code>api-1</code>.</p>
<p>The big difference from L4: the proxy <strong>opens a new TCP connection</strong> to the server. There are two separate connections: client ↔ proxy and proxy ↔ server. That's why the source IP the server sees is the proxy's.</p>
<p>So the server still knows who the client is, the proxy adds <code>X-Forwarded-For: 198.51.100.7</code> and an <code>X-Request-Id</code>, useful when searching logs.</p>`}},

{at:"pa",frame:F5,kind:"h",move:[[["pa","w1"]]],tables:["algo"],hl:{algo:"round robin"},log:{ro:"GET / → web-1",en:"GET / → web-1"},who:"proxy-a",
 title:{ro:"Cum alege serverul: algoritmii",en:"How it picks the server: the algorithms"},
 body:{ro:`<p>Următoarea cerere, <code>GET /</code>, merge la pool-ul web, care are două servere. Pe care? Depinde de <strong>algoritm</strong>:</p>
<ul><li><strong>Round robin</strong>: pe rând. Acum web-1, data viitoare web-2.</li>
<li><strong>Least connections</strong>: cel mai puțin ocupat. Bun când unele cereri durează mult.</li>
<li><strong>Hash</strong> pe IP sau cookie: același client ajunge mereu la același server.</li></ul>
<p>Majoritatea folosesc round robin sau least connections, cu <strong>greutăți</strong> dacă serverele au mărimi diferite.</p>`,
 en:`<p>The next request, <code>GET /</code>, goes to the web pool, which has two servers. Which one? It depends on the <strong>algorithm</strong>:</p>
<ul><li><strong>Round robin</strong>: in turn. Now web-1, next time web-2.</li>
<li><strong>Least connections</strong>: the least busy. Good when some requests take long.</li>
<li><strong>Hash</strong> on IP or cookie: the same client always reaches the same server.</li></ul>
<p>Most setups use round robin or least connections, with <strong>weights</strong> if servers differ in size.</p>`}},

{at:"pa",frame:F6,kind:"h",move:[[["pa","w2"]]],marks:{w2:{k:"drop",t:"DOWN"}},tables:["health"],hl:{health:"web-2"},log:{ro:"health check web-2",en:"health check web-2"},who:{ro:"Health check",en:"Health check"},
 title:{ro:"Health check: un server bolnav e scos automat",en:"Health check: a sick server is removed automatically"},
 body:{ro:`<p>La fiecare 5 secunde, proxy-ul întreabă fiecare server: <code>GET /healthz</code>. Web-2 are discul plin și nu mai răspunde în 2 secunde. După <strong>3 eșecuri la rând</strong>, proxy-ul îl marchează <strong>DOWN</strong> și nu-i mai trimite cereri.</p>
<p>Clienții nu văd nimic: toate cererile merg la web-1. Când web-2 își revine și trece de 2 verificări la rând, intră înapoi în pool.</p>
<p class="key">Fără health check, round robin-ul ar trimite jumătate din clienți spre un server mort.</p>`,
 en:`<p>Every 5 seconds the proxy asks each server: <code>GET /healthz</code>. Web-2's disk is full and it stops answering within 2 seconds. After <strong>3 failures in a row</strong>, the proxy marks it <strong>DOWN</strong> and sends it no more requests.</p>
<p>Clients notice nothing: every request goes to web-1. When web-2 recovers and passes 2 checks in a row, it rejoins the pool.</p>
<p class="key">Without a health check, round robin would send half the clients to a dead server.</p>`},
 more:{ro:`<p>Health check-ul trebuie să verifice ce contează (aplicația răspunde, baza e accesibilă), dar să fie ieftin. Pe lângă verificările <em>active</em>, multe proxy-uri au verificări <em>pasive</em> (outlier detection): dacă un server dă multe erori 5xx la cereri reale, e scos temporar.</p>`,
  en:`<p>A health check must test what matters (the app answers, the database is reachable) but stay cheap. Besides <em>active</em> checks, many proxies do <em>passive</em> checks (outlier detection): if a server returns many 5xx errors on real requests, it's ejected for a while.</p>`}},

{at:"pa",frame:F7,kind:"h",move:[[["pa","w1"]]],log:{ro:"sticky → web-1",en:"sticky → web-1"},who:{ro:"Sesiuni",en:"Sessions"},
 title:{ro:"Sticky sessions: același client, același server",en:"Sticky sessions: same client, same server"},
 body:{ro:`<p>Unele aplicații țin coșul de cumpărături <strong>în memoria</strong> serverului. Dacă a doua cerere ajunge pe alt server, coșul pare gol.</p>
<p>Soluția rapidă: <strong>sticky sessions</strong>. La primul răspuns, proxy-ul pune un cookie <code>SERVERID=web-1</code>; cererile următoare cu acest cookie merg tot la web-1.</p>
<p>Dezavantaje: încărcarea devine inegală, iar dacă web-1 cade, sesiunile lui se pierd. Soluția bună: aplicații <strong>fără stare</strong>, cu sesiunea într-un loc comun (Redis, baza de date) sau într-un token.</p>`,
 en:`<p>Some apps keep the shopping cart <strong>in the server's memory</strong>. If the second request lands on another server, the cart looks empty.</p>
<p>The quick fix: <strong>sticky sessions</strong>. On the first response the proxy sets a <code>SERVERID=web-1</code> cookie; later requests with that cookie go to web-1 again.</p>
<p>Downsides: load becomes uneven, and if web-1 fails its sessions are lost. The proper fix: <strong>stateless</strong> apps, with the session in a shared place (Redis, the database) or in a token.</p>`}},

{at:["pa","pb","w1","w2"],frame:null,kind:"none",who:{ro:"Deploy",en:"Deploys"},
 title:{ro:"Deploy fără întreruperi: draining și slow start",en:"Zero-downtime deploys: draining and slow start"},
 body:{ro:`<p>Vrei să actualizezi web-1 fără să tai cererile în curs:</p>
<ol><li>Îl marchezi <strong>drain</strong>: nu mai primește cereri noi, dar cele începute se termină (de ex. 30 de secunde, „deregistration delay” în AWS).</li>
<li>Îl oprești, îl actualizezi, îl pornești.</li>
<li>Trece health check-ul și revine, cu <strong>slow start</strong>: primește trafic treptat, cât își încălzește cache-urile.</li></ol>
<p>La fel face și LB-ul L4 cu proxy-urile: și ele au health check-uri, deci un proxy căzut e ocolit automat.</p>`,
 en:`<p>You want to update web-1 without cutting requests in flight:</p>
<ol><li>You mark it <strong>draining</strong>: it gets no new requests, but the ones in progress finish (e.g. 30 seconds, the "deregistration delay" in AWS).</li>
<li>You stop it, update it, start it.</li>
<li>It passes the health check and returns with <strong>slow start</strong>: traffic ramps up gradually while it warms its caches.</li></ol>
<p>The L4 LB does the same with the proxies: they have health checks too, so a failed proxy is bypassed automatically.</p>`}},

{at:"l4",frame:F8,kind:"p",move:[[["l4","cl"]]],log:{ro:"răspuns → client",en:"reply → client"},who:{ro:"Drumul înapoi",en:"The way back"},
 title:{ro:"Drumul înapoi și IP-ul clientului",en:"The way back and the client's IP"},
 body:{ro:`<p>Răspunsul trebuie să ajungă la client <strong>de la VIP</strong>, altfel clientul nu-l recunoaște. De obicei trece înapoi prin LB, care pune la loc adresa VIP-ului.</p>
<ul><li><strong>DSR</strong> (Direct Server Return): la LB-uri L4, serverul poate răspunde direct clientului, cu VIP-ul ca sursă. LB-ul vede doar traficul de intrare, mult mai mic. Bun pentru video și descărcări.</li>
<li><strong>IP-ul clientului</strong>: un proxy L7 îl pune în <code>X-Forwarded-For</code>; un LB L4 care face SNAT îl poate transmite cu <strong>PROXY protocol</strong> sau îl păstrează dacă nu face SNAT.</li></ul>`,
 en:`<p>The reply must reach the client <strong>from the VIP</strong>, or the client won't recognise it. It usually goes back through the LB, which restores the VIP address.</p>
<ul><li><strong>DSR</strong> (Direct Server Return): with L4 LBs, the server can reply straight to the client, using the VIP as the source. The LB only sees the much smaller inbound traffic. Good for video and downloads.</li>
<li><strong>The client's IP</strong>: an L7 proxy puts it in <code>X-Forwarded-For</code>; an L4 LB doing SNAT can pass it with the <strong>PROXY protocol</strong>, or keeps it by not doing SNAT.</li></ul>`}},

{at:["l4","pa","pb"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare: L4 vs. L7",en:"Recap: L4 vs L7"},
 body:{ro:`<div class="scroll"><table class="cmp"><thead><tr><th></th><th>L4</th><th>L7</th></tr></thead><tbody>
<tr><td>${"Vede"}</td><td>IP, port, TCP/UDP</td><td>URL, host, header-e, cookie-uri</td></tr>
<tr><td>TLS</td><td>${"îl lasă să treacă"}</td><td>${"îl termină (are certificatul)"}</td></tr>
<tr><td>${"Conexiuni"}</td><td>${"una, trecută mai departe"}</td><td>${"două: client↔proxy, proxy↔server"}</td></tr>
<tr><td>${"Viteză"}</td><td>${"foarte mare"}</td><td>${"mai mică, dar mai deștept"}</td></tr>
<tr><td>${"Exemple"}</td><td>NLB, IPVS, Maglev</td><td>nginx, HAProxy, Envoy, ALB</td></tr></tbody></table></div>
<ul><li>Algoritmi: round robin, least connections, hash, cu greutăți.</li><li>Health check-urile scot automat serverele bolnave.</li><li>Sticky sessions rezolvă rapid sesiunile în memorie, dar aplicațiile fără stare sunt mai bune.</li><li>Draining + slow start = deploy fără întreruperi.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<div class="scroll"><table class="cmp"><thead><tr><th></th><th>L4</th><th>L7</th></tr></thead><tbody>
<tr><td>Sees</td><td>IP, port, TCP/UDP</td><td>URL, host, headers, cookies</td></tr>
<tr><td>TLS</td><td>passes it through</td><td>terminates it (holds the certificate)</td></tr>
<tr><td>Connections</td><td>one, passed along</td><td>two: client↔proxy, proxy↔server</td></tr>
<tr><td>Speed</td><td>very high</td><td>lower, but smarter</td></tr>
<tr><td>Examples</td><td>NLB, IPVS, Maglev</td><td>nginx, HAProxy, Envoy, ALB</td></tr></tbody></table></div>
<ul><li>Algorithms: round robin, least connections, hashing, with weights.</li><li>Health checks remove sick servers automatically.</li><li>Sticky sessions quickly fix in-memory sessions, but stateless apps are better.</li><li>Draining + slow start = zero-downtime deploys.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  return `<div class="ref-grid"><section class="card refcard"><h2>HAProxy: L4 ${ro?"și":"and"} L7</h2>
<pre class="yaml"><span class="c"># L4: ${ro?"doar TCP, TLS-ul trece neatins":"TCP only, TLS passes untouched"}</span>
frontend shop_tcp
  mode tcp
  bind :443
  default_backend proxies
backend proxies
  mode tcp
  balance leastconn
  server proxy-a 10.0.1.11:443 check
  server proxy-b 10.0.1.12:443 check

<span class="c"># L7: ${ro?"termină TLS, rutează după cale":"terminates TLS, routes by path"}</span>
frontend shop_http
  mode http
  bind :443 ssl crt /etc/haproxy/shop.pem
  acl is_api path_beg /api/
  use_backend api if is_api
  default_backend web
backend web
  mode http
  balance roundrobin
  option httpchk GET /healthz
  cookie SERVERID insert indirect nocache
  server web-1 10.0.2.21:8080 check cookie web-1
  server web-2 10.0.2.22:8080 check cookie web-2</pre></section>
<section class="card refcard"><h2>nginx (L7)</h2>
<pre class="yaml">upstream web {
  least_conn;
  server 10.0.2.21:8080 max_fails=3 fail_timeout=30s;
  server 10.0.2.22:8080 max_fails=3 fail_timeout=30s;
}
server {
  listen 443 ssl;
  location /api/ { proxy_pass http://api; }
  location /     {
    proxy_pass http://web;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}</pre>
<h3>${ro?"De reținut":"Remember"}</h3>
<p>${ro?"„max_fails” în nginx open-source e o verificare pasivă; verificările active (health_check) sunt în nginx Plus sau în alte proxy-uri.":"In open-source nginx \"max_fails\" is a passive check; active checks (health_check) are in nginx Plus or other proxies."}</p></section></div>`;
},
