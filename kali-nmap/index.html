steps:[
{at:["kali","fw"],frame:null,kind:"none",tables:["states"],who:{ro:"Ideea",en:"The idea"},
 title:{ro:"Ideea: o întrebare pentru fiecare port",en:"The idea: one question for every port"},
 body:{ro:`<p>Un serviciu de rețea ascultă pe un <strong>port</strong>: SSH pe 22, HTTP pe 80 și așa mai departe. A „scana porturile” înseamnă a întreba fiecare port: „e cineva aici?”.</p>
<p>Pentru TCP, întrebarea e primul pas al unei conexiuni: un pachet <strong>SYN</strong>. Răspunsul spune starea:</p>
<ul><li><strong>SYN-ACK</strong>: un serviciu ascultă → <em>open</em>;</li>
<li><strong>RST</strong>: gazda e acolo, dar nimeni nu ascultă → <em>closed</em>;</li>
<li><strong>nimic</strong> (sau un mesaj ICMP de interzicere): un firewall a intervenit → <em>filtered</em>.</li></ul>
<p>Ținta e <code>web-lab</code>, din laboratorul tău, verificată ca în lecția „Kali Linux: un laborator sigur”.</p>`,
 en:`<p>A network service listens on a <strong>port</strong>: SSH on 22, HTTP on 80 and so on. "Scanning ports" means asking every port: "is anyone here?".</p>
<p>For TCP, the question is a connection's first step: a <strong>SYN</strong> packet. The reply tells the state:</p>
<ul><li><strong>SYN-ACK</strong>: a service is listening → <em>open</em>;</li>
<li><strong>RST</strong>: the host is there, but nobody listens → <em>closed</em>;</li>
<li><strong>nothing</strong> (or an ICMP prohibited message): a firewall stepped in → <em>filtered</em>.</li></ul>
<p>The target is <code>web-lab</code>, in your own lab, checked as in the lesson "Kali Linux: a safe lab".</p>`}},

{at:["p22","p80","p8443"],frame:N2,kind:"n",move:[[["kali","fw"]],[["fw","p22"],["fw","p80"],["fw","p3306"],["fw","p8443"]]],tables:["ports"],hl:{ports:0},log:{ro:"prima scanare",en:"the first scan"},who:"nmap",
 title:{ro:"Prima scanare: nmap 10.0.50.20",en:"The first scan: nmap 10.0.50.20"},
 body:{ro:`<p>Fără opțiuni, cu <code>sudo</code>, nmap face un <strong>SYN scan</strong> pe cele mai folosite <strong>1000</strong> de porturi TCP.</p>
<ul><li><code>22/tcp open ssh</code> și <code>80/tcp open http</code>;</li>
<li><code>8443/tcp filtered</code>: nu a venit niciun răspuns;</li>
<li><em>Not shown: 997 closed tcp ports (reset)</em>: restul au răspuns cu RST.</li></ul>
<p>Coloana SERVICE e doar numele obișnuit al portului dintr-o listă, nu o verificare. Și un detaliu important: un port care nu e între cele 1000 nici n-a fost întrebat.</p>`,
 en:`<p>With no options, run with <code>sudo</code>, nmap does a <strong>SYN scan</strong> of the <strong>1000</strong> most common TCP ports.</p>
<ul><li><code>22/tcp open ssh</code> and <code>80/tcp open http</code>;</li>
<li><code>8443/tcp filtered</code>: no reply came;</li>
<li><em>Not shown: 997 closed tcp ports (reset)</em>: the rest answered with RST.</li></ul>
<p>The SERVICE column is just the port's usual name from a list, not a check. And one important detail: a port outside those 1000 wasn't even asked.</p>`},
 try:[{cmd:"sudo nmap 10.0.50.20",d:{ro:"SYN scan, top 1000 porturi TCP.",en:"SYN scan, top 1000 TCP ports."}}]},

{at:"p22",frame:N3,kind:"n",move:[[["kali","fw"],["fw","p22"]],[["p22","fw"],["fw","kali"]],[["kali","fw"],["fw","p22"]]],marks:{p22:{k:"ok",t:"SYN-ACK"}},tables:["states"],hl:{states:"open"},log:{ro:"open pe fir",en:"open on the wire"},who:"open",
 title:{ro:"Open, pe fir: SYN, SYN-ACK, apoi RST",en:"Open, on the wire: SYN, SYN-ACK, then RST"},
 body:{ro:`<p>Cu <code>tcpdump</code> pornit în paralel vedem exact ce face nmap pe portul 22:</p>
<ol><li><code>[S]</code>: Kali trimite SYN;</li>
<li><code>[S.]</code>: web-lab răspunde SYN-ACK → portul e <strong>open</strong>;</li>
<li><code>[R]</code>: Kali trimite RST în loc de ACK-ul care ar fi terminat conexiunea.</li></ol>
<p>De aceea SYN scan se mai numește <strong>half-open</strong>: conexiunea nu ajunge niciodată la aplicație. E rapid și lasă mai puține urme în jurnalele serviciului, dar firewall-urile și IDS-urile îl văd foarte bine.</p>`,
 en:`<p>With <code>tcpdump</code> running alongside, we see exactly what nmap does on port 22:</p>
<ol><li><code>[S]</code>: Kali sends a SYN;</li>
<li><code>[S.]</code>: web-lab answers SYN-ACK → the port is <strong>open</strong>;</li>
<li><code>[R]</code>: Kali sends a RST instead of the ACK that would have completed the connection.</li></ol>
<p>That's why a SYN scan is also called <strong>half-open</strong>: the connection never reaches the application. It's fast and leaves fewer traces in the service's logs, but firewalls and IDSs see it very well.</p>`},
 try:[{cmd:"sudo tcpdump -ni eth0 host 10.0.50.20 and port 22",d:{ro:"Pornește-l într-un al doilea terminal, apoi scanează.",en:"Start it in a second terminal, then scan."}}]},

{at:"p3306",frame:N4,kind:"n",move:[[["kali","fw"],["fw","p3306"]],[["p3306","fw"],["fw","kali"]]],marks:{p3306:{k:"ok",t:"RST"}},tables:["states"],hl:{states:"closed"},log:{ro:"closed: doar local",en:"closed: local only"},who:"closed",
 title:{ro:"Closed: gazda răspunde „aici nu e nimeni”",en:"Closed: the host answers \"nobody's here\""},
 body:{ro:`<p>MySQL rulează pe web-lab, totuși <code>3306/tcp</code> apare <strong>closed</strong>, cu motivul <code>reset</code>. Pe web-lab, <code>ss -ltn</code> lămurește: MySQL ascultă pe <code>127.0.0.1:3306</code>, deci doar pentru aplicațiile de pe aceeași mașină.</p>
<p>Un SYN venit din rețea, spre <code>10.0.50.20:3306</code>, nu găsește pe nimeni, iar kernelul răspunde cu RST. Asta e configurarea corectă: baza de date nu trebuie să fie accesibilă din rețea.</p>
<p class="key">Closed nu e un semn rău. Spune doar că gazda e pornită și că acolo nu ascultă nimic.</p>`,
 en:`<p>MySQL runs on web-lab, yet <code>3306/tcp</code> shows as <strong>closed</strong>, with the reason <code>reset</code>. On web-lab, <code>ss -ltn</code> explains it: MySQL listens on <code>127.0.0.1:3306</code>, so only for apps on the same machine.</p>
<p>A SYN arriving from the network, to <code>10.0.50.20:3306</code>, finds no one, and the kernel answers with a RST. That's the right setup: the database shouldn't be reachable from the network.</p>
<p class="key">Closed isn't a bad sign. It just says the host is up and nothing listens there.</p>`}},

{at:"p8443",frame:N5,kind:"n",move:[[["kali","fw"]]],marks:{fw:{k:"drop",t:"drop"},p8443:{k:"ok",t:{ro:"protejat",en:"protected"}}},tables:["states"],hl:{states:"filtered"},log:{ro:"filtered: firewall",en:"filtered: firewall"},who:"filtered",
 title:{ro:"Filtered: un firewall aruncă pachetul",en:"Filtered: a firewall drops the packet"},
 body:{ro:`<p>Pentru <code>8443</code>, nmap a trimis SYN-ul de două ori și nu a primit nimic: <code>no-response</code> → <strong>filtered</strong>. Pe web-lab, regula nftables explică: <em>orice nu vine din 10.0.40.0/24 (rețeaua de administrare) spre 8443 se aruncă</em>.</p>
<p>Din Kali nu știm dacă în spate e un serviciu: firewall-ul ascunde exact asta. Panoul de administrare e protejat cum trebuie.</p>`,
 en:`<p>For <code>8443</code>, nmap sent the SYN twice and got nothing: <code>no-response</code> → <strong>filtered</strong>. On web-lab, the nftables rule explains it: <em>anything to 8443 not coming from 10.0.40.0/24 (the management network) is dropped</em>.</p>
<p>From Kali we can't tell whether a service sits behind it: the firewall hides exactly that. The admin panel is properly protected.</p>`},
 more:{ro:`<p>Felul regulii schimbă rezultatul. <code>drop</code> → nimic → filtered. <code>reject with icmp admin-prohibited</code> → ICMP → tot filtered, dar mai rapid. <code>reject with tcp reset</code> → RST → portul pare <strong>closed</strong>, ca și cum n-ar exista firewall.</p>`,
  en:`<p>The kind of rule changes the result. <code>drop</code> → nothing → filtered. <code>reject with icmp admin-prohibited</code> → ICMP → still filtered, but faster. <code>reject with tcp reset</code> → RST → the port looks <strong>closed</strong>, as if there were no firewall.</p>`}},

{at:"p50k",frame:N6,kind:"n",move:[[["kali","fw"]],[["fw","p22"],["fw","p80"],["fw","p3306"],["fw","p8443"],["fw","p50k"]]],marks:{p50k:{k:"drop",t:{ro:"găsit!",en:"found!"}}},tables:["ports"],hl:{ports:3},log:{ro:"-p-: portul 50000",en:"-p-: port 50000"},who:"-p-",
 title:{ro:"-p-: toate cele 65535 de porturi, și o surpriză",en:"-p-: all 65535 ports, and a surprise"},
 body:{ro:`<p>Lista de 1000 de porturi acoperă serviciile obișnuite, dar oamenii pornesc servicii și pe porturi neobișnuite. <code>-p-</code> le verifică pe <strong>toate</strong> (1–65535), iar <code>-T4</code> grăbește ritmul, potrivit pentru o rețea locală.</p>
<p>Apare <strong>50000/tcp open</strong>. nmap scrie „ibm-db2”, dar asta e doar numele din lista lui pentru portul 50000. Nu știm încă ce rulează acolo.</p>
<p class="key">Un serviciu „uitat” pe un port neobișnuit e exact ce lipsește din inventar și ce ar găsi un atacator.</p>`,
 en:`<p>The 1000-port list covers the usual services, but people start services on unusual ports too. <code>-p-</code> checks <strong>all</strong> of them (1–65535), and <code>-T4</code> speeds up the pace, fine for a local network.</p>
<p><strong>50000/tcp open</strong> appears. nmap says "ibm-db2", but that's just its list's name for port 50000. We don't know yet what runs there.</p>
<p class="key">A "forgotten" service on an unusual port is exactly what's missing from the inventory, and what an attacker would find.</p>`},
 try:[{cmd:"sudo nmap -p- -T4 10.0.50.20",d:{ro:"Toate porturile TCP, ritm rapid.",en:"All TCP ports, fast pace."}}]},

{at:["p22","p80","p50k"],frame:N7,kind:"n",move:[[["kali","fw"]],[["fw","p22"],["fw","p80"],["fw","p50k"]],[["p22","fw"],["p80","fw"],["p50k","fw"]]],marks:{p50k:{k:"drop",t:"Werkzeug"}},tables:["scans"],hl:{scans:"-sV"},log:{ro:"-sV: versiuni",en:"-sV: versions"},who:"-sV",
 title:{ro:"-sV: ce rulează de fapt, și în ce versiune",en:"-sV: what actually runs, and which version"},
 body:{ro:`<p><code>-sV</code> nu se mai oprește la SYN-ACK: deschide conexiunea, citește ce spune serviciul (bannerul) și îi trimite câteva cereri cunoscute.</p>
<ul><li>22: <strong>OpenSSH 9.2p1 Debian</strong>;</li>
<li>80: <strong>Apache httpd 2.4.62</strong>;</li>
<li>50000: <strong>Werkzeug 3.0.1, Python</strong>: un server de dezvoltare, nu DB2. Un coleg a testat o aplicație și a lăsat-o pornită. Serverele de dezvoltare nu sunt făcute să fie expuse în rețea.</li></ul>
<p>Versiunile contează: cu ele afli din avizele de securitate (CVE) dacă un serviciu are probleme cunoscute.</p>`,
 en:`<p><code>-sV</code> no longer stops at the SYN-ACK: it opens the connection, reads what the service says (its banner) and sends it a few well-known requests.</p>
<ul><li>22: <strong>OpenSSH 9.2p1 Debian</strong>;</li>
<li>80: <strong>Apache httpd 2.4.62</strong>;</li>
<li>50000: <strong>Werkzeug 3.0.1, Python</strong>: a development server, not DB2. A colleague tested an app and left it running. Development servers aren't made to be exposed on a network.</li></ul>
<p>Versions matter: with them you can check security advisories (CVEs) for known problems in a service.</p>`},
 try:[{cmd:"sudo nmap -sV -p 22,80,50000 10.0.50.20",d:{ro:"Detectarea serviciilor și a versiunilor.",en:"Service and version detection."}}]},

{at:"p80",frame:N8,kind:"n",move:[[["kali","fw"],["fw","p80"]],[["p80","fw"],["fw","kali"]],[["kali","fw"],["fw","p80"]]],tables:["scans"],hl:{scans:"-sT"},log:{ro:"connect scan",en:"connect scan"},who:"-sT",
 title:{ro:"Fără sudo: connect scan (-sT)",en:"Without sudo: connect scan (-sT)"},
 body:{ro:`<p>Un SYN scan are nevoie de drepturi de administrator, ca nmap să poată construi pachetele singur. Fără <code>sudo</code>, nmap folosește <strong>connect scan</strong> (<code>-sT</code>): îi cere sistemului de operare o conexiune normală.</p>
<p>Pe fir: <code>[S]</code>, <code>[S.]</code>, <code>[.]</code> (ACK, conexiunea e completă), apoi închidere. Rezultatul e același (<em>open</em>), dar conexiunea a ajuns până la aplicație și apare mai ușor în jurnalele ei. E și puțin mai lent.</p>`,
 en:`<p>A SYN scan needs admin rights, so nmap can build packets itself. Without <code>sudo</code>, nmap uses a <strong>connect scan</strong> (<code>-sT</code>): it asks the operating system for a normal connection.</p>
<p>On the wire: <code>[S]</code>, <code>[S.]</code>, <code>[.]</code> (ACK, the connection is complete), then a close. The result is the same (<em>open</em>), but the connection reached the application and shows up more easily in its logs. It's also a little slower.</p>`}},

{at:"fw",frame:N9,kind:"n",move:[[["kali","fw"]],[["fw","kali"]]],tables:["states"],hl:{states:"open|filtered"},log:{ro:"UDP",en:"UDP"},who:"-sU",
 title:{ro:"UDP: fără handshake, cu răspunsuri ambigue",en:"UDP: no handshake, ambiguous answers"},
 body:{ro:`<p>Multe servicii importante sunt pe UDP: DNS (53), NTP (123), SNMP (161). <code>-sU --top-ports 20</code> verifică cele mai folosite 20.</p>
<ul><li>Dacă vine un răspuns UDP → <strong>open</strong>: aici SNMP pe 161;</li>
<li>dacă vine <em>ICMP port unreachable</em> → <strong>closed</strong>;</li>
<li>dacă nu vine nimic → <strong>open|filtered</strong>: un serviciu care tace sau un firewall, nmap nu poate deosebi (NTP pe 123).</li></ul>
<p>Scanările UDP sunt lente, pentru că sistemele limitează mesajele ICMP. De aceea scanezi UDP țintit, nu toate porturile.</p>`,
 en:`<p>Many important services are on UDP: DNS (53), NTP (123), SNMP (161). <code>-sU --top-ports 20</code> checks the 20 most common.</p>
<ul><li>If a UDP reply comes → <strong>open</strong>: here SNMP on 161;</li>
<li>if <em>ICMP port unreachable</em> comes → <strong>closed</strong>;</li>
<li>if nothing comes → <strong>open|filtered</strong>: a silent service or a firewall, nmap can't tell which (NTP on 123).</li></ul>
<p>UDP scans are slow, because systems rate-limit ICMP messages. That's why you scan UDP selectively, not every port.</p>`},
 try:[{cmd:"sudo nmap -sU --top-ports 20 10.0.50.20",d:{ro:"Cele mai folosite 20 de porturi UDP.",en:"The 20 most common UDP ports."}}]},

{at:["p22","p80"],frame:N10,kind:"n",move:[[["kali","fw"]],[["fw","p22"],["fw","p80"]]],tables:["nse"],hl:{nse:"default (-sC)"},log:{ro:"scripturi default",en:"default scripts"},who:"NSE",
 title:{ro:"Scripturi NSE: doar categoria default",en:"NSE scripts: the default category only"},
 body:{ro:`<p>nmap are un motor de scripturi (<strong>NSE</strong>) cu sute de scripturi, împărțite pe categorii. <code>-sC</code> rulează categoria <strong>default</strong>: informații utile și sigure.</p>
<ul><li><code>ssh-hostkey</code>: amprenta cheii serverului SSH;</li>
<li><code>http-title</code>: titlul paginii web, „Lab Web - Login”;</li>
<li><code>http-server-header</code>: ce spune serverul despre el.</li></ul>
<p>Alte categorii (<em>intrusive</em>, <em>brute</em>, <em>exploit</em>) încarcă serviciul, încearcă parole sau vulnerabilități. Ele depășesc descoperirea și se folosesc doar cu acord explicit, în scopul unui test.</p>`,
 en:`<p>nmap has a scripting engine (<strong>NSE</strong>) with hundreds of scripts, split into categories. <code>-sC</code> runs the <strong>default</strong> category: useful, safe information.</p>
<ul><li><code>ssh-hostkey</code>: the SSH server key's fingerprint;</li>
<li><code>http-title</code>: the web page's title, "Lab Web - Login";</li>
<li><code>http-server-header</code>: what the server says about itself.</li></ul>
<p>Other categories (<em>intrusive</em>, <em>brute</em>, <em>exploit</em>) load the service, try passwords or vulnerabilities. They go beyond discovery and are used only with explicit approval, within a test's scope.</p>`}},

{at:["fw","p22","p50k"],frame:N11,kind:"n",move:[[["kali","fw"]],[["fw","p80"]]],marks:{p50k:{k:"ok",t:"closed"},p22:{k:"ok",t:"filtered"}},log:{ro:"remediere și rescanare",en:"fix and rescan"},who:{ro:"Raportul",en:"The report"},
 title:{ro:"Raportul: din scanare în remediere, dovedită cu o rescanare",en:"The report: from scan to fix, proven with a rescan"},
 body:{ro:`<p>Scopul unei scanări nu e lista de porturi, ci ce schimbi după ea. Pe web-lab, echipa:</p>
<ul><li>oprește serverul de dezvoltare de pe 50000;</li>
<li>permite SSH doar din rețeaua de administrare <code>10.0.40.0/24</code>, ca la 8443.</li></ul>
<p>Rescanarea completă, salvată cu <code>-oA</code>: <code>22 filtered</code>, <code>80 open</code>, <code>8443 filtered</code>, <code>50000 closed</code>. Din laborator mai e vizibil un singur serviciu, cel care chiar trebuie să fie public.</p>
<p class="key">Același flux îl folosește un administrator pe propria rețea: scanează, compară cu ce ar trebui să existe, închide restul, rescanează.</p>`,
 en:`<p>The point of a scan isn't the list of ports, it's what you change afterwards. On web-lab, the team:</p>
<ul><li>stops the development server on 50000;</li>
<li>allows SSH only from the management network <code>10.0.40.0/24</code>, like 8443.</li></ul>
<p>The full rescan, saved with <code>-oA</code>: <code>22 filtered</code>, <code>80 open</code>, <code>8443 filtered</code>, <code>50000 closed</code>. From the lab, only one service is still visible: the one that really has to be public.</p>
<p class="key">An admin uses the same loop on their own network: scan, compare with what should exist, close the rest, rescan.</p>`},
 try:[{cmd:"sudo nmap -sV -p- -oA web-lab-$(date +%F) 10.0.50.20",d:{ro:"Raport complet în trei formate.",en:"A full report in three formats."}}]},

{at:["kali","fw","p22","p80","p3306","p8443","p50k"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<ul><li><strong>open</strong> = SYN-ACK, <strong>closed</strong> = RST (gazda e acolo), <strong>filtered</strong> = nimic sau ICMP (firewall).</li>
<li>Cu sudo: <code>-sS</code> (half-open). Fără sudo: <code>-sT</code> (conexiune completă).</li>
<li>Implicit: top 1000 de porturi. <code>-p-</code> le verifică pe toate; serviciile uitate stau des pe porturi neobișnuite.</li>
<li>Coloana SERVICE e o ghicire; <code>-sV</code> vorbește cu serviciul și aduce versiunea.</li>
<li>UDP (<code>-sU</code>): <em>open|filtered</em> când nu vine nimic; îl scanezi țintit.</li>
<li><code>-sC</code> rulează doar scripturi default; restul categoriilor doar cu acord explicit.</li>
<li>Raport cu <code>-oA</code>, remediere, rescanare ca dovadă.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<ul><li><strong>open</strong> = SYN-ACK, <strong>closed</strong> = RST (the host is there), <strong>filtered</strong> = nothing or ICMP (a firewall).</li>
<li>With sudo: <code>-sS</code> (half-open). Without sudo: <code>-sT</code> (a full connection).</li>
<li>By default: the top 1000 ports. <code>-p-</code> checks them all; forgotten services often sit on unusual ports.</li>
<li>The SERVICE column is a guess; <code>-sV</code> talks to the service and gets the version.</li>
<li>UDP (<code>-sU</code>): <em>open|filtered</em> when nothing comes back; scan it selectively.</li>
<li><code>-sC</code> runs only default scripts; the other categories only with explicit approval.</li>
<li>A report with <code>-oA</code>, a fix, and a rescan as proof.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],
