<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autentificare</title>
<meta name="description" content="Autentificare în Rețea pas cu pas. / Sign in to Network step by step.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.login-wrap{min-height:calc(100vh - 140px);display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login{width:100%;max-width:420px;background:var(--surface);border:2px solid var(--text);border-radius:14px;padding:24px}
.login h1{font:700 1.6rem var(--head);margin:0 0 4px}
.login .sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 14px;border-radius:9px;border:2px solid var(--text);background:var(--surface);color:var(--text);font:600 .98rem var(--sans);cursor:pointer}
.gbtn:hover{background:var(--surface2)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.82rem;margin:16px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--border)}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;font:600 .88rem var(--sans);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
form{display:grid;gap:10px}
label{display:grid;gap:4px;font:600 .82rem var(--sans);color:var(--muted)}
input{font:500 1rem var(--sans);padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);width:100%}
input:focus-visible,.gbtn:focus-visible,.tabs button:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.submit{padding:11px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-text);font:700 1rem var(--sans);cursor:pointer}
.submit:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.3em;font-size:.88rem;margin:6px 0 0}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.linkbtn{background:none;border:0;color:var(--text);text-decoration:underline;cursor:pointer;font:500 .85rem var(--sans);padding:0;justify-self:start}
.privacy{margin:16px 0 0;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--border);padding-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="topbar" id="top"><div class="topbar-in">
  <a class="brand" href="../index.html"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/><path d="M7 16h18M19 11l6 5-6 5" fill="none" stroke="var(--accent-text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="16" r="2.6" fill="var(--accent-text)"/></svg><span data-t="brand"></span></a>
  <div class="tools" style="margin-left:auto"><div class="seg" role="group" aria-label="Limba / Language"><button type="button" data-lang="ro">RO</button><button type="button" data-lang="en">EN</button></div><button type="button" class="icon-btn" id="theme">◐</button></div>
</div></header>

<main class="login-wrap">
  <section class="login" aria-labelledby="h">
    <h1 id="h" data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <button type="button" class="gbtn" id="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span data-t="google"></span></button>
    <div class="or"><span data-t="or"></span></div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-in" aria-selected="true" data-t="tabIn"></button>
      <button type="button" role="tab" id="tab-up" aria-selected="false" data-t="tabUp"></button>
    </div>
    <form id="form" novalidate>
      <label id="name-row" hidden><span data-t="name"></span><input id="name" type="text" autocomplete="name" maxlength="60"></label>
      <label><span data-t="email"></span><input id="email" type="email" autocomplete="email" required></label>
      <label><span data-t="pass"></span><input id="pass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button type="submit" class="submit" id="submit" data-t="submitIn"></button>
      <button type="button" class="linkbtn" id="reset" data-t="reset"></button>
    </form>
    <p class="msg" id="msg" aria-live="polite"></p>
    <p class="privacy" data-t="privacy"></p>
  </section>
</main>

<script type="module">
import { auth, ROOT } from "../assets/firebase.js?v=5";
import { GoogleAuthProvider, signInWithPopup, signInWithRedirect, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("cadru-lang")==="en"?"en":"ro";
const UI={
  brand:["Rețea pas cu pas","Network step by step"],title:["Bine ai venit","Welcome"],
  sub:["Autentifică-te ca să parcurgi lecțiile și să-ți salvezi rezultatele la teste.","Sign in to take the lessons and save your quiz results."],
  google:["Continuă cu Google","Continue with Google"],or:["sau cu e-mail","or with email"],
  tabIn:["Intră în cont","Sign in"],tabUp:["Cont nou","New account"],
  name:["Numele tău (apare la rezultate)","Your name (shown with results)"],email:["E-mail","Email"],pass:["Parolă (minimum 6 caractere)","Password (at least 6 characters)"],
  submitIn:["Intră","Sign in"],submitUp:["Creează contul","Create account"],reset:["Ai uitat parola?","Forgot your password?"],
  privacy:["Ce salvăm: numele, adresa de e-mail și scorurile tale la teste. Administratorul site-ului poate vedea rezultatele tuturor participanților.","What we store: your name, email address and quiz scores. The site administrator can see every participant's results."],
  needEmail:["Scrie adresa de e-mail.","Enter your email address."],needName:["Scrie-ți numele.","Enter your name."],
  sent:["Ți-am trimis un e-mail pentru resetarea parolei.","We've sent you a password reset email."],
  errs:{"auth/invalid-credential":["E-mail sau parolă greșite.","Wrong email or password."],"auth/invalid-email":["Adresa de e-mail nu e validă.","That email address isn't valid."],"auth/email-already-in-use":["Există deja un cont cu acest e-mail. Alege „Intră în cont”.","An account with this email already exists. Choose \"Sign in\"."],"auth/weak-password":["Parola e prea scurtă (minimum 6 caractere).","The password is too short (at least 6 characters)."],"auth/popup-closed-by-user":["Fereastra Google a fost închisă înainte de autentificare.","The Google window was closed before signing in."],"auth/operation-not-allowed":["Această metodă de autentificare nu e încă activată.","This sign-in method isn't enabled yet."],"auth/unauthorized-domain":["Acest domeniu nu e autorizat pentru autentificare.","This domain isn't authorised for sign-in."],"auth/too-many-requests":["Prea multe încercări. Așteaptă puțin și reîncearcă.","Too many attempts. Wait a little and try again."]},
  generic:["Ceva n-a mers. Încearcă din nou.","Something went wrong. Please try again."]
};
const T=k=>UI[k][lang==="en"?1:0];
let mode="in";
const $=s=>document.querySelector(s);
function render(){
  document.documentElement.lang=lang;document.title=lang==="en"?"Sign in":"Autentificare";
  document.querySelectorAll("[data-t]").forEach(e=>{const k=e.dataset.t;if(UI[k])e.textContent=T(k)});
  $("#submit").textContent=T(mode==="in"?"submitIn":"submitUp");
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
}
function setMode(m){mode=m;$("#tab-in").setAttribute("aria-selected",m==="in");$("#tab-up").setAttribute("aria-selected",m==="up");$("#name-row").hidden=m!=="up";$("#pass").autocomplete=m==="up"?"new-password":"current-password";$("#reset").hidden=m==="up";msg("");render()}
function msg(t,ok){const m=$("#msg");m.textContent=t;m.className="msg "+(ok?"ok":"err")}
function errMsg(e){console.error(e);const x=UI.errs[e&&e.code];return x?x[lang==="en"?1:0]:T("generic")+(e&&e.code?" ("+e.code+")":"")}
const next=()=>{const n=new URLSearchParams(location.search).get("next");try{const u=new URL(n,location.href);if(u.hostname.endsWith(".web.app")&&u.hostname.split(".")[0]===location.hostname.split(".")[0]){u.protocol=location.protocol;u.host=location.host}if(u.origin===location.origin)return u.href}catch(e){}return ROOT+"index.html"};

onAuthStateChanged(auth,u=>{if(u)location.replace(next())});
$("#google").onclick=async()=>{msg("");const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});try{await signInWithPopup(auth,p)}catch(e){if(e&&["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported"].includes(e.code)){try{await signInWithRedirect(auth,p);return}catch(e2){msg(errMsg(e2));return}}msg(errMsg(e))}};
$("#tab-in").onclick=()=>setMode("in");$("#tab-up").onclick=()=>setMode("up");
$("#form").onsubmit=async e=>{e.preventDefault();msg("");const email=$("#email").value.trim(),pass=$("#pass").value,name=$("#name").value.trim();
  if(!email){msg(T("needEmail"));return}if(mode==="up"&&!name){msg(T("needName"));return}
  $("#submit").disabled=true;
  try{if(mode==="in"){await signInWithEmailAndPassword(auth,email,pass)}else{const c=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(c.user,{displayName:name})}}
  catch(err){msg(errMsg(err))}finally{$("#submit").disabled=false}};
$("#reset").onclick=async()=>{const email=$("#email").value.trim();if(!email){msg(T("needEmail"));return}try{await sendPasswordResetEmail(auth,email);msg(T("sent"),true)}catch(e){msg(errMsg(e))}};
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("cadru-lang",lang);render()});
const saved=store.get("cadru-theme");if(saved==="light"||saved==="dark")document.documentElement.dataset.theme=saved;
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const nt=d?"light":"dark";r.dataset.theme=nt;store.set("cadru-theme",nt)};
render();
</script>
</body>
</html>
