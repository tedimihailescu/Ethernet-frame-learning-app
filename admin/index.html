<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administrare</title>
<meta name="description" content="Pagina de administrare: utilizatori, prezență online, administratori și codul de acces. / Admin page.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.page{max-width:1180px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page h1{font:700 clamp(1.5rem,3vw,2.1rem) var(--head);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:75ch}
.block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;min-width:0}
.block h2{font:700 1.1rem var(--head);margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
.kpi b{display:block;font:700 1.6rem var(--head);font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],input[type=text]{font:500 .92rem var(--sans);padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);min-width:0}
input[type=search]{flex:1 1 200px;max-width:300px}
.seg2{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);color:var(--text);padding:7px 11px;font:600 .82rem var(--sans);cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:.76rem;color:var(--muted);font-weight:600;white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#9b9478}
.dot.on{background:#1f9d55;box-shadow:0 0 0 3px rgba(31,157,85,.2)}
.dot.away{background:#e0a100}
.muted{color:var(--muted)}
.badge{display:inline-block;font:600 .7rem var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--text);margin-left:6px;vertical-align:middle}
.btn-sm{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:7px;padding:6px 10px;font:600 .8rem var(--sans);cursor:pointer;white-space:nowrap}
.btn-sm:disabled{opacity:.5;cursor:default}
.btn{border:2px solid var(--text);background:var(--accent);color:var(--accent-text);border-radius:8px;padding:9px 16px;font:700 .92rem var(--sans);cursor:pointer}
.code{font:700 1.15rem var(--mono);letter-spacing:.06em;background:var(--surface2);padding:8px 12px;border-radius:8px;user-select:all;word-break:break-all}
.msg{margin:10px 0 0;font-size:.92rem}
.msg.good{color:var(--ok);font-weight:600}.msg.bad{color:var(--bad)}
.gate{max-width:560px;margin:0 auto;border:2px solid var(--text)}
.gate input{flex:1 1 220px;font:600 1rem var(--mono);padding:10px 12px}
.online{border:2px solid #1f9d55}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.oc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface2);min-width:0}
.oc .av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 .95rem var(--head);background:var(--text);color:var(--surface);position:relative}
.oc .av i{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface2);background:#9b9478}
.oc .av i.on{background:#1f9d55}.oc .av i.away{background:#e0a100}
.oc .who{min-width:0;font-size:.86rem;line-height:1.35}
.oc .who b{display:block;font-size:.95rem;overflow-wrap:anywhere}
.oc .who span{display:block;color:var(--muted);overflow-wrap:anywhere}
.oc .who a{overflow-wrap:anywhere}
.oc .who b span{display:inline;color:inherit}.oc .who b .badge{display:inline-block}.oc .who b .muted{color:var(--muted);font-weight:500}
.sub{font:700 .95rem var(--head);margin:16px 0 8px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="topbar" id="top"><div class="topbar-in">
  <a class="brand" href="../index.html"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/><path d="M7 16h18M19 11l6 5-6 5" fill="none" stroke="var(--accent-text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="16" r="2.6" fill="var(--accent-text)"/></svg><span data-t="brand"></span></a>
  <nav class="nav"><a href="../index.html" data-t="home"></a><a href="../rezultate/index.html" data-t="results"></a></nav>
  <div class="tools"><div class="seg" role="group" aria-label="Limba / Language"><button type="button" data-lang="ro">RO</button><button type="button" data-lang="en">EN</button></div><button type="button" class="icon-btn" id="theme">◐</button></div>
</div></header>

<main class="page">
  <h1 data-t="title"></h1>
  <p class="lead" id="lead"></p>

  <section class="block gate" id="gate" hidden>
    <h2 data-t="gateT"></h2>
    <p data-t="gateLead"></p>
    <div class="ctl"><input type="text" id="codeIn" autocomplete="off" spellcheck="false" autocapitalize="characters"><button type="button" class="btn" id="codeBtn" data-t="gateBtn"></button></div>
    <p class="msg" id="gateMsg" aria-live="polite"></p>
    <p class="muted" style="font-size:.86rem;margin-top:14px" data-t="gateAlt"></p>
  </section>

  <div id="panel" hidden>
    <div class="kpis" id="kpis"></div>

    <section class="block online" id="onlineBox">
      <div class="row"><h2 id="onT"></h2><span class="muted" style="font-size:.84rem" id="onUpd"></span></div>
      <div class="ocards" id="onList"></div>
      <h3 class="sub" id="awT"></h3>
      <div class="ocards" id="awList"></div>
    </section>

    <section class="block">
      <div class="row"><h2 data-t="usersT"></h2>
        <div class="ctl"><input type="search" id="q"><div class="seg2" role="group" id="flt"><button type="button" data-f="all" aria-pressed="true"></button><button type="button" data-f="on" aria-pressed="false"></button><button type="button" data-f="today" aria-pressed="false"></button></div></div></div>
      <div class="scroll" id="users"></div>
      <p class="muted" style="font-size:.84rem;margin:10px 0 0" data-t="statusNote"></p>
    </section>

    <div class="cols">
      <section class="block"><h2 data-t="adminsT"></h2><div id="admins"></div></section>
      <section class="block"><h2 data-t="codeT"></h2><p data-t="codeLead"></p><div id="codeBox"></div><div class="ctl" style="margin-top:10px"><button type="button" class="btn-sm" id="genCode" data-t="gen"></button><button type="button" class="btn-sm" id="copyCode" data-t="copy"></button><button type="button" class="btn-sm" id="offCode" data-t="off"></button></div><p class="msg" id="codeMsg" aria-live="polite"></p></section>
    </div>
  </div>
</main>

<script type="module" src="../assets/auth.js?v=11"></script>
<script type="module">
import { auth, db } from "../assets/firebase.js?v=5";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { collection, doc, getDoc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("cadru-lang")==="en"?"en":"ro";
const UI={
  brand:["Rețea pas cu pas","Network step by step"],home:["← Lecții","← Lessons"],results:["Rezultate","Results"],title:["⚙ Administrare","⚙ Administration"],
  leadAdmin:["Cine folosește site-ul, cine e online acum și când a fost văzut ultima dată fiecare. Lista se actualizează singură.","Who uses the site, who's online right now and when each person was last seen. The list updates by itself."],
  leadGate:["Pagina e doar pentru administratori.","This page is for administrators only."],
  gateT:["Acces de administrator","Administrator access"],gateLead:["Introdu codul de acces primit de la un administrator. Contul tău devine administrator.","Enter the access code you got from an administrator. Your account becomes an administrator."],
  gateBtn:["Devino administrator","Become administrator"],gateAlt:["Alternativ, un administrator te poate face admin din lista de utilizatori, sau poți adăuga documentul admins/{ID-ul tău} în consola Firebase.","Alternatively, an administrator can make you admin from the user list, or you can add the admins/{your ID} document in the Firebase console."],
  badCode:["Cod greșit sau inactiv.","Wrong or inactive code."],okCode:["Gata, ești administrator. Se încarcă…","Done, you're an administrator. Loading…"],
  usersT:["Utilizatori","Users"],adminsT:["Administratori","Administrators"],codeT:["Codul de acces pentru admini","The admin access code"],
  codeLead:["Cine introduce codul ăsta pe pagina de administrare devine administrator. Dă-l doar celor de încredere și schimbă-l după.","Whoever enters this code on the admin page becomes an administrator. Give it only to people you trust, and change it afterwards."],
  gen:["Generează cod nou","Generate a new code"],copy:["Copiază","Copy"],copied:["Copiat ✓","Copied ✓"],off:["Dezactivează codul","Disable the code"],noCode:["Niciun cod activ: nimeni nu poate deveni admin cu un cod.","No active code: nobody can become admin with a code."],
  codeSaved:["Cod nou activ. Cel vechi nu mai merge.","New code active. The old one no longer works."],codeOff:["Codul a fost dezactivat.","The code has been disabled."],
  name:["Nume","Name"],email:["E-mail","Email"],status:["Stare","Status"],last:["Văzut ultima dată","Last seen"],where:["Pagina","Page"],tests:["Teste","Quizzes"],avg:["Medie","Average"],since:["Cont creat","Joined"],act:["",""],
  on:["Online","Online"],away:["Activ recent","Recently active"],onNow:["Online acum","Online now"],nobody:["Nimeni nu e online în acest moment.","Nobody is online right now."],
  now:["Acum pe:","Now on:"],signal:["ultimul semnal","last signal"],live:["Se actualizează singur ·","Updates live ·"],offline:["Offline","Offline"],never:["niciodată","never"],
  fAll:["Toți","All"],fOn:["Online","Online"],fToday:["Azi","Today"],search:["Caută nume sau e-mail","Search name or email"],
  kUsers:["utilizatori","users"],kOn:["online acum","online now"],kToday:["activi azi","active today"],kTests:["teste terminate","quizzes finished"],
  make:["Fă admin","Make admin"],remove:["Scoate admin","Remove admin"],you:["tu","you"],how:{code:["prin cod","by code"],granted:["adăugat de un admin","added by an admin"],console:["din consolă","from the console"]},
  statusNote:["Online = pagina e deschisă și activă (semnal la fiecare minut). Activ recent = văzut în ultimele 15 minute.","Online = the page is open and active (a signal every minute). Recently active = seen in the last 15 minutes."],
  confirmRm:["Scoți drepturile de administrator pentru {n}?","Remove administrator rights from {n}?"],empty:["Niciun utilizator găsit.","No users found."],err:["Acțiunea n-a reușit: ","The action failed: "]
};
const T=k=>{const v=k.includes(".")?k.split(".").reduce((o,p)=>o[p],UI):UI[k];return v[lang==="en"?1:0]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const rtf=()=>new Intl.RelativeTimeFormat(lang==="en"?"en":"ro",{numeric:"auto"});
function ago(d){if(!d)return T("never");const s=(Date.now()-d.getTime())/1000;if(s<45)return rtf().format(0,"second");
  const u=[[60,"second"],[3600,"minute"],[86400,"hour"],[604800,"day"],[2629800,"week"],[31557600,"month"],[Infinity,"year"]];
  let prev=1;for(const [lim,unit] of u){if(s<lim){const div={second:1,minute:60,hour:3600,day:86400,week:604800,month:2629800,year:31557600}[unit];return rtf().format(-Math.round(s/div),unit)}}}
const fmt=d=>d?d.toLocaleString(lang==="en"?"en-GB":"ro-RO",{dateStyle:"medium",timeStyle:"short"}):"—";
const statusOf=u=>{const d=u.d;if(!d)return "offline";const age=(Date.now()-d.getTime())/1000;if(u.online&&age<150)return "on";if(age<900)return "away";return "offline"};

let me=null,isAdmin=false,users=[],admins={},results=[],code=null,filter="all",unsub=[];

function render(){
  document.documentElement.lang=lang;document.title=lang==="en"?"Administration":"Administrare";
  document.querySelectorAll("[data-t]").forEach(e=>{const k=e.dataset.t;if(UI[k])e.textContent=T(k)});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
  $("#lead").textContent=isAdmin?T("leadAdmin"):T("leadGate");
  $("#q").placeholder=T("search");$("#codeIn").placeholder="XXXX-XXXX-XXXX-XXXX";
  const fb=$("#flt").querySelectorAll("button");fb[0].textContent=T("fAll");fb[1].textContent=T("fOn");fb[2].textContent=T("fToday");
  if(isAdmin)renderPanel();
}
function renderPanel(){
  const byUid={};results.forEach(r=>{const x=byUid[r.uid]=byUid[r.uid]||{n:0,sum:0};x.n++;x.sum+=r.total?100*r.score/r.total:0});
  const today=new Date();today.setHours(0,0,0,0);
  const on=users.filter(u=>statusOf(u)==="on").length,act=users.filter(u=>u.d&&u.d>=today).length;
  $("#kpis").innerHTML=[[users.length,T("kUsers")],[on,T("kOn")],[act,T("kToday")],[results.length,T("kTests")]].map(([b,s])=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join("");
  // "Online now" list: only people online at this moment, then the recently active ones
  const byLast=(a,b)=>(b.d||0)-(a.d||0);
  const onU=users.filter(u=>statusOf(u)==="on").sort(byLast),awU=users.filter(u=>statusOf(u)==="away").sort(byLast);
  const card=(u,s)=>{const ini=(u.name||u.email||"?").trim().split(/\s+/).map(p=>p[0]).slice(0,2).join("").toUpperCase();const x=byUid[u.id];
    return `<div class="oc"><span class="av">${esc(ini)}<i class="${s}"></i></span><span class="who"><b>${esc(u.name||"—")}${admins[u.id]?`<span class="badge">admin</span>`:""}${me&&u.id===me.uid?` <span class="muted">(${T("you")})</span>`:""}</b><span>${esc(u.email)}</span>
<span>${T("now")} ${u.path?`<a href="${esc(u.path)}">${esc(u.page||u.path)}</a>`:"—"}</span><span>${s==="on"?T("signal")+" "+esc(ago(u.d)):T("last")+": "+esc(ago(u.d))}${x?` · ${x.n} ${x.n===1?(lang==="en"?"quiz":"test"):T("tests").toLowerCase()}`:""}</span></span></div>`};
  $("#onT").textContent=`🟢 ${T("onNow")} (${onU.length})`;
  $("#onList").innerHTML=onU.length?onU.map(u=>card(u,"on")).join(""):`<p class="muted">${T("nobody")}</p>`;
  $("#awT").textContent=`🟡 ${T("away")} (${awU.length})`;$("#awT").hidden=!awU.length;
  $("#awList").innerHTML=awU.map(u=>card(u,"away")).join("");
  $("#onUpd").textContent=T("live")+" "+new Date().toLocaleTimeString(lang==="en"?"en-GB":"ro-RO",{hour:"2-digit",minute:"2-digit",second:"2-digit"});

  const q=$("#q").value.trim().toLowerCase();
  const rank={on:0,away:1,offline:2};
  const list=users.filter(u=>(!q||(u.name+" "+u.email).toLowerCase().includes(q))&&(filter==="all"||(filter==="on"&&statusOf(u)==="on")||(filter==="today"&&u.d&&u.d>=today)))
    .sort((a,b)=>rank[statusOf(a)]-rank[statusOf(b)]||((b.d||0)-(a.d||0)));
  let h=`<table style="min-width:860px"><thead><tr><th>${T("status")}</th><th>${T("name")}</th><th>${T("email")}</th><th>${T("last")}</th><th>${T("where")}</th><th>${T("tests")}</th><th>${T("avg")}</th><th>${T("since")}</th><th></th></tr></thead><tbody>`;
  list.forEach(u=>{const s=statusOf(u),x=byUid[u.id],adm=!!admins[u.id],self=me&&u.id===me.uid;
    h+=`<tr><td><span class="st"><i class="dot ${s==="on"?"on":s==="away"?"away":""}"></i>${T(s)}</span></td>
<td>${esc(u.name||"—")}${adm?`<span class="badge">admin</span>`:""}${self?` <span class="muted">(${T("you")})</span>`:""}</td><td>${esc(u.email)}</td>
<td class="n" title="${esc(fmt(u.d))}">${s==="on"?`<b>${T("on")}</b>`:esc(ago(u.d))}<br><span class="muted" style="font-size:.78rem">${esc(fmt(u.d))}</span></td>
<td>${u.path?`<a href="${esc(u.path)}">${esc(u.page||u.path)}</a>`:"—"}</td><td class="n">${x?x.n:0}</td><td class="n">${x?Math.round(x.sum/x.n)+"%":"—"}</td>
<td class="n">${u.created?esc(new Date(u.created).toLocaleDateString(lang==="en"?"en-GB":"ro-RO")):"—"}</td>
<td>${self?"":adm?`<button type="button" class="btn-sm" data-rm="${esc(u.id)}">${T("remove")}</button>`:`<button type="button" class="btn-sm" data-mk="${esc(u.id)}">${T("make")}</button>`}</td></tr>`});
  $("#users").innerHTML=list.length?h+`</tbody></table>`:`<p class="muted">${T("empty")}</p>`;
  const al=Object.entries(admins);
  $("#admins").innerHTML=`<ul style="margin:0;padding-left:18px;line-height:1.8">${al.map(([id,a])=>{const u=users.find(x=>x.id===id);return `<li><b>${esc((u&&u.name)||a.name||id.slice(0,8))}</b> <span class="muted">${esc((u&&u.email)||a.email||"")} · ${UI.how[a.how]?T("how."+a.how):T("how.console")}</span>${me&&id===me.uid?` <span class="muted">(${T("you")})</span>`:""}</li>`}).join("")}</ul>`;
  $("#codeBox").innerHTML=code?`<p class="code" id="codeVal">${esc(code)}</p>`:`<p class="muted">${T("noCode")}</p>`;
  $("#copyCode").disabled=!code;$("#offCode").disabled=!code;
}

function randomCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const b=new Uint32Array(16);crypto.getRandomValues(b);let s="";b.forEach((v,i)=>{s+=A[v%A.length];if(i%4===3&&i<15)s+="-"});return s}
const who=u=>({name:(u&&(u.displayName||(u.email||"").split("@")[0]))||"",email:(u&&u.email)||""});

async function startPanel(){
  isAdmin=true;$("#gate").hidden=true;$("#panel").hidden=false;render();
  unsub.push(onSnapshot(collection(db,"users"),s=>{users=s.docs.map(d=>{const x=d.data();return {id:d.id,...x,d:x.lastSeen&&x.lastSeen.toDate?x.lastSeen.toDate():null}});renderPanel()},e=>console.error(e)));
  unsub.push(onSnapshot(collection(db,"admins"),s=>{admins={};s.docs.forEach(d=>admins[d.id]=d.data());renderPanel()},e=>console.error(e)));
  unsub.push(onSnapshot(collection(db,"results"),s=>{results=s.docs.map(d=>d.data());renderPanel()},e=>console.error(e)));
  unsub.push(onSnapshot(doc(db,"config","admin"),s=>{code=s.exists()?s.data().code:null;renderPanel()},e=>console.error(e)));
  setInterval(()=>{if(!$("#panel").hidden)renderPanel()},15000);
}

onAuthStateChanged(auth,async u=>{
  if(!u)return;me=u;
  try{const a=await getDoc(doc(db,"admins",u.uid));if(a.exists()){startPanel();return}}catch(e){console.warn(e)}
  $("#gate").hidden=false;$("#panel").hidden=true;render();
});

$("#codeBtn").onclick=async()=>{const v=$("#codeIn").value.trim().toUpperCase();const m=$("#gateMsg");if(!v)return;
  try{await setDoc(doc(db,"admins",me.uid),{role:"admin",how:"code",code:v,at:serverTimestamp(),...who(me)});m.className="msg good";m.textContent=T("okCode");setTimeout(startPanel,600)}
  catch(e){m.className="msg bad";m.textContent=T("badCode")}};
$("#codeIn").addEventListener("keydown",e=>{if(e.key==="Enter")$("#codeBtn").click()});
$("#genCode").onclick=async()=>{const m=$("#codeMsg");try{await setDoc(doc(db,"config","admin"),{code:randomCode(),by:me.uid,at:serverTimestamp()});m.className="msg good";m.textContent=T("codeSaved")}catch(e){m.className="msg bad";m.textContent=T("err")+e.code}};
$("#offCode").onclick=async()=>{const m=$("#codeMsg");try{await deleteDoc(doc(db,"config","admin"));m.className="msg good";m.textContent=T("codeOff")}catch(e){m.className="msg bad";m.textContent=T("err")+e.code}};
$("#copyCode").onclick=async()=>{if(!code)return;try{await navigator.clipboard.writeText(code)}catch(e){}$("#copyCode").textContent=T("copied");setTimeout(()=>{$("#copyCode").textContent=T("copy")},2000)};
$("#users").addEventListener("click",async e=>{const mk=e.target.closest("[data-mk]"),rm=e.target.closest("[data-rm]");
  try{if(mk){const u=users.find(x=>x.id===mk.dataset.mk);mk.disabled=true;await setDoc(doc(db,"admins",mk.dataset.mk),{role:"admin",how:"granted",by:me.uid,at:serverTimestamp(),name:(u&&u.name)||"",email:(u&&u.email)||""})}
    if(rm){const u=users.find(x=>x.id===rm.dataset.rm);if(!confirm(T("confirmRm").replace("{n}",(u&&u.name)||rm.dataset.rm)))return;rm.disabled=true;await deleteDoc(doc(db,"admins",rm.dataset.rm))}}
  catch(err){alert(T("err")+err.code)}});
$("#q").addEventListener("input",()=>{if(isAdmin)renderPanel()});
$("#flt").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;filter=b.dataset.f;$("#flt").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));renderPanel()});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("cadru-lang",lang);render()});
const saved=store.get("cadru-theme");if(saved==="light"||saved==="dark")document.documentElement.dataset.theme=saved;
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const nt=d?"light":"dark";r.dataset.theme=nt;store.set("cadru-theme",nt)};
render();
</script>
</body>
</html>
