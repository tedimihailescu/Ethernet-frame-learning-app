sub:{ro:"În fiecare noapte, aplicația de plăți produce un fișier mare cu toate plățile zilei, care trebuie să ajungă la core-banking întreg, o singură dată și cu dovadă. Urmărim un flux XFB prin Axway Transfer CFT: partener și IDF, sesiune PeSIT cu TLS, checkpoint-uri și reluare după o cădere de rețea, procedura de final, confirmarea, stările din catalog și urmărirea în Sentinel.",en:"Every night, the payments app produces a large file with all of the day's payments, which must reach core-banking complete, exactly once and with proof. We follow an XFB flow through Axway Transfer CFT: partner and IDF, a PeSIT session with TLS, checkpoints and restart after a network drop, the end-of-transfer procedure, the acknowledgement, the catalog states and tracking in Sentinel."},

steps:[
{at:["cft1","cft2"],frame:null,kind:"none",tables:["vs"],who:{ro:"Ideea",en:"The idea"},
 title:{ro:"De ce un monitor de transfer și nu un script FTP",en:"Why a transfer monitor and not an FTP script"},
 body:{ro:`<p>Fișierul de plăți are 48 MB. Dacă îl copiem cu un script FTP și rețeaua cade la jumătate, avem trei probleme: trebuie luat de la zero, cineva trebuie să observe, iar core-banking ar putea importa <strong>o jumătate de fișier</strong>.</p>
<p><strong>Transfer CFT</strong> (familia de produse XFB de la Axway) rezolvă asta. Pe fiecare server rulează un CFT; cele două vorbesc între ele, țin evidența fiecărui transfer într-un <strong>catalog</strong>, reiau singure după erori și lasă o dovadă.</p>
<p class="key">Un <strong>flux XFB</strong> = ce fișier, de la cine, la cine și ce se întâmplă după ce ajunge.</p>`,
 en:`<p>The payments file is 48 MB. If we copy it with an FTP script and the network drops halfway, we have three problems: it must start over, someone has to notice, and core-banking might import <strong>half a file</strong>.</p>
<p><strong>Transfer CFT</strong> (Axway's XFB product family) solves this. A CFT runs on each server; the two talk to each other, record every transfer in a <strong>catalog</strong>, resume on their own after errors and leave proof.</p>
<p class="key">An <strong>XFB flow</strong> = which file, from whom, to whom, and what happens once it arrives.</p>`}},

{at:"cft1",frame:null,kind:"none",tables:["conf"],who:{ro:"Configurare",en:"Configuration"},
 title:{ro:"Partenerul și IDF-ul: fluxul are un nume",en:"The partner and the IDF: the flow has a name"},
 body:{ro:`<p>Înainte de primul transfer, administratorii definesc două lucruri pe fiecare CFT:</p>
<ul><li><strong>Partenerul</strong> (<code>CFTPART</code> + <code>CFTTCP</code>): cu cine vorbim, la ce adresă, cu ce protocol și cu ce nume ne prezentăm. Pentru CFT APP, partenerul se numește <code>CORE</code>.</li>
<li><strong>IDF-ul</strong> (identificatorul de fișier): numele <em>fluxului</em>, aici <code>PAYOUT</code>. Pe CFT APP există un <code>CFTSEND ID=PAYOUT</code> (cum trimit), pe CFT CORE un <code>CFTRECV ID=PAYOUT</code> (unde pun fișierul și ce rulez apoi).</li></ul>
<p>Aplicația nu știe adrese, porturi sau parole. Spune doar: „trimite fișierul ăsta, fluxul PAYOUT, partenerului CORE”.</p>`,
 en:`<p>Before the first transfer, admins define two things on each CFT:</p>
<ul><li><strong>The partner</strong> (<code>CFTPART</code> + <code>CFTTCP</code>): who we talk to, at which address, with which protocol and under which name we introduce ourselves. For CFT APP, the partner is called <code>CORE</code>.</li>
<li><strong>The IDF</strong> (file identifier): the <em>flow's</em> name, here <code>PAYOUT</code>. CFT APP has a <code>CFTSEND ID=PAYOUT</code> (how I send), CFT CORE has a <code>CFTRECV ID=PAYOUT</code> (where I put the file and what I run next).</li></ul>
<p>The app knows no addresses, ports or passwords. It just says: "send this file, flow PAYOUT, to partner CORE".</p>`}},

{at:"app",frame:F1,kind:"f",move:[[["app","cft1"]]],log:{ro:"cererea de transfer",en:"the transfer request"},who:"batch-plati",
 title:{ro:"Aplicația cere transferul",en:"The app requests the transfer"},
 body:{ro:`<p>Jobul de noapte a scris <code>PAY_20261112.xml</code>. Ultima lui comandă:</p>
<p><code>CFTUTIL SEND PART=CORE, IDF=PAYOUT, FNAME=/data/out/PAY_20261112.xml</code></p>
<p>CFT APP creează o linie în <strong>catalog</strong>, cu un identificator unic al transferului (IDT), în starea <strong>D</strong> (disponibil). Jobul se termină imediat: de aici, livrarea e treaba CFT-ului.</p>`,
 en:`<p>The nightly job has written <code>PAY_20261112.xml</code>. Its last command:</p>
<p><code>CFTUTIL SEND PART=CORE, IDF=PAYOUT, FNAME=/data/out/PAY_20261112.xml</code></p>
<p>CFT APP creates a line in the <strong>catalog</strong>, with a unique transfer identifier (IDT), in state <strong>D</strong> (disposed, ready). The job ends at once: from here, delivery is the CFT's job.</p>`},
 try:[{cmd:"CFTUTIL LISTCAT PART=CORE, IDF=PAYOUT",d:{ro:"Vezi transferul în catalog, cu starea lui.",en:"See the transfer in the catalog, with its state."}}]},

{at:"cft1",frame:F2,kind:"x",move:[[["cft1","cft2"]]],log:{ro:"sesiune PeSIT",en:"PeSIT session"},who:"PeSIT",
 title:{ro:"Sesiunea PeSIT: cele două CFT-uri se recunosc",en:"The PeSIT session: the two CFTs recognise each other"},
 body:{ro:`<p>CFT APP deschide o conexiune TCP spre CFT CORE pe portul <strong>1761</strong> și pornește <strong>TLS</strong>: fiecare parte își arată certificatul (mTLS).</p>
<p>Peste TLS vorbesc <strong>PeSIT</strong>, protocolul nativ între CFT-uri, făcut pentru transferuri bancare. În prima cerere, CFT APP se prezintă cu numele lui de partener și o parolă de partener; CFT CORE verifică dacă îl cunoaște și dacă are voie să trimită fluxul PAYOUT.</p>
<p>Starea devine <strong>C</strong> (în curs).</p>`,
 en:`<p>CFT APP opens a TCP connection to CFT CORE on port <strong>1761</strong> and starts <strong>TLS</strong>: each side shows its certificate (mTLS).</p>
<p>Over TLS they speak <strong>PeSIT</strong>, the native protocol between CFTs, designed for banking transfers. In the first request, CFT APP introduces itself with its partner name and a partner password; CFT CORE checks that it knows it and that it may send the PAYOUT flow.</p>
<p>The state becomes <strong>C</strong> (current).</p>`},
 more:{ro:`<p>Transfer CFT știe și alte protocoale (SFTP, FTP/S, ODETTE), dar între două CFT-uri PeSIT e alegerea obișnuită: are checkpoint-uri, reluare și confirmări încorporate.</p>`,
  en:`<p>Transfer CFT also speaks other protocols (SFTP, FTP/S, ODETTE), but between two CFTs PeSIT is the usual choice: checkpoints, restart and acknowledgements are built in.</p>`}},

{at:"cft2",frame:F3,kind:"x",move:[[["cft1","cft2"]]],log:{ro:"transfer cu checkpoint-uri",en:"transfer with checkpoints"},who:"PeSIT",
 title:{ro:"Datele curg, cu checkpoint-uri",en:"The data flows, with checkpoints"},
 body:{ro:`<p>Fișierul pleacă în blocuri. La fiecare 1 MB, cele două CFT-uri pun un <strong>punct de sincronizare</strong> (checkpoint): receptorul confirmă „am scris pe disc tot până aici”.</p>
<p>Checkpoint-urile costă puțin timp, dar fac posibilă <strong>reluarea</strong>: dacă ceva se strică, nu se pierde decât porțiunea de după ultimul checkpoint.</p>`,
 en:`<p>The file goes out in blocks. Every 1 MB, the two CFTs set a <strong>sync point</strong> (checkpoint): the receiver confirms "I've written everything up to here to disk".</p>
<p>Checkpoints cost a little time, but they make <strong>restart</strong> possible: if something breaks, only the part after the last checkpoint is lost.</p>`}},

{at:"cft1",frame:F4,kind:"x",move:[[["cft1","cft2"]]],marks:{cft2:{k:"drop",t:{ro:"rețea căzută",en:"network down"}}},log:{ro:"cădere și reluare",en:"drop and restart"},who:{ro:"Cădere de rețea",en:"Network drop"},
 title:{ro:"Rețeaua cade la 60%: reluare de la checkpoint",en:"The network drops at 60%: restart from the checkpoint"},
 body:{ro:`<p>La 29 MB, un firewall repornește și conexiunea se rupe. Nimeni nu trebuie să intervină:</p>
<ol><li>CFT APP pune transferul înapoi în <strong>D</strong> și programează o reîncercare (din <code>CFTTCP</code>: de exemplu de 12 ori, la 5 minute).</li>
<li>La reconectare, cele două CFT-uri compară ultimul checkpoint comun: <strong>29 MB</strong>.</li>
<li>Transferul continuă de acolo. Nu se retrimit cei 29 MB.</li></ol>
<p class="key">Pe CFT CORE, fișierul e încă sub un <strong>nume temporar</strong>. Nimic nu poate importa o jumătate de fișier.</p>`,
 en:`<p>At 29 MB, a firewall restarts and the connection breaks. Nobody needs to step in:</p>
<ol><li>CFT APP puts the transfer back in <strong>D</strong> and schedules a retry (from <code>CFTTCP</code>: for example 12 times, every 5 minutes).</li>
<li>On reconnect, the two CFTs compare their last common checkpoint: <strong>29 MB</strong>.</li>
<li>The transfer carries on from there. The 29 MB aren't sent again.</li></ol>
<p class="key">On CFT CORE, the file still has a <strong>temporary name</strong>. Nothing can import half a file.</p>`}},

{at:"cft2",frame:F5,kind:"r",log:{ro:"fișierul a ajuns",en:"the file has arrived"},who:"CFT CORE",
 title:{ro:"Fișierul ajunge întreg și primește numele final",en:"The file arrives whole and gets its final name"},
 body:{ro:`<p>Ultimul bloc ajunge. CFT CORE verifică mărimea și numărul de înregistrări, apoi <strong>redenumește</strong> fișierul temporar (<code>WFNAME</code>) în numele final (<code>FNAME</code>) din <code>CFTRECV ID=PAYOUT</code>: <code>/data/in/PAY_20261112.xml</code>.</p>
<p>Pe ambele CFT-uri, transferul trece în starea <strong>T</strong> (terminat). Partea de rețea s-a încheiat.</p>`,
 en:`<p>The last block arrives. CFT CORE checks the size and record count, then <strong>renames</strong> the temporary file (<code>WFNAME</code>) to the final name (<code>FNAME</code>) from <code>CFTRECV ID=PAYOUT</code>: <code>/data/in/PAY_20261112.xml</code>.</p>
<p>On both CFTs, the transfer moves to state <strong>T</strong> (terminated). The network part is over.</p>`}},

{at:"cft2",frame:F6,kind:"r",move:[[["cft2","core"]]],log:{ro:"procedura de final",en:"the end procedure"},who:"CFT CORE",
 title:{ro:"Procedura de final pornește importul",en:"The end procedure starts the import"},
 body:{ro:`<p>În <code>CFTRECV ID=PAYOUT</code> scrie și <code>EXEC=/opt/cft/exec/import_payments.sh</code>. Imediat după T, CFT CORE rulează acest script și îi dă variabilele transferului: numele fișierului, partenerul, IDF-ul, IDT-ul.</p>
<p>Scriptul pornește importul în core-banking. Nu mai e nevoie de un cron care să verifice „a venit fișierul?”: <strong>sosirea fișierului declanșează procesarea</strong>.</p>
<p>Când scriptul se termină cu succes, starea devine <strong>X</strong> (executat).</p>`,
 en:`<p><code>CFTRECV ID=PAYOUT</code> also says <code>EXEC=/opt/cft/exec/import_payments.sh</code>. Right after T, CFT CORE runs this script and passes it the transfer's variables: file name, partner, IDF, IDT.</p>
<p>The script starts the import in core-banking. There's no need for a cron job checking "has the file arrived?": <strong>the file's arrival triggers the processing</strong>.</p>
<p>When the script finishes successfully, the state becomes <strong>X</strong> (executed).</p>`}},

{at:"cft2",frame:F7,kind:"f",move:[[["cft2","cft1"]]],log:{ro:"confirmarea",en:"the acknowledgement"},who:{ro:"Confirmare",en:"Acknowledgement"},
 title:{ro:"Confirmarea: „am primit și am procesat”",en:"The acknowledgement: \"received and processed\""},
 body:{ro:`<p>Faptul că fișierul a ajuns nu înseamnă că plățile au fost importate. De aceea fluxul cere o <strong>confirmare de aplicație</strong>: la sfârșitul importului, scriptul trimite înapoi un <strong>ACK</strong> (sau un NACK, dacă a găsit erori) legat de transferul original.</p>
<p>Pe CFT APP, linia din catalog arată acum: trimis, livrat și <strong>confirmat</strong>. Echipa de plăți are dovada completă, cu ore.</p>`,
 en:`<p>A file arriving doesn't mean the payments were imported. That's why the flow asks for an <strong>application acknowledgement</strong>: at the end of the import, the script sends back an <strong>ACK</strong> (or a NACK if it found errors) tied to the original transfer.</p>
<p>On CFT APP, the catalog line now shows: sent, delivered and <strong>acknowledged</strong>. The payments team has full proof, with times.</p>`}},

{at:"cft2",frame:F8,kind:"x",marks:{cft2:{k:"drop",t:{ro:"disc plin",en:"disk full"}}},tables:["states"],hl:{states:"K"},log:{ro:"a doua zi: eroare",en:"the next day: an error"},who:{ro:"Starea K",en:"State K"},
 title:{ro:"A doua zi: transferul rămâne în K",en:"The next day: the transfer stays in K"},
 body:{ro:`<p>A doua noapte, discul de pe serverul CORE se umple la jumătatea transferului. Aceasta nu e o problemă de rețea, iar reîncercarea n-ar ajuta. CFT oprește transferul în starea <strong>K</strong> (kept, păstrat cu eroare) și scrie un cod de diagnostic (<code>DIAGI</code>).</p>
<p>Operatorul:</p>
<ol><li>caută transferurile în K (<code>LISTCAT STATE=K</code>) și citește diagnosticul;</li>
<li>eliberează spațiu pe disc;</li>
<li>dă <code>CFTUTIL START</code> pe acel transfer: continuă de la ultimul checkpoint.</li></ol>`,
 en:`<p>The next night, the disk on the CORE server fills up halfway through the transfer. This isn't a network problem, and a retry wouldn't help. CFT stops the transfer in state <strong>K</strong> (kept on error) and writes a diagnostic code (<code>DIAGI</code>).</p>
<p>The operator:</p>
<ol><li>looks for transfers in K (<code>LISTCAT STATE=K</code>) and reads the diagnostic;</li>
<li>frees disk space;</li>
<li>runs <code>CFTUTIL START</code> on that transfer: it carries on from the last checkpoint.</li></ol>`},
 try:[{cmd:"CFTUTIL LISTCAT STATE=K",d:{ro:"Toate transferurile oprite cu eroare.",en:"Every transfer stopped on error."}},{cmd:"CFTUTIL START PART=APP, IDF=PAYOUT, IDT=K1113021",d:{ro:"Repornește transferul după reparație.",en:"Restarts the transfer after the fix."}}]},

{at:"sent",frame:F9,kind:"t",move:[[["cft1","sent"],["cft2","sent"]]],log:{ro:"urmărire în Sentinel",en:"tracking in Sentinel"},who:"Sentinel",
 title:{ro:"Sentinel: tot fluxul pe un singur ecran",en:"Sentinel: the whole flow on one screen"},
 body:{ro:`<p>Ambele CFT-uri trimit evenimente către <strong>Axway Sentinel</strong>. Pentru fiecare transfer, Sentinel ține un obiect <strong>XFBTransfer</strong> și îl actualizează la fiecare etapă: cerut, în curs, primit, executat, confirmat.</p>
<p>Echipa de suport nu mai intră pe servere. Vede în Sentinel:</p>
<ul><li>fluxurile de azi, cu starea și durata fiecăruia;</li>
<li>transferurile în eroare, cu diagnosticul;</li>
<li>o <strong>alertă</strong> dacă fluxul PAYOUT nu a ajuns în X până la ora 06:00.</li></ul>`,
 en:`<p>Both CFTs send events to <strong>Axway Sentinel</strong>. For each transfer, Sentinel keeps an <strong>XFBTransfer</strong> object and updates it at every stage: requested, in progress, received, executed, acknowledged.</p>
<p>The support team no longer logs on to servers. In Sentinel they see:</p>
<ul><li>today's flows, each with its state and duration;</li>
<li>transfers in error, with the diagnostic;</li>
<li>an <strong>alert</strong> if the PAYOUT flow hasn't reached X by 06:00.</li></ul>`}},

{at:["cft1","cft2"],frame:null,kind:"none",summary:true,tables:["states"],
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<ul><li>Un <strong>flux XFB</strong> = partener + IDF + sens; aplicația dă doar <code>SEND PART= IDF= FNAME=</code>.</li>
<li>Între CFT-uri: <strong>PeSIT peste TLS</strong>, cu autentificare de partener.</li>
<li><strong>Checkpoint-urile</strong> permit reluarea de la ultimul punct, nu de la zero; reîncercările sunt automate.</li>
<li>Fișierul are un <strong>nume temporar</strong> până e complet; apoi rulează <strong>procedura de final</strong>.</li>
<li>Stări: D → C → T → X; <strong>K</strong> = eroare (citești DIAGI, repari, START); <strong>H</strong> = oprit voit.</li>
<li><strong>ACK</strong> = dovada că fișierul a fost și procesat; <strong>Sentinel</strong> = urmărire și alerte.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<ul><li>An <strong>XFB flow</strong> = partner + IDF + direction; the app just runs <code>SEND PART= IDF= FNAME=</code>.</li>
<li>Between CFTs: <strong>PeSIT over TLS</strong>, with partner authentication.</li>
<li><strong>Checkpoints</strong> allow restarting from the last point, not from zero; retries are automatic.</li>
<li>The file keeps a <strong>temporary name</strong> until complete; then the <strong>end procedure</strong> runs.</li>
<li>States: D → C → T → X; <strong>K</strong> = error (read DIAGI, fix, START); <strong>H</strong> = stopped on purpose.</li>
<li><strong>ACK</strong> = proof the file was also processed; <strong>Sentinel</strong> = tracking and alerts.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],
