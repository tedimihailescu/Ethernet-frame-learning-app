sub:{ro:"După o actualizare, site-ul de pe serverul web01 nu mai răspunde: nginx nu pornește. Urmărim ce face systemd când pornește un serviciu și depanăm pas cu pas: o cale greșită în unit (203/EXEC), apoi un port ocupat de un apache2 uitat. Folosim systemctl, journalctl, nginx -t, ss și ps, și oprim procesele corect, fără kill -9.",en:"After an upgrade, the site on the web01 server stops answering: nginx won't start. We follow what systemd does when it starts a service and troubleshoot step by step: a wrong path in the unit (203/EXEC), then a port taken by a forgotten apache2. We use systemctl, journalctl, nginx -t, ss and ps, and stop processes properly, without kill -9."},

steps:[
{at:"port",frame:S1,kind:"s",move:[[["cl","port"]]],marks:{port:{k:"drop",t:"RST"}},log:{ro:"simptomul",en:"the symptom"},who:{ro:"Simptomul",en:"The symptom"},
 title:{ro:"Simptomul: „Connection refused” pe portul 80",en:"The symptom: \"Connection refused\" on port 80"},
 body:{ro:`<p>După actualizarea de aseară, <code>curl -I http://web01</code> răspunde imediat: <strong>Connection refused</strong>.</p>
<p>„Refused” e o veste bună pentru depanare: pachetul a ajuns la server, iar kernelul a răspuns cu RST pentru că <strong>nimeni nu ascultă</strong> pe portul 80. Rețeaua e în regulă; problema e serviciul.</p>
<p>Pe Linux, serviciile ca nginx sunt pornite și supravegheate de <strong>systemd</strong> (PID 1). Acolo începem.</p>`,
 en:`<p>After last night's upgrade, <code>curl -I http://web01</code> answers straight away: <strong>Connection refused</strong>.</p>
<p>"Refused" is good news for troubleshooting: the packet reached the server, and the kernel answered with a RST because <strong>nothing listens</strong> on port 80. The network is fine; the problem is the service.</p>
<p>On Linux, services like nginx are started and watched by <strong>systemd</strong> (PID 1). That's where we start.</p>`}},

{at:"sysd",frame:S2,kind:"s",move:[[["adm","sysd"]]],tables:["start"],hl:{start:"3"},log:{ro:"203/EXEC",en:"203/EXEC"},who:"systemctl status",
 title:{ro:"systemctl status: failed, cu status=203/EXEC",en:"systemctl status: failed, with status=203/EXEC"},
 body:{ro:`<p><code>systemctl status nginx --no-pager</code> arată într-un singur loc: starea (<strong>failed</strong>), comanda pornită, codul de ieșire și ultimele linii din jurnal.</p>
<p>Detaliul cheie: <code>status=203/EXEC</code>. Codurile 200+ sunt ale lui systemd, nu ale programului. <strong>203/EXEC</strong> înseamnă că systemd a încercat să execute <code>ExecStart</code> și n-a reușit: nginx <em>nici n-a pornit</em>.</p>
<p>Cauze tipice: calea nu există, fișierul nu are bitul <code>x</code>, un script are shebang greșit sau stă pe o partiție montată <code>noexec</code>.</p>`,
 en:`<p><code>systemctl status nginx --no-pager</code> shows in one place: the state (<strong>failed</strong>), the command started, the exit code and the last journal lines.</p>
<p>The key detail: <code>status=203/EXEC</code>. Codes 200+ belong to systemd, not to the program. <strong>203/EXEC</strong> means systemd tried to execute <code>ExecStart</code> and couldn't: nginx <em>never even started</em>.</p>
<p>Typical causes: the path doesn't exist, the file lacks the <code>x</code> bit, a script has a wrong shebang or sits on a partition mounted <code>noexec</code>.</p>`},
 more:{ro:`<p><code>--no-pager</code> afișează tot direct, fără <code>less</code>: util în scripturi și când copiezi rezultatul într-un tichet.</p>`,
  en:`<p><code>--no-pager</code> prints everything directly, without <code>less</code>: handy in scripts and when you paste the output into a ticket.</p>`},
 try:[{cmd:"systemctl status nginx --no-pager",d:{ro:"Starea, PID-ul, codul de ieșire, ultimele loguri.",en:"State, PID, exit code, latest logs."}}]},

{at:"unit",frame:S3,kind:"s",move:[[["sysd","unit"]]],tables:["codes"],hl:{codes:"203/EXEC"},log:{ro:"cale greșită în unit",en:"wrong path in the unit"},who:"systemctl cat",
 title:{ro:"Unit file-ul: o cale care nu mai există",en:"The unit file: a path that no longer exists"},
 body:{ro:`<p><code>systemctl cat nginx</code> arată unit file-ul și eventualele <em>drop-in</em>-uri care îl modifică. <code>systemctl show nginx -p ExecStart</code> arată exact comanda folosită:</p>
<p><code>/usr/local/sbin/nginx</code>, dar <code>ls -l</code> spune <em>No such file or directory</em>. <code>command -v nginx</code> găsește programul în <code>/usr/sbin/nginx</code>.</p>
<p>Ce s-a întâmplat: cineva compilase nginx de mână în <code>/usr/local</code> și scrisese un unit propriu. Actualizarea a trecut la pachetul oficial, care a șters vechiul binar.</p>`,
 en:`<p><code>systemctl cat nginx</code> shows the unit file and any <em>drop-ins</em> that change it. <code>systemctl show nginx -p ExecStart</code> shows the exact command used:</p>
<p><code>/usr/local/sbin/nginx</code>, but <code>ls -l</code> says <em>No such file or directory</em>. <code>command -v nginx</code> finds the program in <code>/usr/sbin/nginx</code>.</p>
<p>What happened: someone had built nginx by hand in <code>/usr/local</code> and written their own unit. The upgrade switched to the official package, which removed the old binary.</p>`},
 more:{ro:`<p>În unit-ul nginx mai apare de obicei <code>ExecStartPre=/usr/sbin/nginx -t</code>: pregătește și verifică înainte de pornire. <code>ExecStart</code> e cel care pornește efectiv serviciul.</p>`,
  en:`<p>The nginx unit usually also has <code>ExecStartPre=/usr/sbin/nginx -t</code>: it prepares and checks before starting. <code>ExecStart</code> is what actually starts the service.</p>`},
 try:[{cmd:"systemctl cat nginx",d:{ro:"Unit-ul și drop-in-urile.",en:"The unit and its drop-ins."}},{cmd:"systemctl show nginx -p ExecStart",d:{ro:"Comanda exactă.",en:"The exact command."}}]},

{at:"ng",frame:S4,kind:"s",move:[[["adm","sysd"]],[["sysd","unit"]],[["sysd","ng"]]],marks:{ng:{k:"drop",t:"exit 1"}},log:{ro:"cale corectată, altă eroare",en:"path fixed, another error"},who:"systemctl edit",
 title:{ro:"Corectăm calea cu un drop-in. Pornește… și cade",en:"We fix the path with a drop-in. It starts… and falls over"},
 body:{ro:`<p>Nu editezi direct fișierul din <code>/lib/systemd/system</code>: o actualizare l-ar suprascrie. <code>systemctl edit nginx</code> creează un <strong>drop-in</strong> în <code>/etc/systemd/system/nginx.service.d/override.conf</code>:</p>
<ul><li><code>ExecStart=</code> (gol): șterge valoarea veche;</li>
<li><code>ExecStart=/usr/sbin/nginx</code>: noua comandă.</li></ul>
<p><code>systemctl edit</code> face singur <code>daemon-reload</code>. Restart: de data asta status e <code>1/FAILURE</code>. Progres: programul a pornit (nu mai e 203), dar a ieșit singur cu o eroare. Acum ne spune nginx ce are.</p>`,
 en:`<p>You don't edit the file in <code>/lib/systemd/system</code> directly: an upgrade would overwrite it. <code>systemctl edit nginx</code> creates a <strong>drop-in</strong> in <code>/etc/systemd/system/nginx.service.d/override.conf</code>:</p>
<ul><li><code>ExecStart=</code> (empty): clears the old value;</li>
<li><code>ExecStart=/usr/sbin/nginx</code>: the new command.</li></ul>
<p><code>systemctl edit</code> runs <code>daemon-reload</code> itself. Restart: this time the status is <code>1/FAILURE</code>. Progress: the program started (no more 203), but exited with an error on its own. Now nginx will tell us what's wrong.</p>`},
 more:{ro:`<p>Dacă editezi un unit de mână, cu un editor, trebuie <code>systemctl daemon-reload</code>: altfel systemd folosește încă versiunea veche din memorie.</p>`,
  en:`<p>If you edit a unit by hand, with an editor, you need <code>systemctl daemon-reload</code>: otherwise systemd keeps using the old version in memory.</p>`}},

{at:"jr",frame:S5,kind:"s",move:[[["ng","jr"]],[["adm","jr"]]],log:{ro:"port ocupat",en:"port in use"},who:"journalctl",
 title:{ro:"journalctl: „Address already in use”",en:"journalctl: \"Address already in use\""},
 body:{ro:`<p>Tot ce scrie un serviciu pe stdout/stderr ajunge în <strong>journald</strong>. <code>journalctl -u nginx -b -n 50 --no-pager</code> filtrează:</p>
<ul><li><code>-u nginx</code>: doar unitatea asta;</li>
<li><code>-b</code>: doar boot-ul curent;</li>
<li><code>-n 50</code>: ultimele 50 de linii.</li></ul>
<p>Linia importantă: <code>bind() to 0.0.0.0:80 failed (98: Address already in use)</code>. nginx a încercat să deschidă portul 80 și kernelul a refuzat: <strong>alt proces îl folosește deja</strong>.</p>`,
 en:`<p>Everything a service writes to stdout/stderr goes to <strong>journald</strong>. <code>journalctl -u nginx -b -n 50 --no-pager</code> filters:</p>
<ul><li><code>-u nginx</code>: only this unit;</li>
<li><code>-b</code>: only the current boot;</li>
<li><code>-n 50</code>: the last 50 lines.</li></ul>
<p>The important line: <code>bind() to 0.0.0.0:80 failed (98: Address already in use)</code>. nginx tried to open port 80 and the kernel refused: <strong>another process already uses it</strong>.</p>`},
 more:{ro:`<p><code>journalctl -u nginx -f</code> urmărește jurnalul live, ca <code>tail -f</code>. <code>journalctl -b -1</code> arată boot-ul anterior: util după un restart neașteptat.</p>`,
  en:`<p><code>journalctl -u nginx -f</code> follows the journal live, like <code>tail -f</code>. <code>journalctl -b -1</code> shows the previous boot: handy after an unexpected restart.</p>`},
 try:[{cmd:"journalctl -u nginx -b -n 50 --no-pager",d:{ro:"Ultimele 50 de linii ale unității, boot-ul curent.",en:"The unit's last 50 lines, current boot."}}]},

{at:"ng",frame:S6,kind:"s",log:{ro:"sintaxa e corectă",en:"the syntax is fine"},who:"nginx -t",
 title:{ro:"nginx -t: configurația e bună, dar asta nu e tot",en:"nginx -t: the config is fine, but that's not everything"},
 body:{ro:`<p>Mulți încep cu <code>nginx -t</code>: testează sintaxa configurației fără să pornească serverul. Rezultat: <em>syntax is ok</em>, <em>test is successful</em>.</p>
<p>Util, dar trebuie să știi ce <strong>nu</strong> dovedește: nu verifică dacă portul 80 e liber, dacă certificatele pot fi citite de utilizatorul serviciului sau dacă upstream-urile răspund.</p>
<p class="key">Pentru fiecare comandă, întreabă-te: ce dovedește rezultatul, și ce nu?</p>`,
 en:`<p>Many people start with <code>nginx -t</code>: it tests the configuration's syntax without starting the server. Result: <em>syntax is ok</em>, <em>test is successful</em>.</p>
<p>Useful, but you need to know what it does <strong>not</strong> prove: it doesn't check whether port 80 is free, whether the service user can read the certificates, or whether upstreams answer.</p>
<p class="key">For every command, ask yourself: what does the output prove, and what doesn't it?</p>`},
 try:[{cmd:"sudo nginx -t",d:{ro:"Testează configurația.",en:"Tests the configuration."}}]},

{at:"port",frame:S7,kind:"s",move:[[["ap","port"]]],marks:{port:{k:"drop",t:"apache2"}},log:{ro:"apache2 ține portul",en:"apache2 holds the port"},who:"ss",
 title:{ro:"ss: apache2 ține portul 80",en:"ss: apache2 holds port 80"},
 body:{ro:`<p><code>sudo ss -ltnp "sport = :80"</code> arată socket-ul în ascultare pe portul 80 și procesele care îl țin: <code>apache2</code>, PID-urile 812, 814, 815.</p>
<p>Apache rămăsese instalat de la o configurare veche. Până ieri nu conta, pentru că nginx pornea primul la boot. După actualizare, ordinea s-a schimbat și apache2 a prins portul.</p>
<p>Nu opri nimic încă: întâi află ce e procesul și cine îl gestionează.</p>`,
 en:`<p><code>sudo ss -ltnp "sport = :80"</code> shows the socket listening on port 80 and the processes holding it: <code>apache2</code>, PIDs 812, 814, 815.</p>
<p>Apache had been left installed from an old setup. Until yesterday it didn't matter, because nginx started first at boot. After the upgrade the order changed and apache2 grabbed the port.</p>
<p>Don't stop anything yet: first find out what the process is and who manages it.</p>`},
 try:[{cmd:"sudo ss -ltnp \"sport = :80\"",d:{ro:"Cine ascultă pe 80.",en:"Who listens on 80."}}]},

{at:"ap",frame:S8,kind:"s",log:{ro:"master-ul și unit-ul apache2",en:"apache2's master and unit"},who:"ps --forest",
 title:{ro:"ps --forest: master-ul, copiii și cine i-a pornit",en:"ps --forest: the master, the children and who started them"},
 body:{ro:`<p>Un server web are de obicei un proces <strong>master</strong> și mai mulți <strong>workeri</strong>. <code>ps -eo pid,ppid,stat,cmd --forest</code> arată arborele:</p>
<ul><li><code>812</code> are părintele <code>1</code> (systemd): el e master-ul;</li>
<li><code>814</code>, <code>815</code> au părintele <code>812</code>: workeri.</li></ul>
<p>Părintele 1 sugerează un serviciu systemd. <code>systemctl status apache2</code> confirmă: <strong>active (running)</strong> și <strong>enabled</strong>. Deci dacă omori doar procesul, systemd îl poate reporni, iar la boot pornește din nou.</p>`,
 en:`<p>A web server usually has one <strong>master</strong> process and several <strong>workers</strong>. <code>ps -eo pid,ppid,stat,cmd --forest</code> shows the tree:</p>
<ul><li><code>812</code> has parent <code>1</code> (systemd): it's the master;</li>
<li><code>814</code>, <code>815</code> have parent <code>812</code>: workers.</li></ul>
<p>Parent 1 hints at a systemd service. <code>systemctl status apache2</code> confirms: <strong>active (running)</strong> and <strong>enabled</strong>. So if you just kill the process, systemd may restart it, and it comes back at boot.</p>`},
 more:{ro:`<p>Trucul <code>grep [a]pache2</code> evită ca grep să se găsească pe el însuși în listă: textul căutat e „apache2”, dar linia lui grep conține „[a]pache2”.</p>`,
  en:`<p>The <code>grep [a]pache2</code> trick stops grep from finding itself in the list: the pattern matches "apache2", but grep's own line contains "[a]pache2".</p>`},
 try:[{cmd:"ps -eo pid,ppid,stat,cmd --forest",d:{ro:"Arborele proceselor.",en:"The process tree."}}]},

{at:"ap",frame:S9,kind:"s",move:[[["adm","sysd"]],[["sysd","ap"]]],marks:{ap:{k:"ok",t:{ro:"oprit",en:"stopped"}}},tables:["sig"],hl:{sig:"SIGTERM (15)"},log:{ro:"apache2 oprit și dezactivat",en:"apache2 stopped and disabled"},who:{ro:"Oprire curată",en:"Clean stop"},
 title:{ro:"Oprim apache2 prin systemd, nu cu kill -9",en:"We stop apache2 through systemd, not with kill -9"},
 body:{ro:`<p>Pentru că apache2 e un serviciu, îl oprești prin <strong>managerul lui</strong>: <code>systemctl disable --now apache2</code>.</p>
<ul><li><code>--now</code>: îl oprește acum (systemd trimite SIGTERM master-ului și așteaptă să termine curat);</li>
<li><code>disable</code>: nu mai pornește la boot.</li></ul>
<p>Dacă procesul nu ar fi fost un serviciu, ai fi trimis <code>kill -TERM 812</code>, doar după ce ai verificat PID-ul. <code>kill -9</code> (SIGKILL) e ultima soluție: procesul nu mai apucă să închidă fișiere și conexiuni.</p>`,
 en:`<p>Because apache2 is a service, you stop it through <strong>its manager</strong>: <code>systemctl disable --now apache2</code>.</p>
<ul><li><code>--now</code>: stops it now (systemd sends SIGTERM to the master and waits for a clean exit);</li>
<li><code>disable</code>: it no longer starts at boot.</li></ul>
<p>If the process hadn't been a service, you'd have sent <code>kill -TERM 812</code>, only after checking the PID. <code>kill -9</code> (SIGKILL) is the last resort: the process gets no chance to close files and connections.</p>`},
 more:{ro:`<p>Dacă apache2 nu mai trebuie deloc, îl dezinstalezi. <code>systemctl mask apache2</code> îl blochează complet: nu poate fi pornit nici manual, nici ca dependență.</p>`,
  en:`<p>If apache2 isn't needed at all, uninstall it. <code>systemctl mask apache2</code> blocks it completely: it can't be started manually or as a dependency.</p>`}},

{at:"ng",frame:S10,kind:"s",move:[[["adm","sysd"]],[["sysd","ng"]],[["ng","port"]]],marks:{ng:{k:"ok",t:"active"}},tables:["states"],hl:{states:"systemctl is-enabled"},log:{ro:"nginx pornit și activat",en:"nginx started and enabled"},who:"enable --now",
 title:{ro:"enable --now: pornit acum și la fiecare boot",en:"enable --now: started now and at every boot"},
 body:{ro:`<p><code>systemctl enable --now nginx</code> face două lucruri diferite deodată:</p>
<ul><li><strong>start</strong>: pornește serviciul acum;</li>
<li><strong>enable</strong>: creează legătura care îl pornește la boot.</li></ul>
<p>La interviu, întrebarea „pornește la boot?” și „rulează acum?” au răspunsuri separate: <code>is-enabled</code> → <em>enabled</em>, <code>is-active</code> → <em>active</em>. Un serviciu poate fi enabled dar failed, sau active dar disabled (pornit de mână, dispare la restart).</p>`,
 en:`<p><code>systemctl enable --now nginx</code> does two different things at once:</p>
<ul><li><strong>start</strong>: starts the service now;</li>
<li><strong>enable</strong>: creates the link that starts it at boot.</li></ul>
<p>In an interview, "does it start at boot?" and "is it running now?" have separate answers: <code>is-enabled</code> → <em>enabled</em>, <code>is-active</code> → <em>active</em>. A service can be enabled but failed, or active but disabled (started by hand, gone after a reboot).</p>`},
 try:[{cmd:"systemctl is-enabled nginx; systemctl is-active nginx",d:{ro:"Boot și starea curentă, separat.",en:"Boot and current state, separately."}}]},

{at:["cl","ng"],frame:S11,kind:"s",move:[[["cl","port"],["port","ng"]],[["ng","port"],["port","cl"]]],marks:{cl:{k:"ok",t:"200 OK"}},log:{ro:"verificat",en:"verified"},who:{ro:"Verificarea",en:"Verification"},
 title:{ro:"Verificarea: același curl ca la început",en:"Verification: the same curl as at the start"},
 body:{ro:`<p>Refacem testul de la pasul 1: <code>curl -I http://web01</code> → <strong>HTTP/1.1 200 OK</strong>, <code>Server: nginx</code>.</p>
<ul><li><code>ss -ltnp "sport = :80"</code> arată acum nginx pe portul 80;</li>
<li><code>journalctl -u nginx -b</code> nu mai are erori;</li>
<li>un restart de test (într-o fereastră de mentenanță) confirmă că pornește nginx, nu apache2.</li></ul>
<p class="key">Două cauze, găsite pe rând: o cale greșită în unit (203/EXEC) și un port ocupat (Address already in use).</p>`,
 en:`<p>We repeat the test from step 1: <code>curl -I http://web01</code> → <strong>HTTP/1.1 200 OK</strong>, <code>Server: nginx</code>.</p>
<ul><li><code>ss -ltnp "sport = :80"</code> now shows nginx on port 80;</li>
<li><code>journalctl -u nginx -b</code> has no more errors;</li>
<li>a test reboot (in a maintenance window) confirms nginx starts, not apache2.</li></ul>
<p class="key">Two causes, found one after the other: a wrong path in the unit (203/EXEC) and a taken port (Address already in use).</p>`}},

{at:["sysd","unit","ng","jr","port"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<ul><li><strong>Refused</strong> = nimeni nu ascultă: te uiți la serviciu, nu la rețea.</li>
<li><code>systemctl status</code>: starea, PID-ul, codul de ieșire. Codurile 200+ sunt ale lui systemd: <strong>203/EXEC</strong> = programul n-a putut fi executat.</li>
<li><code>systemctl cat</code> / <code>show -p ExecStart</code>: ce pornește de fapt; schimbările se fac cu <code>systemctl edit</code> (drop-in).</li>
<li><code>journalctl -u NUME -b</code>: ce a spus programul; <code>nginx -t</code> verifică doar sintaxa.</li>
<li><code>ss -ltnp</code>: cine ține portul; <code>ps --forest</code>: master, workeri, părinte.</li>
<li>Oprești prin systemd; <code>kill -TERM</code> înainte de <code>kill -9</code>. <code>enable</code> ≠ <code>start</code>.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<ul><li><strong>Refused</strong> = nothing listens: you look at the service, not the network.</li>
<li><code>systemctl status</code>: the state, PID and exit code. Codes 200+ are systemd's: <strong>203/EXEC</strong> = the program couldn't be executed.</li>
<li><code>systemctl cat</code> / <code>show -p ExecStart</code>: what actually starts; changes go through <code>systemctl edit</code> (a drop-in).</li>
<li><code>journalctl -u NAME -b</code>: what the program said; <code>nginx -t</code> only checks the syntax.</li>
<li><code>ss -ltnp</code>: who holds the port; <code>ps --forest</code>: master, workers, parent.</li>
<li>Stop through systemd; <code>kill -TERM</code> before <code>kill -9</code>. <code>enable</code> ≠ <code>start</code>.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],

  return `<div class="ref-grid"><section class="card refcard"><h2>${ro?"Drop-in pentru nginx":"A drop-in for nginx"}</h2>
<pre class="yaml"><span class="c"># /etc/systemd/system/nginx.service.d/override.conf</span>

ExecStart=

<h3>${ro?"Servicii":"Services"}</h3>
<pre class="yaml">systemctl status nginx --no-pager
systemctl cat nginx

<h3>${ro?"Întrebări de interviu":"Interview questions"}</h3>
<pre class="yaml">${ro?"Serviciu failed?":"Service failed?"}        → systemctl status + journalctl -u

${ro?"Pornește la boot?":"Starts at boot?"}         → systemctl is-enabled
${ro?"Care e master-ul?":"Which is the master?"}     → ps --forest</pre></section></div>`;
},
