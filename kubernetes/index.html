const FQDN="backend.shop.svc.cluster.local";
const DQ={qname:FQDN,qtype:"A",srcIp:IP.fe,dstIp:IP.sdns,proto:"UDP",srcPort:"53124",dstPort:"53"};
const DR={qname:FQDN,qtype:"A",answer:"A "+IP.sbk,ttlDns:"30 s",srcIp:IP.dns,dstIp:IP.fe,proto:"UDP",srcPort:"53",dstPort:"53124"};

const DIRECT={ro:"direct (pe acest nod)",en:"direct (on this node)"};

/* ---------- DNS search-list simulator ---------- */
const KNOWN={"backend.shop":IP.sbk,"backend-public.shop":"10.96.77.3","frontend.shop":"10.96.12.4","db.shop":"10.244.1.12, 10.244.2.9","kube-dns.kube-system":IP.sdns,"invoices.billing":"10.96.200.7"};
const EXT={"api.github.com":"203.0.113.50","example.com":"203.0.113.80","www.example.com":"203.0.113.80"};
const SIM={name:"backend",ns:"shop",ndots:5};let simLang="ro";
const st=v=>(v&&typeof v==="object")?v[simLang]:v;
function dnsSim(name,ns,ndots){
  name=name.trim().toLowerCase().replace(/\s+/g,"");if(!name)return [];
  const abs=name.endsWith("."),base=abs?name.slice(0,-1):name;
  const search=[ns+".svc.cluster.local","svc.cluster.local","cluster.local"];
  const dots=(base.match(/\./g)||[]).length;
  const cands=abs?[base]:(dots<ndots?search.map(s=>base+"."+s).concat([base]):[base].concat(search.map(s=>base+"."+s)));
  const out=[];
  for(const c of cands){let r;const m=c.match(/^([a-z0-9-]+)\.([a-z0-9-]+)\.svc\.cluster\.local$/);
    if(m&&KNOWN[m[1]+"."+m[2]])r={ok:true,v:"A "+KNOWN[m[1]+"."+m[2]],by:{ro:"CoreDNS (din cluster)",en:"CoreDNS (cluster data)"}};
    else if(c==="cluster.local"||c.endsWith(".cluster.local"))r={ok:false,v:"NXDOMAIN",by:"CoreDNS"};
    else if(EXT[c])r={ok:true,v:"A "+EXT[c],by:{ro:"forward → DNS extern",en:"forward → upstream DNS"}};
    else r={ok:false,v:"NXDOMAIN",by:{ro:"forward → DNS extern",en:"forward → upstream DNS"}};
    out.push([c,r]);if(r.ok)break}
  return out;
}
function simOut(){
  const res=dnsSim(SIM.name,SIM.ns,SIM.ndots),ro=simLang==="ro";
  if(!res.length)return `<p class="empty">${ro?"Scrie un nume.":"Type a name."}</p>`;
  const ok=res[res.length-1][1].ok,dots=(SIM.name.replace(/\.$/,"").match(/\./g)||[]).length;
  let h=`<p class="note">${SIM.name.trim().endsWith(".")?(ro?"Numele se termină cu punct: e considerat complet, nu se adaugă sufixe.":"The name ends with a dot: it counts as complete, no suffixes are added."):(ro?`Numele are ${dots} ${dots===1?"punct":"puncte"}; ndots este ${SIM.ndots}, deci `:`The name has ${dots} dot${dots===1?"":"s"}; ndots is ${SIM.ndots}, so `)+(dots<SIM.ndots?(ro?"se încearcă întâi sufixele din search.":"the search suffixes are tried first."):(ro?"se încearcă întâi numele exact.":"the exact name is tried first."))}</p>`;
  h+=`<div class="scroll"><table style="min-width:480px"><thead><tr><th>#</th><th>${ro?"Întrebarea trimisă":"Query sent"}</th><th>${ro?"Cine răspunde":"Answered by"}</th><th>${ro?"Răspuns":"Answer"}</th></tr></thead><tbody>`;
  res.forEach(([c,r],i)=>{h+=`<tr class="${r.ok?"hit":""}"><td>${i+1}</td><td class="m">${c}</td><td>${st(r.by)}</td><td class="m ${r.ok?"res-ok":"res-no"}">${r.v}</td></tr>`});
  h+=`</tbody></table></div><p class="sim-sum ${ok?"res-ok":"res-no"}">${ok?(ro?`Rezolvat după ${res.length} ${res.length===1?"întrebare":"întrebări"}.`:`Resolved after ${res.length} quer${res.length===1?"y":"ies"}.`):(ro?`Nu s-a găsit după ${res.length} întrebări: aplicația primește o eroare.`:`Not found after ${res.length} queries: the app gets an error.`)} ${ro?"(Pentru fiecare se trimite de obicei și o întrebare AAAA.)":"(An AAAA query is usually sent for each one too.)"}</p>`;
  return h;
}
document.addEventListener("input",e=>{if(!e.target.closest||!e.target.closest("#dnssim"))return;
  SIM.name=document.getElementById("sim-name").value;SIM.ns=document.getElementById("sim-ns").value;SIM.ndots=+document.getElementById("sim-ndots").value;
  document.getElementById("sim-out").innerHTML=simOut()});

document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-sim]");if(!b)return;

/* ---------- extra reference: ClusterIP, CoreDNS, records, dnsPolicy, troubleshooting ---------- */
function refMore(T,lang){
  simLang=lang;const ro=lang==="ro";
  const cmd=(c,d)=>`<div class="cmdrow"><div class="cmd"><code>${c}</code><button type="button" class="copy" data-cmd="${c.replace(/"/g,"&quot;")}">${ro?"Copiază":"Copy"}</button></div><p>${T(d)}</p></div>`;
  let h=`<div class="sec-head"><p class="eyebrow">${ro?"În detaliu":"Deep dive"}</p><h2>${ro?"ClusterIP și DNS-ul din cluster":"ClusterIP and cluster DNS"}</h2></div>`;

  const facts=[
    [{ro:"De unde vine",en:"Where it comes from"},{ro:"API server-ul alege un IP liber din <code>service-cluster-ip-range</code> (cu kubeadm, implicit <code>10.96.0.0/12</code>). Prin convenție, kube-dns primește a zecea adresă: <code>10.96.0.10</code>.",en:"The API server picks a free IP from <code>service-cluster-ip-range</code> (kubeadm default: <code>10.96.0.0/12</code>). By convention kube-dns gets the tenth address: <code>10.96.0.10</code>."}],
    [{ro:"Cât trăiește",en:"How long it lasts"},{ro:"Cât trăiește Service-ul. Se schimbă doar dacă ștergi și recreezi Service-ul. Poți cere un IP anume cu <code>spec.clusterIP</code>.",en:"As long as the Service exists. It only changes if you delete and recreate the Service. You can request a specific IP with <code>spec.clusterIP</code>."}],
    [{ro:"Nu stă pe nicio placă de rețea",en:"Not on any network card"},{ro:"Niciun dispozitiv nu „are” acest IP. Există doar ca reguli în kernel-ul fiecărui nod, deci e accesibil numai din cluster.",en:"No device \"owns\" this IP. It only exists as rules in every node's kernel, so it's only reachable from inside the cluster."}],
    [{ro:"Doar porturile declarate",en:"Only the declared ports"},{ro:"<code>10.96.45.10:80</code> funcționează, dar <code>10.96.45.10:22</code> nu: regulile există doar pentru porturile din Service. De aceea <code>ping 10.96.45.10</code> de obicei nu răspunde (în modul iptables).",en:"<code>10.96.45.10:80</code> works but <code>10.96.45.10:22</code> doesn't: rules only exist for the Service's ports. That's why <code>ping 10.96.45.10</code> usually gets no reply (in iptables mode)."}],
    [{ro:"Fără pod-uri gata",en:"With no ready pods"},{ro:"Dacă EndpointSlice-ul e gol, kube-proxy pune o regulă care respinge conexiunea: aplicația vede <em>connection refused</em>, deși numele DNS se rezolvă.",en:"If the EndpointSlice is empty, kube-proxy adds a rule that rejects the connection: the app sees <em>connection refused</em> even though the DNS name resolves."}],
    [{ro:"Variabile de mediu",en:"Environment variables"},{ro:"Pod-urile pornite după crearea Service-ului primesc și <code>BACKEND_SERVICE_HOST=10.96.45.10</code> și <code>BACKEND_SERVICE_PORT=80</code>: o metodă mai veche de descoperire, înainte de DNS.",en:"Pods started after the Service was created also get <code>BACKEND_SERVICE_HOST=10.96.45.10</code> and <code>BACKEND_SERVICE_PORT=80</code>: an older discovery method, from before DNS."}],
    [{ro:"Opțiuni utile",en:"Useful options"},{ro:"<code>sessionAffinity: ClientIP</code> (același client → același pod), <code>internalTrafficPolicy: Local</code> (doar pod-uri de pe același nod), <code>ipFamilies</code> pentru IPv4 + IPv6.",en:"<code>sessionAffinity: ClientIP</code> (same client → same pod), <code>internalTrafficPolicy: Local</code> (only pods on the same node), <code>ipFamilies</code> for IPv4 + IPv6."}]
  ];
  h+=`<div class="ref-grid"><section class="card refcard"><h2>${ro?"ClusterIP pe înțelesul tuturor":"ClusterIP explained"}</h2><dl class="facts-list">`;
  facts.forEach(([k,v])=>{h+=`<div><dt>${T(k)}</dt><dd>${T(v)}</dd></div>`});
  h+=`</dl></section>`;

  h+=`<section class="card refcard"><h2>${ro?"Cum e configurat CoreDNS (Corefile)":"How CoreDNS is configured (Corefile)"}</h2><p>${ro?"Configurarea stă într-un ConfigMap numit <code>coredns</code>, în namespace-ul kube-system. Fiecare linie e un plugin:":"The configuration lives in a ConfigMap called <code>coredns</code> in the kube-system namespace. Each line is a plugin:"}</p>
<pre class="yaml">.:53 {
    errors                      <span class="c"># ${ro?"scrie erorile în log":"logs errors"}</span>
    health                      <span class="c"># ${ro?"verificare de sănătate (:8080)":"health check (:8080)"}</span>
    ready                       <span class="c"># ${ro?"verificare de pregătire (:8181)":"readiness check (:8181)"}</span>
    kubernetes cluster.local in-addr.arpa ip6.arpa {
       pods insecure            <span class="c"># ${ro?"nume pentru IP-urile pod-urilor":"names for pod IPs"}</span>
       fallthrough in-addr.arpa ip6.arpa
       ttl 30                   <span class="c"># ${ro?"TTL-ul răspunsurilor":"answer TTL"}</span>
    }
    prometheus :9153            <span class="c"># ${ro?"metrici":"metrics"}</span>
    forward . /etc/resolv.conf  <span class="c"># ${ro?"restul → DNS-ul nodului":"everything else → node's DNS"}</span>
    cache 30                    <span class="c"># ${ro?"ține minte 30 s":"remember for 30 s"}</span>
    loop                        <span class="c"># ${ro?"oprește buclele de forward":"stops forwarding loops"}</span>
    reload                      <span class="c"># ${ro?"aplică modificările automat":"applies changes automatically"}</span>
    loadbalance                 <span class="c"># ${ro?"amestecă ordinea răspunsurilor A":"shuffles A record order"}</span>
}</pre>
<p class="note">${ro?"Plugin-ul <code>kubernetes</code> urmărește API server-ul și răspunde pentru <code>cluster.local</code>. Tot ce nu e în cluster ajunge la <code>forward</code>.":"The <code>kubernetes</code> plugin watches the API server and answers for <code>cluster.local</code>. Anything outside the cluster goes to <code>forward</code>."}</p></section></div>`;

  h+=`<div class="ref-stack" style="margin-top:12px"><section class="card refcard" id="dnssim"><h2>${ro?"Simulator: ce întrebări DNS trimite podul?":"Simulator: which DNS queries does the pod send?"}</h2>
<p>${ro?"Scrie un nume, alege namespace-ul podului și valoarea ndots. Vezi, în ordine, ce nume întreabă podul și cine răspunde.":"Type a name, pick the pod's namespace and the ndots value. See, in order, which names the pod asks for and who answers."}</p>
<div class="sim-form">
  <label for="sim-name">${ro?"Nume":"Name"}<input id="sim-name" type="text" value="${SIM.name.replace(/"/g,"&quot;")}" autocomplete="off" spellcheck="false"></label>
  <label for="sim-ns">${ro?"Namespace-ul podului":"Pod namespace"}<select id="sim-ns">${["shop","billing","kube-system"].map(n=>`<option${n===SIM.ns?" selected":""}>${n}</option>`).join("")}</select></label>
  <label for="sim-ndots">ndots<select id="sim-ndots">${[1,2,5].map(n=>`<option value="${n}"${n===SIM.ndots?" selected":""}>${n}</option>`).join("")}</select></label>
</div>
<div class="presets"><span>${ro?"Încearcă:":"Try:"}</span>${[["backend","shop"],["backend","billing"],["backend.shop","billing"],["db.shop",""],["kube-dns.kube-system",""],["api.github.com",""],["api.github.com.",""],["backend.shop.svc.cluster.local",""],["nu-exista",""]].map(([n,ns])=>`<button type="button" data-sim="${n}"${ns?` data-ns="${ns}"`:""}>${n}${ns?` <small>(${ns})</small>`:""}</button>`).join("")}</div>
<div id="sim-out">${simOut()}</div>
<p class="note">${ro?"Service-uri existente în simulator: backend, backend-public, frontend, db (headless) în shop; invoices în billing; kube-dns în kube-system. Nume externe cunoscute: api.github.com, example.com.":"Services that exist in the simulator: backend, backend-public, frontend, db (headless) in shop; invoices in billing; kube-dns in kube-system. Known external names: api.github.com, example.com."}</p></section></div>`;

  const recs=[
    [{ro:"Service ClusterIP",en:"ClusterIP Service"},"A / AAAA","backend.shop.svc.cluster.local → 10.96.45.10"],
    [{ro:"Service headless",en:"Headless Service"},{ro:"A pentru fiecare pod gata",en:"A for every ready pod"},"db.shop.svc.cluster.local → 10.244.1.12, 10.244.2.9"],
    [{ro:"Headless + StatefulSet",en:"Headless + StatefulSet"},{ro:"A pentru fiecare pod, cu nume stabil",en:"A per pod, with a stable name"},"db-0.db.shop.svc.cluster.local → 10.244.1.12"],
    ["ExternalName","CNAME","payments.shop.svc.cluster.local → api.payments.example.com"],
    [{ro:"Port cu nume",en:"Named port"},"SRV","_http._tcp.backend.shop.svc.cluster.local → 0 100 80 backend.shop.svc.cluster.local"],
    [{ro:"Căutare inversă",en:"Reverse lookup"},"PTR","10.45.96.10.in-addr.arpa → backend.shop.svc.cluster.local"],
    ["Pod","A","10-244-1-5.shop.pod.cluster.local → 10.244.1.5"]
  ];
  h+=`<div class="ref-grid" style="margin-top:12px"><section class="card refcard"><h2>${ro?"Ce înregistrări DNS creează Kubernetes":"Which DNS records Kubernetes creates"}</h2><div class="scroll"><table style="min-width:480px"><thead><tr><th>${ro?"Pentru":"For"}</th><th>${ro?"Tip":"Type"}</th><th>${ro?"Exemplu":"Example"}</th></tr></thead><tbody>`;
  recs.forEach(r=>{h+=`<tr><td>${T(r[0])}</td><td>${T(r[1])}</td><td class="m">${r[2]}</td></tr>`});
  h+=`</tbody></table></div></section>`;

  const pol=[
    ["ClusterFirst",{ro:"Implicit. Numele din cluster merg la CoreDNS; restul sunt trimise mai departe de CoreDNS.",en:"The default. Cluster names go to CoreDNS; everything else is forwarded by CoreDNS."}],
    ["Default",{ro:"Podul folosește DNS-ul nodului, ca un program obișnuit. Nu poate rezolva nume de Service-uri!",en:"The pod uses the node's DNS like an ordinary program. It can't resolve Service names!"}],
    ["ClusterFirstWithHostNet",{ro:"Pentru pod-uri cu hostNetwork: true care vor totuși DNS-ul cluster-ului.",en:"For pods with hostNetwork: true that still want cluster DNS."}],
    ["None",{ro:"Kubernetes nu scrie nimic; tu dai tot în dnsConfig (servere, search, opțiuni).",en:"Kubernetes writes nothing; you supply everything in dnsConfig (servers, search, options)."}]
  ];
  h+=`<section class="card refcard"><h2>${ro?"dnsPolicy: ce DNS folosește un pod":"dnsPolicy: which DNS a pod uses"}</h2><div class="scroll"><table class="cmp"><thead><tr><th>dnsPolicy</th><th>${ro?"Ce înseamnă":"What it means"}</th></tr></thead><tbody>`;
  pol.forEach(r=>{h+=`<tr><td><span class="pill">${r[0]}</span></td><td>${T(r[1])}</td></tr>`});
  h+=`</tbody></table></div><h3>${ro?"Exemplu: mai puține întrebări pentru nume externe":"Example: fewer queries for external names"}</h3>
<pre class="yaml">spec:
  dnsPolicy: ClusterFirst
  dnsConfig:
    options:
      - name: ndots
        value: "2"     <span class="c"># ${ro?"api.github.com se întreabă direct":"api.github.com is asked directly"}</span></pre></section></div>`;

    [{ro:"Numele se rezolvă, dar conexiunea e refuzată",en:"The name resolves but the connection is refused"},{ro:"Service-ul nu are pod-uri gata: verifică EndpointSlice-ul, eticheta și selectorul, readiness probe-ul.",en:"The Service has no ready pods: check the EndpointSlice, the label and selector, the readiness probe."}],
    [{ro:"Merge cu IP, nu merge cu numele",en:"Works by IP, not by name"},{ro:"Problemă de DNS: verifică /etc/resolv.conf din pod și dnsPolicy.",en:"A DNS problem: check /etc/resolv.conf in the pod and the dnsPolicy."}],
    [{ro:"Numele externe sunt lente",en:"External names are slow"},{ro:"Efectul ndots:5 (multe întrebări NXDOMAIN). Folosește punct la final, ndots mai mic sau NodeLocal DNSCache.",en:"The ndots:5 effect (many NXDOMAIN queries). Use a trailing dot, a lower ndots or NodeLocal DNSCache."}]
  ];
  h+=`<div class="ref-stack" style="margin-top:12px"><section class="card refcard"><h2>${ro?"Depanare: când DNS-ul din cluster nu merge":"Troubleshooting: when cluster DNS doesn't work"}</h2>
<div class="scroll"><table class="cmp" style="min-width:480px"><thead><tr><th>${ro?"Simptom":"Symptom"}</th><th>${ro?"Cauza probabilă":"Likely cause"}</th></tr></thead><tbody>`;
  sym.forEach(r=>{h+=`<tr><td>${T(r[0])}</td><td>${T(r[1])}</td></tr>`});
  h+=`</tbody></table></div><h3>${ro?"Comenzi, în ordinea în care le-ai folosi":"Commands, in the order you'd use them"}</h3><div class="try">`;
  h+=cmd("kubectl run dnstest -n shop -it --rm --image=busybox:1.36 -- nslookup backend",{ro:"1. Pornește un pod de test și întreabă numele.",en:"1. Start a test pod and ask for the name."});
  h+=cmd("kubectl get pods -n kube-system -l k8s-app=kube-dns",{ro:"2. Rulează pod-urile CoreDNS?",en:"2. Are the CoreDNS pods running?"});
  h+=cmd("kubectl logs -n kube-system -l k8s-app=kube-dns --tail=50",{ro:"3. Ce erori scrie CoreDNS?",en:"3. What errors does CoreDNS log?"});
  h+=cmd("kubectl get svc,endpointslices -n shop",{ro:"4. Există Service-ul și are pod-uri în spate?",en:"4. Does the Service exist and have pods behind it?"});
  h+=cmd("kubectl get networkpolicy -A",{ro:"5. Blochează vreo regulă de rețea traficul DNS?",en:"5. Is a network policy blocking DNS traffic?"});
  h+=`</div></section></div>`;
  return h;
}

steps:[
{at:["fe","sbk"],frame:null,kind:"none",tables:["svcs"],
 title:{ro:"Scenariul",en:"The scenario"},
 body:{ro:`<p>Un <strong>cluster Kubernetes</strong> are două mașini (<strong>noduri</strong>): node-1 și node-2. Pe ele rulează <strong>pod-uri</strong>, adică containerele aplicației, fiecare cu IP-ul lui.</p>
<p>În namespace-ul <code>shop</code>, podul <strong>frontend</strong> vrea lista de produse de la <strong>backend</strong>. Backend-ul rulează în <strong>2 copii</strong> (backend-7d9f și backend-x2k4), pe noduri diferite.</p>
<p>Problema: pod-urile se mută și se recreează des, iar la fiecare recreare primesc alt IP. Frontend-ul nu poate ține minte IP-uri. Soluția e un <strong>Service</strong>: un nume și un IP care rămân fixe, în fața unui grup de pod-uri.</p>`,
 en:`<p>A <strong>Kubernetes cluster</strong> has two machines (<strong>nodes</strong>): node-1 and node-2. They run <strong>pods</strong>, the application's containers, each with its own IP.</p>
<p>In the <code>shop</code> namespace, the <strong>frontend</strong> pod wants the product list from the <strong>backend</strong>. The backend runs as <strong>2 copies</strong> (backend-7d9f and backend-x2k4), on different nodes.</p>
<p>The problem: pods are moved and recreated often, and each recreation gets a new IP. The frontend can't keep track of IPs. The solution is a <strong>Service</strong>: a name and an IP that stay fixed, in front of a group of pods.</p>`},
 more:{ro:`<p>Componentele care fac posibilă povestea:</p><ul><li><strong>API server</strong>: „creierul” cluster-ului; toate celelalte componente îi cer informații.</li><li><strong>kubelet</strong>: pe fiecare nod, pornește și supraveghează pod-urile.</li><li><strong>kube-proxy</strong>: pe fiecare nod, transformă Service-urile în reguli de rețea (iptables sau IPVS).</li><li><strong>CoreDNS</strong>: serverul DNS intern al cluster-ului.</li><li><strong>CNI</strong> (de ex. Calico, Flannel, Cilium): dă IP-uri pod-urilor și le leagă între noduri.</li></ul>`,
  en:`<p>The components that make this story work:</p><ul><li><strong>API server</strong>: the cluster's "brain"; every other component asks it for information.</li><li><strong>kubelet</strong>: on each node, starts and watches the pods.</li><li><strong>kube-proxy</strong>: on each node, turns Services into network rules (iptables or IPVS).</li><li><strong>CoreDNS</strong>: the cluster's internal DNS server.</li><li><strong>CNI</strong> (e.g. Calico, Flannel, Cilium): gives pods their IPs and connects them across nodes.</li></ul>`},
 try:[{cmd:"kubectl get pods -n shop -o wide",d:{ro:"Listează pod-urile, cu IP-ul și nodul fiecăruia.",en:"Lists the pods, with each one's IP and node."}},{cmd:"kubectl get svc -n shop",d:{ro:"Listează Service-urile din namespace.",en:"Lists the Services in the namespace."}}]},

{at:"sbk",frame:null,kind:"none",tables:["eps"],hl:{eps:["backend-7d9f","backend-x2k4"]},who:"Service backend",
 title:{ro:"Service-ul și pod-urile lui: etichete și selector",en:"The Service and its pods: labels and selector"},
 body:{ro:`<p>Cum știe Service-ul <code>backend</code> ce pod-uri să folosească? Prin <strong>etichete</strong> (labels). Fiecare pod backend are eticheta <code>app=backend</code>, iar Service-ul are <strong>selectorul</strong> <code>app=backend</code>.</p>
<p>Kubernetes caută continuu pod-urile care se potrivesc și sunt <strong>gata</strong> (readiness probe trecut) și le scrie într-un <strong>EndpointSlice</strong>: lista cu IP:port-urile reale.</p>
<p class="key">Service-ul nu e un program și nu e o mașină. E doar o <strong>înregistrare</strong> în API: un IP virtual + lista de pod-uri din spatele lui.</p>`,
 en:`<p>How does the <code>backend</code> Service know which pods to use? Through <strong>labels</strong>. Every backend pod has the label <code>app=backend</code>, and the Service has the <strong>selector</strong> <code>app=backend</code>.</p>
<p>Kubernetes continuously looks for pods that match and are <strong>ready</strong> (readiness probe passed) and writes them into an <strong>EndpointSlice</strong>: the list of real IP:ports.</p>
<p class="key">A Service is not a program and not a machine. It's just a <strong>record</strong> in the API: a virtual IP + the list of pods behind it.</p>`},
 more:{ro:`<p>Dacă un pod pică testul de readiness, iese automat din EndpointSlice și nu mai primește trafic, deși încă rulează. Când se recuperează, intră înapoi. Așa faci actualizări fără întreruperi: pod-urile noi primesc trafic doar când sunt pregătite.</p><p>Observă și porturile: Service-ul ascultă pe <code>80</code> (<em>port</em>), dar containerele pe <code>8080</code> (<em>targetPort</em>).</p>`,
  en:`<p>If a pod fails its readiness check, it automatically leaves the EndpointSlice and stops getting traffic, even though it's still running. When it recovers, it's added back. That's how you do updates without downtime: new pods only receive traffic once they're ready.</p><p>Note the ports too: the Service listens on <code>80</code> (<em>port</em>), but the containers on <code>8080</code> (<em>targetPort</em>).</p>`},
 try:[{cmd:"kubectl get endpointslices -n shop -l kubernetes.io/service-name=backend",d:{ro:"Arată IP-urile pod-urilor din spatele Service-ului.",en:"Shows the pod IPs behind the Service."}},{cmd:"kubectl get pods -n shop -l app=backend --show-labels",d:{ro:"Pod-urile care au eticheta app=backend.",en:"Pods that have the label app=backend."}}]},

{at:"fe",frame:null,kind:"none",tables:["resolv"],hl:{resolv:["nameserver","search"]},who:{ro:"podul frontend",en:"frontend pod"},
 title:{ro:"Frontend-ul vrea „http://backend”",en:"The frontend wants \"http://backend\""},
 body:{ro:`<p>În codul frontend-ului scrie doar <code>http://backend/api/products</code>. Înainte de orice conexiune, podul trebuie să afle <strong>IP-ul</strong> numelui <code>backend</code>, deci face o întrebare <strong>DNS</strong>.</p>
<p>Kubelet a scris în pod fișierul <code>/etc/resolv.conf</code>:</p>
<ul><li><code>nameserver 10.96.0.10</code>: serverul DNS de întrebat (Service-ul kube-dns, adică CoreDNS).</li>
<li><code>search shop.svc.cluster.local …</code>: sufixe adăugate automat la numele scurte.</li></ul>
<p>Așa, <code>backend</code> devine <code>backend.shop.svc.cluster.local</code>: Service-ul <em>backend</em> din namespace-ul <em>shop</em>.</p>`,
 en:`<p>The frontend's code just says <code>http://backend/api/products</code>. Before any connection, the pod has to find the <strong>IP</strong> of the name <code>backend</code>, so it makes a <strong>DNS</strong> query.</p>
<p>The kubelet wrote the file <code>/etc/resolv.conf</code> into the pod:</p>
<ul><li><code>nameserver 10.96.0.10</code>: the DNS server to ask (the kube-dns Service, i.e. CoreDNS).</li>
<li><code>search shop.svc.cluster.local …</code>: suffixes added automatically to short names.</li></ul>
<p>So <code>backend</code> becomes <code>backend.shop.svc.cluster.local</code>: the <em>backend</em> Service in the <em>shop</em> namespace.</p>`},
 more:{ro:`<p><code>ndots:5</code> înseamnă: dacă numele are mai puțin de 5 puncte, încearcă întâi cu sufixele din <code>search</code>. De aceea un nume extern ca <code>api.github.com</code> (2 puncte) generează mai întâi câteva întrebări inutile (<code>api.github.com.shop.svc.cluster.local</code>…). Pentru performanță, poți scrie nume externe cu punct la final: <code>api.github.com.</code></p><p>Din alt namespace ai scrie <code>backend.shop</code> sau numele complet.</p>`,
  en:`<p><code>ndots:5</code> means: if the name has fewer than 5 dots, try the <code>search</code> suffixes first. That's why an external name like <code>api.github.com</code> (2 dots) first triggers a few useless queries (<code>api.github.com.shop.svc.cluster.local</code>…). For performance, you can write external names with a trailing dot: <code>api.github.com.</code></p><p>From another namespace you'd write <code>backend.shop</code> or the full name.</p>`},
 try:[{cmd:"kubectl exec -n shop deploy/frontend -- cat /etc/resolv.conf",d:{ro:"Afișează configurarea DNS din pod.",en:"Shows the DNS configuration inside the pod."}}]},

{at:"fe",frame:DQ,kind:"dns",move:[[["fe","sdns"]]],log:{ro:"pod → kube-dns",en:"pod → kube-dns"},tables:["svcs"],hl:{svcs:"kube-dns"},who:{ro:"podul frontend",en:"frontend pod"},
 title:{ro:"Întrebarea DNS pleacă spre kube-dns",en:"The DNS query heads to kube-dns"},
 body:{ro:`<p>Podul trimite un pachet <strong>UDP</strong> pe portul <code>53</code>, cu întrebarea:</p><p class="quote">„Ce adresă (tip A) are backend.shop.svc.cluster.local?”</p>
<p>Destinația e <code>10.96.0.10</code>, IP-ul <strong>Service-ului</strong> kube-dns. Dar niciun dispozitiv din rețea nu are cu adevărat acest IP: e <strong>virtual</strong>. Să vedem ce se întâmplă cu pachetul.</p>`,
 en:`<p>The pod sends a <strong>UDP</strong> packet to port <code>53</code> with the question:</p><p class="quote">"What address (type A) does backend.shop.svc.cluster.local have?"</p>
<p>The destination is <code>10.96.0.10</code>, the IP of the kube-dns <strong>Service</strong>. But no device on the network actually owns this IP: it's <strong>virtual</strong>. Let's see what happens to the packet.</p>`}},

{at:"sdns",frame:{...DQ,dstIp:IP.dns},kind:"dns",move:[[["sdns","cdns"]]],fx:[["conntrack","10.244.1.5:53124 → 10.96.0.10:53","10.244.2.3:53"]],log:{ro:"DNAT → coredns",en:"DNAT → coredns"},
 tables:["rules","conntrack"],hl:{rules:IP.sdns+":53"},who:"kube-proxy (node-1)",
 title:{ro:"kube-proxy rescrie destinația (DNAT)",en:"kube-proxy rewrites the destination (DNAT)"},
 body:{ro:`<p>Pachetul nici nu iese bine din pod: încă în <strong>kernel-ul lui node-1</strong>, trece prin regulile scrise de <strong>kube-proxy</strong>. Regula spune: „ce merge la <code>10.96.0.10:53</code> trimite la podul CoreDNS <code>10.244.2.3:53</code>”.</p>
<p>Kernel-ul <strong>schimbă IP-ul destinație</strong> (vezi câmpul galben). Asta se numește <strong>DNAT</strong> (Destination NAT). Apoi ține minte conversia în tabela <strong>conntrack</strong>, ca să poată întoarce răspunsul.</p>
<p class="key">Seamănă cu lecția Ethernet, dar invers: acolo se schimbau MAC-urile și IP-ul rămânea. Aici <strong>chiar IP-ul destinație se schimbă</strong>.</p>`,
 en:`<p>The packet barely leaves the pod: still inside <strong>node-1's kernel</strong>, it goes through the rules written by <strong>kube-proxy</strong>. The rule says: "anything for <code>10.96.0.10:53</code> goes to the CoreDNS pod <code>10.244.2.3:53</code>".</p>
<p>The kernel <strong>changes the destination IP</strong> (see the yellow field). This is called <strong>DNAT</strong> (Destination NAT). It then remembers the translation in the <strong>conntrack</strong> table so it can return the reply.</p>
<p class="key">It's like the Ethernet lesson, but the other way round: there the MACs changed and the IP stayed. Here <strong>the destination IP itself changes</strong>.</p>`},
 more:{ro:`<p>kube-proxy nu stă în calea pachetelor: el doar <strong>scrie reguli</strong> în kernel (iptables sau IPVS) când se schimbă Service-urile. Kernel-ul face apoi rescrierea, foarte rapid. Unele rețele moderne (de ex. Cilium cu eBPF) înlocuiesc complet kube-proxy, dar ideea e aceeași.</p>`,
  en:`<p>kube-proxy doesn't sit in the packets' path: it only <strong>writes rules</strong> into the kernel (iptables or IPVS) whenever Services change. The kernel then does the rewriting, very quickly. Some modern networks (e.g. Cilium with eBPF) replace kube-proxy entirely, but the idea is the same.</p>`},
 try:[{cmd:"sudo iptables -t nat -L KUBE-SERVICES -n | grep 10.96.0.10",d:{ro:"Pe un nod: regulile NAT create de kube-proxy pentru kube-dns.",en:"On a node: the NAT rules kube-proxy created for kube-dns."}}]},

{at:"cdns",frame:DR,kind:"dns",move:[[["cdns","sdns"]]],log:{ro:"coredns → pod",en:"coredns → pod"},tables:["records"],hl:{records:FQDN},who:"CoreDNS",
 title:{ro:"CoreDNS răspunde: 10.96.45.10",en:"CoreDNS answers: 10.96.45.10"},
 body:{ro:`<p>CoreDNS urmărește permanent API server-ul și știe toate Service-urile. Găsește imediat:</p>
<p class="quote">backend.shop.svc.cluster.local → A 10.96.45.10 (TTL 30 s)</p>
<p>Răspunsul conține <strong>IP-ul Service-ului</strong> (ClusterIP), nu IP-ul vreunui pod. Pod-urile din spate se pot schimba oricât; numele și ClusterIP-ul rămân aceleași.</p>
<p>Pachetul de răspuns pleacă de la <code>10.244.2.3</code> (CoreDNS) spre <code>10.244.1.5</code> (frontend).</p>`,
 en:`<p>CoreDNS constantly watches the API server and knows every Service. It finds right away:</p>
<p class="quote">backend.shop.svc.cluster.local → A 10.96.45.10 (TTL 30 s)</p>
<p>The answer contains the <strong>Service IP</strong> (ClusterIP), not the IP of any pod. The pods behind it can change as much as they like; the name and the ClusterIP stay the same.</p>
<p>The reply packet leaves <code>10.244.2.3</code> (CoreDNS) for <code>10.244.1.5</code> (frontend).</p>`},
 more:{ro:`<p>Pentru nume din afara cluster-ului (de ex. <code>google.com</code>), CoreDNS <strong>trimite întrebarea mai departe</strong> la serverul DNS al nodului (plugin-ul <code>forward</code>). Acela face rezolvarea completă descrisă în <a href="../dns/index.html">lecția DNS</a>.</p><p>TTL-ul mic (30 s) face ca schimbările să se vadă repede.</p>`,
  en:`<p>For names outside the cluster (e.g. <code>google.com</code>), CoreDNS <strong>forwards the question</strong> to the node's DNS server (the <code>forward</code> plugin). That server does the full resolution described in the <a href="../dns/index.html">DNS lesson</a>.</p><p>The short TTL (30 s) means changes show up quickly.</p>`},
 try:[{cmd:"kubectl exec -n shop deploy/frontend -- nslookup backend",d:{ro:"Pune aceeași întrebare din interiorul podului.",en:"Asks the same question from inside the pod."}}]},

{at:"sdns",frame:{...DR,srcIp:IP.sdns},kind:"dns",move:[[["sdns","fe"]]],log:{ro:"un-NAT → pod",en:"un-NAT → pod"},tables:["conntrack"],hl:{conntrack:"10.244.1.5:53124 → 10.96.0.10:53"},who:"conntrack (node-1)",
 title:{ro:"Răspunsul e „deghizat” înapoi",en:"The reply is \"disguised\" back"},
 body:{ro:`<p>Frontend-ul a întrebat <code>10.96.0.10</code>. Dacă ar primi răspuns de la <code>10.244.2.3</code>, l-ar ignora: nu a vorbit cu acel IP.</p>
<p>Kernel-ul lui node-1 recunoaște conversația în <strong>conntrack</strong> și <strong>schimbă IP-ul sursă</strong> înapoi în <code>10.96.0.10</code>. Frontend-ul primește răspunsul de la cine se aștepta și află: <code>backend</code> = <code>10.96.45.10</code>.</p>`,
 en:`<p>The frontend asked <code>10.96.0.10</code>. If it got a reply from <code>10.244.2.3</code>, it would ignore it: it never talked to that IP.</p>
<p>node-1's kernel recognises the conversation in <strong>conntrack</strong> and <strong>changes the source IP</strong> back to <code>10.96.0.10</code>. The frontend gets the reply from the address it expected and learns: <code>backend</code> = <code>10.96.45.10</code>.</p>`}},

{at:"fe",frame:H1,kind:"http",move:[[["fe","sbk"]]],log:{ro:"pod → backend",en:"pod → backend"},tables:["svcs"],hl:{svcs:"backend"},who:{ro:"podul frontend",en:"frontend pod"},
 title:{ro:"Cererea HTTP spre ClusterIP",en:"The HTTP request to the ClusterIP"},
 body:{ro:`<p>Acum frontend-ul deschide o conexiune <strong>TCP</strong> spre <code>10.96.45.10:80</code> și trimite <code>GET /api/products</code>.</p>
<p>Din punctul lui de vedere, vorbește cu un singur server, „backend”. Nu știe și nici nu-l interesează că în spate sunt două pod-uri pe noduri diferite.</p>`,
 en:`<p>Now the frontend opens a <strong>TCP</strong> connection to <code>10.96.45.10:80</code> and sends <code>GET /api/products</code>.</p>
<p>From its point of view it's talking to a single server, "backend". It doesn't know, and doesn't care, that there are two pods on different nodes behind it.</p>`}},

{at:"sbk",frame:{...H1,dstIp:IP.bk2,dstPort:"8080"},kind:"http",move:[[["sbk","bk2"]]],fx:[["conntrack","10.244.1.5:41000 → 10.96.45.10:80","10.244.2.7:8080"]],log:{ro:"DNAT → backend-x2k4",en:"DNAT → backend-x2k4"},
 tables:["rules","eps"],hl:{rules:IP.sbk+":80",eps:"backend-x2k4"},who:"kube-proxy (node-1)",
 title:{ro:"Echilibrare: kube-proxy alege un pod",en:"Load balancing: kube-proxy picks a pod"},
 body:{ro:`<p>Regula pentru <code>10.96.45.10:80</code> are <strong>două ținte</strong>, câte una pentru fiecare pod din EndpointSlice, fiecare cu 50% șanse. Acum a ieșit <strong>backend-x2k4</strong>, pe node-2.</p>
<p>Kernel-ul rescrie <strong>IP-ul și portul destinație</strong>: <code>10.96.45.10:80</code> → <code>10.244.2.7:8080</code> (portul 80 al Service-ului devine <em>targetPort</em>-ul 8080 al containerului).</p>
<p>Alegerea se face o singură dată, <strong>la începutul conexiunii</strong>. Toate pachetele acestei conexiuni TCP merg apoi la același pod, datorită conntrack.</p>`,
 en:`<p>The rule for <code>10.96.45.10:80</code> has <strong>two targets</strong>, one for each pod in the EndpointSlice, each with a 50% chance. This time it picked <strong>backend-x2k4</strong>, on node-2.</p>
<p>The kernel rewrites the <strong>destination IP and port</strong>: <code>10.96.45.10:80</code> → <code>10.244.2.7:8080</code> (the Service's port 80 becomes the container's <em>targetPort</em> 8080).</p>
<p>The choice is made only once, <strong>at the start of the connection</strong>. Every packet of this TCP connection then goes to the same pod, thanks to conntrack.</p>`},
 more:{ro:`<p>În modul iptables alegerea e aleatoare. În modul <strong>IPVS</strong> poți alege algoritmi ca round-robin sau „cele mai puține conexiuni”. Dacă vrei ca același client să ajungă mereu la același pod, setezi <code>sessionAffinity: ClientIP</code> pe Service.</p>`,
  en:`<p>In iptables mode the choice is random. In <strong>IPVS</strong> mode you can choose algorithms like round-robin or "least connections". If you want the same client to always reach the same pod, set <code>sessionAffinity: ClientIP</code> on the Service.</p>`}},

{at:"bk2",frame:{...H1,dstIp:IP.bk2,dstPort:"8080"},kind:"http",tables:["routes"],hl:{routes:"10.244.2.0/24"},who:{ro:"rețeaua pod-urilor (CNI)",en:"pod network (CNI)"},
 title:{ro:"Trecerea de pe un nod pe altul",en:"Crossing from one node to another"},
 body:{ro:`<p>Destinația <code>10.244.2.7</code> e în rețeaua pod-urilor de pe node-2. Ruta de pe node-1 spune: <code>10.244.2.0/24</code> → prin <code>10.0.0.12</code> (node-2).</p>
<p>Pachetul iese prin placa de rețea a lui node-1, ajunge la node-2 și e livrat podului backend-x2k4. <strong>Pachetul IP nu se mai schimbă</strong> (niciun câmp colorat).</p>
<p>Dedesubt se întâmplă exact ce ai văzut în <a href="../ethernet/index.html">lecția Ethernet</a>: cadre noi, MAC-uri noi la fiecare hop.</p>`,
 en:`<p>The destination <code>10.244.2.7</code> is in node-2's pod network. node-1's route says: <code>10.244.2.0/24</code> → via <code>10.0.0.12</code> (node-2).</p>
<p>The packet leaves through node-1's network card, reaches node-2 and is delivered to the backend-x2k4 pod. <strong>The IP packet doesn't change any more</strong> (no coloured fields).</p>
<p>Underneath, exactly what you saw in the <a href="../ethernet/index.html">Ethernet lesson</a> happens: new frames, new MACs at every hop.</p>`},
 more:{ro:`<p>Cum ajung pachetele între noduri depinde de plugin-ul <strong>CNI</strong>:</p><ul><li><strong>Rutare directă</strong> (de ex. Calico BGP): ca aici, nodurile își anunță rețelele de pod-uri.</li><li><strong>Overlay</strong> (de ex. Flannel VXLAN): pachetul pod-ului e pus <em>în interiorul</em> altui pachet, de la node-1 (10.0.0.11) la node-2 (10.0.0.12), apoi despachetat.</li></ul><p>Regula de bază a Kubernetes: orice pod poate vorbi cu orice pod, <strong>fără NAT</strong>, pe IP-ul lui real.</p>`,
  en:`<p>How packets travel between nodes depends on the <strong>CNI</strong> plugin:</p><ul><li><strong>Direct routing</strong> (e.g. Calico BGP): like here, nodes announce their pod networks.</li><li><strong>Overlay</strong> (e.g. Flannel VXLAN): the pod's packet is placed <em>inside</em> another packet, from node-1 (10.0.0.11) to node-2 (10.0.0.12), then unwrapped.</li></ul><p>Kubernetes' basic rule: any pod can talk to any pod, <strong>without NAT</strong>, on its real IP.</p>`}},

{at:"bk2",frame:R1,kind:"http",move:[[["bk2","sbk"]]],log:{ro:"backend → pod",en:"backend → pod"},who:"backend-x2k4",
 title:{ro:"Backend-ul răspunde",en:"The backend replies"},
 body:{ro:`<p>Aplicația din backend-x2k4 citește cererea și răspunde <code>200 OK</code> cu lista de produse în JSON.</p>
<p>Răspunsul pleacă de la <strong>IP-ul real al podului</strong>, <code>10.244.2.7:8080</code>, spre <code>10.244.1.5:41000</code>. Merge înapoi spre node-1, pe același drum.</p>`,
 en:`<p>The app in backend-x2k4 reads the request and replies <code>200 OK</code> with the product list in JSON.</p>
<p>The reply leaves from the <strong>pod's real IP</strong>, <code>10.244.2.7:8080</code>, for <code>10.244.1.5:41000</code>. It travels back to node-1 along the same path.</p>`}},

{at:"sbk",frame:{...R1,srcIp:IP.sbk,srcPort:"80"},kind:"http",move:[[["sbk","fe"]]],log:{ro:"un-DNAT → pod",en:"un-DNAT → pod"},tables:["conntrack"],hl:{conntrack:"10.244.1.5:41000 → 10.96.45.10:80"},who:"conntrack (node-1)",
 title:{ro:"Frontend-ul vede răspunsul de la Service",en:"The frontend sees the reply from the Service"},
 body:{ro:`<p>Ca la DNS: conntrack de pe node-1 găsește conexiunea și rescrie <strong>sursa</strong> înapoi: <code>10.244.2.7:8080</code> → <code>10.96.45.10:80</code>.</p>
<p>Frontend-ul primește răspunsul de la adresa cu care a deschis conexiunea și își afișează produsele. 🎉</p>
<p class="key">Pentru frontend, Service-ul arată ca un singur server stabil. În realitate, kernel-ul a rescris adresele la dus și la întors.</p>`,
 en:`<p>Just like with DNS: conntrack on node-1 finds the connection and rewrites the <strong>source</strong> back: <code>10.244.2.7:8080</code> → <code>10.96.45.10:80</code>.</p>
<p>The frontend gets the reply from the address it opened the connection to and shows its products. 🎉</p>
<p class="key">To the frontend, the Service looks like one stable server. In reality, the kernel rewrote the addresses on the way there and back.</p>`}},

{at:"sbk",frame:{...H1,srcPort:"41002",dstIp:IP.bk1,dstPort:"8080"},kind:"http2",cmp:8,move:[[["fe","sbk"]],[["sbk","bk1"]]],fx:[["conntrack","10.244.1.5:41002 → 10.96.45.10:80","10.244.1.8:8080"]],log:{ro:"conexiune nouă → backend-7d9f",en:"new connection → backend-7d9f"},
 tables:["conntrack","eps"],hl:{eps:"backend-7d9f"},who:"kube-proxy (node-1)",
 title:{ro:"O conexiune nouă poate ajunge la alt pod",en:"A new connection may reach another pod"},
 body:{ro:`<p>Puțin mai târziu, frontend-ul deschide o <strong>conexiune nouă</strong> (port sursă <code>41002</code>). Regula aruncă din nou „zarul” și de data asta iese <strong>backend-7d9f</strong>, chiar pe node-1.</p>
<p>Comparat cu pasul 9: s-a schimbat portul sursă și IP-ul destinație. Așa se împarte încărcarea între copii: <strong>pe conexiuni</strong>, nu pe pachete.</p>`,
 en:`<p>A bit later, the frontend opens a <strong>new connection</strong> (source port <code>41002</code>). The rule "rolls the dice" again and this time picks <strong>backend-7d9f</strong>, right on node-1.</p>
<p>Compared with step 9: the source port and the destination IP changed. That's how load is shared between copies: <strong>per connection</strong>, not per packet.</p>`},
 more:{ro:`<p>Consecință practică: conexiunile lungi (HTTP/2, gRPC, WebSocket) rămân lipite de un singur pod. Dacă ai multe astfel de conexiuni, încărcarea poate fi inegală; atunci se folosesc echilibratoare la nivel L7 (de ex. un service mesh).</p>`,
  en:`<p>Practical consequence: long-lived connections (HTTP/2, gRPC, WebSocket) stay stuck to one pod. With many such connections, load can be uneven; that's when L7 load balancers (e.g. a service mesh) are used.</p>`}},

{at:"user",frame:E1,kind:"ext",move:[[["user","lb"]]],log:{ro:"client → LoadBalancer",en:"client → LoadBalancer"},tables:["svcs"],hl:{svcs:"backend-public"},who:{ro:"client din internet",en:"internet client"},
 title:{ro:"Trafic din afară: Service de tip LoadBalancer",en:"Outside traffic: a LoadBalancer Service"},
 body:{ro:`<p>ClusterIP-urile funcționează <strong>doar în interiorul cluster-ului</strong>. Ca să poată intra clienți din internet, s-a creat al doilea Service, <code>backend-public</code>, de tip <strong>LoadBalancer</strong>.</p>
<p>Furnizorul cloud a pornit un echilibrator cu IP public <code>198.51.100.20</code>. Un client trimite <code>GET /api/products</code> către el.</p>`,
 en:`<p>ClusterIPs only work <strong>inside the cluster</strong>. To let clients in from the internet, a second Service, <code>backend-public</code>, of type <strong>LoadBalancer</strong> was created.</p>
<p>The cloud provider started a load balancer with the public IP <code>198.51.100.20</code>. A client sends <code>GET /api/products</code> to it.</p>`},
 try:[{cmd:"kubectl expose deployment backend -n shop --name=backend-public --type=LoadBalancer --port=80 --target-port=8080",d:{ro:"Creează un Service LoadBalancer pentru backend.",en:"Creates a LoadBalancer Service for the backend."}},{cmd:"minikube service backend-public -n shop --url",d:{ro:"Pe minikube: afișează adresa la care poți accesa Service-ul.",en:"On minikube: prints the address where you can reach the Service."}}]},

{at:"lb",frame:{...E1,dstIp:IP.bk2,dstPort:"8080"},kind:"ext",move:[[["lb","bk2"]]],log:{ro:"LB → NodePort → pod",en:"LB → NodePort → pod"},tables:["eps"],hl:{eps:"backend-x2k4"},who:"LoadBalancer + kube-proxy (node-2)",
 title:{ro:"Prin NodePort, până la pod",en:"Through the NodePort, to the pod"},
 body:{ro:`<p>Un Service LoadBalancer e construit în trepte:</p>
<div class="flow"><span>198.51.100.20:80</span><i>→</i><span>10.0.0.12:30080</span><i>→</i><span>10.244.2.7:8080</span></div>
<ol><li>Echilibratorul cloud trimite pachetul la unul dintre noduri, pe <strong>NodePort</strong>-ul <code>30080</code> (deschis pe <em>toate</em> nodurile).</li>
<li>kube-proxy de pe acel nod face DNAT, exact ca înainte, către un pod din EndpointSlice.</li></ol>
<p>Comparat cu pasul anterior: <strong>destinația</strong> s-a schimbat, iar sursa (clientul) a rămas.</p>`,
 en:`<p>A LoadBalancer Service is built in layers:</p>
<div class="flow"><span>198.51.100.20:80</span><i>→</i><span>10.0.0.12:30080</span><i>→</i><span>10.244.2.7:8080</span></div>
<ol><li>The cloud load balancer sends the packet to one of the nodes, on the <strong>NodePort</strong> <code>30080</code> (open on <em>every</em> node).</li>
<li>kube-proxy on that node does DNAT, exactly as before, to a pod from the EndpointSlice.</li></ol>
<p>Compared with the previous step: the <strong>destination</strong> changed, while the source (the client) stayed.</p>`},
 more:{ro:`<p>Implicit (<code>externalTrafficPolicy: Cluster</code>), nodul care primește pachetul îl poate trimite și unui pod de pe <em>alt</em> nod. Atunci face și <strong>SNAT</strong>: înlocuiește IP-ul clientului cu IP-ul nodului, iar aplicația nu mai vede IP-ul real al clientului. Cu <code>externalTrafficPolicy: Local</code> traficul rămâne pe nodul care are pod-ul, iar IP-ul clientului se păstrează.</p><p>Pentru site-uri cu mai multe domenii și căi (/api, /shop) se folosește de obicei un <strong>Ingress</strong> (sau Gateway API), care rutează după antetul HTTP Host și cale.</p>`,
  en:`<p>By default (<code>externalTrafficPolicy: Cluster</code>), the node that receives the packet may send it to a pod on <em>another</em> node. It then also does <strong>SNAT</strong>: it replaces the client's IP with the node's IP, so the app no longer sees the client's real IP. With <code>externalTrafficPolicy: Local</code>, traffic stays on the node that has the pod and the client IP is preserved.</p><p>For sites with several domains and paths (/api, /shop) you usually use an <strong>Ingress</strong> (or Gateway API), which routes by the HTTP Host header and path.</p>`}},

{at:"cdns",frame:{qname:"db.shop.svc.cluster.local",qtype:"A",answer:"A 10.244.1.12 · A 10.244.2.9",ttlDns:"30 s",srcIp:IP.sdns,dstIp:IP.fe,proto:"UDP",srcPort:"53",dstPort:"53188"},kind:"dns",
 move:[[["fe","sdns"]],[["sdns","cdns"]],[["cdns","sdns"]],[["sdns","fe"]]],log:{ro:"DNS headless: db",en:"headless DNS: db"},tables:["headless","svcs"],hl:{svcs:"db",headless:["db.shop.svc.cluster.local"]},who:"CoreDNS",
 title:{ro:"Service headless: DNS-ul dă direct IP-urile pod-urilor",en:"Headless Service: DNS returns the pod IPs directly"},
 body:{ro:`<p>Frontend-ul vrea acum baza de date <code>db</code>. Service-ul ei e <strong>headless</strong>: are <code>clusterIP: None</code>, deci <strong>nu are ClusterIP</strong> și kube-proxy nu face nimic pentru el.</p>
<p>Întrebarea DNS face același drum ca la pasul 4 (frontend → kube-dns → CoreDNS și înapoi). Răspunsul e însă diferit: CoreDNS întoarce <strong>câte o înregistrare A pentru fiecare pod gata</strong>: <code>10.244.1.12</code> și <code>10.244.2.9</code>.</p>
<p>Clientul alege singur un IP și se conectează <strong>direct la pod</strong>, fără DNAT. Compară cu pasul 7: acolo răspunsul era un singur IP virtual.</p>`,
 en:`<p>The frontend now wants the <code>db</code> database. Its Service is <strong>headless</strong>: it has <code>clusterIP: None</code>, so it has <strong>no ClusterIP</strong> and kube-proxy does nothing for it.</p>
<p>The DNS query takes the same path as in step 4 (frontend → kube-dns → CoreDNS and back). But the answer is different: CoreDNS returns <strong>one A record per ready pod</strong>: <code>10.244.1.12</code> and <code>10.244.2.9</code>.</p>
<p>The client picks an IP itself and connects <strong>straight to the pod</strong>, with no DNAT. Compare with step 7: there the answer was a single virtual IP.</p>`},
 more:{ro:`<p>Headless e potrivit când clientul trebuie să știe <strong>exact cu care pod vorbește</strong>: baze de date replicate, cozi de mesaje, sisteme unde un pod e „lider”.</p><p>Împreună cu un <strong>StatefulSet</strong>, fiecare pod primește și un nume stabil: <code>db-0.db.shop.svc.cluster.local</code>, <code>db-1.db.shop.svc.cluster.local</code>. Podul <code>db-0</code> își păstrează numele chiar dacă e recreat cu alt IP.</p><p class="note">Atenție la cache: dacă aplicația ține minte IP-ul primit, după recrearea podului se poate conecta la un IP care nu mai există. TTL-ul de 30 s limitează problema.</p>`,
  en:`<p>Headless suits cases where the client must know <strong>exactly which pod it's talking to</strong>: replicated databases, message queues, systems where one pod is the "leader".</p><p>Combined with a <strong>StatefulSet</strong>, each pod also gets a stable name: <code>db-0.db.shop.svc.cluster.local</code>, <code>db-1.db.shop.svc.cluster.local</code>. Pod <code>db-0</code> keeps its name even if it's recreated with a new IP.</p><p class="note">Watch out for caching: if the app remembers the IP it got, after the pod is recreated it may connect to an IP that no longer exists. The 30 s TTL limits the problem.</p>`},
 try:[{cmd:"kubectl exec -n shop deploy/frontend -- nslookup db",d:{ro:"Pentru un Service headless vei vedea mai multe adrese, câte una pe pod.",en:"For a headless Service you'll see several addresses, one per pod."}}]},

{at:"cdns",frame:{qname:"api.github.com",qtype:"A",answer:"A 203.0.113.50",ttlDns:"60 s",srcIp:IP.sdns,dstIp:IP.fe,proto:"UDP",srcPort:"53",dstPort:"53201"},kind:"dns",
 move:[[["fe","sdns"]],[["sdns","cdns"]],[["cdns","sdns"]],[["sdns","fe"]]],marks:{cdns:{k:"ok",t:{ro:"forward → DNS extern",en:"forward → upstream DNS"}}},log:{ro:"nume extern: api.github.com",en:"external name: api.github.com"},
 tables:["searchq"],hl:{searchq:[3]},who:"CoreDNS",
 title:{ro:"Nume din afara cluster-ului: lista search și forward",en:"Names outside the cluster: the search list and forward"},
 body:{ro:`<p>Frontend-ul apelează și <code>https://api.github.com</code>. Numele are doar <strong>2 puncte</strong>, mai puțin decât <code>ndots:5</code>, așa că podul încearcă <strong>întâi sufixele</strong> din <code>search</code>:</p>
<ol><li><code>api.github.com.shop.svc.cluster.local</code> → NXDOMAIN</li><li><code>api.github.com.svc.cluster.local</code> → NXDOMAIN</li><li><code>api.github.com.cluster.local</code> → NXDOMAIN</li><li><code>api.github.com</code> → nu e în cluster, deci CoreDNS îl <strong>trimite mai departe</strong> (<code>forward</code>) la DNS-ul nodului → <code>203.0.113.50</code></li></ol>
<p>Patru întrebări în loc de una. Plus că podul întreabă de obicei și <strong>AAAA</strong> (IPv6) pentru fiecare, deci până la 8 pachete.</p>`,
 en:`<p>The frontend also calls <code>https://api.github.com</code>. The name has only <strong>2 dots</strong>, fewer than <code>ndots:5</code>, so the pod tries the <code>search</code> <strong>suffixes first</strong>:</p>
<ol><li><code>api.github.com.shop.svc.cluster.local</code> → NXDOMAIN</li><li><code>api.github.com.svc.cluster.local</code> → NXDOMAIN</li><li><code>api.github.com.cluster.local</code> → NXDOMAIN</li><li><code>api.github.com</code> → not in the cluster, so CoreDNS <strong>forwards</strong> it to the node's DNS → <code>203.0.113.50</code></li></ol>
<p>Four queries instead of one. And the pod usually asks for <strong>AAAA</strong> (IPv6) for each too, so up to 8 packets.</p>`},
 more:{ro:`<p>Cum reduci întrebările inutile:</p><ul><li>scrie numele cu <strong>punct la final</strong>: <code>api.github.com.</code> e considerat complet și se trimite o singură întrebare;</li><li>scade <code>ndots</code> pentru pod, cu <code>dnsConfig</code> (de ex. <code>ndots: "2"</code>);</li><li>activează <strong>NodeLocal DNSCache</strong>: un cache DNS pe fiecare nod, care răspunde imediat la întrebări repetate.</li></ul><p>Serverul „upstream” face apoi rezolvarea completă din <a href="../dns/index.html">lecția DNS</a>: rădăcină → .com → serverul autoritar al lui github.com.</p><p>Încearcă variantele în <strong>simulatorul DNS</strong> din secțiunea Referință.</p>`,
  en:`<p>How to cut down useless queries:</p><ul><li>write the name with a <strong>trailing dot</strong>: <code>api.github.com.</code> counts as complete and only one query is sent;</li><li>lower <code>ndots</code> for the pod with <code>dnsConfig</code> (e.g. <code>ndots: "2"</code>);</li><li>enable <strong>NodeLocal DNSCache</strong>: a DNS cache on every node that answers repeated questions instantly.</li></ul><p>The "upstream" server then does the full resolution from the <a href="../dns/index.html">DNS lesson</a>: root → .com → github.com's authoritative server.</p><p>Try the variations in the <strong>DNS simulator</strong> in the Reference section.</p>`},
 try:[{cmd:"kubectl -n kube-system get configmap coredns -o yaml",d:{ro:"Arată configurarea CoreDNS (Corefile), inclusiv linia forward.",en:"Shows the CoreDNS configuration (Corefile), including the forward line."}}]},

{at:["fe","sbk","cdns"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<p>Drumul complet al unei cereri în cluster:</p>
<div class="flow"><span>backend</span><i>DNS →</i><span>10.96.45.10:80</span><i>DNAT →</i><span>10.244.2.7:8080</span></div>
<ul><li><strong>Service</strong> = nume stabil + IP virtual (ClusterIP) în fața pod-urilor alese prin <strong>selector</strong>.</li>
<li><strong>CoreDNS</strong> transformă <code>backend</code> în ClusterIP, folosind sufixele din <code>/etc/resolv.conf</code>.</li>
<li><strong>kube-proxy</strong> scrie reguli în kernel; kernel-ul face <strong>DNAT</strong> spre un pod, iar <strong>conntrack</strong> întoarce răspunsul.</li>
<li>Între noduri, pachetul circulă pe rețeaua pod-urilor (<strong>CNI</strong>), cu IP-urile reale.</li>
<li><strong>NodePort</strong> și <strong>LoadBalancer</strong> deschid Service-ul spre exterior.</li>
<li>Un Service <strong>headless</strong> nu are ClusterIP: DNS-ul întoarce direct IP-urile pod-urilor.</li>
<li>Numele scurte trec prin lista <strong>search</strong> (ndots:5); numele externe ajung la CoreDNS, care le trimite mai departe (<strong>forward</strong>).</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Mergi la test ↓</button></p>`,
 en:`<p>The full path of a request in the cluster:</p>
<div class="flow"><span>backend</span><i>DNS →</i><span>10.96.45.10:80</span><i>DNAT →</i><span>10.244.2.7:8080</span></div>
<ul><li>A <strong>Service</strong> = a stable name + virtual IP (ClusterIP) in front of the pods chosen by a <strong>selector</strong>.</li>
<li><strong>CoreDNS</strong> turns <code>backend</code> into the ClusterIP, using the suffixes from <code>/etc/resolv.conf</code>.</li>
<li><strong>kube-proxy</strong> writes rules into the kernel; the kernel does <strong>DNAT</strong> to a pod, and <strong>conntrack</strong> brings the reply back.</li>
<li>Between nodes, the packet travels on the pod network (<strong>CNI</strong>), with real IPs.</li>
<li><strong>NodePort</strong> and <strong>LoadBalancer</strong> open the Service to the outside.</li>
<li>A <strong>headless</strong> Service has no ClusterIP: DNS returns the pod IPs directly.</li>
<li>Short names go through the <strong>search</strong> list (ndots:5); external names reach CoreDNS, which <strong>forwards</strong> them.</li></ul>
<p><button type="button" class="btn primary" data-goto="quiz">Go to the quiz ↓</button></p>`},
 more:{ro:`<p>Ce poți învăța mai departe: <strong>Ingress / Gateway API</strong> (rutare HTTP), <strong>NetworkPolicy</strong> (cine are voie să vorbească cu cine), <strong>service mesh</strong> (Istio, Linkerd), <strong>StatefulSet</strong> cu Service headless pentru baze de date.</p>`,
  en:`<p>What to learn next: <strong>Ingress / Gateway API</strong> (HTTP routing), <strong>NetworkPolicy</strong> (who may talk to whom), <strong>service mesh</strong> (Istio, Linkerd), <strong>StatefulSet</strong> with a headless Service for databases.</p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  const types=[
    ["ClusterIP",{ro:"Doar din interiorul cluster-ului",en:"Only from inside the cluster"},{ro:"IP virtual + nume DNS; kube-proxy face DNAT spre pod-uri. Tipul implicit.",en:"Virtual IP + DNS name; kube-proxy DNATs to pods. The default type."},{ro:"API-uri interne, baze de date",en:"Internal APIs, databases"}],
    ["NodePort",{ro:"Din afară, prin IP-ul oricărui nod",en:"From outside, via any node's IP"},{ro:"Deschide același port (30000–32767) pe toate nodurile; include un ClusterIP.",en:"Opens the same port (30000–32767) on every node; includes a ClusterIP."},{ro:"Teste, cluster-e fără cloud",en:"Testing, clusters without a cloud"}],
    ["LoadBalancer",{ro:"Din internet, prin IP public",en:"From the internet, via a public IP"},{ro:"Cere furnizorului cloud un echilibrator care trimite la NodePort.",en:"Asks the cloud provider for a load balancer that sends to the NodePort."},{ro:"Aplicații publice",en:"Public apps"}],
    ["ExternalName",{ro:"Din cluster, spre un serviciu extern",en:"From the cluster, to an outside service"},{ro:"Doar o înregistrare DNS CNAME; fără IP, fără proxy.",en:"Just a DNS CNAME record; no IP, no proxying."},{ro:"Baze de date gestionate (db.example.com)",en:"Managed databases (db.example.com)"}],
    ["Headless",{ro:"Din interiorul cluster-ului",en:"From inside the cluster"},{ro:"clusterIP: None. DNS-ul întoarce direct IP-urile pod-urilor.",en:"clusterIP: None. DNS returns the pod IPs directly."},{ro:"StatefulSet-uri, baze de date replicate",en:"StatefulSets, replicated databases"}]
  ];
  let h=`<div class="ref-grid"><section class="card refcard"><h2>${ro?"Tipurile de Service":"Service types"}</h2><div class="scroll"><table class="cmp" style="min-width:520px"><thead><tr><th>${ro?"Tip":"Type"}</th><th>${ro?"Cine îl poate accesa":"Who can reach it"}</th><th>${ro?"Cum funcționează":"How it works"}</th><th>${ro?"Folosit pentru":"Used for"}</th></tr></thead><tbody>`;
  types.forEach(r=>{h+=`<tr><td><span class="pill">${r[0]}</span></td><td>${T(r[1])}</td><td>${T(r[2])}</td><td>${T(r[3])}</td></tr>`});
  h+=`</tbody></table></div><p class="note">${ro?"NodePort conține un ClusterIP, iar LoadBalancer conține un NodePort: fiecare tip se bazează pe cel dinainte.":"A NodePort contains a ClusterIP, and a LoadBalancer contains a NodePort: each type builds on the one before."}</p></section>`;
  h+=`<section class="card refcard"><h2>${ro?"Cum arată în YAML":"What it looks like in YAML"}</h2><p>${ro?"Service-ul din lecție. Selectorul alege pod-urile cu eticheta app=backend.":"The Service from the lesson. The selector picks the pods labelled app=backend."}</p>
<pre class="yaml">apiVersion: v1
kind: Service
metadata:

spec:

    - port: 80           <span class="c"># ${ro?"portul Service-ului":"the Service's port"}</span>

<p class="note">${ro?"Salvează ca service.yaml și aplică-l cu":"Save as service.yaml and apply it with"} <code>kubectl apply -f service.yaml</code>.</p></section></div>`;
  const names=[
    ["backend",{ro:"Din același namespace (shop)",en:"From the same namespace (shop)"},"10.96.45.10"],

    ["db-0.db.shop.svc.cluster.local",{ro:"Un pod anume dintr-un StatefulSet cu Service headless",en:"A specific pod of a StatefulSet with a headless Service"},{ro:"IP-ul podului db-0",en:"the db-0 pod's IP"}],
    ["_http._tcp.backend.shop.svc.cluster.local",{ro:"Înregistrare SRV: portul numit „http”",en:"SRV record: the port named \"http\""},"80 + "+FQDN],
    ["10-244-1-5.shop.pod.cluster.local",{ro:"Nume generat pentru IP-ul unui pod",en:"Name generated for a pod's IP"},"10.244.1.5"]
  ];
  h+=`<div class="ref-stack" style="margin-top:12px"><section class="card refcard"><h2>${ro?"Nume DNS în cluster":"DNS names in the cluster"}</h2><p>${ro?"Formatul general: <code>&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local</code>. Iată ce poți întreba:":"The general format: <code>&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local</code>. Here's what you can ask for:"}</p>
<div class="scroll"><table style="min-width:520px"><thead><tr><th>${ro?"Nume":"Name"}</th><th>${ro?"Când îl folosești":"When to use it"}</th><th>${ro?"Răspuns":"Answer"}</th></tr></thead><tbody>`;
  names.forEach(r=>{h+=`<tr><td class="m">${r[0]}</td><td>${T(r[1])}</td><td class="m">${T(r[2])}</td></tr>`});
  h+=`</tbody></table></div></section></div>`;
  h+=refMore(T,lang);
  return h;
},
