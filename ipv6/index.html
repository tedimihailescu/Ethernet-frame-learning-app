steps:[
{at:["lap","rtr"],frame:null,kind:"none",tables:["types"],
 title:{ro:"De ce IPv6 și cum arată o adresă",en:"Why IPv6, and what an address looks like"},
 body:{ro:`<p>IPv4 are 32 de biți: ~4,3 miliarde de adrese, epuizate de mult (de aceea există <a href="../nat/index.html">NAT</a>). <strong>IPv6</strong> are <strong>128 de biți</strong>: destule ca fiecare dispozitiv să aibă adrese publice proprii.</p>
<p>O adresă se scrie în 8 grupuri de 4 cifre hexazecimale, separate prin „:”. Două reguli o scurtează:</p>
<ul><li>zerourile de la începutul unui grup se pot omite: <code>0db8</code> → <code>db8</code>;</li>
<li>o singură dată, un șir de grupuri numai zero se înlocuiește cu <code>::</code>.</li></ul>
<p class="key"><code>2001:0db8:0004:0001:0000:0000:0000:0001</code> = <code>2001:db8:4:1::1</code></p>
<p>Primii 64 de biți sunt de obicei <strong>prefixul rețelei</strong> (<code>/64</code>), ultimii 64 identifică interfața. Tabelul din dreapta arată felurile de adrese.</p>`,
 en:`<p>IPv4 has 32 bits: ~4.3 billion addresses, exhausted long ago (that's why <a href="../nat/index.html">NAT</a> exists). <strong>IPv6</strong> has <strong>128 bits</strong>: enough for every device to have public addresses of its own.</p>
<p>An address is written as 8 groups of 4 hex digits separated by ":". Two rules shorten it:</p>
<ul><li>leading zeros in a group can be dropped: <code>0db8</code> → <code>db8</code>;</li>
<li>once only, a run of all-zero groups is replaced by <code>::</code>.</li></ul>
<p class="key"><code>2001:0db8:0004:0001:0000:0000:0000:0001</code> = <code>2001:db8:4:1::1</code></p>
<p>The first 64 bits are usually the <strong>network prefix</strong> (<code>/64</code>); the last 64 identify the interface. The table on the right shows the kinds of addresses.</p>`},
 try:[{cmd:"ipconfig",d:{ro:"Caută rândurile „IPv6 Address” și „Link-local IPv6 Address”.",en:"Look for the \"IPv6 Address\" and \"Link-local IPv6 Address\" lines."}},{cmd:"ip -6 addr",d:{ro:"Același lucru pe Linux.",en:"The same on Linux."}}]},

{at:"lap",frame:DAD,kind:"ndp",move:[[["lap","sw"]],[["sw","ph"],["sw","rtr"]]],fx:[["addr",LL,"link-local",{ro:"tentativă (verific DAD)",en:"tentative (running DAD)"}]],tables:["addr"],log:{ro:"DAD: e liberă adresa?",en:"DAD: is the address free?"},who:"Laptop",
 title:{ro:"Prima adresă: link-local, apoi verificarea de dublură",en:"First address: link-local, then the duplicate check"},
 body:{ro:`<p>Imediat ce cablul e conectat, laptopul își face singur o adresă <strong>link-local</strong>: prefixul <code>fe80::/64</code> + un identificator de interfață. Cu ea poate vorbi pe segmentul local fără router și fără configurare.</p>
<p>Înainte s-o folosească, verifică să nu o mai aibă cineva: <strong>DAD</strong> (Duplicate Address Detection). Trimite un <strong>Neighbor Solicitation</strong> „cine are adresa asta?”, cu sursa <code>::</code> (încă n-are adresă sigură).</p>
<p>Atenție la destinație: nu e broadcast. E o adresă <strong>multicast „solicited-node”</strong>, <code>ff02::1:ff10:a</code>, formată din ultimii 24 de biți ai adresei căutate. Doar interfețele care au o adresă terminată la fel o ascultă. IPv6 <strong>nu are broadcast</strong>.</p>`,
 en:`<p>As soon as the cable is plugged in, the laptop builds a <strong>link-local</strong> address by itself: the <code>fe80::/64</code> prefix + an interface identifier. With it, it can talk on the local segment with no router and no configuration.</p>
<p>Before using it, it checks nobody else has it: <strong>DAD</strong> (Duplicate Address Detection). It sends a <strong>Neighbor Solicitation</strong> "who has this address?", with source <code>::</code> (it has no confirmed address yet).</p>
<p>Look at the destination: it's not broadcast. It's a <strong>solicited-node multicast</strong> address, <code>ff02::1:ff10:a</code>, built from the last 24 bits of the address being checked. Only interfaces with an address ending the same way listen to it. IPv6 <strong>has no broadcast</strong>.</p>`},
 more:{ro:`<p>Identificatorul de interfață poate fi format din MAC (<strong>EUI-64</strong>: <code>3c:22:fb:10:00:0a</code> → se inserează <code>ff:fe</code> la mijloc și se inversează un bit → <code>3e22:fbff:fe10:a</code>), cum vezi aici. Sistemele moderne preferă un identificator <strong>aleator, stabil pe rețea</strong> (RFC 7217), ca să nu poată fi urmărit laptopul după MAC.</p><p>MAC-ul destinație al multicast-ului IPv6 e mereu <code>33:33</code> + ultimii 32 de biți ai adresei: <code>33:33:ff:10:00:0a</code>.</p>`,
  en:`<p>The interface identifier can come from the MAC (<strong>EUI-64</strong>: <code>3c:22:fb:10:00:0a</code> → insert <code>ff:fe</code> in the middle and flip one bit → <code>3e22:fbff:fe10:a</code>), as here. Modern systems prefer a <strong>random identifier that's stable per network</strong> (RFC 7217), so the laptop can't be tracked by its MAC.</p><p>The destination MAC of IPv6 multicast is always <code>33:33</code> + the last 32 bits of the address: <code>33:33:ff:10:00:0a</code>.</p>`}},

{at:"lap",frame:RS,kind:"ndp",move:[[["lap","sw"]],[["sw","rtr"],["sw","ph"]]],fx:[["addr",LL,"link-local",{ro:"validă",en:"valid"}]],tables:["addr"],log:{ro:"caut un router",en:"looking for a router"},who:"Laptop",
 title:{ro:"Router Solicitation: „e vreun router aici?”",en:"Router Solicitation: \"is there a router here?\""},
 body:{ro:`<p>Nu a răspuns nimeni la DAD, deci adresa link-local e a lui. Acum laptopul vrea o adresă cu care să iasă pe internet. Pentru asta îi trebuie <strong>prefixul</strong> rețelei, pe care îl știe routerul.</p>
<p>Trimite un <strong>Router Solicitation</strong> la <code>ff02::2</code>, grupul multicast „toate routerele de pe link”. Telefonul îl ignoră: nu e în grupul ăsta.</p>`,
 en:`<p>Nobody answered the DAD, so the link-local address is its own. Now the laptop wants an address it can use on the internet. For that it needs the network's <strong>prefix</strong>, which the router knows.</p>
<p>It sends a <strong>Router Solicitation</strong> to <code>ff02::2</code>, the "all routers on this link" multicast group. The phone ignores it: it's not in that group.</p>`}},

{at:"rtr",frame:RA,kind:"ndp",move:[[["rtr","sw"]],[["sw","lap"],["sw","ph"]]],tables:["ra"],log:{ro:"routerul se anunță",en:"the router announces itself"},who:"Router",
 title:{ro:"Router Advertisement: prefixul, gateway-ul, DNS-ul",en:"Router Advertisement: prefix, gateway, DNS"},
 body:{ro:`<p>Routerul răspunde cu un <strong>Router Advertisement</strong> la <code>ff02::1</code> (toate nodurile). Îl trimite oricum și periodic, la câteva minute, ca să afle de el și cei care n-au întrebat.</p>
<p>Mesajul spune (tabelul din dreapta): prefixul <code>${PFX}</code>, că poate fi folosit ca gateway implicit, ce DNS să folosești și că nu e nevoie de DHCPv6.</p>
<p class="key">Gateway-ul implicit e adresa <strong>link-local</strong> a routerului, <code>fe80::1</code>, nu una globală. În IPv6 asta e normal.</p>`,
 en:`<p>The router replies with a <strong>Router Advertisement</strong> to <code>ff02::1</code> (all nodes). It also sends one periodically, every few minutes, so even devices that didn't ask find out about it.</p>
<p>The message says (table on the right): the prefix <code>${PFX}</code>, that it can be used as default gateway, which DNS to use, and that DHCPv6 isn't needed.</p>
<p class="key">The default gateway is the router's <strong>link-local</strong> address, <code>fe80::1</code>, not a global one. That's normal in IPv6.</p>`},
 more:{ro:`<p>Flag-urile M și O spun cum se configurează rețeaua: <code>M=1</code> = ia adresa de la un server <strong>DHCPv6</strong> (multe firme vor asta ca să țină evidența); <code>O=1</code> = adresa ți-o faci singur, dar alte informații (DNS) le iei din DHCPv6. Android nu suportă DHCPv6 pentru adrese, de aceea în rețelele mixte se folosește SLAAC.</p><p>Un RA fals de la un atacator poate redirecționa tot traficul. Switch-urile de firmă au <strong>RA Guard</strong>, care lasă RA-uri doar pe portul routerului.</p>`,
  en:`<p>The M and O flags say how the network is configured: <code>M=1</code> = get the address from a <strong>DHCPv6</strong> server (many companies want that for record keeping); <code>O=1</code> = build the address yourself, but get other info (DNS) from DHCPv6. Android doesn't support DHCPv6 for addresses, so mixed networks use SLAAC.</p><p>A fake RA from an attacker can redirect all traffic. Business switches have <strong>RA Guard</strong>, which allows RAs only on the router's port.</p>`}},

{at:"lap",frame:null,kind:"none",fx:[["addr",GA,{ro:"global (SLAAC)",en:"global (SLAAC)"},{ro:"preferată",en:"preferred"}],["addr","2001:db8:4:1:c4f1:77e2:1a0b:9d33",{ro:"global temporară",en:"global temporary"},{ro:"preferată · pentru conexiuni ieșite",en:"preferred · for outgoing connections"}],["rt",PFX,{ro:"direct (on-link)",en:"direct (on-link)"},"RA"],["rt","::/0",RL,"RA"]],tables:["addr","rt"],who:"SLAAC",
 title:{ro:"SLAAC: laptopul își face singur adresa globală",en:"SLAAC: the laptop builds its own global address"},
 body:{ro:`<p><strong>SLAAC</strong> (Stateless Address Autoconfiguration): laptopul ia prefixul primit, <code>2001:db8:4:1::/64</code>, și pune în ultimii 64 de biți un identificator ales de el. Rezultă <code>${GA}</code>. Face din nou DAD și o folosește.</p>
<p>De obicei își face <strong>două</strong> adrese globale:</p>
<ul><li>una <strong>stabilă</strong>, pentru conexiuni care vin spre el;</li>
<li>una <strong>temporară</strong> (privacy extensions), schimbată zilnic, pentru conexiunile pe care le deschide el, ca site-urile să nu-l recunoască după adresă.</li></ul>
<p>Din RA mai pune în tabela de rute: rețeaua locală e direct conectată, iar <strong>tot restul</strong> (<code>::/0</code>) merge prin <code>fe80::1</code>.</p>
<p class="key">O interfață IPv6 are mereu <strong>mai multe adrese</strong> deodată. E normal.</p>`,
 en:`<p><strong>SLAAC</strong> (Stateless Address Autoconfiguration): the laptop takes the prefix it got, <code>2001:db8:4:1::/64</code>, and fills the last 64 bits with an identifier of its choosing. The result is <code>${GA}</code>. It runs DAD again and starts using it.</p>
<p>It usually builds <strong>two</strong> global addresses:</p>
<ul><li>a <strong>stable</strong> one, for connections coming to it;</li>
<li>a <strong>temporary</strong> one (privacy extensions), rotated daily, for connections it opens, so websites can't recognise it by its address.</li></ul>
<p>From the RA it also adds routes: the local network is directly connected, and <strong>everything else</strong> (<code>::/0</code>) goes via <code>fe80::1</code>.</p>
<p class="key">An IPv6 interface always has <strong>several addresses</strong> at once. That's normal.</p>`},
 try:[{cmd:"netsh interface ipv6 show addresses",d:{ro:"Vezi adresele „Public”, „Temporary” și „Link”.",en:"See the \"Public\", \"Temporary\" and \"Link\" addresses."}},{cmd:"route print -6",d:{ro:"Ruta ::/0 arată spre adresa fe80:: a routerului.",en:"The ::/0 route points at the router's fe80:: address."}}]},

{at:"lap",frame:DQ,kind:"dns",move:[[["lap","sw"]],[["sw","rtr"]],[["rtr","dns"]]],log:{ro:"întreabă DNS de AAAA",en:"asks DNS for AAAA"},who:"Laptop",
 title:{ro:"DNS: înregistrarea AAAA și dual-stack",en:"DNS: the AAAA record and dual stack"},
 body:{ro:`<p>Utilizatorul deschide <code>www.example.com</code>. Pentru IPv6, adresa e într-o înregistrare <strong>AAAA</strong> (pentru IPv4 era <strong>A</strong>). Laptopul cere ambele în paralel, pentru că majoritatea rețelelor sunt <strong>dual-stack</strong>: merg simultan IPv4 și IPv6.</p>
<p>Dacă primește amândouă, aplică <strong>Happy Eyeballs</strong>: încearcă IPv6 întâi și, dacă nu răspunde în ~250 ms, încearcă și IPv4. Câștigă conexiunea care reușește prima, așa că un IPv6 stricat nu face site-urile să se încarce greu.</p>
<p>Notă: pachetul spre DNS deja are nevoie de MAC-ul routerului. Pasul următor arată cum îl află.</p>`,
 en:`<p>The user opens <code>www.example.com</code>. For IPv6 the address is in an <strong>AAAA</strong> record (for IPv4 it was <strong>A</strong>). The laptop asks for both in parallel, because most networks are <strong>dual stack</strong>: IPv4 and IPv6 run at the same time.</p>
<p>If it gets both, it applies <strong>Happy Eyeballs</strong>: try IPv6 first and, if it doesn't answer within ~250 ms, try IPv4 too. Whichever connects first wins, so a broken IPv6 doesn't make sites load slowly.</p>
<p>Note: the packet to the DNS server already needs the router's MAC. The next step shows how it's found.</p>`},
 try:[{cmd:"nslookup -type=AAAA www.google.com",d:{ro:"Adresa IPv6 a unui site mare.",en:"A big site's IPv6 address."}}]},

{at:"lap",frame:NS,kind:"ndp",move:[[["lap","sw"]],[["sw","rtr"]]],fx:[["nc",RL,"?",{ro:"INCOMPLETE (aștept)",en:"INCOMPLETE (waiting)"}]],tables:["nc"],log:{ro:"NDP: MAC-ul routerului?",en:"NDP: the router's MAC?"},who:"Laptop",
 title:{ro:"NDP: cum află MAC-ul routerului, fără ARP",en:"NDP: finding the router's MAC without ARP"},
 body:{ro:`<p>În IPv4, laptopul ar fi trimis un <a href="../ethernet/index.html">ARP</a> broadcast la toată rețeaua. În IPv6 nu există ARP: rolul lui îl ia <strong>NDP</strong> (Neighbor Discovery Protocol), care e doar ICMPv6.</p>
<p>Laptopul trimite un <strong>Neighbor Solicitation</strong> „cine are <code>fe80::1</code>?” la adresa solicited-node a routerului, <code>ff02::1:ff00:1</code>. Pune în mesaj și MAC-ul lui, ca routerul să poată răspunde direct.</p>
<p class="key">Diferența față de ARP: un broadcast ARP întrerupe <em>toate</em> dispozitivele; multicast-ul solicited-node ajunge practic doar la cel căutat.</p>`,
 en:`<p>In IPv4 the laptop would have sent an <a href="../ethernet/index.html">ARP</a> broadcast to the whole network. IPv6 has no ARP: its job is done by <strong>NDP</strong> (Neighbor Discovery Protocol), which is just ICMPv6.</p>
<p>The laptop sends a <strong>Neighbor Solicitation</strong> "who has <code>fe80::1</code>?" to the router's solicited-node address, <code>ff02::1:ff00:1</code>. It includes its own MAC so the router can reply directly.</p>
<p class="key">The difference from ARP: an ARP broadcast interrupts <em>every</em> device; solicited-node multicast practically reaches only the one being looked for.</p>`}},

{at:"rtr",frame:NA,kind:"ndp",move:[[["rtr","sw"]],[["sw","lap"]]],fx:[["nc",RL,RM,"REACHABLE"]],tables:["nc"],hl:{nc:RL},log:{ro:"NDP: răspunsul routerului",en:"NDP: the router's reply"},who:"Router",
 title:{ro:"Neighbor Advertisement și neighbor cache",en:"Neighbor Advertisement and the neighbour cache"},
 body:{ro:`<p>Routerul răspunde direct laptopului (unicast) cu un <strong>Neighbor Advertisement</strong>: „<code>fe80::1</code> e la <code>${RM}</code>”.</p>
<p>Laptopul scrie perechea în <strong>neighbor cache</strong> (echivalentul tabelei ARP), cu starea <code>REACHABLE</code>. După câteva zeci de secunde fără confirmare trece în <code>STALE</code> și verifică din nou când e nevoie (<strong>NUD</strong>, Neighbor Unreachability Detection).</p>
<p>Acum poate trimite atât interogarea DNS, cât și restul traficului spre internet.</p>`,
 en:`<p>The router replies straight to the laptop (unicast) with a <strong>Neighbor Advertisement</strong>: "<code>fe80::1</code> is at <code>${RM}</code>".</p>
<p>The laptop stores the pair in its <strong>neighbour cache</strong> (the equivalent of the ARP table), in state <code>REACHABLE</code>. After some tens of seconds without confirmation it becomes <code>STALE</code> and is checked again when needed (<strong>NUD</strong>, Neighbor Unreachability Detection).</p>
<p>Now it can send both the DNS query and all other internet traffic.</p>`},
 try:[{cmd:"netsh interface ipv6 show neighbors",d:{ro:"Neighbor cache-ul tău (pe Linux: ip -6 neigh).",en:"Your neighbour cache (on Linux: ip -6 neigh)."}}]},

{at:"lap",frame:T1,kind:"data",move:[[["lap","sw"]],[["sw","rtr"]]],tables:["hdr"],log:{ro:"laptop → router",en:"laptop → router"},who:"Laptop",
 title:{ro:"Pachetul de date: un antet mai simplu",en:"The data packet: a simpler header"},
 body:{ro:`<p>DNS-ul a răspuns cu <code>${WEB}</code>. Laptopul deschide o conexiune TCP spre portul 443. Pachetul pleacă spre MAC-ul routerului, cu IP-ul destinație al serverului, exact ca în IPv4.</p>
<p>Antetul IPv6 e însă mai simplu (tabelul din dreapta): are mereu <strong>40 de octeți</strong>, nu are sumă de control, iar opțiunile rare au fost mutate în <strong>antete de extensie</strong>, legate prin câmpul <strong>Next Header</strong>. Routerele îl pot procesa mai repede.</p>`,
 en:`<p>DNS answered <code>${WEB}</code>. The laptop opens a TCP connection to port 443. The packet goes to the router's MAC with the server's destination IP, exactly as in IPv4.</p>
<p>The IPv6 header is simpler though (table on the right): it's always <strong>40 bytes</strong>, has no checksum, and rare options moved into <strong>extension headers</strong>, chained through the <strong>Next Header</strong> field. Routers can process it faster.</p>`}},

{at:"rtr",frame:T2,kind:"data",move:[[["rtr","net"]],[["net","web"]]],log:{ro:"după router",en:"after the router"},who:"Router",
 title:{ro:"Routerul: Hop Limit scade, MAC-urile se schimbă",en:"The router: Hop Limit drops, the MACs change"},
 body:{ro:`<p>Routerul face exact ce făcea în IPv4: caută destinația în tabela de rutare, scade <strong>Hop Limit</strong> cu 1 (64 → 63) și pune MAC-uri noi pentru următorul link. Adresele IPv6 sursă și destinație rămân <strong>neschimbate</strong> pe tot drumul.</p>
<p class="key">Și nu există NAT: serverul vede adresa reală a laptopului. Firewall-ul routerului lasă să intre doar răspunsurile la conexiuni pornite din interior.</p>`,
 en:`<p>The router does exactly what it did in IPv4: looks up the destination in its routing table, decrements <strong>Hop Limit</strong> by 1 (64 → 63) and puts on new MACs for the next link. The source and destination IPv6 addresses stay <strong>unchanged</strong> all the way.</p>
<p class="key">And there's no NAT: the server sees the laptop's real address. The router's firewall only lets in replies to connections started from inside.</p>`}},

{at:["rtr","lap"],frame:PTB,kind:"ptb",move:[[["rtr","sw"]],[["sw","lap"]]],log:{ro:"Packet Too Big",en:"Packet Too Big"},who:"ICMPv6",
 title:{ro:"Fragmentare: doar la sursă, și nu bloca ICMPv6",en:"Fragmentation: only at the source, and don't block ICMPv6"},
 body:{ro:`<p>În IPv4, un router putea tăia un pachet prea mare în fragmente. În IPv6 routerele <strong>nu fragmentează</strong>. Dacă un pachet nu încape pe un link (de ex. un tunel cu MTU 1280), routerul îl aruncă și trimite înapoi un <strong>ICMPv6 Packet Too Big</strong> cu MTU-ul corect. Sursa micșorează pachetele (<strong>Path MTU Discovery</strong>).</p>
<p class="key">De aceea ICMPv6 <strong>nu trebuie blocat</strong> în firewall. Fără el nu merg nici NDP, nici SLAAC, iar conexiunile cu pachete mari se „blochează” fără eroare (pagini care nu se încarcă până la capăt).</p>`,
 en:`<p>In IPv4 a router could cut an oversized packet into fragments. In IPv6 routers <strong>don't fragment</strong>. If a packet doesn't fit a link (e.g. a tunnel with MTU 1280), the router drops it and sends back an <strong>ICMPv6 Packet Too Big</strong> with the correct MTU. The source makes its packets smaller (<strong>Path MTU Discovery</strong>).</p>
<p class="key">That's why ICMPv6 <strong>must not be blocked</strong> in firewalls. Without it neither NDP nor SLAAC works, and connections with large packets "hang" without an error (pages that never finish loading).</p>`}},

{at:["lap","rtr","web"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare și tranziția de la IPv4",en:"Recap, and the transition from IPv4"},
 body:{ro:`<div class="flow"><span>fe80:: + DAD</span><i>→</i><span>RS / RA</span><i>→</i><span>SLAAC</span><i>→</i><span>NDP</span><i>→</i><span>${"date"}</span></div>
<ul><li>Adresele au 128 de biți și se scurtează cu reguli simple; prefixul e de obicei <code>/64</code>.</li>
<li>Orice interfață are o adresă <strong>link-local</strong>, plus una sau mai multe <strong>globale</strong>.</li>
<li><strong>Router Advertisement</strong> dă prefixul și gateway-ul; <strong>SLAAC</strong> construiește adresa.</li>
<li><strong>NDP</strong> (ICMPv6) înlocuiește ARP; <strong>multicast</strong> înlocuiește broadcast-ul.</li>
<li>Antet fix de 40 de octeți, Hop Limit în loc de TTL, fără fragmentare în routere.</li>
<li>Fără NAT, dar cu firewall; nu bloca ICMPv6.</li></ul>
<p>Rețelele care au doar IPv6 ajung la site-urile vechi, doar IPv4, prin <strong>NAT64 + DNS64</strong> (DNS-ul inventează o adresă AAAA din <code>64:ff9b::/96</code>, iar un gateway traduce). Telefoanele mobile folosesc des <strong>464XLAT</strong>.</p>
<p><button type="button" class="btn primary" data-goto="quiz">Mergi la test ↓</button></p>`,
 en:`<div class="flow"><span>fe80:: + DAD</span><i>→</i><span>RS / RA</span><i>→</i><span>SLAAC</span><i>→</i><span>NDP</span><i>→</i><span>data</span></div>
<ul><li>Addresses have 128 bits and are shortened with simple rules; the prefix is usually <code>/64</code>.</li>
<li>Every interface has a <strong>link-local</strong> address, plus one or more <strong>global</strong> ones.</li>
<li>The <strong>Router Advertisement</strong> gives the prefix and gateway; <strong>SLAAC</strong> builds the address.</li>
<li><strong>NDP</strong> (ICMPv6) replaces ARP; <strong>multicast</strong> replaces broadcast.</li>
<li>A fixed 40-byte header, Hop Limit instead of TTL, no fragmentation in routers.</li>
<li>No NAT, but a firewall; don't block ICMPv6.</li></ul>
<p>IPv6-only networks reach old IPv4-only sites through <strong>NAT64 + DNS64</strong> (DNS makes up an AAAA address in <code>64:ff9b::/96</code> and a gateway translates). Mobile phones often use <strong>464XLAT</strong>.</p>
<p><button type="button" class="btn primary" data-goto="quiz">Go to the quiz ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  const ex=[["2001:0db8:0000:0000:0000:0000:0000:0001","2001:db8::1"],["fe80:0000:0000:0000:3e22:fbff:fe10:000a","fe80::3e22:fbff:fe10:a"],["2001:0db8:0004:0001:0000:0000:0000:0000","2001:db8:4:1::"],["0000:0000:0000:0000:0000:0000:0000:0001","::1"]];
  let h=`<div class="ref-grid"><section class="card refcard"><h2>${ro?"Scrierea scurtă":"Short notation"}</h2><div class="scroll"><table class="cmp" style="min-width:460px"><thead><tr><th>${ro?"Complet":"Full"}</th><th>${ro?"Scurt":"Short"}</th></tr></thead><tbody>`;
  ex.forEach(r=>{h+=`<tr><td><code>${r[0]}</code></td><td><b><code>${r[1]}</code></b></td></tr>`});
  h+=`</tbody></table></div><p>${ro?"<code>::</code> poate apărea o singură dată. Într-un URL, adresa stă între paranteze drepte: <code>https://[2001:db8::1]:8443/</code>.":"<code>::</code> may appear only once. In a URL the address goes in square brackets: <code>https://[2001:db8::1]:8443/</code>."}</p></section>`;
  h+=`<section class="card refcard"><h2>${ro?"Comenzi utile":"Useful commands"}</h2>
<pre class="yaml"><span class="c"># Windows</span>
ipconfig

ping -6 www.google.com
<span class="c"># Linux / macOS</span>
ip -6 addr

ping -6 www.google.com
traceroute -6 www.google.com
<span class="c"># ${ro?"testează dacă ai IPv6 funcțional":"check whether IPv6 works"}</span>
curl -6 https://ifconfig.co</pre></section></div>`;
  return h;
},
