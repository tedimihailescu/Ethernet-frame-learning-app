steps:[
{at:["kali","home"],frame:null,kind:"none",tables:["rules"],who:{ro:"Regulile",en:"The rules"},
 title:{ro:"Înainte de orice: ce ai voie să scanezi",en:"Before anything: what you're allowed to scan"},
 body:{ro:`<p><strong>Kali Linux</strong> e o distribuție Debian întreținută de OffSec, cu sute de unelte pentru teste de securitate. Uneltele nu sunt „de hacker” sau „de apărător”: aceeași comandă nmap o rulează și un administrator care își face inventarul, și un atacator care caută o țintă.</p>
<p>Diferența e <strong>permisiunea</strong>. În multe țări, inclusiv în România, accesul fără drept la un sistem informatic e infracțiune. Chiar și o simplă scanare a rețelei altcuiva poate încălca un contract (de exemplu cu furnizorul de internet sau cu angajatorul) sau poate declanșa alarme.</p>
<p class="key">Regula laboratorului: scanezi doar mașini care îți aparțin, într-o rețea pe care o controlezi. La un test real, ai un acord scris cu un scop clar.</p>`,
 en:`<p><strong>Kali Linux</strong> is a Debian distribution maintained by OffSec, with hundreds of security-testing tools. The tools aren't "attacker" or "defender" tools: the same nmap command is run by an admin taking inventory and by an attacker looking for a target.</p>
<p>The difference is <strong>permission</strong>. In many countries, Romania included, accessing a computer system without the right to do so is a crime. Even a simple scan of someone else's network can break a contract (with your internet provider or employer, for example) or trigger alarms.</p>
<p class="key">The lab rule: scan only machines you own, on a network you control. In a real test, you have a written agreement with a clear scope.</p>`}},

{at:"host",frame:K2,kind:"k",log:{ro:"imaginea verificată",en:"the image verified"},who:"sha256sum",
 title:{ro:"Imaginea oficială, verificată",en:"The official image, verified"},
 body:{ro:`<p>Cea mai simplă variantă pentru un laborator: imaginea gata făcută pentru <strong>VirtualBox</strong> (sau VMware) de pe <code>kali.org</code>. O descarci doar de acolo, nu de pe site-uri cu „Kali modificat”.</p>
<p>Lângă fiecare imagine, site-ul publică un <strong>SHA256</strong>. <code>sha256sum</code> calculează amprenta fișierului descărcat; dacă e identică, fișierul e exact cel publicat. O unealtă de securitate descărcată modificată ar fi o ironie scumpă.</p>
<p>Surse oficiale: <a href="https://www.kali.org/get-kali/#kali-virtual-machines" target="_blank" rel="noopener noreferrer">kali.org/get-kali</a> pentru Kali și <a href="https://www.virtualbox.org/wiki/Downloads" target="_blank" rel="noopener noreferrer">virtualbox.org</a> pentru VirtualBox. Lista completă e în secțiunea de referință.</p>`,
 en:`<p>The simplest option for a lab: the ready-made <strong>VirtualBox</strong> (or VMware) image from <code>kali.org</code>. Download it only from there, not from sites offering a "modified Kali".</p>
<p>Next to each image, the site publishes a <strong>SHA256</strong>. <code>sha256sum</code> computes the downloaded file's fingerprint; if it matches, the file is exactly the published one. A security tool downloaded already tampered with would be an expensive irony.</p>
<p>Official sources: <a href="https://www.kali.org/get-kali/#kali-virtual-machines" target="_blank" rel="noopener noreferrer">kali.org/get-kali</a> for Kali and <a href="https://www.virtualbox.org/wiki/Downloads" target="_blank" rel="noopener noreferrer">virtualbox.org</a> for VirtualBox. The full list is in the reference section.</p>`},
 try:[{cmd:"sha256sum kali-linux-*-virtualbox-amd64.7z",d:{ro:"Compari rezultatul cu valoarea de pe kali.org.",en:"Compare the result with the value on kali.org."}}]},

{at:["kali","lab"],frame:K3,kind:"k",tables:["modes"],hl:{modes:"Internal Network"},log:{ro:"rețeaua VM-ului",en:"the VM's network"},who:{ro:"Rețeaua",en:"The network"},
 title:{ro:"Cea mai importantă alegere: rețeaua mașinii virtuale",en:"The most important choice: the VM's network"},
 body:{ro:`<p>O mașină virtuală poate fi legată la rețea în mai multe feluri. Pentru laborator:</p>
<ul><li><strong>Adaptorul 1: Internal Network</strong>, numit <code>lab-net</code>: o rețea virtuală care există doar între VM-urile tale. Aici stau Kali și țintele;</li>
<li><strong>Adaptorul 2: NAT</strong>: Kali iese prin laptop, ca să descarce actualizări.</li></ul>
<p>Ce <strong>nu</strong> folosești pentru scanări: <strong>bridged</strong>. Atunci Kali apare în rețeaua de acasă ca un dispozitiv nou, iar orice scanare atinge routerul, telefoanele și televizorul.</p>`,
 en:`<p>A virtual machine can be connected to a network in several ways. For the lab:</p>
<ul><li><strong>Adapter 1: Internal Network</strong>, named <code>lab-net</code>: a virtual network that exists only between your VMs. Kali and the targets live here;</li>
<li><strong>Adapter 2: NAT</strong>: Kali goes out through the laptop, to download updates.</li></ul>
<p>What you <strong>don't</strong> use for scanning: <strong>bridged</strong>. Then Kali shows up on the home network as a new device, and any scan touches the router, the phones and the TV.</p>`}},

{at:"kali",frame:K4,kind:"k",log:{ro:"parola schimbată",en:"password changed"},who:{ro:"Primul login",en:"First login"},
 title:{ro:"Primul login: schimbi parola implicită",en:"First login: change the default password"},
 body:{ro:`<p>Imaginile oficiale pornesc cu utilizatorul <code>kali</code> și parola <code>kali</code>, cunoscute de toată lumea. Primul lucru: <code>passwd</code>.</p>
<p>Din 2020, Kali nu mai lucrează implicit ca <code>root</code>. <code>id</code> arată că ești <code>kali</code>, în grupul <code>sudo</code>: rulezi ca utilizator obișnuit și ceri drepturi de administrator doar pentru comenzile care chiar au nevoie (o scanare SYN cu nmap, de exemplu).</p>`,
 en:`<p>The official images start with the user <code>kali</code> and the password <code>kali</code>, known to everyone. First thing: <code>passwd</code>.</p>
<p>Since 2020, Kali no longer works as <code>root</code> by default. <code>id</code> shows you're <code>kali</code>, in the <code>sudo</code> group: you run as a normal user and ask for admin rights only for commands that really need them (an nmap SYN scan, for example).</p>`},
 try:[{cmd:"passwd",d:{ro:"Schimbă parola utilizatorului curent.",en:"Changes the current user's password."}},{cmd:"id",d:{ro:"UID-ul și grupurile tale.",en:"Your UID and groups."}}]},

{at:"kali",frame:K5,kind:"k",move:[[["kali","nat"]],[["nat","home"]],[["home","net"]]],log:{ro:"sistemul actualizat",en:"system updated"},who:"apt",
 title:{ro:"Actualizarea: Kali e o distribuție „rolling”",en:"Updating: Kali is a \"rolling\" distribution"},
 body:{ro:`<p>Kali nu are versiuni mari la câțiva ani, ci se actualizează continuu din depozitul <code>kali-rolling</code>. Imaginea descărcată e deja în urmă cu câteva săptămâni.</p>
<p><code>sudo apt update</code> citește lista de pachete (semnată cu cheia Kali), iar <code>sudo apt full-upgrade -y</code> le aduce pe toate la zi, inclusiv când se schimbă dependențele. Pachetele trec prin adaptorul NAT, apoi prin laptop și routerul de acasă.</p>`,
 en:`<p>Kali doesn't have big releases every few years; it updates continuously from the <code>kali-rolling</code> repository. The downloaded image is already a few weeks behind.</p>
<p><code>sudo apt update</code> reads the package list (signed with the Kali key), and <code>sudo apt full-upgrade -y</code> brings everything up to date, including when dependencies change. The packages come through the NAT adapter, then the laptop and the home router.</p>`},
 more:{ro:`<p>Depozitul oficial e în <code>/etc/apt/sources.list</code>: <code>deb http://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware</code>. Nu adăuga depozite Debian sau PPA-uri: amestecul strică sistemul.</p>`,
  en:`<p>The official repository is in <code>/etc/apt/sources.list</code>: <code>deb http://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware</code>. Don't add Debian repositories or PPAs: the mix breaks the system.</p>`},
 try:[{cmd:"sudo apt update && sudo apt full-upgrade -y",d:{ro:"Actualizează tot sistemul.",en:"Updates the whole system."}}]},

{at:"kali",frame:K6,kind:"k",tables:["meta"],hl:{meta:"kali-tools-information-gathering"},log:{ro:"uneltele de descoperire",en:"discovery tools"},who:{ro:"Metapachete",en:"Metapackages"},
 title:{ro:"Metapachete: instalezi doar ce-ți trebuie",en:"Metapackages: install only what you need"},
 body:{ro:`<p>Uneltele Kali sunt grupate în <strong>metapachete</strong>: pachete goale care trag după ele o categorie de unelte. Pentru lecțiile următoare îți ajunge <code>kali-tools-information-gathering</code>: nmap, arp-scan, netdiscover și alte unelte de descoperire.</p>
<p>Mai puține unelte înseamnă un sistem mai mic, mai rapid de actualizat și mai ușor de înțeles. Nu instalezi „tot”, ca să ai de unde alege.</p>`,
 en:`<p>Kali's tools are grouped into <strong>metapackages</strong>: empty packages that pull in a category of tools. For the next lessons, <code>kali-tools-information-gathering</code> is enough: nmap, arp-scan, netdiscover and other discovery tools.</p>
<p>Fewer tools mean a smaller system, quicker to update and easier to understand. You don't install "everything" just to have options.</p>`}},

{at:"kali",frame:K7,kind:"k",log:{ro:"adresele lui Kali",en:"Kali's addresses"},who:"ip",
 title:{ro:"Unde e Kali în rețea?",en:"Where is Kali on the network?"},
 body:{ro:`<p>Înainte de orice scanare, afli <strong>unde ești</strong>. <code>ip -br addr</code> și <code>ip route</code>:</p>
<ul><li><code>eth0 10.0.50.10/24</code>: placa din <code>lab-net</code>. Rețeaua laboratorului e <code>10.0.50.0/24</code>;</li>
<li><code>eth1 10.0.2.15/24</code>: placa NAT;</li>
<li><code>default via 10.0.2.2 dev eth1</code>: tot ce nu e în laborator iese prin NAT.</li></ul>
<p>Ultima linie e cea care ne îngrijorează: „tot ce nu e în laborator” include și rețeaua de acasă.</p>`,
 en:`<p>Before any scan, you find out <strong>where you are</strong>. <code>ip -br addr</code> and <code>ip route</code>:</p>
<ul><li><code>eth0 10.0.50.10/24</code>: the <code>lab-net</code> card. The lab network is <code>10.0.50.0/24</code>;</li>
<li><code>eth1 10.0.2.15/24</code>: the NAT card;</li>
<li><code>default via 10.0.2.2 dev eth1</code>: everything not in the lab goes out through NAT.</li></ul>
<p>The last line is the worrying one: "everything not in the lab" includes the home network.</p>`},
 try:[{cmd:"ip -br addr",d:{ro:"Interfețe și adrese.",en:"Interfaces and addresses."}},{cmd:"ip route",d:{ro:"Unde pleacă pachetele.",en:"Where packets go."}}]},

{at:"home",frame:K8,kind:"k",move:[[["kali","nat"]],[["nat","home"]]],marks:{home:{k:"drop",t:{ro:"accesibilă!",en:"reachable!"}}},log:{ro:"drum spre rețeaua de acasă",en:"a path to the home network"},who:{ro:"Verificarea izolării",en:"Isolation check"},
 title:{ro:"Verificarea izolării: rețeaua de acasă e accesibilă",en:"Isolation check: the home network is reachable"},
 body:{ro:`<p>Testăm ce credeam că e imposibil. <code>ip route get 192.168.1.1</code>: pachetul ar pleca pe <code>eth1</code>, prin NAT. <code>ping</code> spre routerul de acasă: <strong>răspunde</strong>.</p>
<p>NAT-ul VirtualBox duce traficul VM-ului prin laptop, deci Kali poate ajunge oriunde ajunge și laptopul: routerul, telefoanele, imprimanta, camerele. O greșeală de tastare (<code>192.168.1.0/24</code> în loc de <code>10.0.50.0/24</code>) ar scana rețeaua familiei.</p>
<p class="key">Nu presupui izolarea. O verifici, cu o comandă, înainte de primul exercițiu.</p>`,
 en:`<p>We test what we assumed was impossible. <code>ip route get 192.168.1.1</code>: the packet would leave on <code>eth1</code>, through NAT. A <code>ping</code> to the home router: <strong>it answers</strong>.</p>
<p>VirtualBox NAT carries the VM's traffic through the laptop, so Kali can reach anything the laptop can: the router, phones, the printer, cameras. A typo (<code>192.168.1.0/24</code> instead of <code>10.0.50.0/24</code>) would scan the family network.</p>
<p class="key">You don't assume isolation. You check it, with a command, before the first exercise.</p>`}},

{at:"kali",frame:K9,kind:"k",marks:{nat:{k:"ok",t:{ro:"deconectat",en:"disconnected"}}},log:{ro:"NAT deconectat",en:"NAT disconnected"},who:{ro:"Izolarea",en:"Isolation"},
 title:{ro:"Închidem drumul: NAT doar când actualizezi",en:"Closing the path: NAT only while updating"},
 body:{ro:`<p>Soluția simplă: adaptorul NAT stă <strong>deconectat</strong> cât lucrezi în laborator. În setările VM-ului debifezi „Cable connected” (sau, din Kali, <code>sudo ip link set eth1 down</code>). Îl reconectezi doar pentru <code>apt full-upgrade</code>.</p>
<p>Verificarea: <code>ip route get 192.168.1.1</code> → <strong>Network is unreachable</strong>. Kali mai poate ajunge doar în <code>10.0.50.0/24</code>.</p>`,
 en:`<p>The simple fix: the NAT adapter stays <strong>disconnected</strong> while you work in the lab. In the VM settings you untick "Cable connected" (or, from Kali, <code>sudo ip link set eth1 down</code>). You reconnect it only for <code>apt full-upgrade</code>.</p>
<p>The check: <code>ip route get 192.168.1.1</code> → <strong>Network is unreachable</strong>. Kali can now reach only <code>10.0.50.0/24</code>.</p>`},
 more:{ro:`<p>O variantă mai strictă: o regulă nftables în Kali care permite ieșirea pe <code>eth1</code> doar spre portul 80/443, sau un VM separat care face actualizările.</p>`,
  en:`<p>A stricter option: an nftables rule in Kali that allows <code>eth1</code> out only to ports 80/443, or a separate VM that does the updates.</p>`}},

{at:["t1","t2"],frame:K10,kind:"k",move:[[["kali","lab"]],[["lab","t1"],["lab","t2"]]],log:{ro:"țintele răspund",en:"targets answer"},who:{ro:"Țintele",en:"Targets"},
 title:{ro:"Țintele de test: vulnerabile intenționat, închise în laborator",en:"Test targets: vulnerable on purpose, locked in the lab"},
 body:{ro:`<p>În <code>lab-net</code> pornești mașini făcute anume pentru exerciții: de exemplu <strong>Metasploitable 2</strong> (un Linux vechi, plin de servicii vulnerabile) sau o aplicație web ca <strong>DVWA</strong>. Aici le numim <code>web-lab</code> (<code>.20</code>) și <code>win-lab</code> (<code>.30</code>).</p>
<p>Sunt vulnerabile <em>intenționat</em>, deci nu le dai niciodată adaptor NAT sau bridged și nu le expui la internet. <code>ping</code> confirmă că răspund din Kali.</p>`,
 en:`<p>On <code>lab-net</code> you start machines made specifically for practice: for example <strong>Metasploitable 2</strong> (an old Linux full of vulnerable services) or a web app like <strong>DVWA</strong>. Here we call them <code>web-lab</code> (<code>.20</code>) and <code>win-lab</code> (<code>.30</code>).</p>
<p>They're vulnerable <em>on purpose</em>, so you never give them a NAT or bridged adapter and never expose them to the internet. <code>ping</code> confirms they answer from Kali.</p>`}},

{at:["kali","t1","t2"],frame:K11,kind:"k",move:[[["host","kali"]]],log:{ro:"snapshot curat",en:"clean snapshot"},who:"Snapshot",
 title:{ro:"Snapshot-uri: un buton „înapoi” pentru tot laboratorul",en:"Snapshots: an \"undo\" button for the whole lab"},
 body:{ro:`<p>Un <strong>snapshot</strong> salvează starea completă a unei mașini virtuale: disc, setări, opțional memoria. După ce Kali și țintele sunt configurate, faci câte un snapshot „curat”.</p>
<p>Orice exercițiu care strică ceva (o configurare greșită, un serviciu oprit, o țintă modificată) se anulează revenind la snapshot, în câteva secunde. Așa poți experimenta fără teamă.</p>`,
 en:`<p>A <strong>snapshot</strong> saves a virtual machine's complete state: disk, settings, optionally memory. Once Kali and the targets are set up, you take a "clean" snapshot of each.</p>
<p>Any exercise that breaks something (a wrong setting, a stopped service, a modified target) is undone by going back to the snapshot, in seconds. That way you can experiment without fear.</p>`},
 try:[{cmd:"VBoxManage snapshot kali take curat-2026-11",d:{ro:"Snapshot din linia de comandă.",en:"A snapshot from the command line."}},{cmd:"VBoxManage snapshot kali restore curat-2026-11",d:{ro:"Revenire (cu VM-ul oprit).",en:"Restore (with the VM powered off)."}}]},

{at:["kali","lab","t1","t2"],frame:null,kind:"none",summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<ul><li>Uneltele Kali sunt neutre; ce contează e <strong>permisiunea</strong>: doar sisteme proprii sau un acord scris, cu scop clar.</li>
<li>Imaginea vine doar de pe kali.org și se verifică cu <code>sha256sum</code>.</li>
<li>Rețeaua: <strong>Internal Network</strong> pentru laborator, NAT doar pentru actualizări, niciodată bridged pentru scanări.</li>
<li>Primul login: <code>passwd</code>; lucrezi ca utilizator normal, cu <code>sudo</code>. Apoi <code>apt full-upgrade</code> și doar metapachetele necesare.</li>
<li>Izolarea se <strong>verifică</strong>: <code>ip route get</code> spre rețeaua de acasă trebuie să dea „unreachable”.</li>
<li>Țintele vulnerabile stau doar în rețeaua internă; snapshot-urile te readuc la starea curată.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<ul><li>Kali's tools are neutral; what matters is <strong>permission</strong>: only your own systems or a written agreement with a clear scope.</li>
<li>The image comes only from kali.org and is checked with <code>sha256sum</code>.</li>
<li>The network: <strong>Internal Network</strong> for the lab, NAT only for updates, never bridged for scanning.</li>
<li>First login: <code>passwd</code>; you work as a normal user, with <code>sudo</code>. Then <code>apt full-upgrade</code> and only the metapackages you need.</li>
<li>Isolation is <strong>checked</strong>: <code>ip route get</code> towards the home network must say "unreachable".</li>
<li>Vulnerable targets live only on the internal network; snapshots take you back to a clean state.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],

reference:(T,lang)=>{
  const ro=lang==="ro";
  return `<div class="ref-grid"><section class="card refcard"><h2>${ro?"Configurarea VM-urilor":"VM setup"}</h2>
<pre class="yaml"><span class="c"># ${ro?"Kali: placa 1 în rețeaua internă, placa 2 NAT":"Kali: card 1 on the internal network, card 2 NAT"}</span>
VBoxManage modifyvm kali --nic1 intnet --intnet1 lab-net
VBoxManage modifyvm kali --nic2 nat
VBoxManage modifyvm kali --cableconnected2 off   <span class="c"># ${ro?"NAT deconectat":"NAT unplugged"}</span>
<span class="c"># ${ro?"ținte: doar rețeaua internă":"targets: internal network only"}</span>
VBoxManage modifyvm web-lab --nic1 intnet --intnet1 lab-net
VBoxManage snapshot kali take curat-2026-11</pre>
<h3>${ro?"Adrese fixe în lab-net (fără DHCP)":"Static addresses on lab-net (no DHCP)"}</h3>
<pre class="yaml">sudo nmcli con add type ethernet ifname eth0 con-name lab \
  ipv4.method manual ipv4.addresses 10.0.50.10/24</pre></section>
<section class="card refcard"><h2>${ro?"Comenzi în Kali":"Commands in Kali"}</h2>
<pre class="yaml">passwd
id
sudo apt update && sudo apt full-upgrade -y
sudo apt install -y kali-tools-information-gathering
ip -br addr
ip route
ip route get 192.168.1.1      <span class="c"># ${ro?"trebuie: unreachable":"should be: unreachable"}</span>
ping -c2 10.0.50.20</pre>
<h3>${ro?"Înainte de fiecare exercițiu":"Before every exercise"}</h3>
<pre class="yaml">1. ${ro?"Ținta e a mea / am acord scris?":"Is the target mine / do I have written approval?"}
2. ${ro?"NAT deconectat? ip route get":"NAT unplugged? ip route get"}
3. ${ro?"Adresele din comandă sunt din 10.0.50.0/24?":"Are the command's addresses in 10.0.50.0/24?"}
4. ${ro?"Am un snapshot curat?":"Do I have a clean snapshot?"}</pre></section>
<section class="card refcard"><h2>${ro?"De unde descarci (doar surse oficiale)":"Where to download (official sources only)"}</h2>
<ul class="dl-src" style="overflow-wrap:anywhere">
<li><a href="https://www.virtualbox.org/wiki/Downloads" target="_blank" rel="noopener noreferrer">virtualbox.org/wiki/Downloads</a>: ${ro?"VirtualBox pentru Windows, macOS și Linux":"VirtualBox for Windows, macOS and Linux"}</li>
<li><a href="https://download.virtualbox.org/virtualbox/" target="_blank" rel="noopener noreferrer">download.virtualbox.org/virtualbox</a>: ${ro?"toate versiunile, cu fișierul <code>SHA256SUMS</code>":"every version, with the <code>SHA256SUMS</code> file"}</li>
<li><a href="https://www.kali.org/get-kali/#kali-virtual-machines" target="_blank" rel="noopener noreferrer">kali.org/get-kali → Virtual Machines</a>: ${ro?"imaginea gata făcută pentru VirtualBox (<code>.7z</code>)":"the ready-made VirtualBox image (<code>.7z</code>)"}</li>
<li><a href="https://cdimage.kali.org/current/" target="_blank" rel="noopener noreferrer">cdimage.kali.org/current</a>: ${ro?"aceleași imagini, plus <code>SHA256SUMS</code> și semnătura <code>.gpg</code>":"the same images, plus <code>SHA256SUMS</code> and the <code>.gpg</code> signature"}</li>
<li><a href="https://www.kali.org/docs/virtualization/import-premade-virtualbox/" target="_blank" rel="noopener noreferrer">kali.org/docs → Import pre-made VirtualBox</a>: ${ro?"ghidul oficial de import":"the official import guide"}</li>
</ul>
<h3>${ro?"Verificare pe Windows (PowerShell)":"Checking on Windows (PowerShell)"}</h3>
<pre class="yaml">Get-FileHash .\kali-linux-*-virtualbox-amd64.7z
<span class="c"># ${ro?"compari cu linia din SHA256SUMS":"compare with the line in SHA256SUMS"}</span>
tar -xf .\kali-linux-*-virtualbox-amd64.7z   <span class="c"># ${ro?"sau 7-Zip":"or 7-Zip"}</span></pre>
<p>${ro?"Imaginea pornește cu utilizatorul <code>kali</code> / parola <code>kali</code>: schimb-o imediat cu <code>passwd</code>.":"The image starts with user <code>kali</code> / password <code>kali</code>: change it right away with <code>passwd</code>."}</p></section></div>`;
},
