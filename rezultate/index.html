<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezultate teste</title>
<meta name="description" content="Rezultatele testelor: ale tale și, pentru administrator, ale tuturor participanților. / Quiz results.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.page{max-width:1180px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page h1{font:700 clamp(1.5rem,3vw,2.1rem) var(--head);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
.kpi b{display:block;font:700 1.6rem var(--head);font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.block h2{font:700 1.1rem var(--head);margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.row input{font:500 .92rem var(--sans);padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);min-width:0;flex:1 1 220px;max-width:340px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:.76rem;color:var(--muted);font-weight:600;white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--text)}
.pct{display:flex;align-items:center;gap:8px}
.pill{display:inline-block;font:600 .72rem var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--border)}
.good{color:var(--ok)} .mid{color:var(--chgfg)} .low{color:var(--bad)}
.empty{color:var(--muted);font-style:italic}
.setup{border:2px dashed var(--text)}
.setup ol{margin:10px 0 14px;padding-left:22px;line-height:1.6}
.setup li{margin-bottom:4px}
.setup code,.uid-row code{font:600 .86rem var(--mono);background:var(--surface2);padding:2px 6px;border-radius:5px;word-break:break-all}
.uid-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.uid-row code{user-select:all;padding:6px 10px;font-size:.95rem}
.go-btn{display:inline-flex;padding:9px 14px;border-radius:8px;background:var(--accent);color:var(--accent-text);font:700 .9rem var(--sans);text-decoration:none}
.pts{background:var(--accent);color:var(--accent-text);border:2px solid var(--text);border-radius:12px;padding:10px 14px;font:600 .95rem var(--sans);margin:0 0 12px}.pts b{font:700 1.3rem var(--head)}.pts a{color:inherit;font-weight:700}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.btn-sm{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:7px;padding:6px 10px;font:600 .82rem var(--sans);cursor:pointer}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="topbar" id="top"><div class="topbar-in">
  <a class="brand" href="../index.html"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/><path d="M7 16h18M19 11l6 5-6 5" fill="none" stroke="var(--accent-text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="16" r="2.6" fill="var(--accent-text)"/></svg><span data-t="brand"></span></a>
  <nav class="nav"><a href="../index.html" data-t="home"></a></nav>
  <div class="tools"><div class="seg" role="group" aria-label="Limba / Language"><button type="button" data-lang="ro">RO</button><button type="button" data-lang="en">EN</button></div><button type="button" class="icon-btn" id="theme">◐</button></div>
</div></header>

<main class="page">
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="top-actions"><a class="go-btn" href="../teste/index.html" data-t="toTests"></a></div>

  <section class="block" id="mine">
    <h2 data-t="mineT"></h2>
    <div id="mineBody"><p class="empty" data-t="loading"></p></div>
  </section>

  <div id="admin" hidden>
    <div class="kpis" id="kpis"></div>
    <section class="block"><div class="row"><h2 data-t="peopleT"></h2><button type="button" class="btn-sm" id="csv" data-t="csv"></button></div><div class="scroll" id="people"></div></section>
    <section class="block"><h2 data-t="lessonsT"></h2><div class="scroll" id="lessons"></div></section>
    <section class="block"><div class="row"><h2 data-t="allT"></h2><input id="filter" type="search" autocomplete="off"></div><div class="scroll" id="all"></div></section>
  </div>

  <section class="block setup" id="help" hidden>
    <h2 data-t="helpT"></h2>
    <p><b data-t="codeWay"></b> <a class="go-btn" href="../admin/index.html" data-t="toAdmin"></a></p>
    <p class="lead" data-t="helpLead"></p>
    <div class="uid-row"><code id="uid"></code><button type="button" class="btn-sm" id="copy" data-t="copy"></button></div>
    <ol id="steps"></ol>
    <p><a class="go-btn" id="console" target="_blank" rel="noopener" data-t="openConsole"></a> <button type="button" class="btn-sm" id="recheck" data-t="recheck"></button></p>
  </section>
</main>

<script type="module" src="../assets/auth.js?v=6"></script>
<script type="module">
import { app, auth, db } from "../assets/firebase.js?v=5";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { collection, query, where, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { qualifies, PER_TEST } from "../assets/points.js?v=1";
let rouletteNet=0;

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("cadru-lang")==="en"?"en":"ro";
const UI={
  brand:["Rețea pas cu pas","Network step by step"],home:["← Lecții","← Lessons"],
  title:["Rezultatele testelor","Quiz results"],lead:["Fiecare test terminat din finalul unei lecții e salvat aici, cu scorul obținut.","Every quiz finished at the end of a lesson is saved here, with the score."],
  mineT:["Rezultatele mele","My results"],loading:["Se încarcă…","Loading…"],noMine:["Încă n-ai terminat niciun test. Deschide o lecție și răspunde la toate întrebările din „Test final”.","You haven't finished a quiz yet. Open a lesson and answer every question in the \"Final quiz\"."],
  lesson:["Lecție","Lesson"],score:["Scor","Score"],best:["Cel mai bun","Best"],attempts:["Încercări","Attempts"],last:["Ultima dată","Last time"],when:["Când","When"],
  peopleT:["Participanți","Participants"],lessonsT:["Pe lecții","By lesson"],allT:["Toate încercările","Every attempt"],
  name:["Nume","Name"],email:["E-mail","Email"],avg:["Medie","Average"],lessonsDone:["Lecții","Lessons"],participants:["Participanți","Participants"],
  kPeople:["participanți","participants"],kAttempts:["teste terminate","quizzes finished"],kAvg:["scor mediu","average score"],kLessons:["lecții încercate","lessons attempted"],
  filter:["Caută după nume, e-mail sau lecție","Search by name, email or lesson"],csv:["Descarcă CSV","Download CSV"],
  helpT:["Ești administratorul site-ului? Activează vederea de administrator","Are you the site administrator? Turn on the admin view"],
  codeWay:["Mai simplu: dacă ai un cod de acces de la un administrator, introdu-l pe pagina Administrare.","Easier: if you have an access code from an administrator, enter it on the Administration page."],toAdmin:["⚙ Pagina Administrare →","⚙ Administration page →"],
  helpLead:["Acum vezi doar rezultatele tale. Ca să vezi rezultatele tuturor participanților, adaugă o singură dată ID-ul tău în lista de administratori din consola Firebase. ID-ul tău de utilizator:","Right now you only see your own results. To see every participant's results, add your ID to the admin list in the Firebase console, once. Your user ID:"],
  steps:[["Apasă <b>Copiază ID-ul</b> de mai sus.","Deschide consola Firestore cu butonul de mai jos (sau: meniul din stânga → <b>Databases &amp; Storage → Firestore</b>).","Apasă <b>+ Start collection</b>. La <b>Collection ID</b> scrie <code>admins</code> → <b>Next</b>.","La <b>Document ID</b> lipește ID-ul copiat.","Adaugă un câmp: <b>Field</b> <code>role</code>, <b>Type</b> string, <b>Value</b> <code>admin</code> → <b>Save</b>.","Revino aici și apasă <b>Verifică din nou</b>. Apar participanții, mediile pe lecții, toate încercările și exportul CSV."],
         ["Click <b>Copy ID</b> above.","Open the Firestore console with the button below (or: left menu → <b>Databases &amp; Storage → Firestore</b>).","Click <b>+ Start collection</b>. For <b>Collection ID</b> type <code>admins</code> → <b>Next</b>.","For <b>Document ID</b> paste the copied ID.","Add one field: <b>Field</b> <code>role</code>, <b>Type</b> string, <b>Value</b> <code>admin</code> → <b>Save</b>.","Come back here and click <b>Check again</b>. Participants, lesson averages, every attempt and the CSV export appear."]],
  copy:["Copiază ID-ul","Copy ID"],copied:["Copiat ✓","Copied ✓"],openConsole:["Deschide consola Firestore ↗","Open the Firestore console ↗"],recheck:["Verifică din nou","Check again"],
  toTests:["✎ Mergi la teste","✎ Go to the quizzes"],
  err:["Rezultatele nu au putut fi încărcate.","The results couldn't be loaded."]
};
const T=k=>UI[k][lang==="en"?1:0];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const lhref=l=>{l=String(l);return l.endsWith("-lab")?"../"+esc(l.slice(0,-4))+"/index.html#lab":"../"+esc(l)+"/index.html"};
const pct=(s,t)=>t?Math.round(100*s/t):0;
const cls=p=>p>=80?"good":p>=50?"mid":"low";
const fmt=d=>d?d.toLocaleString(lang==="en"?"en-GB":"ro-RO",{dateStyle:"medium",timeStyle:"short"}):"—";
const bar=p=>`<span class="pct"><span class="bar"><i style="width:${p}%"></i></span><b class="${cls(p)}">${p}%</b></span>`;
let mine=[],all=null,me=null;

function render(){
  document.documentElement.lang=lang;document.title=T("title");
  document.querySelectorAll("[data-t]").forEach(e=>{const k=e.dataset.t;if(UI[k])e.textContent=T(k)});
  $("#filter").placeholder=T("filter");
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
  if(me){$("#uid").textContent=me.uid}
  $("#steps").innerHTML=UI.steps[lang==="en"?1:0].map(s=>`<li>${s}</li>`).join("");
  renderMine();if(all)renderAdmin();
}
function renderMine(){
  if(!me)return;
  const nOk=mine.filter(qualifies).length,earned=nOk*PER_TEST,tot=Math.max(0,earned+rouletteNet),en=lang==="en";
  const ptsBox=`<p class="pts">🪙 <b>${tot}</b> ${en?"points":"puncte"} · ${en?`${nOk} quizzes over 80% × ${PER_TEST} = ${earned}`:`${nOk} teste peste 80% × ${PER_TEST} = ${earned}`}${rouletteNet?` · ${en?"roulette":"ruletă"} ${rouletteNet>0?"+":""}${rouletteNet}`:""} · <a href="../ruleta/index.html">${en?"🎰 Play roulette →":"🎰 Joacă la ruletă →"}</a></p>`;
  if(!mine.length){$("#mineBody").innerHTML=ptsBox+`<p class="empty">${T("noMine")}</p>`;return}
  const by={};mine.forEach(r=>{(by[r.lesson]=by[r.lesson]||[]).push(r)});
  let h=`<div class="scroll"><table><thead><tr><th>${T("lesson")}</th><th>${T("best")}</th><th>${T("attempts")}</th><th>${T("last")}</th></tr></thead><tbody>`;
  Object.values(by).sort((a,b)=>b[0].d-a[0].d).forEach(list=>{const best=list.reduce((m,r)=>Math.max(m,pct(r.score,r.total)),0);const lastR=list[0];
    h+=`<tr><td><a href="${lhref(lastR.lesson)}">${esc(lastR.title)}</a></td><td>${bar(best)}</td><td class="n">${list.length}</td><td class="n">${lastR.score}/${lastR.total} · ${fmt(lastR.d)}</td></tr>`});
  $("#mineBody").innerHTML=ptsBox+h+`</tbody></table></div>`;
}
function renderAdmin(){
  const people={},lessons={};
  all.forEach(r=>{const p=people[r.uid]=people[r.uid]||{name:r.name,email:r.email,n:0,sum:0,lessons:new Set(),last:null};p.n++;p.sum+=pct(r.score,r.total);p.lessons.add(r.lesson);if(!p.last||r.d>p.last)p.last=r.d;
    const l=lessons[r.lesson]=lessons[r.lesson]||{title:r.title,n:0,sum:0,people:new Set()};l.n++;l.sum+=pct(r.score,r.total);l.people.add(r.uid)});
  const avg=all.length?Math.round(all.reduce((s,r)=>s+pct(r.score,r.total),0)/all.length):0;
  $("#kpis").innerHTML=[[Object.keys(people).length,T("kPeople")],[all.length,T("kAttempts")],[avg+"%",T("kAvg")],[Object.keys(lessons).length,T("kLessons")]].map(([b,s])=>`<div class="kpi"><b>${b}</b><span>${s}</span></div>`).join("");
  let h=`<table style="min-width:620px"><thead><tr><th>${T("name")}</th><th>${T("email")}</th><th>${T("attempts")}</th><th>${T("lessonsDone")}</th><th>${T("avg")}</th><th>${T("last")}</th></tr></thead><tbody>`;
  Object.values(people).sort((a,b)=>b.last-a.last).forEach(p=>{h+=`<tr><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td class="n">${p.n}</td><td class="n">${p.lessons.size}</td><td>${bar(Math.round(p.sum/p.n))}</td><td class="n">${fmt(p.last)}</td></tr>`});
  $("#people").innerHTML=h+`</tbody></table>`;
  h=`<table style="min-width:520px"><thead><tr><th>${T("lesson")}</th><th>${T("participants")}</th><th>${T("attempts")}</th><th>${T("avg")}</th></tr></thead><tbody>`;
  Object.entries(lessons).sort((a,b)=>b[1].n-a[1].n).forEach(([id,l])=>{h+=`<tr><td><a href="${lhref(id)}">${esc(l.title)}</a></td><td class="n">${l.people.size}</td><td class="n">${l.n}</td><td>${bar(Math.round(l.sum/l.n))}</td></tr>`});
  $("#lessons").innerHTML=h+`</tbody></table>`;
  renderAll();
}
function renderAll(){
  const q=$("#filter").value.trim().toLowerCase();
  const rows=all.filter(r=>!q||(r.name+" "+r.email+" "+r.title).toLowerCase().includes(q)).slice(0,300);
  let h=`<table style="min-width:620px"><thead><tr><th>${T("when")}</th><th>${T("name")}</th><th>${T("email")}</th><th>${T("lesson")}</th><th>${T("score")}</th></tr></thead><tbody>`;
  rows.forEach(r=>{const p=pct(r.score,r.total);h+=`<tr><td class="n">${fmt(r.d)}</td><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.title)}</td><td class="n"><b class="${cls(p)}">${r.score}/${r.total}</b> (${p}%)</td></tr>`});
  $("#all").innerHTML=rows.length?h+`</tbody></table>`:`<p class="empty">—</p>`;
}
$("#filter").addEventListener("input",()=>{if(all)renderAll()});
$("#csv").onclick=()=>{const head=["date","name","email","lesson","title","score","total","percent"];const lines=[head.join(",")].concat(all.map(r=>[r.d?r.d.toISOString():"",r.name,r.email,r.lesson,r.title,r.score,r.total,pct(r.score,r.total)].map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\n")],{type:"text/csv"}));a.download="rezultate-teste.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};

const norm=d=>{const x=d.data();return {...x,d:x.ts&&x.ts.toDate?x.ts.toDate():null}};
$("#console").href=`https://console.firebase.google.com/project/${encodeURIComponent(app.options.projectId)}/firestore/databases/-default-/data`;
$("#copy").onclick=async()=>{if(!me)return;try{await navigator.clipboard.writeText(me.uid)}catch(e){const r=document.createRange();r.selectNodeContents($("#uid"));const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand("copy")}catch(_){}}
  $("#copy").textContent=T("copied");setTimeout(()=>{$("#copy").textContent=T("copy")},2000)};
async function checkAdmin(){
  const adm=await getDoc(doc(db,"admins",me.uid));
  if(adm.exists()){
    const s2=await getDocs(collection(db,"results"));
    all=s2.docs.map(norm).sort((a,b)=>(b.d||0)-(a.d||0));
    $("#admin").hidden=false;$("#help").hidden=true;renderAdmin();
    const top=document.querySelector(".top-actions");if(top&&!top.querySelector(".to-admin")){const a=document.createElement("a");a.className="go-btn to-admin";a.href="../admin/index.html";a.textContent=lang==="en"?"⚙ Users & online status":"⚙ Utilizatori și cine e online";top.appendChild(a)}
  }else{$("#help").hidden=false}
}
$("#recheck").onclick=()=>{if(me)checkAdmin().catch(e=>console.error(e))};
onAuthStateChanged(auth,async user=>{
  if(!user)return;me=user;render();
  try{
    const snap=await getDocs(query(collection(db,"results"),where("uid","==",user.uid)));
    try{const u=await getDoc(doc(db,"users",user.uid));if(u.exists()&&typeof u.data().roulette==="number")rouletteNet=u.data().roulette}catch(e){}
    mine=snap.docs.map(norm).sort((a,b)=>(b.d||0)-(a.d||0));renderMine();
    await checkAdmin();
  }catch(e){console.error(e);$("#mineBody").innerHTML=`<p class="empty">${T("err")}</p>`}
});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("cadru-lang",lang);render()});
const saved=store.get("cadru-theme");if(saved==="light"||saved==="dark")document.documentElement.dataset.theme=saved;
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const nt=d?"light":"dark";r.dataset.theme=nt;store.set("cadru-theme",nt)};
render();
</script>
</body>
</html>
