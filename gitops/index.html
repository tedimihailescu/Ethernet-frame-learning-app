sub:{ro:"Echipa Comenzi vrea să lanseze versiunea 1.8.0 a serviciului orders-api. Nimeni nu rulează kubectl în producție: tot ce trebuie să ruleze e scris în Git, iar Argo CD aduce clusterul la starea din Git. Urmărim schimbarea de la build la pull request, sync, o modificare manuală anulată automat, un rollback cu git revert, mediile și secretele.",en:"The Orders team wants to release version 1.8.0 of the orders-api service. Nobody runs kubectl in production: everything that should run is written in Git, and Argo CD brings the cluster to the state in Git. We follow the change from build to pull request, sync, a manual change undone automatically, a rollback with git revert, environments and secrets."},

steps:[
{at:["git","argo"],frame:null,kind:"none",tables:["push","principles"],who:{ro:"Ideea",en:"The idea"},
 title:{ro:"Ce e GitOps: Git spune ce trebuie să ruleze",en:"What GitOps is: Git says what should run"},
 body:{ro:`<p>Fără GitOps, o lansare înseamnă ca cineva (sau un pipeline) să ruleze <code>kubectl apply</code> sau <code>helm upgrade</code> în producție. După câteva luni, nimeni nu mai știe sigur ce rulează și de ce.</p>
<p>Cu <strong>GitOps</strong>, tot ce trebuie să ruleze în cluster (Deployment-uri, Service-uri, configurări) e descris în fișiere YAML într-un <strong>repo Git de configurare</strong>. Un agent din cluster, aici <strong>Argo CD</strong>, compară mereu Git cu clusterul și le aduce la fel.</p>
<p class="key">Vrei să schimbi producția? Faci un commit. Vrei să știi ce rulează? Te uiți în Git.</p>`,
 en:`<p>Without GitOps, a release means someone (or a pipeline) runs <code>kubectl apply</code> or <code>helm upgrade</code> against production. After a few months, nobody is quite sure what's running or why.</p>
<p>With <strong>GitOps</strong>, everything that should run in the cluster (Deployments, Services, config) is described in YAML files in a <strong>Git config repo</strong>. An agent in the cluster, here <strong>Argo CD</strong>, keeps comparing Git with the cluster and makes them match.</p>
<p class="key">Want to change production? Make a commit. Want to know what's running? Look in Git.</p>`}},

{at:"ci",frame:C1,kind:"c",move:[[["dev","ci"]],[["ci","reg"]]],log:{ro:"build și imagine",en:"build and image"},who:"CI",
 title:{ro:"Codul nou devine o imagine",en:"The new code becomes an image"},
 body:{ro:`<p>Un programator face merge în repo-ul de <strong>cod</strong> al lui orders-api. Pipeline-ul CI rulează testele, construiește imaginea de container și o publică în registry cu un tag fix: <code>orders-api:1.8.0</code>.</p>
<p>Observă ce <strong>nu</strong> face CI-ul: nu se conectează la clusterul de producție. Nu are nici măcar acces acolo. Treaba lui se termină cu o imagine publicată.</p>`,
 en:`<p>A developer merges into orders-api's <strong>code</strong> repo. The CI pipeline runs the tests, builds the container image and pushes it to the registry with a fixed tag: <code>orders-api:1.8.0</code>.</p>
<p>Note what CI does <strong>not</strong> do: it doesn't connect to the production cluster. It doesn't even have access there. Its job ends with a published image.</p>`},
 more:{ro:`<p>De obicei sunt <strong>două repo-uri</strong>: unul de cod (aplicația) și unul de configurare (ce rulează unde). Așa, o schimbare de configurare nu declanșează un build, iar drepturile pot fi diferite.</p>`,
  en:`<p>There are usually <strong>two repos</strong>: one for code (the app) and one for config (what runs where). That way a config change doesn't trigger a build, and permissions can differ.</p>`}},

{at:"git",frame:C2,kind:"c",move:[[["ci","git"]]],log:{ro:"pull request de configurare",en:"config pull request"},who:{ro:"Pull request",en:"Pull request"},
 title:{ro:"Lansarea e un pull request de o linie",en:"The release is a one-line pull request"},
 body:{ro:`<p>Ca 1.8.0 să ajungă în producție, cineva schimbă <strong>o singură linie</strong> în repo-ul de configurare: tag-ul imaginii din <code>overlays/prod/kustomization.yaml</code>.</p>
<p>Poate fi un om sau un robot (CI-ul, ori <em>Argo CD Image Updater</em>), dar schimbarea vine mereu ca <strong>pull request</strong>: se vede exact ce se schimbă, <code>1.7.3 → 1.8.0</code>.</p>`,
 en:`<p>For 1.8.0 to reach production, someone changes <strong>a single line</strong> in the config repo: the image tag in <code>overlays/prod/kustomization.yaml</code>.</p>
<p>It can be a person or a bot (CI, or <em>Argo CD Image Updater</em>), but the change always arrives as a <strong>pull request</strong>: you see exactly what changes, <code>1.7.3 → 1.8.0</code>.</p>`}},

{at:"git",frame:C3,kind:"c",move:[[["dev","git"]]],log:{ro:"review și merge",en:"review and merge"},who:"Review",
 title:{ro:"Review și merge: aprobarea e în Git",en:"Review and merge: the approval lives in Git"},
 body:{ro:`<p>Doi colegi aprobă PR-ul, iar verificările automate trec (YAML valid, fără imagini <code>latest</code>, limite de resurse puse). Apoi <strong>merge în main</strong>.</p>
<p>Acel merge <em>este</em> cererea de lansare. Nu există un tichet separat și o parolă de producție: <strong>cine, ce, când și cine a aprobat</strong> rămân în istoricul Git pentru totdeauna, gata pentru un audit.</p>`,
 en:`<p>Two colleagues approve the PR, and automated checks pass (valid YAML, no <code>latest</code> images, resource limits set). Then it's <strong>merged into main</strong>.</p>
<p>That merge <em>is</em> the release request. There's no separate ticket and production password: <strong>who, what, when and who approved</strong> stay in Git history forever, ready for an audit.</p>`}},

{at:"argo",frame:C4,kind:"s",move:[[["git","argo"]]],tables:["status"],hl:{status:"OutOfSync"},log:{ro:"Argo CD vede diferența",en:"Argo CD sees the difference"},who:"Argo CD",
 title:{ro:"Argo CD observă: OutOfSync",en:"Argo CD notices: OutOfSync"},
 body:{ro:`<p>Argo CD rulează <strong>în cluster</strong> și citește repo-ul de configurare (la câteva minute sau imediat, printr-un webhook). Pentru aplicația <code>orders-prod</code> generează YAML-ul final din folderul <code>overlays/prod</code> și îl compară cu ce rulează.</p>
<p>Git spune <code>1.8.0</code>, clusterul are <code>1.7.3</code>: aplicația devine <strong>OutOfSync</strong>.</p>
<p class="key">Acesta e modelul <strong>pull</strong>: clusterul își ia singur starea din Git. Nimeni din afară nu are nevoie de acces la cluster.</p>`,
 en:`<p>Argo CD runs <strong>inside the cluster</strong> and reads the config repo (every few minutes, or straight away via a webhook). For the <code>orders-prod</code> application it renders the final YAML from the <code>overlays/prod</code> folder and compares it with what's running.</p>
<p>Git says <code>1.8.0</code>, the cluster has <code>1.7.3</code>: the app becomes <strong>OutOfSync</strong>.</p>
<p class="key">This is the <strong>pull</strong> model: the cluster fetches its own state from Git. Nobody outside needs access to the cluster.</p>`},
 try:[{cmd:"argocd app diff orders-prod",d:{ro:"Arată exact diferența dintre Git și cluster.",en:"Shows exactly how Git and the cluster differ."}}]},

{at:"argo",frame:C5,kind:"s",move:[[["argo","k8s"]],[["reg","k8s"]]],tables:["status"],hl:{status:"Healthy"},log:{ro:"sync și rolling update",en:"sync and rolling update"},who:"Sync",
 title:{ro:"Sync: clusterul ajunge ca în Git",en:"Sync: the cluster catches up with Git"},
 body:{ro:`<p>Cu <strong>sync automat</strong> pornit, Argo CD aplică diferența: Deployment-ul primește imaginea nouă. Kubernetes face un <strong>rolling update</strong>: nodurile descarcă <code>orders-api:1.8.0</code> din registry, pornesc pod-uri noi, iar cele vechi se opresc doar după ce cele noi sunt gata.</p>
<p>În Argo CD, aplicația trece prin <strong>Synced · Progressing</strong> și ajunge la <strong>Synced · Healthy</strong>. Lansarea s-a terminat fără ca cineva să atingă clusterul.</p>`,
 en:`<p>With <strong>automated sync</strong> enabled, Argo CD applies the difference: the Deployment gets the new image. Kubernetes performs a <strong>rolling update</strong>: the nodes pull <code>orders-api:1.8.0</code> from the registry, start new pods, and stop the old ones only once the new ones are ready.</p>
<p>In Argo CD, the app goes through <strong>Synced · Progressing</strong> and ends at <strong>Synced · Healthy</strong>. The release finished without anyone touching the cluster.</p>`}},

{at:"k8s",frame:C6,kind:"s",move:[[["argo","k8s"]]],marks:{k8s:{k:"drop",t:{ro:"modificat manual",en:"changed by hand"}}},log:{ro:"drift anulat",en:"drift undone"},who:"Self-heal",
 title:{ro:"Drift: o modificare manuală e anulată",en:"Drift: a manual change is undone"},
 body:{ro:`<p>Noaptea, cineva rulează <code>kubectl scale deploy/orders-api --replicas=1</code> „ca să economisească resurse”. Clusterul nu mai corespunde cu Git: acesta e <strong>drift</strong>.</p>
<p>Argo CD îl vede imediat (OutOfSync). Cu <strong>selfHeal</strong> pornit, readuce numărul de replici la 3, cum scrie în Git. Schimbarea corectă era un PR.</p>
<p class="key">În GitOps, singura cale durabilă de a schimba ceva e prin Git.</p>`,
 en:`<p>At night, someone runs <code>kubectl scale deploy/orders-api --replicas=1</code> "to save resources". The cluster no longer matches Git: that's <strong>drift</strong>.</p>
<p>Argo CD sees it straight away (OutOfSync). With <strong>selfHeal</strong> on, it puts the replicas back to 3, as Git says. The right way to make that change was a PR.</p>
<p class="key">In GitOps, the only lasting way to change something is through Git.</p>`}},

{at:"k8s",frame:C7,kind:"s",marks:{k8s:{k:"drop",t:"Degraded"}},tables:["status"],hl:{status:"Degraded"},log:{ro:"versiunea are o problemă",en:"the release has a problem"},who:"Degraded",
 title:{ro:"1.8.0 are o problemă",en:"1.8.0 has a problem"},
 body:{ro:`<p>A doua zi dimineață, alertele arată erori 500: versiunea 1.8.0 caută o coloană care nu există încă în baza de date. Pod-urile repornesc, iar Argo CD arată aplicația <strong>Degraded</strong>.</p>
<p>Atenție: aplicația e încă <strong>Synced</strong>. Clusterul face exact ce scrie în Git; problema e chiar ce scrie în Git. Deci și reparația trebuie să vină tot prin Git.</p>`,
 en:`<p>Next morning, alerts show 500 errors: version 1.8.0 looks for a column that doesn't exist in the database yet. The pods restart, and Argo CD shows the app as <strong>Degraded</strong>.</p>
<p>Note: the app is still <strong>Synced</strong>. The cluster does exactly what Git says; the problem is what Git says. So the fix has to come through Git as well.</p>`}},

{at:"git",frame:C8,kind:"c",move:[[["dev","git"]],[["git","argo"]],[["argo","k8s"]]],log:{ro:"rollback cu git revert",en:"rollback with git revert"},who:"Rollback",
 title:{ro:"Rollback: git revert",en:"Rollback: git revert"},
 body:{ro:`<p>Rollback-ul e un commit nou: <code>git revert 7d02e1b</code> pune la loc <code>newTag: 1.7.3</code>. După merge, Argo CD vede diferența și revine la 1.7.3 în câteva minute; aplicația redevine <strong>Healthy</strong>.</p>
<p>Istoricul arată tot: când a intrat 1.8.0, când a fost scoasă și de cine. Când coloana e adăugată, echipa face un PR nou cu 1.8.1.</p>`,
 en:`<p>The rollback is a new commit: <code>git revert 7d02e1b</code> puts back <code>newTag: 1.7.3</code>. After merging, Argo CD sees the difference and returns to 1.7.3 within minutes; the app is <strong>Healthy</strong> again.</p>
<p>The history shows everything: when 1.8.0 went in, when it was pulled and by whom. Once the column is added, the team opens a new PR with 1.8.1.</p>`},
 more:{ro:`<p>Argo CD are și un buton de rollback la o versiune anterioară, util în urgență, dar el oprește temporar sync-ul automat: Git și clusterul nu mai coincid până faci revert-ul.</p>`,
  en:`<p>Argo CD also has a rollback button to an earlier revision, handy in an emergency, but it temporarily disables auto-sync: Git and the cluster don't match until you make the revert.</p>`}},

{at:["git","argo"],frame:null,kind:"none",tables:["envs"],who:{ro:"Medii și secrete",en:"Environments and secrets"},
 title:{ro:"Medii, promovare și secrete",en:"Environments, promotion and secrets"},
 body:{ro:`<p><strong>Mediile</strong> sunt foldere în același repo: o <em>bază</em> comună și câte un <em>overlay</em> (Kustomize) pentru dev, staging și prod, cu diferențele lor (tag, replici, resurse). Fiecare are aplicația ei în Argo CD.</p>
<p><strong>Promovarea</strong> = un PR care copiază tag-ul testat din staging în prod. Aceeași imagine, verificată deja.</p>
<p><strong>Secretele</strong> nu se pun niciodată în clar în Git. Variante:</p>
<ul><li><strong>Sealed Secrets</strong>: în Git e o versiune criptată, pe care doar clusterul o poate decripta;</li>
<li><strong>External Secrets Operator</strong>: în Git e doar o referință; valoarea vine din Vault sau din managerul de secrete al cloud-ului.</li></ul>`,
 en:`<p><strong>Environments</strong> are folders in the same repo: a shared <em>base</em> and one <em>overlay</em> (Kustomize) each for dev, staging and prod, with their differences (tag, replicas, resources). Each has its own Argo CD application.</p>
<p><strong>Promotion</strong> = a PR that copies the tested tag from staging to prod. The same image, already verified.</p>
<p><strong>Secrets</strong> never go into Git in plain text. Options:</p>
<ul><li><strong>Sealed Secrets</strong>: Git holds an encrypted version that only the cluster can decrypt;</li>
<li><strong>External Secrets Operator</strong>: Git holds only a reference; the value comes from Vault or the cloud's secret manager.</li></ul>`}},

{at:["git","argo","k8s"],frame:null,kind:"none",summary:true,
 title:{ro:"Argo CD sau Flux? Și recapitulare",en:"Argo CD or Flux? And a recap"},
 body:{ro:`<p><strong>Argo CD</strong> și <strong>Flux</strong> sunt cele două unelte GitOps populare (ambele proiecte CNCF). Argo CD are o interfață web bogată; Flux e mai minimalist, configurat doar prin resurse Kubernetes. Ideea e aceeași.</p>
<ul><li>Starea dorită stă în <strong>Git</strong>; clusterul e adus la ea de un agent din cluster (<strong>pull</strong>).</li>
<li>CI construiește și publică imaginea; <strong>nu</strong> face deploy.</li>
<li>Lansare = <strong>PR</strong> care schimbă tag-ul; aprobarea și istoricul rămân în Git.</li>
<li><strong>OutOfSync</strong> = Git ≠ cluster; <strong>selfHeal</strong> anulează modificările manuale.</li>
<li>Rollback = <strong>git revert</strong>; medii = overlay-uri; secrete = Sealed / External Secrets.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<p><strong>Argo CD</strong> and <strong>Flux</strong> are the two popular GitOps tools (both CNCF projects). Argo CD has a rich web UI; Flux is more minimal, configured only through Kubernetes resources. The idea is the same.</p>
<ul><li>The desired state lives in <strong>Git</strong>; an agent in the cluster brings the cluster to it (<strong>pull</strong>).</li>
<li>CI builds and pushes the image; it does <strong>not</strong> deploy.</li>
<li>Release = a <strong>PR</strong> that changes the tag; approval and history stay in Git.</li>
<li><strong>OutOfSync</strong> = Git ≠ cluster; <strong>selfHeal</strong> undoes manual changes.</li>
<li>Rollback = <strong>git revert</strong>; environments = overlays; secrets = Sealed / External Secrets.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],
