<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste</title>
<meta name="description" content="Toate testele lecțiilor, cu cel mai bun scor al tău. / Every lesson quiz, with your best score.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/theme.css">
<style>
.page{max-width:1180px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page h1{font:700 clamp(1.5rem,3vw,2.1rem) var(--head);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.sum div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:140px}
.sum b{display:block;font:700 1.4rem var(--head);font-variant-numeric:tabular-nums}
.sum span{font-size:.82rem;color:var(--muted)}
h2.grp{font:700 1.05rem var(--head);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.t{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.t:hover{border-color:var(--text)}
.t h3{font:700 1rem var(--head);margin:0}
.t .lvl{font:600 .72rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.t .st{font-size:.86rem;color:var(--muted);min-height:1.3em}
.t .st b{color:var(--text)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--text)}
.go{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:8px;background:var(--accent);color:var(--accent-text);font:700 .9rem var(--sans);text-decoration:none;border:1px solid var(--accent)}
.go:hover{filter:brightness(1.1)}
.t.game{display:flex;margin:0 0 18px;text-decoration:none;color:var(--text);border:2px solid var(--text);background:var(--hero)}
.done{font:600 .72rem var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--text);margin-left:6px}
</style>
</head>
<body>
<header class="topbar" id="top"><div class="topbar-in">
  <a class="brand" href="../index.html"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/><path d="M7 16h18M19 11l6 5-6 5" fill="none" stroke="var(--accent-text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="16" r="2.6" fill="var(--accent-text)"/></svg><span data-t="brand"></span></a>
  <nav class="nav"><a href="../index.html" data-t="home"></a></nav>
  <div class="tools"><div class="seg" role="group" aria-label="Limba / Language"><button type="button" data-lang="ro">RO</button><button type="button" data-lang="en">EN</button></div><button type="button" class="icon-btn" id="theme">◐</button></div>
</div></header>

<main class="page">
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>
  <a class="t game" href="../joc/index.html"><span class="lvl" data-t="gameK"></span><h3 data-t="gameT"></h3><span class="st" data-t="gameD"></span></a>
  <div class="sum" id="sum"></div>
  <div id="list"></div>
</main>

<script type="module" src="../assets/auth.js?v=4"></script>
<script type="module">
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("cadru-lang")==="en"?"en":"ro";
const UI={brand:["Rețea pas cu pas","Network step by step"],home:["← Lecții","← Lessons"],title:["Teste","Quizzes"],
  lead:["Alege un test. Fiecare deschide lecția direct la „Test final”; după ce răspunzi la toate întrebările, scorul se salvează automat. Poți reface un test oricând.","Pick a quiz. Each one opens the lesson straight at the \"Final quiz\"; once you answer every question the score is saved automatically. You can retake a quiz any time."],
  start:["Începe testul →","Start the quiz →"],again:["Refă testul →","Retake the quiz →"],best:["Cel mai bun","Best"],tries:["încercări","attempts"],none:["Încă neîncercat","Not taken yet"],
  done:["teste încercate","quizzes taken"],avg:["media celor mai bune scoruri","average of best scores"],total:["teste disponibile","quizzes available"],
  g1:["Rețele: bazele","Networking basics"],g2:["Internet și web","Internet and web"],g3:["Kubernetes și operare","Kubernetes and operations"],g4:["Aplicații în producție","Production apps"],
  gameK:["Pauză de joacă","Play break"],gameT:["🎮 Livrează pachetul: mini-joc de 2 minute →","🎮 Deliver the packet: a 2-minute mini-game →"],gameD:["Rutare, porturi, MAC-uri, DNS, OSI și IPv6, contra cronometru. Scorul intră în rezultate.","Routing, ports, MACs, DNS, OSI and IPv6, against the clock. The score goes into your results."]};
const T=k=>UI[k][lang==="en"?1:0];
const G=[
 ["g1",[["ethernet","Drumul unui cadru Ethernet","The journey of an Ethernet frame","Începător","Beginner"],["vlan","VLAN: mai multe rețele pe un switch","VLANs: several networks on one switch","Începător+","Beginner+"],["nat","NAT: un singur IP public","NAT: one public IP","Începător+","Beginner+"]]],
 ["g2",[["dns","Cum funcționează DNS","How DNS works","Începător","Beginner"],["https","HTTPS / TLS: de ce e sigur lacătul","HTTPS / TLS: why the padlock is safe","Intermediar","Intermediate"],["ipv6","IPv6: un laptop își face singur adresa","IPv6: a laptop builds its own address","Începător+","Beginner+"],["bgp","BGP: cum găsește internetul drumul","BGP: how the internet finds its way","Intermediar","Intermediate"]]],
 ["g3",[["kubernetes","Kubernetes: Service-uri și DNS în cluster","Kubernetes: Services and cluster DNS","Intermediar","Intermediate"],["ingress","Ingress în Kubernetes","Kubernetes Ingress","Intermediar","Intermediate"],["gke-retea","Rețeaua pod-urilor în GKE","Pod networking on GKE","Intermediar","Intermediate"],["k8s-intrare","Viața unui pachet care intră în Kubernetes","The life of a packet entering Kubernetes","Avansat","Advanced"],["service-mesh","Service mesh: o cerere între două microservicii","Service mesh: a request between two microservices","Avansat","Advanced"],["observabilitate","Observabilitate: de ce e lent checkout-ul?","Observability: why is checkout slow?","Intermediar","Intermediate"]]],
 ["g4",[["tomcat","Tomcat: viața unei cereri","Tomcat: the life of a request","Intermediar","Intermediate"],["microservicii","Microservicii pe Tomcat în producție","Microservices on Tomcat in production","Intermediar","Intermediate"],["monolit-cpp","Monolit C++ cu SOAP, nginx și Oracle","C++ monolith with SOAP, nginx and Oracle","Intermediar","Intermediate"]]]
];
const ALL=G.flatMap(g=>g[1]);
let stats={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function render(){
  const en=lang==="en";document.documentElement.lang=lang;document.title=T("title");
  document.querySelectorAll("[data-t]").forEach(e=>{if(UI[e.dataset.t])e.textContent=T(e.dataset.t)});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
  const taken=ALL.filter(l=>stats[l[0]]);const avg=taken.length?Math.round(taken.reduce((s,l)=>s+stats[l[0]].best,0)/taken.length):0;
  document.getElementById("sum").innerHTML=`<div><b>${taken.length} / ${ALL.length}</b><span>${T("done")}</span></div><div><b>${taken.length?avg+"%":"—"}</b><span>${T("avg")}</span></div>`;
  document.getElementById("list").innerHTML=G.map(([g,ls])=>`<h2 class="grp">${T(g)}</h2><div class="grid">`+ls.map(l=>{const s=stats[l[0]];
    return `<article class="t"><span class="lvl">${esc(en?l[4]:l[3])}</span><h3>${esc(en?l[2]:l[1])}${s&&s.best===100?'<span class="done">100%</span>':""}</h3>
    <div class="st">${s?`${T("best")}: <b>${s.best}%</b> · ${s.n} ${T("tries")}`:T("none")}</div><div class="bar"><i style="width:${s?s.best:0}%"></i></div>
    <a class="go" href="../${l[0]}/index.html#quiz">${s?T("again"):T("start")}</a></article>`}).join("")+`</div>`).join("");
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("cadru-lang",lang);render()});
const saved=store.get("cadru-theme");if(saved==="light"||saved==="dark")document.documentElement.dataset.theme=saved;
document.getElementById("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const nt=d?"light":"dark";r.dataset.theme=nt;store.set("cadru-theme",nt)};
render();
if(location.protocol!=="file:"){
  const [{auth,db},{onAuthStateChanged},{collection,query,where,getDocs}]=await Promise.all([import("../assets/firebase.js?v=4"),import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")]);
  onAuthStateChanged(auth,async u=>{if(!u)return;try{const snap=await getDocs(query(collection(db,"results"),where("uid","==",u.uid)));stats={};
    snap.docs.forEach(d=>{const x=d.data();const p=x.total?Math.round(100*x.score/x.total):0;const s=stats[x.lesson]=stats[x.lesson]||{best:0,n:0};s.n++;if(p>s.best)s.best=p});render()}catch(e){console.error(e)}});
}
</script>
</body>
</html>
