<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rețea pas cu pas</title>
<meta name="description" content="Lecții interactive despre rețele, web, Kubernetes, identitate și mesagerie. / Interactive lessons on networking, the web, Kubernetes, identity and messaging.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
.home{max-width:1080px;margin:0 auto;padding:34px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.intro{max-width:640px}
.intro h1{font:700 clamp(1.9rem,5vw,3rem)/1.08 var(--head);margin:6px 0 10px}
.intro p{font-size:1.08rem;color:var(--muted);margin:0 0 18px}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.cta{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--text);border-radius:10px;padding:11px 16px;font:700 1rem var(--sans);text-decoration:none;color:var(--text);background:var(--surface)}
.cta.main{background:var(--accent);color:var(--accent-text)}
.cta:hover{transform:translateY(-1px)}
.resume{display:none;margin:20px 0 0;align-items:center;gap:10px;flex-wrap:wrap;border:2px dashed var(--text);border-radius:12px;padding:10px 14px;background:var(--surface2);max-width:640px}
.resume.on{display:flex}
.resume a{font-weight:700;color:var(--text)}
.myprog{display:none;margin:12px 0 0;max-width:640px}
.myprog.on{display:block}
.myprog a{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:2px solid var(--text);border-radius:12px;padding:10px 14px;background:var(--surface);color:var(--text);text-decoration:none}
.myprog .bar{flex:1 1 140px;height:10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.myprog .bar i,.tile .mini i{display:block;height:100%;background:var(--ok);border-radius:999px}
.myprog .pc{font:600 .82rem var(--mono)}
.tile .mini{display:block;height:5px;border-radius:999px;background:var(--surface2);overflow:hidden}
.tile .ok{color:var(--ok)}
h2.sh{font:700 1.25rem var(--head);margin:36px 0 12px}
.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.topic{position:relative;min-width:0}
.tile{display:flex;flex-direction:column;gap:6px;height:100%;box-sizing:border-box;border:2px solid var(--text);border-radius:14px;padding:16px;background:var(--surface);color:var(--text);text-decoration:none;transition:transform .15s,box-shadow .15s}
.tile .ic{font-size:1.9rem;line-height:1}
.tile b{font:700 1.05rem var(--head)}
.tile span.d{font-size:.86rem;color:var(--muted)}
.tile small{margin-top:auto;font:600 .76rem var(--mono);color:var(--muted)}
.pop{display:none;position:absolute;left:-2px;right:-2px;top:calc(100% - 8px);z-index:20;background:var(--surface);border:2px solid var(--text);border-top:0;border-radius:0 0 14px 14px;padding:8px}
.pop a{display:block;padding:6px 8px;border-radius:6px;color:var(--text);text-decoration:none;font-size:.86rem;line-height:1.3}
.pop a:hover,.pop a:focus-visible{background:var(--accent);color:var(--accent-text)}
@media (hover:hover){.topic:hover .tile,.topic:focus-within .tile{box-shadow:0 6px 0 var(--text);transform:translateY(-3px);border-bottom-left-radius:0;border-bottom-right-radius:0}
  .topic:hover .pop,.topic:focus-within .pop{display:block}}
.games{display:flex;flex-wrap:wrap;gap:8px}
.games a{border:1px solid var(--border);border-radius:999px;padding:8px 14px;text-decoration:none;color:var(--text);font-weight:600;font-size:.92rem;background:var(--surface)}
.games a:hover{border-color:var(--text);background:var(--accent);color:var(--accent-text)}
@media (max-width:980px){.topics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.topics{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tile span.d{display:none}}
@media (prefers-reduced-motion:reduce){.tile,.cta{transition:none}.topic:hover .tile{transform:none}.cta:hover{transform:none}}
</style>
</head>
<body>
<header class="topbar" id="top"><div class="topbar-in">
  <a class="brand" href="index.html"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/><path d="M7 16h18M19 11l6 5-6 5" fill="none" stroke="var(--accent-text)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="16" r="2.6" fill="var(--accent-text)"/></svg><span data-t="brand"></span></a>
  <nav class="nav" data-menu data-root="" aria-label="Meniu / Menu"></nav>
  <div class="tools"><div class="seg" role="group" aria-label="Limba / Language"><button type="button" data-lang="ro">RO</button><button type="button" data-lang="en">EN</button></div><button type="button" class="icon-btn" id="theme">◐</button></div>
</div></header>

<main class="home">
  <section class="intro">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 data-t="h1"></h1>
    <p data-t="sub"></p>
    <div class="ctas"><a class="cta main" href="ethernet/index.html" data-t="start"></a><a class="cta" href="lectii/index.html" data-t="all"></a><a class="cta" href="teste/index.html" data-t="tests"></a></div>
    <p class="resume" id="resume"></p>
    <p class="myprog" id="progress"></p>
  </section>

  <h2 class="sh" data-t="topicsT"></h2>
  <div class="topics" id="topics"></div>

  <h2 class="sh" data-t="gamesT"></h2>
  <div class="games" id="games"></div>
</main>
<footer class="foot"><div class="foot-in"><p data-t="foot"></p><p><a href="https://github.com/tedimihailescu/Ethernet-frame-learning-app" data-t="src"></a></p></div></footer>

<script src="assets/catalog.js?v=6"></script>
<script src="assets/menu.js?v=2"></script>
<script>
(function(){
"use strict";
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("cadru-lang")==="en"?"en":"ro";
const T=v=>(v&&typeof v==="object"&&!Array.isArray(v))?v[lang]:v;
const C=window.CATALOG;
const UI={brand:{ro:"Rețea pas cu pas",en:"Network step by step"},
  eyebrow:{ro:`${C.ALL.length} lecții interactive · RO / EN`,en:`${C.ALL.length} interactive lessons · RO / EN`},
  h1:{ro:"Învață rețelele urmărind pachetele",en:"Learn networking by following the packets"},
  sub:{ro:"Fiecare lecție e o poveste animată, pas cu pas, urmată de un laborator și un test scurt.",en:"Each lesson is an animated story, step by step, followed by a lab and a short quiz."},
  start:{ro:"▶ Începe cu prima lecție",en:"▶ Start with the first lesson"},all:{ro:"📚 Toate lecțiile",en:"📚 All lessons"},tests:{ro:"✎ Teste",en:"✎ Quizzes"},
  topicsT:{ro:"Alege un subiect",en:"Pick a topic"},gamesT:{ro:"Pauză de joacă",en:"Play break"},
  n:{ro:"lecții",en:"lessons"},one:{ro:"lecție",en:"lesson"},
  resume:{ro:"Continuă de unde ai rămas:",en:"Pick up where you left off:"},step:{ro:"pasul",en:"step"},
  pT:{ro:"Progresul tău",en:"Your progress"},pDone:{ro:"lecții terminate",en:"lessons finished"},
  foot:{ro:"Proiect educațional. Adresele și numele din lecții sunt exemple.",en:"An educational project. Addresses and names in the lessons are examples."},
  src:{ro:"Codul sursă pe GitHub ↗",en:"Source code on GitHub ↗"},theme:{ro:"Comută tema luminoasă / întunecată",en:"Toggle light / dark theme"}};
function render(){
  document.documentElement.lang=lang;document.title=lang==="ro"?"Rețea pas cu pas":"Network Step by Step";
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=T(UI[e.dataset.t])});
  document.getElementById("topics").innerHTML=C.CATS.map(c=>{const cs=C.summary(c.list);return `<div class="topic"><a class="tile" href="lectii/index.html#${c.id}"><span class="ic" aria-hidden="true">${c.icon}</span><b>${T(c.t)}</b><span class="d">${T(c.d)}</span><small>${c.list.length} ${T(c.list.length===1?UI.one:UI.n)}${cs.complete?` · <span class="ok">${cs.complete} ✓</span>`:""}</small><span class="mini" aria-hidden="true"><i style="width:${Math.round(cs.parts/(cs.total*3)*100)}%"></i></span></a><div class="pop">${c.list.map(id=>{const l=C.byId(id);return `<a href="${l.href}">${C.progress(id).complete?"✓ ":""}${T(l.t)}</a>`}).join("")}</div></div>`}).join("");
  const s=C.summary(),pct=Math.round(s.parts/(s.total*3)*100),pr=document.getElementById("progress");
  if(s.parts){pr.innerHTML=`<a href="lectii/index.html"><b>${T(UI.pT)}: ${s.complete} / ${s.total} ${T(UI.pDone)}</b><span class="bar"><i style="width:${pct}%"></i></span><span class="pc">${pct}%</span></a>`;pr.classList.add("on")}else pr.classList.remove("on");
  document.getElementById("games").innerHTML=C.GAMES.map(g=>`<a href="${g.href}">${g.icon} ${T(g.t)}</a>`).join("");
  let last=null;try{last=JSON.parse(store.get("cadru-last")||"null")}catch(e){}
  const r=document.getElementById("resume"),l=last&&C.byId(last.id);
  if(l){r.innerHTML=`<span>${T(UI.resume)}</span><a href="${l.href}#step-${(last.step|0)+1}">${T(l.t)} · ${T(UI.step)} ${(last.step|0)+1}${last.n?" / "+last.n:""} →</a>`;r.classList.add("on")}else r.classList.remove("on");
  const th=document.getElementById("theme");th.setAttribute("aria-label",T(UI.theme));th.title=T(UI.theme);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
}
window.addEventListener("progress:changed",render);
window.addEventListener("pageshow",e=>{if(e.persisted)render()});
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("cadru-lang",lang);render();window.dispatchEvent(new Event("cadru:lang"))});
const saved=store.get("cadru-theme");if(saved==="light"||saved==="dark")document.documentElement.dataset.theme=saved;
document.getElementById("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const nt=d?"light":"dark";r.dataset.theme=nt;store.set("cadru-theme",nt)};
render();
})();
</script>
<script type="module" src="assets/auth.js?v=12"></script>
</body>
</html>
