function render(){
  document.documentElement.lang=lang;document.title=lang==="ro"?"Rețea pas cu pas":"Network Step by Step";
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=T(UI[e.dataset.t])});
  document.getElementById("meta").innerHTML=UI.meta.map(m=>`<li>${T(m)}</li>`).join("");
  document.getElementById("how").innerHTML=UI.how.map(([i,b,s])=>`<li><i aria-hidden="true">${i}</i><div><b>${T(b)}</b><span>${T(s)}</span></div></li>`).join("");
  const card=(l,i)=>`<a class="lesson" href="${l.href}"><div class="top"><span class="num">${lang==="ro"?"LECȚIA":"LESSON"} ${String(i+1).padStart(2,"0")}</span><span class="lvl">${T(l.lvl)}</span></div>${ILL[l.ill]}<h3>${T(l.t)}</h3><p>${T(l.d)}</p><ul>${l.topics.map(t=>`<li>${T(t)}</li>`).join("")}</ul><span class="stats">${T(l.stats)}</span><span class="go">${T(UI.start)}</span></a>`;
  const ALL=[...LESSONS,...PROD,...EXTRA],by=h=>ALL.find(l=>l.href===h+"/index.html");
  const SECTIONS=[["path",["ethernet","vlan","nat"]],["pathW",["dns","https"]],["pathK",["kubernetes","ingress","gke-retea","k8s-intrare"]],["path2",["tomcat","microservicii","monolit-cpp"]]];
  let n=0;SECTIONS.forEach(([id,list])=>{document.getElementById(id).innerHTML=list.map(h=>card(by(h),n++)).join("")});
  document.getElementById("soon").innerHTML=SOON.map(([b,p])=>`<div><b>${T(b)}</b><p>${T(p)}</p></div>`).join("");
  const th=document.getElementById("theme");th.setAttribute("aria-label",T(UI.theme));th.title=T(UI.theme);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("cadru-lang",lang);render()});
const saved=store.get("cadru-theme");if(saved==="light"||saved==="dark")document.documentElement.dataset.theme=saved;
document.getElementById("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const nt=d?"light":"dark";r.dataset.theme=nt;store.set("cadru-theme",nt)};
render();
