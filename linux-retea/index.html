<script>
(function(){
const RO="READ-ONLY",CH="LAB CHANGE";
const N1={q:{ro:"De ce primește clientul timeout pe 10.10.20.15:8080?",en:"Why does the client time out on 10.10.20.15:8080?"},cmd:"curl -v --connect-timeout 5 http://10.10.20.15:8080/health",mode:RO,out:"* Trying 10.10.20.15:8080... · * Connection timed out after 5001 milliseconds",proves:{ro:"timeout, nu „refused”: pachetele se pierd undeva și nimeni nu răspunde, nici măcar cu RST",en:"a timeout, not \"refused\": packets get lost somewhere and nobody answers, not even with a RST"},bad:"TIMEOUT"};
const N2={q:{ro:"Ce adrese IPv4 are serverul?",en:"Which IPv4 addresses does the server have?"},cmd:"ip -br addr",mode:RO,out:"lo UNKNOWN 127.0.0.1/8 · eth0 UP 10.10.20.15/24 · eth1 UP 10.10.30.5/24",proves:{ro:"ambele interfețe sunt UP; app01 e în două rețele, iar a doua e chiar rețeaua clientului",en:"both interfaces are UP; app01 is on two networks, and the second one is the client's own network"}};
const N3={q:{ro:"Care e gateway-ul și ce rețele sunt conectate direct?",en:"What is the gateway and which networks are directly connected?"},cmd:"ip route show default · ip route",mode:RO,out:"default via 10.10.20.1 dev eth0 · 10.10.20.0/24 dev eth0 src 10.10.20.15 · 10.10.30.0/24 dev eth1 src 10.10.30.5",proves:{ro:"traficul spre alte rețele iese prin router, pe eth0; 10.10.30.0/24 e conectată direct, pe eth1",en:"traffic to other networks leaves through the router, on eth0; 10.10.30.0/24 is directly connected, on eth1"}};
const N4={q:{ro:"Ascultă cineva pe portul TCP 8080?",en:"Is anything listening on TCP port 8080?"},cmd:"sudo ss -ltnp \"sport = :8080\"",mode:RO,out:"LISTEN 0 511 127.0.0.1:8080 0.0.0.0:* users:((\"orders-api\",pid=1432,fd=7))",proves:{ro:"aplicația ascultă doar pe loopback (127.0.0.1): din rețea nu se poate ajunge la ea",en:"the app listens on loopback only (127.0.0.1): it can't be reached from the network"},bad:"127.0.0.1"};
const N5={q:{ro:"Merge aplicația după ce ascultă pe toate adresele?",en:"Does the app work once it listens on every address?"},fix:{ro:"în /etc/orders-api/config.yaml: listen: 0.0.0.0:8080 · systemctl restart orders-api",en:"in /etc/orders-api/config.yaml: listen: 0.0.0.0:8080 · systemctl restart orders-api"},mode:CH,cmd:"ss -ltnp \"sport = :8080\" · curl -s http://127.0.0.1:8080/health",out:"LISTEN 0 511 0.0.0.0:8080 · {\"status\":\"ok\"}",proves:{ro:"aplicația răspunde local; din rețea clientul primește tot timeout",en:"the app answers locally; from the network the client still times out"}};
const N6={q:{ro:"Ajunge SYN-ul clientului până la server?",en:"Does the client's SYN reach the server?"},cmd:"sudo tcpdump -ni eth0 \"tcp port 8080\"",mode:RO,out:"IP 10.10.30.50.51544 > 10.10.20.15.8080: Flags [S], seq 3170… (de 3 ori: după 1 s, 2 s, 4 s)",proves:{ro:"SYN-ul ajunge pe eth0, dar nu pleacă niciun SYN-ACK: pachetul e aruncat chiar în app01",en:"the SYN arrives on eth0, but no SYN-ACK leaves: the packet is dropped inside app01 itself"},bad:"NO SYN-ACK"};
const N7={q:{ro:"Aruncă firewall-ul local pachetul?",en:"Is the local firewall dropping the packet?"},cmd:"sudo nft list ruleset",mode:RO,out:"chain input { type filter hook input priority 0; policy drop; ct state established,related accept; tcp dport { 22, 8080 } counter packets 0 bytes 0 accept }",proves:{ro:"regula pentru 8080 există, dar contorul e 0: pachetele nu ajung nici măcar la firewall",en:"the 8080 rule exists, but its counter is 0: the packets don't even reach the firewall"}};
const N8={q:{ro:"Pe unde ar pleca răspunsul către client?",en:"Which way would the reply to the client go?"},cmd:"ip route get 10.10.30.50 · ip rule show",mode:RO,out:"10.10.30.50 dev eth1 src 10.10.30.5 · 0: from all lookup local · 32766: from all lookup main · 32767: from all lookup default",proves:{ro:"SYN-ul a intrat pe eth0, dar drumul înapoi spre client e pe eth1: drum asimetric",en:"the SYN came in on eth0, but the way back to the client is on eth1: an asymmetric path"},bad:"ASYMMETRIC"};
const N9={q:{ro:"Poate reverse-path filtering să arunce SYN-ul?",en:"Could reverse-path filtering drop the SYN?"},cmd:"sysctl net.ipv4.conf.all.rp_filter net.ipv4.conf.eth0.rp_filter · nstat -az TcpExtIPReversePathFilter",mode:RO,out:"net.ipv4.conf.all.rp_filter = 1 · net.ipv4.conf.eth0.rp_filter = 1 · TcpExtIPReversePathFilter 37",proves:{ro:"rp_filter strict: kernelul aruncă SYN-ul pentru că sursa 10.10.30.50 nu s-ar întoarce prin eth0; contorul crește la fiecare încercare",en:"strict rp_filter: the kernel drops the SYN because the source 10.10.30.50 wouldn't be routed back out of eth0; the counter grows with every attempt"},bad:"RP_FILTER"};
const N10={q:{ro:"Cum facem ca răspunsul să plece pe aceeași interfață?",en:"How do we make the reply leave on the same interface?"},fix:"ip rule add from 10.10.20.15 table 100 · ip route add default via 10.10.20.1 dev eth0 table 100",mode:CH,cmd:"ip route get 10.10.30.50 from 10.10.20.15",out:"10.10.30.50 from 10.10.20.15 via 10.10.20.1 dev eth0 table 100",proves:{ro:"traficul care pleacă de pe adresa lui eth0 se întoarce acum tot pe eth0, prin router",en:"traffic leaving from eth0's address now goes back out of eth0 too, through the router"}};
const N11={q:{ro:"Funcționează acum de la client?",en:"Does it work from the client now?"},cmd:"curl -s -o /dev/null -w \"%{http_code}\" http://10.10.20.15:8080/health · ss -tn state established \"sport = :8080\"",mode:RO,out:"200 · ESTAB 10.10.20.15:8080 10.10.30.50:51560",proves:{ro:"SYN, SYN-ACK și ACK trec pe eth0; contorul rp_filter nu mai crește",en:"SYN, SYN-ACK and ACK go through eth0; the rp_filter counter no longer grows"}};

sub:{ro:"Un client din rețeaua 10.10.30.0/24 nu se poate conecta la aplicația orders-api de pe serverul Linux app01, portul 8080: „Connection timed out”. Depanăm ca la un interviu LFCS: simptom, ipoteză, comandă, dovadă, remediere sigură, verificare. Găsim două probleme suprapuse: o aplicație care ascultă doar local și un drum asimetric pe care kernelul îl blochează cu rp_filter.",en:"A client on the 10.10.30.0/24 network can't connect to the orders-api app on the Linux server app01, port 8080: \"Connection timed out\". We troubleshoot the way you would in an LFCS interview: symptom, hypothesis, command, evidence, safe fix, verification. We find two stacked problems: an app listening only locally, and an asymmetric path the kernel blocks with rp_filter."},

steps:[
{at:"cl",frame:N1,kind:"n",move:[[["cl","rtr"]],[["rtr","eth0"]]],marks:{cl:{k:"drop",t:"timeout"}},tables:["errs"],hl:{errs:"Connection timed out"},log:{ro:"simptomul",en:"the symptom"},who:{ro:"Simptomul",en:"The symptom"},
 title:{ro:"Simptomul: „Connection timed out” după 5 secunde",en:"The symptom: \"Connection timed out\" after 5 seconds"},
 body:{ro:`<p>Clientul <code>10.10.30.50</code> încearcă <code>http://10.10.20.15:8080/health</code> și primește <strong>Connection timed out</strong>.</p>
<p>Cuvântul exact contează. <strong>Refused</strong> ar însemna că pachetul a ajuns și serverul a răspuns „aici nu ascultă nimeni” (un RST). <strong>Timeout</strong> înseamnă că nu a venit <em>niciun</em> răspuns: pachetul s-a pierdut pe drum sau a fost aruncat în tăcere.</p>
<p class="key">Nu începe cu restart-uri și schimbări. Ordinea bună: simptom → ipoteze → comandă care doar citește → dovadă → remediere mică → verificare.</p>`,
 en:`<p>The client <code>10.10.30.50</code> tries <code>http://10.10.20.15:8080/health</code> and gets <strong>Connection timed out</strong>.</p>
<p>The exact word matters. <strong>Refused</strong> would mean the packet arrived and the server answered "nothing listens here" (a RST). <strong>Timeout</strong> means <em>no</em> answer came at all: the packet got lost on the way or was dropped silently.</p>
<p class="key">Don't start with restarts and changes. The good order: symptom → hypotheses → read-only command → evidence → small fix → verification.</p>`},
 more:{ro:`<p>Dacă eroarea ar fi <em>Could not resolve host</em>, pachetul nici n-ar fi plecat: problema e DNS. Pe un sistem cu systemd-resolved verifici cu <code>resolvectl status</code> și <code>resolvectl query nume</code>. <code>/etc/resolv.conf</code> poate arăta doar stub-ul local <code>127.0.0.53</code>, nu serverele DNS reale.</p>`,
  en:`<p>If the error were <em>Could not resolve host</em>, the packet would never have left: the problem is DNS. On a system with systemd-resolved you check with <code>resolvectl status</code> and <code>resolvectl query name</code>. <code>/etc/resolv.conf</code> may show only the local stub <code>127.0.0.53</code>, not the real DNS servers.</p>`},
 try:[{cmd:"curl -v --connect-timeout 5 http://10.10.20.15:8080/health",d:{ro:"Separă conectarea TCP de răspunsul HTTP.",en:"Separates the TCP connect from the HTTP response."}}]},

{at:["eth0","eth1"],frame:N2,kind:"n",log:{ro:"interfețele",en:"the interfaces"},who:"ip addr",
 title:{ro:"Pe server: ce interfețe și adrese are?",en:"On the server: which interfaces and addresses does it have?"},
 body:{ro:`<p>Intrăm pe app01 și pornim de jos: interfețele. <code>ip -br addr</code> le arată compact, câte una pe linie:</p>
<ul><li><code>eth0 UP 10.10.20.15/24</code>: rețeaua serverelor;</li>
<li><code>eth1 UP 10.10.30.5/24</code>: o a doua placă, în <strong>aceeași rețea cu clientul</strong>.</li></ul>
<p>Ambele sunt UP și au adrese, deci nu e o placă oprită. Dar ținem minte detaliul: serverul are două drumuri posibile spre client.</p>`,
 en:`<p>We log in to app01 and start from the bottom: the interfaces. <code>ip -br addr</code> shows them compactly, one per line:</p>
<ul><li><code>eth0 UP 10.10.20.15/24</code>: the server network;</li>
<li><code>eth1 UP 10.10.30.5/24</code>: a second card, on <strong>the same network as the client</strong>.</li></ul>
<p>Both are UP and have addresses, so it's not a card that's down. But we note the detail: the server has two possible paths to the client.</p>`},
 more:{ro:`<p>O interfață DOWN și o rută lipsă sunt probleme diferite. <code>ip -br link</code> arată doar starea legăturii (UP/DOWN, adresa MAC), fără IP-uri.</p>`,
  en:`<p>An interface that's DOWN and a missing route are different problems. <code>ip -br link</code> shows only the link state (UP/DOWN, MAC address), without IPs.</p>`},
 try:[{cmd:"ip -br addr",d:{ro:"Interfețele și adresele, pe scurt.",en:"Interfaces and addresses, briefly."}}]},

{at:"krn",frame:N3,kind:"n",log:{ro:"tabela de rutare",en:"the routing table"},who:"ip route",
 title:{ro:"Tabela de rutare: default și rețelele conectate",en:"The routing table: default and connected networks"},
 body:{ro:`<p><code>ip route</code> arată unde trimite kernelul pachetele:</p>
<ul><li><code>default via 10.10.20.1 dev eth0</code>: orice destinație fără rută mai specifică merge la router, pe eth0;</li>
<li><code>10.10.30.0/24 dev eth1</code>: rețeaua clientului e <strong>conectată direct</strong> pe eth1, fără router.</li></ul>
<p>Kernelul alege mereu ruta <strong>cea mai specifică</strong> (prefixul cel mai lung). Ruta default se folosește doar când nu există alta.</p>`,
 en:`<p><code>ip route</code> shows where the kernel sends packets:</p>
<ul><li><code>default via 10.10.20.1 dev eth0</code>: any destination without a more specific route goes to the router, on eth0;</li>
<li><code>10.10.30.0/24 dev eth1</code>: the client's network is <strong>directly connected</strong> on eth1, with no router.</li></ul>
<p>The kernel always picks the <strong>most specific</strong> route (the longest prefix). The default route is used only when there's no other.</p>`},
 try:[{cmd:"ip route show default",d:{ro:"Doar ruta default.",en:"Just the default route."}},{cmd:"ip route",d:{ro:"Toată tabela main.",en:"The whole main table."}}]},

{at:"app",frame:N4,kind:"n",marks:{app:{k:"drop",t:"127.0.0.1"}},tables:["bind"],hl:{bind:"127.0.0.1:8080"},log:{ro:"aplicația ascultă local",en:"the app listens locally"},who:"ss",
 title:{ro:"Cine ascultă pe 8080? Prima problemă",en:"Who listens on 8080? The first problem"},
 body:{ro:`<p><code>ss -ltnp</code> listează socket-urile TCP (<code>-t</code>) în ascultare (<code>-l</code>), cu numere (<code>-n</code>) și procesul (<code>-p</code>, cere sudo). Filtrul <code>"sport = :8080"</code> păstrează doar portul nostru.</p>
<p>Rezultatul: <code>127.0.0.1:8080</code>, procesul <code>orders-api</code>. Aplicația ascultă doar pe <strong>loopback</strong>: o poate apela doar un proces de pe app01.</p>
<p>Dar atenție: un SYN spre un port fără ascultător ar fi primit RST, deci „refused”, nu timeout. Faptul că vedem timeout înseamnă că <strong>mai e ceva</strong> care aruncă pachetele înainte. Avem cel puțin două probleme.</p>`,
 en:`<p><code>ss -ltnp</code> lists TCP (<code>-t</code>) listening (<code>-l</code>) sockets, with numbers (<code>-n</code>) and the process (<code>-p</code>, needs sudo). The filter <code>"sport = :8080"</code> keeps only our port.</p>
<p>The result: <code>127.0.0.1:8080</code>, the <code>orders-api</code> process. The app listens on <strong>loopback</strong> only: only a process on app01 can call it.</p>
<p>But careful: a SYN to a port with no listener would have got a RST, so "refused", not a timeout. Seeing a timeout means <strong>something else</strong> is dropping the packets first. We have at least two problems.</p>`},
 try:[{cmd:"sudo ss -ltnp \"sport = :8080\"",d:{ro:"Socket-ul, adresa și procesul.",en:"The socket, the address and the process."}}]},

{at:"app",frame:N5,kind:"n",marks:{app:{k:"ok",t:"0.0.0.0:8080"}},log:{ro:"aplicația ascultă pe toate adresele",en:"the app listens on every address"},who:{ro:"Remedierea 1",en:"Fix 1"},
 title:{ro:"Prima remediere: aplicația ascultă pe toate adresele",en:"First fix: the app listens on every address"},
 body:{ro:`<p>În configurația aplicației, <code>listen: 127.0.0.1:8080</code> devine <code>0.0.0.0:8080</code>, apoi restart. Asta e o schimbare (LAB CHANGE): în producție o faci cu aprobare, știind cine mai folosește serviciul.</p>
<p>Verificăm imediat: <code>ss</code> arată acum <code>0.0.0.0:8080</code>, iar <code>curl</code> local răspunde <code>{"status":"ok"}</code>.</p>
<p>Clientul încearcă din nou: <strong>tot timeout</strong>. Era de așteptat după pasul anterior. Mergem mai departe, la pachete.</p>`,
 en:`<p>In the app's config, <code>listen: 127.0.0.1:8080</code> becomes <code>0.0.0.0:8080</code>, then a restart. This is a change (LAB CHANGE): in production you do it with approval, knowing who else uses the service.</p>
<p>We check straight away: <code>ss</code> now shows <code>0.0.0.0:8080</code>, and a local <code>curl</code> answers <code>{"status":"ok"}</code>.</p>
<p>The client tries again: <strong>still a timeout</strong>. That was expected after the previous step. We move on, to the packets.</p>`}},

{at:"krn",frame:N6,kind:"n",move:[[["cl","rtr"]],[["rtr","eth0"]],[["eth0","krn"]]],marks:{krn:{k:"drop",t:{ro:"SYN pierdut",en:"SYN lost"}}},log:{ro:"SYN-ul ajunge, răspunsul lipsește",en:"the SYN arrives, no reply"},who:"tcpdump",
 title:{ro:"tcpdump: SYN-ul ajunge, dar nu pleacă nimic înapoi",en:"tcpdump: the SYN arrives, but nothing goes back"},
 body:{ro:`<p><code>tcpdump -ni eth0 "tcp port 8080"</code> arată pachetele de pe eth0 (<code>-n</code>: fără rezolvare de nume). Clientul reîncearcă:</p>
<ul><li>apare <code>Flags [S]</code>: SYN-ul clientului <strong>ajunge</strong> pe eth0;</li>
<li>după 1 s, 2 s, 4 s apare din nou același SYN: retransmisii, pentru că nu vine răspuns;</li>
<li>nu apare niciun <code>[S.]</code> (SYN-ACK).</li></ul>
<p class="key">Concluzia e precisă: rețeaua până la server funcționează. Pachetul e aruncat <strong>în interiorul</strong> lui app01.</p>`,
 en:`<p><code>tcpdump -ni eth0 "tcp port 8080"</code> shows the packets on eth0 (<code>-n</code>: no name resolution). The client retries:</p>
<ul><li><code>Flags [S]</code> appears: the client's SYN <strong>arrives</strong> on eth0;</li>
<li>after 1 s, 2 s, 4 s the same SYN appears again: retransmissions, because no reply comes;</li>
<li>no <code>[S.]</code> (SYN-ACK) ever appears.</li></ul>
<p class="key">The conclusion is precise: the network up to the server works. The packet is dropped <strong>inside</strong> app01.</p>`},
 more:{ro:`<p>Cu <code>-i any</code> vezi toate interfețele deodată: nici pe eth1 nu pleacă vreun SYN-ACK. Capturează doar ce-ți trebuie (un port, un host): o captură poate conține date private.</p>`,
  en:`<p>With <code>-i any</code> you see every interface at once: no SYN-ACK leaves on eth1 either. Capture only what you need (one port, one host): a capture can contain private data.</p>`},
 try:[{cmd:"sudo tcpdump -ni eth0 \"tcp port 8080\"",d:{ro:"Pachetele spre/dinspre 8080 pe eth0.",en:"Packets to/from 8080 on eth0."}}]},

{at:"nft",frame:N7,kind:"n",marks:{nft:{k:"ok",t:"counter 0"}},log:{ro:"firewall-ul nu e de vină",en:"the firewall isn't to blame"},who:"nftables",
 title:{ro:"Firewall-ul? Contorul spune că nu",en:"The firewall? The counter says no"},
 body:{ro:`<p>Prima bănuială pentru un drop în tăcere: firewall-ul local. <code>nft list ruleset</code> arată lanțul <code>input</code> cu <code>policy drop</code>, dar și o regulă care acceptă <code>tcp dport { 22, 8080 }</code>.</p>
<p>Detaliul important e <strong>contorul</strong> regulii: <code>counter packets 0</code>. Nici măcar un pachet nu a ajuns la regula asta. Dacă firewall-ul ar fi aruncat SYN-ul, l-am fi văzut ajungând în lanțul input.</p>
<p>Deci pachetul dispare <strong>înainte</strong> de firewall: în decizia de rutare a kernelului.</p>`,
 en:`<p>The first suspect for a silent drop: the local firewall. <code>nft list ruleset</code> shows the <code>input</code> chain with <code>policy drop</code>, but also a rule accepting <code>tcp dport { 22, 8080 }</code>.</p>
<p>The important detail is the rule's <strong>counter</strong>: <code>counter packets 0</code>. Not a single packet reached this rule. If the firewall had dropped the SYN, we'd have seen it reach the input chain.</p>
<p>So the packet disappears <strong>before</strong> the firewall: in the kernel's routing decision.</p>`},
 more:{ro:`<p>Pe multe sisteme, <code>iptables</code> e de fapt <code>iptables-nft</code> și scrie tot în nftables. Docker și Kubernetes adaugă reguli automat, deci regulile pe care le vezi nu sunt toate scrise de tine.</p>`,
  en:`<p>On many systems, <code>iptables</code> is actually <code>iptables-nft</code> and writes into nftables too. Docker and Kubernetes add rules automatically, so not every rule you see was written by you.</p>`},
 try:[{cmd:"sudo nft list ruleset",d:{ro:"Toate tabelele, lanțurile și regulile.",en:"Every table, chain and rule."}}]},

{at:"krn",frame:N8,kind:"n",move:[[["krn","eth1"]],[["eth1","cl"]]],marks:{eth0:{k:"drop",t:{ro:"SYN intră aici",en:"SYN comes in here"}},eth1:{k:"drop",t:{ro:"răspunsul ar ieși aici",en:"the reply would leave here"}}},log:{ro:"drum asimetric",en:"asymmetric path"},who:"ip route get",
 title:{ro:"ip route get: răspunsul ar pleca pe altă interfață",en:"ip route get: the reply would leave on another interface"},
 body:{ro:`<p><code>ip route get 10.10.30.50</code> întreabă kernelul: „dacă aș trimite acum un pachet spre client, pe unde ar pleca?”. Răspuns: <code>dev eth1 src 10.10.30.5</code>, pentru că rețeaua clientului e conectată direct pe eth1.</p>
<p>Dar SYN-ul a venit prin router, pe <strong>eth0</strong>. Drumul dus și drumul întors nu sunt aceleași: un <strong>drum asimetric</strong>.</p>
<p><code>ip rule show</code> arată doar regulile implicite (<code>local</code>, <code>main</code>, <code>default</code>): nu există policy routing care să schimbe asta.</p>`,
 en:`<p><code>ip route get 10.10.30.50</code> asks the kernel: "if I sent a packet to the client now, which way would it go?". The answer: <code>dev eth1 src 10.10.30.5</code>, because the client's network is directly connected on eth1.</p>
<p>But the SYN came through the router, on <strong>eth0</strong>. The way in and the way out aren't the same: an <strong>asymmetric path</strong>.</p>
<p><code>ip rule show</code> shows only the default rules (<code>local</code>, <code>main</code>, <code>default</code>): no policy routing changes that.</p>`},
 more:{ro:`<p>Pentru trafic cu o adresă sursă anume adaugi <code>from</code>: <code>ip route get 10.10.30.50 from 10.10.20.15</code>. Tabela <code>local</code> (adresele serverului însuși) are prioritatea 0, înaintea tabelei <code>main</code>.</p>`,
  en:`<p>For traffic with a specific source address you add <code>from</code>: <code>ip route get 10.10.30.50 from 10.10.20.15</code>. The <code>local</code> table (the server's own addresses) has priority 0, before the <code>main</code> table.</p>`},
 try:[{cmd:"ip route get 10.10.30.50",d:{ro:"Decizia de rutare spre client.",en:"The routing decision towards the client."}},{cmd:"ip rule show",d:{ro:"Regulile și tabelele consultate.",en:"The rules and the tables they consult."}}]},

{at:"krn",frame:N9,kind:"n",move:[[["cl","rtr"]],[["rtr","eth0"]],[["eth0","krn"]]],marks:{krn:{k:"drop",t:"rp_filter = 1"}},tables:["rpf"],hl:{rpf:"1"},log:{ro:"rp_filter strict aruncă SYN-ul",en:"strict rp_filter drops the SYN"},who:"rp_filter",
 title:{ro:"Cauza: reverse-path filtering în modul strict",en:"The cause: reverse-path filtering in strict mode"},
 body:{ro:`<p>Linux are o protecție împotriva adreselor sursă falsificate: <strong>reverse-path filtering</strong>. Pentru fiecare pachet care intră, kernelul se întreabă: „dacă aș răspunde la sursa asta, aș pleca pe aceeași interfață pe care a venit pachetul?”.</p>
<ul><li>SYN-ul de la <code>10.10.30.50</code> a intrat pe <strong>eth0</strong>;</li>
<li>răspunsul spre <code>10.10.30.50</code> ar pleca pe <strong>eth1</strong>;</li>
<li>cu <code>rp_filter = 1</code> (strict), kernelul consideră sursa suspectă și <strong>aruncă pachetul în tăcere</strong>, înainte de firewall.</li></ul>
<p>Dovada directă: contorul <code>TcpExtIPReversePathFilter</code> din <code>nstat</code> crește cu fiecare încercare a clientului.</p>`,
 en:`<p>Linux has a protection against spoofed source addresses: <strong>reverse-path filtering</strong>. For every incoming packet, the kernel asks: "if I replied to this source, would I leave through the same interface the packet came in on?".</p>
<ul><li>the SYN from <code>10.10.30.50</code> came in on <strong>eth0</strong>;</li>
<li>the reply to <code>10.10.30.50</code> would leave on <strong>eth1</strong>;</li>
<li>with <code>rp_filter = 1</code> (strict), the kernel considers the source suspicious and <strong>drops the packet silently</strong>, before the firewall.</li></ul>
<p>The direct evidence: the <code>TcpExtIPReversePathFilter</code> counter in <code>nstat</code> grows with every client attempt.</p>`},
 more:{ro:`<p>Valoarea efectivă pentru o interfață e maximul dintre <code>conf.all.rp_filter</code> și <code>conf.eth0.rp_filter</code>. Deci dacă <code>all</code> e 1, interfața e strictă chiar dacă a ei e 0.</p>`,
  en:`<p>The effective value for an interface is the maximum of <code>conf.all.rp_filter</code> and <code>conf.eth0.rp_filter</code>. So if <code>all</code> is 1, the interface is strict even if its own value is 0.</p>`},
 try:[{cmd:"sysctl net.ipv4.conf.all.rp_filter net.ipv4.conf.eth0.rp_filter",d:{ro:"Modul curent.",en:"The current mode."}},{cmd:"nstat -az TcpExtIPReversePathFilter",d:{ro:"Câte pachete a aruncat rp_filter.",en:"How many packets rp_filter dropped."}}]},

{at:"krn",frame:N10,kind:"n",move:[[["krn","eth0"]],[["eth0","rtr"]],[["rtr","cl"]]],log:{ro:"policy routing",en:"policy routing"},who:{ro:"Remedierea 2",en:"Fix 2"},
 title:{ro:"A doua remediere: policy routing, nu oprirea protecției",en:"Second fix: policy routing, not switching the protection off"},
 body:{ro:`<p>Soluția rapidă și greșită ar fi <code>rp_filter = 0</code>: oprești o protecție ca să treacă traficul. Soluția corectă e ca răspunsul să plece pe <strong>aceeași interfață</strong>:</p>
<ul><li><code>ip rule add from 10.10.20.15 table 100</code>: pachetele cu sursa adresa lui eth0 folosesc tabela 100;</li>
<li><code>ip route add default via 10.10.20.1 dev eth0 table 100</code>: în tabela 100, totul pleacă pe eth0, prin router.</li></ul>
<p>Acum <code>ip route get 10.10.30.50 from 10.10.20.15</code> spune <code>dev eth0 table 100</code>. Verificarea rp_filter folosește aceeași decizie, deci SYN-ul nu mai e aruncat.</p>
<p>Comenzile <code>ip</code> se pierd la restart: regula și ruta trebuie puse și în configurația rețelei (netplan <code>routing-policy</code>, NetworkManager sau systemd-networkd).</p>`,
 en:`<p>The quick, wrong fix would be <code>rp_filter = 0</code>: switching a protection off so the traffic gets through. The right fix is for the reply to leave on <strong>the same interface</strong>:</p>
<ul><li><code>ip rule add from 10.10.20.15 table 100</code>: packets whose source is eth0's address use table 100;</li>
<li><code>ip route add default via 10.10.20.1 dev eth0 table 100</code>: in table 100, everything leaves on eth0, through the router.</li></ul>
<p>Now <code>ip route get 10.10.30.50 from 10.10.20.15</code> says <code>dev eth0 table 100</code>. The rp_filter check uses the same decision, so the SYN is no longer dropped.</p>
<p><code>ip</code> commands are lost on reboot: the rule and route must also go into the network config (netplan <code>routing-policy</code>, NetworkManager or systemd-networkd).</p>`},
 more:{ro:`<p>Alte variante: clienții din 10.10.30.0/24 folosesc adresa serverului din rețeaua lor (<code>10.10.30.5</code>), deci nu mai trec prin router; sau <code>rp_filter = 2</code> (loose), care verifică doar că există <em>vreun</em> drum înapoi. Loose e mai permisiv: alege-l conștient.</p>`,
  en:`<p>Other options: clients in 10.10.30.0/24 use the server's address on their own network (<code>10.10.30.5</code>), so they no longer go through the router; or <code>rp_filter = 2</code> (loose), which only checks that <em>some</em> way back exists. Loose is more permissive: choose it deliberately.</p>`}},

{at:["cl","app"],frame:N11,kind:"n",move:[[["cl","rtr"],["rtr","eth0"],["eth0","krn"],["krn","nft"],["nft","app"]],[["app","nft"],["nft","krn"],["krn","eth0"],["eth0","rtr"],["rtr","cl"]]],marks:{cl:{k:"ok",t:"200 OK"}},log:{ro:"verificat de la client",en:"verified from the client"},who:{ro:"Verificarea",en:"Verification"},
 title:{ro:"Verificarea: același test ca la început",en:"Verification: the same test as at the start"},
 body:{ro:`<p>Refacem exact testul de la pasul 1, de pe client: <strong>200</strong>. Și ne uităm la dovezi, nu doar la rezultat:</p>
<ul><li><code>tcpdump</code> pe eth0 arată acum <code>[S]</code>, <code>[S.]</code>, <code>[.]</code>: handshake complet, dus și întors pe eth0;</li>
<li><code>ss -tn state established "sport = :8080"</code> arată conexiunea <code>ESTAB</code> de la 10.10.30.50;</li>
<li>contorul regulii 8080 din nftables crește, iar <code>TcpExtIPReversePathFilter</code> nu mai crește.</li></ul>
<p class="key">Două probleme suprapuse: aplicația asculta doar local, iar răspunsul ar fi plecat pe altă interfață. Fiecare a fost găsită cu o dovadă, nu ghicită.</p>`,
 en:`<p>We repeat exactly the test from step 1, from the client: <strong>200</strong>. And we look at the evidence, not just the result:</p>
<ul><li><code>tcpdump</code> on eth0 now shows <code>[S]</code>, <code>[S.]</code>, <code>[.]</code>: a full handshake, in and out on eth0;</li>
<li><code>ss -tn state established "sport = :8080"</code> shows the <code>ESTAB</code> connection from 10.10.30.50;</li>
<li>the nftables 8080 rule counter grows, and <code>TcpExtIPReversePathFilter</code> no longer does.</li></ul>
<p class="key">Two stacked problems: the app listened only locally, and the reply would have left on another interface. Each one was found with evidence, not guessed.</p>`}},

{at:["cl","rtr","eth0","eth1","krn","nft","app"],frame:null,kind:"none",tables:["method"],summary:true,
 title:{ro:"Recapitulare",en:"Recap"},
 body:{ro:`<ul><li><strong>Refused</strong> = a ajuns, nu ascultă nimeni. <strong>Timeout</strong> = pierdut sau aruncat în tăcere.</li>
<li><code>ip -br addr</code>: interfețe și adrese. <code>ip route</code>: unde pleacă pachetele. <code>ip route get</code>: decizia exactă pentru o destinație. <code>ip rule</code>: ce tabele se consultă.</li>
<li><code>ss -ltnp</code>: cine ascultă și pe ce adresă; <code>127.0.0.1</code> nu se vede din rețea.</li>
<li><code>tcpdump</code>: ce ajunge și ce pleacă; <code>nft list ruleset</code> cu contoarele regulilor.</li>
<li><strong>rp_filter</strong> strict aruncă pachetele cu drum asimetric; repari cu <strong>policy routing</strong>, nu oprind protecția.</li>
<li>Comenzile care doar citesc vin primele; schimbările (LAB CHANGE) se fac mici, cu aprobare, și se verifică.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Mergi la laborator ↓</button></p>`,
 en:`<ul><li><strong>Refused</strong> = it arrived, nothing listens. <strong>Timeout</strong> = lost or silently dropped.</li>
<li><code>ip -br addr</code>: interfaces and addresses. <code>ip route</code>: where packets go. <code>ip route get</code>: the exact decision for one destination. <code>ip rule</code>: which tables are consulted.</li>
<li><code>ss -ltnp</code>: who listens and on which address; <code>127.0.0.1</code> can't be seen from the network.</li>
<li><code>tcpdump</code>: what arrives and what leaves; <code>nft list ruleset</code> with the rule counters.</li>
<li>Strict <strong>rp_filter</strong> drops packets on an asymmetric path; you fix it with <strong>policy routing</strong>, not by switching the protection off.</li>
<li>Read-only commands come first; changes (LAB CHANGE) are small, approved and verified.</li></ul>
<p><button type="button" class="btn primary" data-goto="lab">Go to the lab ↓</button></p>`}}
],

 {"q":{"ro":"Ce înseamnă „Connection refused”, spre deosebire de „Connection timed out”?","en":"What does \"Connection refused\" mean, as opposed to \"Connection timed out\"?"},"o":[{"ro":"Pachetul a ajuns și serverul a răspuns cu RST: nimeni nu ascultă pe port","en":"The packet arrived and the server answered with a RST: nothing listens on the port"},{"ro":"E același lucru","en":"They're the same"},{"ro":"DNS-ul nu merge","en":"DNS doesn't work"},{"ro":"Pachetul s-a pierdut","en":"The packet was lost"}],"a":0,"e":{"ro":"Timeout = niciun răspuns: pachet pierdut sau aruncat în tăcere.","en":"Timeout = no answer: the packet was lost or silently dropped."}},
